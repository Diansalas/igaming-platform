# SELF-HOSTED CI (PREPARED, NOT ACTIVE).
#
# Runbook: docs/runbooks/self-hosted-runner.md  (read it before using this file)
# Registry: CI-BILLING-1 (GitHub-hosted Actions are blocked by account billing).
#
# This workflow is DISABLED BY DEFAULT in the strongest sense available inside
# the repository: its only trigger is a MANUAL workflow_dispatch. It has no
# push or pull_request trigger, so it cannot run for a fork, for an outside
# contributor's PR, or on any commit by itself. It cannot start until a runner
# carrying ALL the labels below is registered, and the runner is registered
# only when the repository owner separately authorizes the setup. With no such
# runner a dispatched run just queues; it consumes nothing and runs nothing.
#
# It mirrors .github/workflows/ci.yml (which is NOT modified and keeps running
# on GitHub-hosted runners whenever billing allows). Differences, all forced
# by macOS self-hosted hardware:
#   * GitHub `services:` containers are not available on macOS runners, so
#     PostgreSQL 16 is started from Homebrew `postgresql@16` binaries into a
#     throwaway data directory on 127.0.0.1:54329 (not 5432, to avoid
#     colliding with any other Postgres on the machine). Removed at job end.
#   * Roles and grants are the SAME SQL as ci.yml's role-creation steps.
#   * The timing lane runs after the rest of the integration suite, on an
#     otherwise idle runner (frontend/infrastructure jobs `needs` this job so
#     they never overlap it), is repeated N times (input), and records CPU
#     model, load and Go/PostgreSQL versions (ADR 0094 section 9 and its
#     2026-10-05 environment qualification amendment). The 500 ms bound and
#     the test list are unchanged.
#   * Evidence from this workflow is labeled "SELF-HOSTED CI EVIDENCE". It is
#     not "GITHUB-HOSTED CI" evidence and not "LOCAL" evidence.
#
# Secrets: NONE are used. Every credential below is a synthetic CI value that
# is already published in ci.yml. permissions are read-only.
#
# ASSUMPTION (unverified): the runner is an Apple Silicon Mac, so the label is
# ARM64. If the owner's Mac is Intel, change ARM64 to X64 in all three
# runs-on lines AND register the runner accordingly (runbook section 2).

name: CI (self-hosted, manual)

on:
  workflow_dispatch:
    inputs:
      timing_repetitions:
        description: "Repetitions of the isolated timing lane (ADR 0094 qualification: at least 5)"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  # One run at a time: the timing lane needs an idle machine. Never cancel a
  # run mid-flight (a cancelled timing run is worthless as evidence).
  group: ci-selfhosted
  cancel-in-progress: false

jobs:
  build-test-lint:
    # Guard: never run for a fork even if someone copies this file there.
    if: github.repository == 'Diansalas/igaming-platform'
    runs-on: [self-hosted, macOS, ARM64, igaming-ci]
    timeout-minutes: 90

    env:
      # Port 54329 and 127.0.0.1 are deliberate (see header). Passwords are the
      # synthetic CI values from ci.yml, not secrets.
      PGHOST: 127.0.0.1
      PGPORT: "54329"
      DATABASE_URL: postgres://igaming:igaming_ci_password@127.0.0.1:54329/igaming_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://igaming:igaming_ci_password@127.0.0.1:54329/igaming_platform_test?sslmode=disable
      TEST_RUNTIME_DATABASE_URL: postgres://igaming_runtime:igaming_runtime_ci_password@127.0.0.1:54329/igaming_platform_test?sslmode=disable
      TEST_ADMIN_DATABASE_URL: postgres://igaming_test_admin:igaming_test_admin_ci_password@127.0.0.1:54329/igaming_platform_test?sslmode=disable
      JWT_SIGNING_SECRET: ci-signing-secret-at-least-32-characters-long
      PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ci-only-provider-credential-fingerprint-key-not-a-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Record runner environment (SELF-HOSTED CI EVIDENCE header)
        run: |
          {
            echo "SELF-HOSTED CI EVIDENCE (not GitHub-hosted, not local)"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "runner: ${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
            echo "cpu model: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown)"
            echo "logical cpus: $(sysctl -n hw.logicalcpu 2>/dev/null || echo unknown)"
            echo "memory bytes: $(sysctl -n hw.memsize 2>/dev/null || echo unknown)"
            echo "macOS: $(sw_vers -productVersion 2>/dev/null || echo unknown)"
            echo "go: $(go version)"
            echo "load at job start: $(sysctl -n vm.loadavg 2>/dev/null || echo unknown)"
          } | tee selfhosted-evidence.txt

      - name: Locate PostgreSQL 16 binaries (Homebrew postgresql@16)
        run: |
          for d in /opt/homebrew/opt/postgresql@16/bin /usr/local/opt/postgresql@16/bin; do
            if [ -x "$d/initdb" ] && [ -x "$d/pg_ctl" ] && [ -x "$d/psql" ]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "using PostgreSQL binaries in $d"
              "$d/postgres" --version | tee -a selfhosted-evidence.txt
              exit 0
            fi
          done
          echo "::error title=postgresql@16 missing::Homebrew postgresql@16 not found; see docs/runbooks/self-hosted-runner.md section 4"
          exit 1

      - name: Start throwaway PostgreSQL 16 on 127.0.0.1 only
        run: |
          # Equivalent of ci.yml's `services: postgres`: the bootstrap role is
          # the default "postgres" SUPERUSER (never used by the app), database
          # igaming_platform_test. Listening on loopback only.
          if lsof -nP -iTCP:"${PGPORT}" -sTCP:LISTEN >/dev/null 2>&1; then
            echo "::error title=port busy::port ${PGPORT} is already in use; refusing to reuse a database that is not ours"
            exit 1
          fi
          PGDATA="${RUNNER_TEMP}/igaming-pgdata"
          PGSOCK="${RUNNER_TEMP}/igaming-pgsock"
          rm -rf "$PGDATA" "$PGSOCK"
          mkdir -p "$PGSOCK"
          umask 077
          printf '%s' 'igaming_ci_superuser_password' > "${RUNNER_TEMP}/igaming-pwfile"
          initdb -D "$PGDATA" -U postgres --auth=scram-sha-256 --pwfile="${RUNNER_TEMP}/igaming-pwfile" -E UTF8 --locale=C
          rm -f "${RUNNER_TEMP}/igaming-pwfile"
          pg_ctl -D "$PGDATA" -w -t 60 -l "${RUNNER_TEMP}/igaming-postgres.log" \
            -o "-p ${PGPORT} -c listen_addresses=127.0.0.1 -c unix_socket_directories=${PGSOCK}" start
          echo "PGDATA=${PGDATA}" >> "$GITHUB_ENV"
          PGPASSWORD=igaming_ci_superuser_password createdb -h 127.0.0.1 -p "${PGPORT}" -U postgres igaming_platform_test
          PGPASSWORD=igaming_ci_superuser_password psql -h 127.0.0.1 -p "${PGPORT}" -U postgres -d igaming_platform_test -Atc "select version()" | tee -a selfhosted-evidence.txt

      - name: Create non-superuser application role
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          psql -h 127.0.0.1 -p "${PGPORT}" -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE igaming LOGIN PASSWORD 'igaming_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          ALTER DATABASE igaming_platform_test OWNER TO igaming;
          ALTER SCHEMA public OWNER TO igaming;
          SQL

      - name: Create non-owning runtime application role (PLAT-ROLESPLIT-1)
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          psql -h 127.0.0.1 -p "${PGPORT}" -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE igaming_runtime LOGIN PASSWORD 'igaming_runtime_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE igaming_platform_test TO igaming_runtime;
          GRANT USAGE ON SCHEMA public TO igaming_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO igaming_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO igaming_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE igaming IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO igaming_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE igaming IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO igaming_runtime;
          SQL

      - name: Create CI-only test admin role for scratch databases (Stage 10 W0)
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          psql -h 127.0.0.1 -p "${PGPORT}" -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE igaming_test_admin LOGIN PASSWORD 'igaming_test_admin_ci_password' NOSUPERUSER CREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT igaming TO igaming_test_admin;
          SQL

      - name: Guard - test admin URL is only read by test support code (Stage 10 W0)
        run: |
          offenders="$(grep -rl --include='*.go' 'TEST_ADMIN_DATABASE_URL' . | grep -v '_test\.go$' | grep -v '^\./internal/testsupport/scratchdb/' || true)"
          if [ -n "$offenders" ]; then echo "TEST_ADMIN_DATABASE_URL referenced outside test support code:"; echo "$offenders"; exit 1; fi
          if grep -rn 'TEST_ADMIN' internal/config/; then echo "internal/config must never read a TEST_ADMIN setting"; exit 1; fi
          for f in internal/testsupport/scratchdb/*.go; do
            head -1 "$f" | grep -qx '//go:build integration' || { echo "$f lacks //go:build integration"; exit 1; }
          done

      - name: Guard - AWS SDK confined to internal/secretstore/awssm (Stage 10.3 W3b)
        run: |
          offenders="$(grep -rl --include='*.go' '"github.com/aws/' . | grep -v '^\./internal/secretstore/awssm/' || true)"
          if [ -n "$offenders" ]; then echo "AWS SDK imported outside internal/secretstore/awssm:"; echo "$offenders"; exit 1; fi

      - name: Guard - memory secret store is imported only by tests (Stage 10.3 W2a)
        run: |
          offenders="$(grep -rl --include='*.go' '"github.com/Diansalas/igaming-platform/internal/secretstore/memstore"' . | grep -v '_test\.go$' || true)"
          if [ -n "$offenders" ]; then echo "memstore imported outside tests:"; echo "$offenders"; exit 1; fi
          offenders="$(grep -rl --include='*.go' 'NewRouterUnvalidated' . | grep -v '_test\.go$' | grep -v '^\./internal/secretstore/router\.go$' | grep -v '^\./internal/secretstore/memstore/' || true)"
          if [ -n "$offenders" ]; then echo "NewRouterUnvalidated used outside test support:"; echo "$offenders"; exit 1; fi

      - name: Verify gofmt
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt needs to be run on:"; gofmt -l .; exit 1)

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # Same action and pinned version as ci.yml (v2.9.0 is built with go1.26,
        # required by go.mod). Needs the node24 Actions runtime, which current
        # runner releases bundle; use a current runner release (runbook section 5).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

      - name: Dependency drift (go.mod/go.sum, QA condition)
        run: |
          go mod verify
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod || { echo "go.mod is not tidy - run 'go mod tidy' and commit the result"; exit 1; }
          diff -u go.sum.orig go.sum || { echo "go.sum is not tidy - run 'go mod tidy' and commit the result"; exit 1; }
          rm -f go.mod.orig go.sum.orig

      - name: govulncheck (Stage 10.3 W3b, C12.3)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        run: go build ./...

      - name: Run migrations (up)
        run: go run ./cmd/migrate up

      - name: Verify migrations (checksum drift + version gaps, PLAT-MIGDRIFT-1)
        run: go run ./cmd/migrate verify

      - name: Narrow igaming_runtime's schema_migrations access to read-only
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          psql -h 127.0.0.1 -p "${PGPORT}" -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE INSERT, UPDATE, DELETE ON schema_migrations FROM igaming_runtime;
          SQL

      - name: Narrow igaming_runtime's sportsbook_bet_settlements access (ADR 0088 §3.5)
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          psql -h 127.0.0.1 -p "${PGPORT}" -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE UPDATE, DELETE, TRUNCATE ON sportsbook_bet_settlements FROM igaming_runtime;
          SQL

      - name: Unit tests (race detector)
        run: go test -race ./...

      - name: Integration tests (RLS, HTTP foundation, race detector)
        run: |
          set -o pipefail
          # Identical -skip list to ci.yml: the timing-sensitive tests run in the
          # next step, alone (CI-342-STOREOUTAGE / ADR 0094 section 9).
          TIMING_LANE_TESTS='TestStoreOutage_DoesNotPinPool|TestStoreOutage_DoesNotPinPool_ProductionPoolSize|TestResolutionIsolation_NormalOperation|TestResolutionIsolation_OneTenantStoreOutage|TestResolutionIsolation_MultipleTenantsOutage|TestResolutionIsolation_SimultaneousOnset_Bounded|TestResolutionIsolation_ConnectionExhaustion|TestResolutionIsolation_FinancialDuringOutage'
          go test -race -tags=integration -v -skip "^(${TIMING_LANE_TESTS})\$" ./... 2>&1 | tee integration-test.log

      - name: Timing-sensitive security tests, run alone, repeated (CI-342-STOREOUTAGE, ADR 0094)
        env:
          TIMING_REPETITIONS: ${{ inputs.timing_repetitions }}
        run: |
          set -o pipefail
          # Same commands, same blocking semantics and same name guards as
          # ci.yml: -count=1, no retry. The 500 ms bound is unchanged. Added on
          # self-hosted only: environment recording and N repetitions (ADR 0094
          # section 9 environment qualification: idle host, load below 2,
          # CPU model and versions recorded, at least 5 repetitions).
          case "${TIMING_REPETITIONS:-5}" in
            ''|*[!0-9]*) echo "::error title=timing lane::timing_repetitions must be a positive integer"; exit 1 ;;
          esac
          REPS="${TIMING_REPETITIONS:-5}"
          if [ "$REPS" -lt 1 ]; then echo "::error title=timing lane::timing_repetitions must be >= 1"; exit 1; fi
          {
            echo "== timing lane environment =="
            echo "cpu model: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown)"
            echo "logical cpus: $(sysctl -n hw.logicalcpu 2>/dev/null || echo unknown)"
            echo "go: $(go version)"
            echo "postgres: $(postgres --version)"
            echo "repetitions requested: ${REPS}"
          } | tee -a selfhosted-evidence.txt
          : > timing-tests.log
          rep=1
          while [ "$rep" -le "$REPS" ]; do
            # Wait up to 180 s for the 1-minute load average to fall below 2
            # (compiling the previous step's -race binaries leaves load behind).
            # Waiting never changes a bound; if the host stays busy the
            # repetition is recorded as UNQUALIFIED and still must pass.
            waited=0
            while :; do
              load1="$(sysctl -n vm.loadavg | awk '{gsub(/[{}]/,""); print $1}')"
              if awk -v l="$load1" 'BEGIN{exit !(l < 2)}'; then qualified=QUALIFIED; break; fi
              if [ "$waited" -ge 180 ]; then qualified=UNQUALIFIED; break; fi
              sleep 10; waited=$((waited + 10))
            done
            echo "timing lane repetition ${rep}/${REPS}: load1=${load1} (${qualified}); loadavg=$(sysctl -n vm.loadavg)" | tee -a selfhosted-evidence.txt
            : > "timing-rep-${rep}.log"
            go test -race -tags=integration -v -count=1 \
              -run '^(TestStoreOutage_DoesNotPinPool|TestStoreOutage_DoesNotPinPool_ProductionPoolSize)$' \
              ./internal/providercred/ 2>&1 | tee -a integration-test.log | tee -a "timing-rep-${rep}.log"
            go test -race -tags=integration -v -count=1 \
              -run '^(TestResolutionIsolation_NormalOperation|TestResolutionIsolation_OneTenantStoreOutage|TestResolutionIsolation_MultipleTenantsOutage|TestResolutionIsolation_SimultaneousOnset_Bounded|TestResolutionIsolation_ConnectionExhaustion|TestResolutionIsolation_FinancialDuringOutage)$' \
              ./internal/httpserver/ 2>&1 | tee -a integration-test.log | tee -a "timing-rep-${rep}.log"
            for name in TestStoreOutage_DoesNotPinPool TestStoreOutage_DoesNotPinPool_ProductionPoolSize \
              TestResolutionIsolation_NormalOperation TestResolutionIsolation_OneTenantStoreOutage \
              TestResolutionIsolation_MultipleTenantsOutage TestResolutionIsolation_SimultaneousOnset_Bounded \
              TestResolutionIsolation_ConnectionExhaustion TestResolutionIsolation_FinancialDuringOutage; do
              grep -q -- "--- PASS: ${name} " "timing-rep-${rep}.log" || { echo "::error title=timing lane::${name} did not PASS in repetition ${rep} (${qualified})"; exit 1; }
            done
            cat "timing-rep-${rep}.log" >> timing-tests.log
            echo "timing lane repetition ${rep}/${REPS}: all 8 PASS by name (${qualified})" | tee -a selfhosted-evidence.txt
            rep=$((rep + 1))
          done

      - name: Summarize integration failures
        if: failure()
        run: |
          test -f integration-test.log || exit 0
          grep -E -- '--- FAIL|^FAIL|^panic:|WARNING: DATA RACE' integration-test.log | head -50 |
            while IFS= read -r line; do echo "::error title=integration failure::${line}"; done
          grep -E -B40 -A12 -- '--- FAIL' integration-test.log | grep -E '_test\.go:[0-9]+' | head -30 |
            while IFS= read -r line; do echo "::error title=failure detail::${line}"; done

      - name: Assert integration evidence (Stage 10 W0 gate)
        run: |
          # Identical to ci.yml: a skipped test is green, so require that no
          # test skipped for a missing database URL and that the named
          # scratch/RLS/migration tests actually passed.
          if grep -E 'TEST_(ADMIN_|RUNTIME_)?DATABASE_URL not set' integration-test.log; then
            echo "integration tests were skipped for a missing database URL"; exit 1
          fi
          for t in TestMigration0048_PreflightGuardFiresOnBarePlayerLocked TestMigrateUp_RecordsCorrectChecksum \
                   TestWave3Phase2Migrations_FullChainUpDownUpRoundTrip TestMigration0077_EnablesAndForcesRLSOnTenantsLicencesAndJurisdictions \
                   TestPCMigration_RoundTripOnCleanDatabase TestPCMigration_DownRefusesWithRows TestPCHandles_RLS_TenantIsolation \
                   TestInitAppRole_RerunKeepsProviderCredentialGrants TestPCMigration_RuntimeGrantsMinimal \
                   TestMigration0097_DownRefusesOnceARejectionRowExists TestMigration0097_DownRefusesOnceACasinoMismatchExists \
                   TestMigration0098_DownRefusesOnceAStatementMismatchExists TestMigration0098_CleanDatabaseDownThenUpRoundTrip \
                   TestMigration0099_UpEnforcesBoundDownDropsItRoundTrip TestMigration0099_PreflightFailsLoudlyWithCountsAndChangesNothing \
                   TestMigration0102_CleanDatabaseDownThenUpRoundTrip TestMigration0102_DownRefusesOnceAStatementExists \
                   TestInitAppRole_RerunKeepsPaymentStatementGrants TestPaymentStatement_NoFinancialEffect \
                   TestMigration0102_RuntimeGrantsMinimal TestPaymentStatement_LegacyUnattemptedPostingsAreCountedNotFlagged \
                   TestPaymentStatement_AttemptLinkedPostingsStayFullyChecked \
                   TestMigration0104_ChecksRefuseBadCharsetDirectly TestMigration0104_UpDownUpRoundTrip TestMigration0104_PreflightCountsAndChangesNothing; do
            grep -q -- "--- PASS: $t " integration-test.log || { echo "expected $t to PASS"; exit 1; }
          done
          echo "packages ok:  $(grep -cE '^ok[[:space:]]' integration-test.log)"
          echo "tests passed: $(grep -c -- '--- PASS' integration-test.log)"
          echo "tests skipped: $(grep -c -- '--- SKIP' integration-test.log)"
          echo "tests failed: $(grep -c -- '--- FAIL' integration-test.log)"

      - name: Migration reversibility (down then up)
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE igaming_reversibility OWNER igaming"
          export DATABASE_URL="postgres://igaming:igaming_ci_password@127.0.0.1:54329/igaming_reversibility?sslmode=disable"
          go run ./cmd/migrate up
          APP_ENV=development go run ./cmd/migrate -steps=4 down
          go run ./cmd/migrate up
          go run ./cmd/migrate verify

      - name: Upload SELF-HOSTED CI EVIDENCE (logs only, no secrets)
        # Diagnostics and evidence; runs on success and failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhosted-ci-evidence
          path: |
            selfhosted-evidence.txt
            integration-test.log
            timing-tests.log
            timing-rep-*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Stop and delete the throwaway PostgreSQL
        if: always()
        run: |
          if [ -n "${PGDATA:-}" ] && [ -d "${PGDATA}" ]; then
            pg_ctl -D "${PGDATA}" -m fast -w stop || true
          fi
          rm -rf "${RUNNER_TEMP}/igaming-pgdata" "${RUNNER_TEMP}/igaming-pgsock" "${RUNNER_TEMP}/igaming-pwfile"

  frontend:
    # Run after build-test-lint so it never overlaps the timing lane (the lane
    # needs an idle host). `!cancelled()` runs it even if the Go job failed.
    needs: build-test-lint
    if: ${{ !cancelled() && github.repository == 'Diansalas/igaming-platform' }}
    runs-on: [self-hosted, macOS, ARM64, igaming-ci]
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        app: [b2c, backoffice]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  infrastructure:
    # Offline Terraform checks; NO AWS credentials, creates NO AWS resources
    # (same as ci.yml). Requires bash and standard tools on the Mac; the
    # script's macOS compatibility is an UNVERIFIED ASSUMPTION (runbook
    # section 9). frontend-image (Docker build) is intentionally not mirrored:
    # it needs a Docker daemon and is out of scope for this runner.
    needs: [build-test-lint, frontend]
    if: ${{ !cancelled() && github.repository == 'Diansalas/igaming-platform' }}
    runs-on: [self-hosted, macOS, ARM64, igaming-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: deploy/aws static checks
        run: deploy/aws/tests/run-static-checks.sh
