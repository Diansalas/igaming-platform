name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Stage 10 W0: lets the gate be re-run on the same commit (the
  # five-consecutive-green-runs acceptance, docs/testing/testing-strategy.md).
  workflow_dispatch:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    services:
      # POSTGRES_USER is deliberately left at its default ("postgres"):
      # whatever role this variable names becomes the initdb bootstrap
      # SUPERUSER, and superusers always bypass row-level security even
      # with FORCE ROW LEVEL SECURITY. The app never connects as this
      # role - see the "Create non-superuser application role" step
      # below, which mirrors deploy/init-app-role.sql. An earlier version
      # of this workflow connected as the bootstrap superuser directly,
      # which silently made every RLS tenant-isolation test pass for the
      # wrong reason (RLS was never actually being enforced); caught in
      # Stage 1 specialist review.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: igaming_ci_superuser_password
          POSTGRES_DB: igaming_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d igaming_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://igaming:igaming_ci_password@localhost:5432/igaming_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://igaming:igaming_ci_password@localhost:5432/igaming_platform_test?sslmode=disable
      # PLAT-ROLESPLIT-1 (docs/security/runtime-role-separation.md):
      # exercises internal/db/runtime_role_separation_test.go's
      # adversarial-probe suite against a real, non-owning role every CI
      # run, not just by hand - the "Operational consequence... not yet
      # addressed by any CI change" gap that document's §5 named. That
      # test t.Skip()s cleanly if this var is unset, so it is harmless to
      # set unconditionally.
      TEST_RUNTIME_DATABASE_URL: postgres://igaming_runtime:igaming_runtime_ci_password@localhost:5432/igaming_platform_test?sslmode=disable
      # Stage 10 W0 (docs/testing/testing-strategy.md "Scratch databases"):
      # CI/dev-only role used ONLY by internal/testsupport/scratchdb to
      # CREATE/DROP throwaway databases for migration and RLS tests. The
      # application roles above stay NOCREATEDB; scratch databases are
      # created OWNER igaming and every assertion still runs as igaming.
      TEST_ADMIN_DATABASE_URL: postgres://igaming_test_admin:igaming_test_admin_ci_password@localhost:5432/igaming_platform_test?sslmode=disable
      JWT_SIGNING_SECRET: ci-signing-secret-at-least-32-characters-long
      # Stage 10.3 W2a (ADR 0093 A3; security review §3): the published,
      # CI-only fingerprint-key placeholder. config.Load refuses it unless
      # APP_ENV is explicitly "development"; tests that construct the
      # credential subsystem set their own runtime-generated key.
      PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ci-only-provider-credential-fingerprint-key-not-a-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create non-superuser application role
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          psql -h localhost -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE igaming LOGIN PASSWORD 'igaming_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          ALTER DATABASE igaming_platform_test OWNER TO igaming;
          ALTER SCHEMA public OWNER TO igaming;
          SQL

      - name: Create non-owning runtime application role (PLAT-ROLESPLIT-1)
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          # Mirrors deploy/init-app-role.sql's igaming_runtime block - see
          # docs/security/runtime-role-separation.md §3/§6. No tables
          # exist yet at this point (migrations run in a later step), so
          # existing-table grants below are no-ops; ALTER DEFAULT
          # PRIVILEGES is what actually reaches the tables migrations are
          # about to create.
          psql -h localhost -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE igaming_runtime LOGIN PASSWORD 'igaming_runtime_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT CONNECT ON DATABASE igaming_platform_test TO igaming_runtime;
          GRANT USAGE ON SCHEMA public TO igaming_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO igaming_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO igaming_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE igaming IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO igaming_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE igaming IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO igaming_runtime;
          SQL

      - name: Create CI-only test admin role for scratch databases (Stage 10 W0)
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          # Mirrors deploy/init-test-admin-role.dev.sql. CREATEDB but
          # never SUPERUSER or BYPASSRLS; membership in igaming lets it
          # create databases OWNER igaming and drop them again. Never
          # created by deploy/init-app-role.sql (deployment path).
          psql -h localhost -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE igaming_test_admin LOGIN PASSWORD 'igaming_test_admin_ci_password' NOSUPERUSER CREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT igaming TO igaming_test_admin;
          SQL

      - name: Guard - test admin URL is only read by test support code (Stage 10 W0)
        run: |
          # TEST_ADMIN_DATABASE_URL may appear only in _test.go files and in
          # the integration-tagged internal/testsupport/scratchdb package -
          # never in application code or internal/config.
          offenders="$(grep -rl --include='*.go' 'TEST_ADMIN_DATABASE_URL' . | grep -v '_test\.go$' | grep -v '^\./internal/testsupport/scratchdb/' || true)"
          if [ -n "$offenders" ]; then echo "TEST_ADMIN_DATABASE_URL referenced outside test support code:"; echo "$offenders"; exit 1; fi
          if grep -rn 'TEST_ADMIN' internal/config/; then echo "internal/config must never read a TEST_ADMIN setting"; exit 1; fi
          # Every scratchdb file must carry the integration build tag so it
          # is never compiled into an application binary.
          for f in internal/testsupport/scratchdb/*.go; do
            head -1 "$f" | grep -qx '//go:build integration' || { echo "$f lacks //go:build integration"; exit 1; }
          done

      - name: Guard - AWS SDK confined to internal/secretstore/awssm (Stage 10.3 W3b)
        run: |
          # ADR 0093 §6 / security review C12.2: AWS modules may be
          # imported only by internal/secretstore/awssm. Widened to every
          # github.com/aws/ module (gate W2/W3 S-5: smithy-go, the v1 SDK).
          # Mirrors TestImportBoundary_NoOtherPackageImportsAWSSDK.
          offenders="$(grep -rl --include='*.go' '"github.com/aws/' . | grep -v '^\./internal/secretstore/awssm/' || true)"
          if [ -n "$offenders" ]; then echo "AWS SDK imported outside internal/secretstore/awssm:"; echo "$offenders"; exit 1; fi

      - name: Guard - memory secret store is imported only by tests (Stage 10.3 W2a)
        run: |
          # ADR 0093 §6 / security review §4.1: the memory:// backend
          # (internal/secretstore/memstore) is test-only. Mirrors
          # TestSecretStore_MemstoreImportedOnlyByTests.
          offenders="$(grep -rl --include='*.go' '"github.com/Diansalas/igaming-platform/internal/secretstore/memstore"' . | grep -v '_test\.go$' || true)"
          if [ -n "$offenders" ]; then echo "memstore imported outside tests:"; echo "$offenders"; exit 1; fi
          offenders="$(grep -rl --include='*.go' 'NewRouterUnvalidated' . | grep -v '_test\.go$' | grep -v '^\./internal/secretstore/router\.go$' | grep -v '^\./internal/secretstore/memstore/' || true)"
          if [ -n "$offenders" ]; then echo "NewRouterUnvalidated used outside test support:"; echo "$offenders"; exit 1; fi

      - name: Verify gofmt
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt needs to be run on:"; gofmt -l .; exit 1)

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # Stage 10 W0: the previous reference (golangci-lint/golangci-lint-action)
        # does not exist, so this job never ran. Per the upstream README
        # "Compatibility" section, action v7+ is required for golangci-lint
        # v2 configuration (.golangci.yml is `version: "2"`); v9 is current
        # and requires the node24 Actions runtime (upstream README), so a
        # runner image without node24 fails this step at setup.
        # The linter version is pinned (not `latest`) so results are
        # reproducible; bump it deliberately.
        #
        # GO-TOOLCHAIN-VULN-1: bumped v2.5.0 -> v2.9.0. The action installs
        # the published release binary, and golangci-lint refuses to run
        # when that binary was built with a Go older than go.mod's
        # toolchain ("the Go language version (go1.25) used to build
        # golangci-lint is lower than the targeted Go version"). v2.9.0 is
        # the first release whose linux-amd64 binary is built with go1.26
        # (v2.6.2-v2.8.0 binaries are go1.25.x; CI run #340 failed on v2.6.2).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

      - name: Dependency drift (go.mod/go.sum, QA condition)
        # `go mod tidy` must be a no-op: a diff here means go.mod/go.sum
        # were not committed in the state `go mod tidy` produces (a stale
        # or hand-edited entry), which `go mod verify` alone does not
        # catch. This is required whenever a dependency is added, which
        # Stage 10.3 W3b does for the first time (aws-sdk-go-v2).
        run: |
          go mod verify
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod || { echo "go.mod is not tidy - run 'go mod tidy' and commit the result"; exit 1; }
          diff -u go.sum.orig go.sum || { echo "go.sum is not tidy - run 'go mod tidy' and commit the result"; exit 1; }
          rm -f go.mod.orig go.sum.orig

      - name: govulncheck (Stage 10.3 W3b, C12.3)
        # ADR 0093 §6 / security review C12 condition 3: govulncheck (or
        # equivalent) is added to CI no later than the wave that
        # introduces the AWS SDK (internal/secretstore/awssm). Scans the
        # whole module, not just that package, since a vulnerable
        # transitive dependency anywhere is worth knowing about.
        #
        # GO-TOOLCHAIN-VULN-1 (docs/governance/task-registry.md):
        # pinned to an exact version (not @latest) so results are
        # reproducible and a bump is a deliberate, reviewable diff -
        # govulncheck v1.8.0 requires go >= 1.26, which matches the
        # toolchain pinned in go.mod.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Build
        run: go build ./...

      - name: Run migrations (up)
        run: go run ./cmd/migrate up

      - name: Verify migrations (checksum drift + version gaps, PLAT-MIGDRIFT-1)
        run: go run ./cmd/migrate verify

      - name: Narrow igaming_runtime's schema_migrations access to read-only
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          # The blanket "ALL TABLES IN SCHEMA public" grant above also
          # covers schema_migrations (the migration ledger cmd/migrate
          # owns) - only meaningful once that table exists, i.e. after
          # the migrations step above, per
          # docs/security/runtime-role-separation.md §6 step 3b.
          psql -h localhost -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE INSERT, UPDATE, DELETE ON schema_migrations FROM igaming_runtime;
          SQL

      - name: Narrow igaming_runtime's sportsbook_bet_settlements access (ADR 0088 §3.5)
        env:
          PGPASSWORD: igaming_ci_superuser_password
        run: |
          # Mirrors deploy/init-app-role.sql's guarded REVOKE and migration
          # 0091's own copy: the blanket "ALL TABLES IN SCHEMA public"
          # grant above also covers sportsbook_bet_settlements (the
          # append-only settlement history table), only meaningful once
          # that table exists, i.e. after the migrations step above. The
          # deny triggers on that table are the BINDING control (they bind
          # the table owner too) - this REVOKE is defence in depth only,
          # so CI's runtime role mirrors the deployed posture ADR 0088
          # §3.5 requires.
          psql -h localhost -U postgres -d igaming_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE UPDATE, DELETE, TRUNCATE ON sportsbook_bet_settlements FROM igaming_runtime;
          SQL

      - name: Unit tests (race detector)
        run: go test -race ./...

      - name: Integration tests (RLS, HTTP foundation, race detector)
        run: |
          set -o pipefail
          # CI-342-STOREOUTAGE / ADR 0094 §9 (security ruling (6)): the
          # wall-clock security bounds of the tests listed in
          # TIMING_LANE_TESTS (unrelated query / every B request < 500 ms,
          # <= 4 store calls, no transaction held > 400 ms) are measured in
          # the next step, alone, not while every other package's -race
          # binary competes for the runner's CPUs. They still run on every
          # CI run and still block; no bound is changed. Every other test,
          # including the rest of ADR 0094's suite, runs here.
          TIMING_LANE_TESTS='TestStoreOutage_DoesNotPinPool|TestStoreOutage_DoesNotPinPool_ProductionPoolSize|TestResolutionIsolation_NormalOperation|TestResolutionIsolation_OneTenantStoreOutage|TestResolutionIsolation_MultipleTenantsOutage|TestResolutionIsolation_SimultaneousOnset_Bounded|TestResolutionIsolation_ConnectionExhaustion|TestResolutionIsolation_FinancialDuringOutage'
          go test -race -tags=integration -v -skip "^(${TIMING_LANE_TESTS})\$" ./... 2>&1 | tee integration-test.log

      - name: Timing-sensitive security tests, run alone (CI-342-STOREOUTAGE, ADR 0094)
        run: |
          set -o pipefail
          # Exactly the tests security admitted to this lane (ADR 0094,
          # "Security design review" (6); 15-ci-342-security-ruling.md
          # ruling B): blocking, no retry or rerun, -count=1, one name guard
          # per test. Nothing else may join without its own ruling.
          go test -race -tags=integration -v -count=1 \
            -run '^(TestStoreOutage_DoesNotPinPool|TestStoreOutage_DoesNotPinPool_ProductionPoolSize)$' \
            ./internal/providercred/ 2>&1 | tee -a integration-test.log | tee timing-tests.log
          go test -race -tags=integration -v -count=1 \
            -run '^(TestResolutionIsolation_NormalOperation|TestResolutionIsolation_OneTenantStoreOutage|TestResolutionIsolation_MultipleTenantsOutage|TestResolutionIsolation_SimultaneousOnset_Bounded|TestResolutionIsolation_ConnectionExhaustion|TestResolutionIsolation_FinancialDuringOutage)$' \
            ./internal/httpserver/ 2>&1 | tee -a integration-test.log | tee -a timing-tests.log
          # Fail if any test was renamed or removed: -run matching nothing
          # passes silently. Each must PASS by name.
          for name in TestStoreOutage_DoesNotPinPool TestStoreOutage_DoesNotPinPool_ProductionPoolSize \
            TestResolutionIsolation_NormalOperation TestResolutionIsolation_OneTenantStoreOutage \
            TestResolutionIsolation_MultipleTenantsOutage TestResolutionIsolation_SimultaneousOnset_Bounded \
            TestResolutionIsolation_ConnectionExhaustion TestResolutionIsolation_FinancialDuringOutage; do
            grep -q -- "--- PASS: ${name} " timing-tests.log || { echo "::error title=timing lane::${name} did not PASS"; exit 1; }
          done

      - name: Summarize integration failures
        # Stage 10.1: job logs are only retrievable by their last lines,
        # and the Postgres container log printed on shutdown pushes the
        # failing test's output out of that window. Emitting each failure
        # as an annotation keeps the test name and location readable from
        # the check run.
        if: failure()
        run: |
          test -f integration-test.log || exit 0
          grep -E -- '--- FAIL|^FAIL|^panic:|WARNING: DATA RACE' integration-test.log | head -50 |
            while IFS= read -r line; do echo "::error title=integration failure::${line}"; done
          # -B as well as -A: under `go test -v` a test's t.Fatalf/t.Errorf
          # line is printed BEFORE its `--- FAIL` line (CI #342/#347 showed
          # no detail with -A alone).
          grep -E -B40 -A12 -- '--- FAIL' integration-test.log | grep -E '_test\.go:[0-9]+' | head -30 |
            while IFS= read -r line; do echo "::error title=failure detail::${line}"; done

      - name: Upload integration test log (CI-FLAKE-281)
        # The check-run annotations above (444e6e1) are a summary capped at a
        # handful of lines; the job's own log is only retrievable as its last
        # 5,000 lines via the API, and direct log-URL download is blocked in
        # some environments (e.g. an egress-restricted proxy). Uploading the
        # full integration-test.log as a build artifact gives a complete,
        # directly downloadable record of a failing run, independent of log
        # retention/tail limits. Diagnostics only - this does not affect the
        # pass/fail gate above and never runs on a green step.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-test.log
          retention-days: 14
          if-no-files-found: warn

      - name: Assert integration evidence (Stage 10 W0 gate)
        run: |
          # A skipped test is green, so a green step alone does not prove the
          # scratch-database migration/RLS tests ran. Fail if any test
          # skipped for a missing database URL, and require the scratch
          # tests and the runtime-role probe to have actually passed.
          if grep -E 'TEST_(ADMIN_|RUNTIME_)?DATABASE_URL not set' integration-test.log; then
            echo "integration tests were skipped for a missing database URL"; exit 1
          fi
          for t in TestMigration0048_PreflightGuardFiresOnBarePlayerLocked TestMigrateUp_RecordsCorrectChecksum \
                   TestWave3Phase2Migrations_FullChainUpDownUpRoundTrip TestMigration0077_EnablesAndForcesRLSOnTenantsLicencesAndJurisdictions \
                   TestPCMigration_RoundTripOnCleanDatabase TestPCMigration_DownRefusesWithRows TestPCHandles_RLS_TenantIsolation \
                   TestInitAppRole_RerunKeepsProviderCredentialGrants TestPCMigration_RuntimeGrantsMinimal \
                   TestMigration0097_DownRefusesOnceARejectionRowExists TestMigration0097_DownRefusesOnceACasinoMismatchExists \
                   TestMigration0098_DownRefusesOnceAStatementMismatchExists TestMigration0098_CleanDatabaseDownThenUpRoundTrip \
                   TestMigration0099_UpEnforcesBoundDownDropsItRoundTrip TestMigration0099_PreflightFailsLoudlyWithCountsAndChangesNothing \
                   TestMigration0102_CleanDatabaseDownThenUpRoundTrip TestMigration0102_DownRefusesOnceAStatementExists \
                   TestInitAppRole_RerunKeepsPaymentStatementGrants TestPaymentStatement_NoFinancialEffect \
                   TestMigration0102_RuntimeGrantsMinimal TestPaymentStatement_LegacyUnattemptedPostingsAreCountedNotFlagged \
                   TestPaymentStatement_AttemptLinkedPostingsStayFullyChecked \
                   TestMigration0104_ChecksRefuseBadCharsetDirectly TestMigration0104_UpDownUpRoundTrip TestMigration0104_PreflightCountsAndChangesNothing; do
            grep -q -- "--- PASS: $t " integration-test.log || { echo "expected $t to PASS"; exit 1; }
          done
          echo "packages ok:  $(grep -cE '^ok[[:space:]]' integration-test.log)"
          echo "tests passed: $(grep -c -- '--- PASS' integration-test.log)"
          echo "tests skipped: $(grep -c -- '--- SKIP' integration-test.log)"
          echo "tests failed: $(grep -c -- '--- FAIL' integration-test.log)"

      - name: Migration reversibility (down then up)
        run: |
          # Stage 10 W1: runs on a FRESH database created by the CI-only test
          # admin role, not the shared test database. Migration 0091's down
          # script (like 0078's) refuses once settlement evidence exists, and
          # the integration tests above leave such evidence behind, so the
          # shared database would always (correctly) refuse. Reversibility is
          # a property of the schema; the data-bearing refusals are covered
          # by migration tests. The database is owned by igaming, so every
          # step still runs as the non-superuser owner.
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE igaming_reversibility OWNER igaming"
          export DATABASE_URL="postgres://igaming:igaming_ci_password@localhost:5432/igaming_reversibility?sslmode=disable"
          go run ./cmd/migrate up
          APP_ENV=development go run ./cmd/migrate -steps=4 down
          go run ./cmd/migrate up
          go run ./cmd/migrate verify

  frontend:
    # Stage 9 (§23 CI/CD coverage audit): the b2c and backoffice SPAs
    # (docs/architecture/38-deployment-architecture.md §1 - each an
    # independent static Vite build with no runtime dependency on
    # platform-api's own deploy cadence) had a build and a real vitest
    # suite (39 + 23 passing tests respectively, confirmed locally) that
    # NOTHING in CI ever ran - a broken frontend build or a genuinely
    # failing frontend test could merge to main undetected. This job
    # closes that gap; it does not rebuild or reorganize the existing Go
    # pipeline above.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [b2c, backoffice]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  frontend-image:
    # Stage 9.4 staging regression: both frontend images built from
    # deploy/docker/frontend.Dockerfile exited on ECS with
    # `open() "/run/nginx.pid" failed (13: Permission denied)` because the
    # non-root nginx could not write the base image's default pid path.
    # Builds each image and proves nginx starts as the non-root user and
    # serves HTTP on 8080. Uses NO cloud credentials.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [b2c, backoffice]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image and smoke-test non-root nginx startup
        run: deploy/docker/tests/frontend-image-smoke.sh ${{ matrix.app }}

  infrastructure:
    # Stage 9.4 (ADR 0086): offline Terraform checks for deploy/aws —
    # fmt, validate (-backend=false), `terraform test` with mock AWS
    # providers, the CloudFront allowlist function's unit tests, script
    # syntax, and repository guards (no state/plan/tfvars tracked, no
    # regression of the Stage 9.3 alarm/secret/ECR defects). Uses NO AWS
    # credentials and creates NO AWS resources.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: deploy/aws static checks
        run: deploy/aws/tests/run-static-checks.sh
