        `subject_id` a canonical UUID; any other input is 400 (the `other` bucket applies to output only). The stored reconciliation key and the
        expected/actual diagnostic texts are never returned: `subject_ref` (an attempt, deposit intent, receipt, bet, wallet, ledger account or
        ledger transaction, never a player identity), the minor-unit amounts, the asset code and its exponent are derived from them by strict
        parsers over the platform-written part only (see StaffReconciliationMismatch) and are null when not unambiguous. `subject_id` (canonical
        lower-case UUID) matches exactly the mismatches whose subject_ref would name that id.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stream
          in: query
          required: true
          schema: { $ref: "#/components/schemas/StaffReconciliationStream" }
        - name: status
          in: query
          schema: { type: string, enum: [open, investigating, resolved] }
        - name: kind
