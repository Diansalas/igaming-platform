                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/activation:
    put:
      summary: Activate or suspend an asset (layer 2)
      description: >
        Requires asset_registry:manage. `value: true` additionally requires
        an approved activate request (409 otherwise); `value: false` is
        deliberately single-actor - an incident kill-switch must not wait
        for a second approver (ADR 0037 §C.5.3). `value` is mandatory:
        defaulting a missing boolean would make granting reachable by
        omission.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/platform-authorization:
    put:
      summary: Grant or revoke platform authorization (layer 3)
      description: >
        Requires asset_registry:manage. ADR 0037 §C.5.1 operation 5 - the
        asset's own platform clearance, NOT ProviderCapability (ADR 0022),
        which is a different concept. Granting requires an approved
        platform_authorize request; revoking does not.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/operation-eligibility:
    put:
      summary: Set the PLATFORM-WIDE operation eligibility default (layer 7)
      description: >
        Requires asset_registry:manage (platform tier of ADR 0037 §C.5.1
        operation 9). `product` omitted means every product; a
        product-specific row always wins over it. Returns 403 if the asset
        is not platform-authorized - nothing may be made eligible for an
        asset the platform has not cleared.


        FOUR-EYES: eligible=true is DUAL-CONTROLLED (§C.5.3). It requires
        an approved platform_operation_eligibility change request for this
        exact (asset, operation, product); without one the response is
        409. This row is a platform-wide gate for every tenant, and until
        migration 0047 a single platform-admin credential could flip it.
        eligible=false (revocation) is deliberately single-actor - the
        fail-closed direction must never wait for a second approver - and
        an idempotent re-write of an already-eligible row needs no new
        approval.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Platform-wide default written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations:
    get:
      summary: List this tenant's asset authorizations (layers 4-6)
      description: Requires asset_authorization:write and a tenant-scoped token.
      security:
        - bearerAuth: []
      parameters:
        - name: asset_code
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Authorization facts visible to the caller's tenant
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/{scopeKind}:
    put:
      summary: Authorize an asset for this tenant, a brand, or a jurisdiction (layers 4/5/6)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. The
        tenant is ALWAYS taken from the verified token, never from the body
        (ADR 0038 §11's rule, applied here). brand_id/jurisdiction_id name
        which brand/jurisdiction is being configured; a composite foreign
        key plus RLS mean neither can belong to another tenant. Returns 403
        when the write would widen past the layer above it (a
        non-platform-authorized asset, or a brand grant with no tenant
        grant behind it) - refused at write time, not only at resolution
        time.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeKind
          in: path
          required: true
          schema: { type: string, enum: [tenant, brand, jurisdiction] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_code, eligible, reason_code]
              properties:
                asset_code: { type: string }
                brand_id: { type: string, format: uuid, description: Required for scopeKind=brand }
                jurisdiction_id: { type: string, format: uuid, description: Required for scopeKind=jurisdiction }
                product: { type: string, description: Omitted means every product }
                eligible: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Authorization fact written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/operation-eligibility/{code}:
    put:
      summary: Narrow the operation eligibility for this tenant (layer 7 override)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. A
        tenant override may only NARROW the platform-wide default: a
        widening write returns 403 and is never stored (ADR 0037 §A.6).
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Tenant override written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Jurisdiction Registry, Resolution-Active, and Tenant-Licence
  # binding (Stage 4I, docs/governance/stage-4i-canonical-model.md §11.1
  # items B-1/B-6, and Phase A item B-4) ---
  #
  # Split along the canonical model's own platform-vs-tenant line,
  # mirroring the Asset Registry split above: /v1/admin/jurisdictions and
  # /v1/admin/licences are jurisdiction_registry:manage (platform_admin
  # only) - platform-wide reference data with no row-level security
  # (jurisdictions/licences are FK targets every tenant-scoped transaction
  # ultimately reads through resolution, not tenant-owned rows).
  # /v1/admin/jurisdiction-resolution-active/** is
  # jurisdiction_resolution_active:write (tenant_admin only, RLS-scoped to
  # the caller's own tenant) - GET shares the same write permission because
  # no separate read permission exists for this fact.
  # /v1/admin/tenants/{tenantID}/licence is tenant_licence:assign
  # (platform_admin only) - the tenant is named by the path, never the
  # body, and platform_admin may target any tenant.
  #
  # There is deliberately NO endpoint that RESOLVES a jurisdiction for a
  # player or tenant: internal/jurisdiction.Resolve takes tenant/brand/
  # player as server-resolved values and is consumed IN-PROCESS ONLY,
  # never over HTTP. jurisdiction_admin_routes.go's own header comment
  # explains why - an HTTP endpoint accepting a jurisdiction identifier
  # from a caller would be exactly the spoofable-input shape Stage 4H-B0-R5
  # finding S-6a (and this stage's own JV-1/JV-2 ruling) forbids.
  /v1/admin/jurisdictions:
    get:
      summary: List the platform jurisdiction registry
      description: >
        Requires jurisdiction_registry:manage (platform_admin only).
        Platform-wide reference data with no tenant scoping - returns
        every jurisdiction row regardless of the caller's own tenant (a
        platform_admin token has none).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full jurisdiction registry, ordered by code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Jurisdiction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a jurisdiction (platform-wide reference row)
      description: >
        Requires jurisdiction_registry:manage (platform_admin only). Not
        four-eyes gated - unlike the Asset Registry's own `create`, no
        dual-control mechanism exists for this registry today. Requires
        reason_code, recorded on an audit entry with tenant_id NULL (a
        genuinely platform-wide reference row, not a tenant-owned one). A
        duplicate `code` returns 400, not 409 - jurisdiction.ErrInvalidInput
        is the sole domain-error sentinel this registry's write path maps
        to a client error, and writeJurisdictionRegistryError maps it to
        400 regardless of the underlying database condition (unique
        violation or otherwise).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
                regulatory_body: { type: string }
                notes: { type: string }
                reason_code: { type: string }
              required: [code, name, reason_code]
      responses:
        "201":
          description: Jurisdiction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/licences:
    get:
      summary: List the platform licence registry
      description: >
        Requires jurisdiction_registry:manage (platform_admin only).
        Platform-wide reference data with no tenant scoping, ordered by
        created_at.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full licence registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Licence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a licence (platform-wide reference row, FK'd to a jurisdiction)
      description: >
        Requires jurisdiction_registry:manage (platform_admin only).
        `status` always starts `active` - no status-transition endpoint
        exists yet (a disclosed, deliberate scope limit: no current
        consumer needs one). Not four-eyes gated. Requires reason_code,
        recorded on an audit entry with tenant_id NULL. An unknown
        jurisdiction_id returns 400 (jurisdiction.ErrInvalidInput wrapping
        the foreign-key violation), never 404 - this registry's write path
        never distinguishes "not found" from "invalid input" the way
        AssignTenantLicence below does.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jurisdiction_id: { type: string, format: uuid }
                licensee:
                  type: string
                  enum: [platform, tenant]
                licence_number: { type: string }
                permitted_products:
                  type: array
                  items: { type: string }
                permitted_markets:
                  type: array
                  items: { type: string }
                reason_code: { type: string }
              required: [jurisdiction_id, licensee, licence_number, reason_code]
      responses:
        "201":
          description: Licence created, status=active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licence"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/jurisdiction-resolution-active:
    get:
      summary: List the caller's own tenant's jurisdiction-resolution-active facts
      description: >
        Requires jurisdiction_resolution_active:write (tenant_admin only)
        and a real tenant context - GET shares the mutating permission
        because no separate read permission exists for this fact. An
        admin/diagnostics read only; never consumed by any enforcement
        path (enforcement uses the narrow, read-only IsActive accessor for
        exactly one (tenant, operation_class) pair, in-process).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: This tenant's resolution-active facts, ordered by operation_class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JurisdictionResolutionActive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/jurisdiction-resolution-active/{operationClass}:
    put:
      summary: Set whether jurisdiction resolution is genuinely active for one operation class
      description: >
        Requires jurisdiction_resolution_active:write (tenant_admin only).
        Deliberately single-actor (no four-eyes): this records an
        ENGINEERING precondition fact, not a financial or player-facing
        authorization decision, and Risk's own future consumer (R-2b)
        treats "not recorded" as inactive/fail-closed regardless of who
        flips it. Requires reason_code, recorded on the audit entry
        alongside the before/after active value. An unknown
        operationClass path segment returns 400.
      security:
        - bearerAuth: []
      parameters:
        - name: operationClass
          in: path
          required: true
          schema:
            type: string
            enum: [play, catalogue_availability, bonus_issuance, bonus_conversion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
                reason_code: { type: string }
              required: [active, reason_code]
      responses:
        "200":
          description: Resolution-active fact written (created or updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionResolutionActive"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/licence:
    put:
      summary: Bind (or unassign) the licence a tenant actually operates under
      description: >
        Requires tenant_licence:assign (platform_admin only). Deliberately
        separate from tenant:write (name/slug/licensing_model
        provisioning) and from jurisdiction_registry:manage (which only
        creates jurisdictions/licences REFERENCE rows, never binds a live
        tenant to one) - binding a live tenant to a licence determines
        which jurisdiction's rules govern that tenant's operations. The
        tenant is always taken from the path, never the body; a
        platform_admin may target any tenant (canActOnTenant always allows
        a nil-tenant/platform-scoped caller - a 403 here is latent today
        since no other role holds this permission, but is enforced
        regardless, closing a risk should that ever change).


        `licence_id` is a three-state field, not a plain optional string:
        the JSON key MUST be present. An absent key returns 400 ("licence_id
        is required; send null to unassign"). A JSON `null` unassigns the
        tenant's current licence. A UUID string assigns that licence,
        subject to: the licence must exist and have status `active`
        (400 otherwise), and its `licensee` must match the tenant's own
        `licensing_model` (enforced by the database's composite foreign
        key, surfaced here as 400). An unknown tenantID returns 404
        (jurisdiction.ErrNotFound) - the only ErrNotFound producer in this
        registry's write surface, unlike the 400-only jurisdictions/
        licences creation paths above.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTenantLicenceRequest"
      responses:
        "200":
          description: Licence bound (or unassigned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantLicenceAssignment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks tenant_licence:assign, or is targeting a tenant it cannot act on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown tenantID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Jurisdiction Evidence Collection Activation (Stage 4I Phase B) ---
  #
  # A lawful-basis activation switch for player-level jurisdiction
  # EVIDENCE collection (declared_residence / verified_residence /
  # location_signal), distinct from jurisdiction-resolution-active above,
  # which gates resolver behavior for a (tenant, operation_class) pair
  # only. Turning this OFF makes the corresponding write (PUT
  # /v1/me/residence, or a verified_residence_country determination on
  # the KYC review endpoint) fail closed with 403, writing nothing.
  #
  # jurisdiction_evidence_collection:activate is RoleCompliance-only
  # (never RoleTenantAdmin, unlike jurisdiction_resolution_active:write)
  # - switching on collection of privacy-sensitive personal data is a
  # lawful-basis judgment (HDR-J-3e), not a commercial/engineering
  # configuration act. GET shares the same permission - no separate read
  # permission exists for this fact, mirroring the resolution-active
  # precedent above.
  #
  # This switch gates COLLECTION only and has no effect on
  # internal/jurisdiction.Resolve, which this phase leaves entirely
  # unchanged - evidence existing (or being collectible) does not
  # activate any regulatory jurisdiction decision.
  /v1/admin/jurisdiction-evidence-collection:
    get:
      summary: List the caller's own tenant's evidence-collection-active facts
      description: >
        Requires jurisdiction_evidence_collection:activate
        (RoleCompliance only). Absence of a row for a given
        evidence_type is equivalent to inactive (fail-closed) - the
        underlying accessor returns false without erroring in that case.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: This tenant's evidence-collection-active facts, ordered by evidence_type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JurisdictionEvidenceCollectionActive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/jurisdiction-evidence-collection/{evidenceType}:
    put:
      summary: Set whether a tenant may currently collect one category of jurisdiction evidence
      description: >
        Requires jurisdiction_evidence_collection:activate
        (RoleCompliance only). Requires reason_code, recorded on the
        audit entry (jurisdiction_evidence_collection_active.changed)
        alongside the before/after active value. An unknown
        evidenceType path segment returns 400.
      security:
        - bearerAuth: []
      parameters:
        - name: evidenceType
          in: path
          required: true
          schema:
            type: string
            enum: [declared_residence, verified_residence, location_signal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetJurisdictionEvidenceCollectionActiveRequest"
      responses:
        "200":
          description: Evidence-collection-active fact written (created or updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionEvidenceCollectionActive"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HMAC-signed (HS256) JWTs, verified against a key registry keyed
        by the token's own `kid` header claim - this is what allows an
        old and a new signing key to be valid simultaneously during
        rotation (see internal/auth/keys.go). Tokens also carry a
        possibly-nil tenant_id claim: platform_admin tokens are
        legitimately platform-scoped (see docs/decisions/0011) - routes
        that require a real tenant reject a nil one via the
        RequireTenantScope middleware, not at token-verification time.
        This remains PROVIDER DEPENDENT / foundation-only for Stage 2 -
        see docs/architecture/05-identity-architecture.md.
  schemas:
    PaymentsMockCallback:
      type: object
      description: >
        The MOCK payments adapter's own wire shape (platform-invented, not
        modeled on any real vendor - PAY-WH-TENANT-1). The signature
        covers these RAW BODY BYTES, never a re-serialization, so field
        order/whitespace are significant to verification even though not
        semantically. There is deliberately no "signature" field in the
        body (moved to the X-Payments-Signature header) - a body that
        still carries one is rejected.
      properties:
        event_type: { type: string, enum: [deposit, deposit_reversal] }
        provider_reference: { type: string }
        original_provider_reference:
          type: string
          description: Set only for event_type=deposit_reversal - the reference of the deposit being reversed.
        outcome: { type: string, enum: [succeeded, declined, ambiguous, pending] }
        amount:
          type: integer
          format: int64
          description: Minor units at the asset's own exponent - never a float.
        asset_code: { type: string }
        decline_reason: { type: string }
        cascadable: { type: boolean }
      required: [event_type, provider_reference, outcome, amount, asset_code]
    KYCMockCallback:
      type: object
      description: >
        The MOCK KYC adapter's own wire shape (platform-invented, not
        modeled on any real vendor - KYC-WH-1, Stage 10.2, ADR 0091). The
        signature covers these RAW BODY BYTES, never a re-serialization.
        At most 256 KiB. There is deliberately no "signature" field in the
        body (the signature lives in the X-KYC-Signature header) - a body
        that still carries one is rejected as an invalid signature, not a
        malformed body.
      properties:
        provider_reference: { type: string }
        outcome:
          type: string
          enum: [approved, rejected, pending, review_required, expired, error]
        reason: { type: string }
      required: [provider_reference, outcome]
    CasinoMockCallback:
      type: object
      description: >
        The MOCK casino adapter's own wire shape (platform-invented, not
        modeled on any real vendor - CAS-WH-TENANT-1). The signature
        covers these RAW BODY BYTES, never a re-serialization, so field
        order/whitespace are significant to verification even though not
        semantically. There is deliberately no "signature" field in the
        body (moved to the X-Casino-Signature header) - a body that still
        carries one is rejected.
      properties:
        event_type: { type: string, enum: [bet, win, rollback] }
        provider_tx_id: { type: string }
        original_provider_tx_id:
          type: string
          description: Set only for event_type=rollback - the reference of the bet/win being reversed.
        round_id: { type: string }
        provider_game_id: { type: string }
        amount:
          type: integer
          format: int64
          description: Minor units at the asset's own exponent - never a float.
        asset_code: { type: string }
        outcome: { type: string, enum: [succeeded, declined, ambiguous, pending] }
        decline_reason: { type: string }
        player_account_id: { type: string, format: uuid }
        session_id:
          type: string
          format: uuid
          description: >
            The platform's own casino_launch_sessions id issued at launch
            time, echoed back on this callback - required for
            event_type=bet.
      required: [event_type, provider_tx_id, amount, asset_code]
    Asset:
      type: object
      description: >
        One Asset Registry row (ADR 0037 layers 1-3). `active` (layer 2)
        and `platform_authorized` (layer 3) are deliberately separate
        bits - an incident kill-switch and a compliance clearance must not
        share one. Neither being true implies anything about layers 4-7.
      properties:
        code: { type: string }
        asset_type: { type: string, enum: [fiat, crypto] }
        decimal_exponent:
          type: integer
          description: Immutable after creation - changing it would reinterpret every existing balance.
        display_name: { type: string }
        network: { type: string }
        active: { type: boolean }
        platform_authorized: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [code, asset_type, decimal_exponent, display_name, active, platform_authorized]
    AssetOperationEligibilityInput:
      type: object
      description: >
        Layer 7. `product` omitted means every product; a product-specific
        row always wins over it, so the product axis narrows and never
        widens. `operation` is exactly ADR 0037 §C.2's six values.
      properties:
        product: { type: string }
        operation:
          type: string
          enum: [deposit, withdrawal, wagering, settlement, conversion, reporting]
        eligible: { type: boolean }
        reason_code: { type: string }
      required: [operation, eligible, reason_code]
    Jurisdiction:
      type: object
      description: >
        A platform-wide `jurisdictions` registry row (migration 0002,
        Stage 4I item B-1) - shared reference data with no per-tenant
        scoping or row-level security (docs/governance/stage-4i-canonical-
        model.md §6.1). An FK target every tenant-scoped transaction
        ultimately reads through jurisdiction resolution.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        regulatory_body: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, code, name, created_at]
    Licence:
      type: object
      description: >
        A platform-wide `licences` registry row (migration 0002, Stage 4I
        item B-1), FK'd to a Jurisdiction. `status` always starts `active`
        - no status-transition endpoint exists yet (a disclosed, deliberate
        scope limit; see registry_admin.go's own doc comment).
      properties:
        id: { type: string, format: uuid }
        jurisdiction_id: { type: string, format: uuid }
        licensee: { type: string, enum: [platform, tenant] }
        licence_number: { type: string }
        status: { type: string }
        permitted_products:
          type: array
          items: { type: string }
        permitted_markets:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, jurisdiction_id, licensee, licence_number, status, permitted_products, permitted_markets, created_at]
    JurisdictionResolutionActive:
      type: object
      description: >
        One (tenant, operation_class) `jurisdiction_resolution_active` fact
        (Stage 4I item B-6) - a tenant-scoped, resolver-owned engineering
        precondition record, consumed read-only by Risk's future R-2b
        precondition (internal/jurisdiction.IsActive) in-process, never by
        any HTTP caller. Absent means inactive/fail-closed, never
        "unrestricted".
      properties:
        id: { type: string, format: uuid }
        operation_class:
          type: string
          enum: [play, catalogue_availability, bonus_issuance, bonus_conversion]
        active: { type: boolean }
      required: [id, operation_class, active]
    AssignTenantLicenceRequest:
      type: object
      description: >
        `licence_id` is a required JSON key with three meaningful states:
        the key absent is rejected with 400 ("licence_id is required; send
        null to unassign"); a JSON `null` unassigns the tenant's current
        licence; a UUID string assigns that licence (subject to the
        licence being `active` and its `licensee` matching the tenant's
        own `licensing_model`). Presence vs. absence of the key is itself
        significant, which is why the underlying Go type is
        `json.RawMessage` rather than a plain optional string.
      properties:
        licence_id:
          nullable: true
          type: string
          format: uuid
          description: Required key. Omit entirely -> 400. `null` -> unassign. UUID string -> assign.
        reason_code: { type: string }
      required: [licence_id, reason_code]
    TenantLicenceAssignment:
      type: object
      description: >
        The result of binding (or unassigning) the licence a tenant
        actually operates under (`tenants.licence_id`, Stage 4I Phase A).
      properties:
        tenant_id: { type: string, format: uuid }
        licence_id:
          type: string
          format: uuid
          nullable: true
          description: Null when no licence is currently assigned.
      required: [tenant_id, licence_id]
    PlayerResidence:
      type: object
      description: >
        The caller's own DECLARED residence (Stage 4I Phase B,
        self-declared, unverified - HDR-J-3b). is_set=false omits
        country_code/captured_at entirely rather than emitting an
        ambiguous empty country. Never establishes jurisdiction by
        itself - see docs/governance/stage-4i-canonical-model.md §1.2.
      properties:
        is_set: { type: boolean }
        country_code: { type: string, example: "ES" }
        captured_at: { type: string, format: date-time }
      required: [is_set]
    SetMyResidenceRequest:
      type: object
      properties:
        country_code:
          type: string
          example: "ES"
          description: ISO 3166-1 alpha-2.
      required: [country_code]
    JurisdictionEvidenceCollectionActive:
      type: object
      description: >
        Whether a tenant is currently authorized to COLLECT a given
        category of jurisdiction evidence (Stage 4I Phase B) - a
        lawful-basis activation switch (HDR-J-3e), never a resolution or
        enforcement decision. Absence of a row for an evidence_type is
        equivalent to inactive (fail-closed).
      properties:
        id: { type: string, format: uuid }
        evidence_type:
          type: string
          enum: [declared_residence, verified_residence, location_signal]
        active: { type: boolean }
      required: [id, evidence_type, active]
    SetJurisdictionEvidenceCollectionActiveRequest:
      type: object
      properties:
        active: { type: boolean }
        reason_code: { type: string }
      required: [active, reason_code]
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds }
      required: [access_token, refresh_token, token_type, expires_in]
    PlayerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [pending_verification, active, suspended, self_excluded, closed, identity_review_required]
        kyc_tier: { type: integer }
        tenant_id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
      required: [id, email, status, kyc_tier, tenant_id, brand_id]
    PlayerAccount:
      type: object
      description: Player account as seen by tenant staff (no cross-brand/cross-tenant identifiers exposed).
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [pending_verification, active, suspended, self_excluded, closed, identity_review_required]
        kyc_tier: { type: integer }
      required: [id, brand_id, email, status, kyc_tier]
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
      required: [id, expires_at]
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        licensing_model:
          type: string
          enum: [under_platform_licence, own_licence]
        status: { type: string }
      required: [id, name, slug, licensing_model, status]
    Brand:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
      required: [id, tenant_id, name, slug, status]
    StaffUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: string
          enum: [platform_admin, tenant_admin, support, compliance, finance]
        status: { type: string }
      required: [id, email, role, status]
    AuditEntry:
      type: object
      description: >
        Append-only audit record (internal/audit.Entry / the audit_log
        table). Immutable at the database level - see
        docs/decisions/0013.
      properties:
        id: { type: string, format: uuid }
        actor_type:
          type: string
          enum: [player, staff, system]
        actor_id: { type: string, format: uuid }
        action: { type: string, example: player.suspended }
        target_type: { type: string, example: player_account }
        target_id: { type: string }
        outcome:
          type: string
          enum: [success, failure, denied]
        created_at: { type: string, format: date-time }
      required: [id, actor_type, action, outcome, created_at]
    Verification:
      type: object
      description: >
        A platform-owned KYC/identity-verification attempt
        (internal/kyc.Verification / kyc_verifications). Never collapsed
        into PlayerAccount.status - see docs/decisions/0028.
      properties:
        id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        status:
          type: string
          enum: [unverified, pending, review_required, approved, rejected, expired]
        provider_id: { type: string, example: mock }
        provider_reference: { type: string }
        reason: { type: string }
        reviewed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        # Stage 5 (Operator Back Office MVP) additions - additive, optional,
        # surfaced by GET /v1/admin/kyc/cases for the case-queue view.
        brand_id: { type: string, format: uuid }
        reviewed_by: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        has_verified_residence: { type: boolean }
      required: [id, player_account_id, status, provider_id, created_at]
    PlayerVerification:
      type: object
      description: >
        The PLAYER-facing shape of a verification (Stage 10.2, ADR 0091,
        KYC-WH-1 design §B5) - used ONLY by
        /v1/me/kyc/verifications (POST/GET). Deliberately omits the
        provider reference field - a player has no legitimate need to see
        or echo it, and a player-supplied provider reference is never
        trusted anywhere in this API. The staff-facing Verification schema
        (used by every /v1/admin/kyc/* route) keeps that field.
      properties:
        id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        status:
          type: string
          enum: [unverified, pending, review_required, approved, rejected, expired]
        provider_id: { type: string, example: mock }
        reason: { type: string }
        reviewed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, player_account_id, status, provider_id, created_at]
    PageMeta:
      type: object
      description: >
        Stage 5 (Operator Back Office MVP) shared pagination envelope
        (internal/httpserver/pagination.go). Every Stage-5-era admin list
        endpoint returns `{items: [...]}` merged with this object - see
        each path's response schema for the concrete `items` type.
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
      required: [limit, offset, total]
    RGRestriction:
      type: object
      description: >
        A responsible-gaming restriction/self-exclusion row
        (internal/rg.Restriction / player_restrictions). Enforcement and
        self-exclusion mechanics are owned entirely server-side - this
        schema is read-only visibility.
      properties:
        id: { type: string, format: uuid }
        restriction_type:
          type: string
          enum: [self_exclusion]
        scope: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        indefinite: { type: boolean }
        source: { type: string }
        reason_code: { type: string }
        created_at: { type: string, format: date-time }
        active: { type: boolean }
      required: [id, restriction_type, scope, starts_at, indefinite, source, created_at, active]
    BonusCampaign:
      type: object
      description: Bonus campaign summary (internal/bonus.Campaign), read-only visibility.
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, active, paused, ended, archived]
        fulfillment_owner: { type: string }
        brand_id: { type: string, format: uuid }
        current_version_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
      required: [id, status, fulfillment_owner]
    BonusGrant:
      type: object
      description: A player's bonus grant/reward state (internal/bonus.Grant), read-only visibility.
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [issued, activated, in_progress, pending_settlement, completed, converted, expired, cancelled, forfeited, reversed]
        asset_code: { type: string }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        terminal_at: { type: string, format: date-time }
        terminal_reason_code: { type: string }
        remaining_bonus_balance: { type: string }
      required: [id, status, asset_code, created_at]
    WithdrawalAdmin:
      type: object
      description: >
        A withdrawal request as seen by staff (staffWithdrawalResponse),
        tenant-wide (not restricted to one player). The state machine,
        four-eyes controls, and ledger postings are unchanged from the
        existing (pre-Stage-5) withdrawal domain - this schema and its
        two GET endpoints are purely additive read visibility.
      properties:
        id: { type: string, format: uuid }
        asset_code: { type: string }
        amount: { type: integer }
        state:
          type: string
          enum: [requested, pending_review, approved, rejected, submitted, completed, failed, cancelled, reversed]
        requested_at: { type: string, format: date-time }
        hold_ledger_transaction_id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        decimal_exponent:
          type: integer
          description: >
            Minor-unit exponent for asset_code (e.g. 2 for EUR meaning
            `amount` is in cents). Absent means unknown - a client must
            not assume 0. Added after a ledger-finance review flagged the
            Back Office rendering raw minor units with no exponent as a
            real financial-clarity defect at the withdrawal-approval
            decision point.
      required: [id, asset_code, amount, state, requested_at, player_account_id]
    Selection:
      type: object
      description: >
        A single backable outcome within a market
        (internal/sportsbook.Selection). Odds are an integer numerator/
        denominator fraction, never a float - and the ratio
        odds_numerator/odds_denominator IS the decimal odds value
        directly (e.g. 250/100 = decimal odds 2.50), already including
        the stake: potential_return = stake * odds_numerator /
        odds_denominator. Do not add 1 to this ratio.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        odds_numerator: { type: integer, format: int64 }
        odds_denominator: { type: integer, format: int64 }
        status: { type: string, enum: [active, suspended] }
        available:
          type: boolean
          description: >-
            Stage 9.2 (ADR 0083 §5.4.1). true unless an active
            sb_jurisdiction_restrictions row applies to this selection (or
            propagates down from its market/event) for the caller's
            resolved jurisdiction - always true for an anonymous/
            unauthenticated read. A restricted selection is MARKED
            unavailable here, never omitted from the response.
        unavailable_reason:
          type: string
          description: One opaque reason, present only when available is false. Never distinguishes "blocked" from "jurisdiction undetermined" (that distinction is never player-facing).
      required: [id, name, odds_numerator, odds_denominator, status, available]
    EventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        start_time: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, live, finished, cancelled] }
        available:
          type: boolean
          description: Stage 9.2 (ADR 0083 §5.4.1) - see Selection.available's identical doc comment.
        unavailable_reason: { type: string }
      required: [id, name, start_time, status, available]
    CompetitionCatalogue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/EventSummary" }
      required: [id, name, events]
    SportCatalogue:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        competitions:
          type: array
          items: { $ref: "#/components/schemas/CompetitionCatalogue" }
      required: [id, code, name, competitions]
    MarketDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [open, suspended, closed] }
        selections:
          type: array
          items: { $ref: "#/components/schemas/Selection" }
        available:
          type: boolean
          description: >-
            Stage 9.2 (ADR 0083 §5.4.1) - see Selection.available's
            identical doc comment. A restriction on this market's own
            event marks this market (and every selection beneath it)
            unavailable too (downward propagation); a restriction on one
            of this market's own selections never propagates upward here.
        unavailable_reason: { type: string }
      required: [id, name, status, selections, available]
    EventDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        start_time: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, live, finished, cancelled] }
        sport_code: { type: string }
        sport_name: { type: string }
        competition_name: { type: string }
        markets:
          type: array
          items: { $ref: "#/components/schemas/MarketDetail" }
      required: [id, name, start_time, status, sport_code, sport_name, competition_name, markets]
    PlaceBetRequest:
      type: object
      properties:
        selection_id: { type: string, format: uuid }
        stake_amount: { type: integer, format: int64, description: "Minor units, must be positive" }
        asset_code: { type: string }
        expected_odds_numerator: { type: integer, format: int64 }
        expected_odds_denominator: { type: integer, format: int64 }
        idempotency_key: { type: string }
      required: [selection_id, stake_amount, asset_code, expected_odds_numerator, expected_odds_denominator, idempotency_key]
    Bet:
      type: object
      description: >
        A placed bet (internal/sportsbook.Bet), player-owned view.
        outcome/payout_amount/settled_at (Stage 10 W1, ADR 0088 §3.4) are
        read-only, derived from the bet's own settlement history - never
        writable by any request. This response NEVER carries a staff
        actor id or request id, even for a settled bet (see
        docs/decisions/0088 §3.4/§14 S8).
      properties:
        id: { type: string, format: uuid }
        selection_id: { type: string, format: uuid }
        asset_code: { type: string }
        stake_amount: { type: integer, format: int64 }
        odds_numerator: { type: integer, format: int64 }
        odds_denominator: { type: integer, format: int64 }
        potential_return: { type: integer, format: int64 }
        status: { type: string, enum: [open, settled_won, settled_lost, void] }
        placed_at: { type: string, format: date-time }
        outcome:
          type: string
          nullable: true
          enum: [won, lost]
          description: "From the bet's current un-reversed settlement row; null when open or void."
        payout_amount:
          type: integer
          format: int64
          nullable: true
          description: "From the bet's current un-reversed settlement row; null when open, void, or lost."
        settled_at:
          type: string
          format: date-time
          nullable: true
          description: >
            created_at of the history row that set the bet's CURRENT
            non-open status: the current settlement row for
            settled_won/settled_lost, the void row for void; null when
            open (including a settled-then-rolled-back bet, which is open
            again).
      required: [id, selection_id, asset_code, stake_amount, odds_numerator, odds_denominator, potential_return, status, placed_at, outcome, payout_amount, settled_at]
    BetSettlementLifecycleEntry:
      type: object
      description: >
        One sportsbook_bet_settlements row (Stage 10 W1, ADR 0088 §3.2/§3.4).
        Staff-only - never on the player-facing Bet schema.
      properties:
        id: { type: string, format: uuid }
        event_kind: { type: string, enum: [settlement, rollback, void, tombstone] }
        generation: { type: integer, nullable: true }
        outcome: { type: string, nullable: true, enum: [won, lost] }
        payout_amount: { type: integer, format: int64, nullable: true }
        void_reason: { type: string, nullable: true, enum: [market_cancelled, push, data_error] }
        ledger_transaction_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
      required: [id, event_kind, generation, outcome, payout_amount, void_reason, ledger_transaction_id, created_at]
    AdminBet:
      allOf:
        - $ref: "#/components/schemas/Bet"
        - type: object
          description: >
            Stage 6 Back Office visibility view - adds the player identity
            and the same decimal_exponent presentation aid WithdrawalAdmin
            carries, for the identical reason (raw minor units misrepresent
            the real staked/returned amount at a glance). Stage 8
            (docs/decisions/0080 Decision 5) additionally surfaces
            provider_id/provider_bet_reference, passed through from
            internal/sportsbook.Bet's identical nullable columns as empty
            strings when unset - always empty today, since no real
            sportsbook provider adapter exists yet. Stage 10 W1 (ADR 0088
            §3.4) additionally surfaces correlation_id (the bet id itself
            - every W1 ledger posting for this bet carries it) and the
            full settlement lifecycle, staff-only.
          properties:
            player_account_id: { type: string, format: uuid }
            brand_id: { type: string, format: uuid }
            decimal_exponent: { type: integer }
            provider_id: { type: string, description: "Empty when this bet has no provider-acceptance reference recorded (always empty until a real adapter exists)." }
            provider_bet_reference: { type: string, description: "Empty when this bet has no provider-acceptance reference recorded (always empty until a real adapter exists)." }
            correlation_id: { type: string, format: uuid, description: "The bet id itself - the ledger correlation_id every W1 posting for this bet carries." }
            lifecycle:
              type: array
              items: { $ref: "#/components/schemas/BetSettlementLifecycleEntry" }
          required: [player_account_id, brand_id, decimal_exponent, provider_id, provider_bet_reference, correlation_id, lifecycle]
    SimulateSettlementEventRequest:
      type: object
      description: >
        ADR 0088 §9.2's exact request shape for the non-production
        test-support settlement-simulation route. Unknown fields are
        rejected. Field requirements vary by event_type: settle requires
        generation/outcome/payout_amount/asset_code and forbids
        void_reason; rollback requires only generation; void requires only
        void_reason. payout_amount must be a JSON integer (non-integer,
        negative, or overflowing int64 is rejected at decode, 400
        VALIDATION_FAILED) - it is a CLAIM validated against the bet's own
        frozen potential_return, never posted directly.
      properties:
        event_type: { type: string, enum: [settle, void, rollback] }
        generation: { type: integer, description: "Required for settle/rollback; forbidden for void." }
        outcome: { type: string, enum: [won, lost], description: "Required for settle; forbidden otherwise." }
        payout_amount: { type: integer, format: int64, description: "Required for settle (a claim, not posted directly); forbidden otherwise." }
        asset_code: { type: string, description: "Required for settle; forbidden otherwise." }
        void_reason: { type: string, enum: [market_cancelled, push, data_error], description: "Required for void; forbidden otherwise." }
      required: [event_type]
    SimulateSettlementEventResponse:
      type: object
      properties:
        bet_id: { type: string, format: uuid }
        event_type: { type: string, enum: [settle, void, rollback] }
        result: { type: string, enum: [applied, replayed, tombstoned] }
        bet_status: { type: string, enum: [open, settled_won, settled_lost, void] }
        generation: { type: integer }
        ledger_transaction_ids:
          type: array
          items: { type: string, format: uuid }
        settlement_record_ids:
          type: array
          items: { type: string, format: uuid }
      required: [bet_id, event_type, result, bet_status, generation, ledger_transaction_ids, settlement_record_ids]
    PlaceBetResponse:
      type: object
      description: >
        Response envelope for BOTH outcomes of POST /v1/me/sportsbook/bets.
        accepted is the discriminator: when true, bet is populated and the
        rejection_* fields are absent; when false, bet is absent and
        rejection_category/rejection_code/rejection_message are populated.
        A decline is a well-formed business outcome, not an HTTP error.
      properties:
        accepted: { type: boolean }
        bet: { $ref: "#/components/schemas/Bet" }
        rejection_category:
          type: string
          enum: [odds_changed, event_not_open, insufficient_funds, rg_denied, risk_denied, jurisdiction_denied]
          description: >-
            jurisdiction_denied (Stage 9.2, ADR 0083 Part C) collapses two
            internally-distinguishable outcomes (jurisdiction_blocked /
            jurisdiction_unresolved) into one opaque
            rejection_code/rejection_message at this HTTP boundary (K3-6)
            - the two are never distinguishable in this response.
        rejection_code: { type: string }
        rejection_message: { type: string }
      required: [accepted]
    Round:
      type: object
      description: >
        A casino round (internal/casino.RoundSummary) - one launch session
        enriched with whatever casino_bet/casino_win/casino_rollback
        ledger transactions were posted under it. Amount/provider_tx_id
        fields are absent when that leg never happened.
      properties:
        session_id: { type: string, format: uuid }
        game_id: { type: string, format: uuid }
        provider_id: { type: string }
        provider_game_id: { type: string }
        asset_code: { type: string }
        mode: { type: string, enum: [real, demo] }
        status: { type: string, enum: [launched, wagered, won, rolled_back] }
        launched_at: { type: string, format: date-time }
        bet_amount: { type: integer, format: int64 }
        win_amount: { type: integer, format: int64 }
        rollback_amount: { type: integer, format: int64 }
        bet_provider_tx_id: { type: string }
        win_provider_tx_id: { type: string }
        rollback_provider_tx_id: { type: string }
      required: [session_id, game_id, provider_id, provider_game_id, asset_code, mode, status, launched_at]
    AdminRound:
      allOf:
        - $ref: "#/components/schemas/Round"
        - type: object
          description: >
            Stage 7 Back Office minimum-visibility view - adds the player/
            brand identity, the same decimal_exponent presentation aid
            AdminBet carries, and the round's own ledger_transaction_ids
            for audit-log cross-reference. Stage 8 (docs/decisions/0080
            Decision 5) additionally surfaces provider_round_id, sourced
            from the casino_provider_rounds binding (migration 0080) for
            this round's own launch session when one exists - empty when
            no provider has ever bound a round id to this session (the
            common case today, since no real provider posts callbacks).
          properties:
            player_account_id: { type: string, format: uuid }
            brand_id: { type: string, format: uuid }
            decimal_exponent: { type: integer }
            ledger_transaction_ids:
              type: array
              items: { type: string, format: uuid }
            provider_round_id: { type: string, description: "Empty when no casino_provider_rounds binding exists yet for this round's session." }
          required: [player_account_id, brand_id, decimal_exponent, ledger_transaction_ids, provider_round_id]
    CasinoPlayResult:
      type: object
      description: Response envelope shared by the wager/win/rollback play-simulation endpoints.
      properties:
        outcome: { type: string, enum: [succeeded, declined, ambiguous, pending] }
        provider_tx_id: { type: string, description: "This event's own provider reference - save it to name in a later rollback" }
        ledger_transaction_id: { type: string, format: uuid }
        tombstoned: { type: boolean }
        decline_reason: { type: string }
      required: [outcome, provider_tx_id, tombstoned]
    Document:
      type: object
      description: >
        A versioned, immutable-after-upload identity/verification
        document (internal/kyc.Document / kyc_documents). A reupload of
        the same document_type is a NEW row with version+1, never an
        overwrite - see docs/decisions/0029.
      properties:
        id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        verification_id: { type: string, format: uuid }
        document_type:
          type: string
          enum: [passport, national_id, drivers_license, proof_of_address, selfie, other]
        issuing_country: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [pending_review, approved, rejected]
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        original_filename: { type: string }
        rejection_reason: { type: string }
        uploaded_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
      required: [id, player_account_id, verification_id, document_type, version, status, content_type, size_bytes, original_filename, uploaded_at]
    RiskRule:
      type: object
      description: >
        A Risk & Limits policy rule (internal/risk.Rule / risk_rules).
        Immutable after creation except status/description/
        effective_until - see docs/decisions/0031.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, description: "Absent/empty means platform-wide" }
        brand_id: { type: string, format: uuid }
        jurisdiction_code: { type: string }
        licensing_mode: { type: string, enum: [under_platform_licence, own_licence], description: "Stage 4G-FINAL: absent means the rule applies regardless of licensing mode" }
        player_account_id: { type: string, format: uuid }
        product: { type: string, enum: [casino, sportsbook, payments, bonus] }
        operation:
          type: string
          enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
        provider_id: { type: string }
        game_id: { type: string, format: uuid }
        asset_code: { type: string }
        payment_method: { type: string }
        limit_kind: { type: string, enum: [min_amount, max_amount, cumulative_amount] }
        time_window: { type: string, enum: [transaction, rolling_hour, rolling_day, rolling_week, rolling_month] }
        threshold: { type: integer, format: int64 }
        threshold_exponent:
          type: integer
          minimum: 0
          maximum: 18
          nullable: true
          description: >-
            The decimal exponent `threshold`'s minor units are expressed in, for an
            asset-agnostic amount rule. Absent for an asset-scoped rule, whose denomination is
            its own asset_code (ADR 0031 §35).
        rule_kind: { type: string, enum: [hard_limit, configurable_limit, risk_signal] }
        action: { type: string, enum: [deny, review] }
        status: { type: string, enum: [active, disabled] }
        effective_from: { type: string, format: date-time }
        effective_until: { type: string, format: date-time }
        description: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, operation, limit_kind, time_window, threshold, rule_kind, action, status, effective_from, created_at]
    SportsbookJurisdictionRestriction:
      type: object
      description: >
        A deny-only sb_jurisdiction_restrictions row (internal/sportsbook.
        JurisdictionRestriction, migration 0087, ADR 0083 §5.2). Platform-
        wide - carries no tenant_id. Immutable except status/reason_code;
        withdrawn, never deleted.
      properties:
        id: { type: string, format: uuid }
        scope_kind: { type: string, enum: [event, market, selection] }
        event_id: { type: string, format: uuid }
        market_id: { type: string, format: uuid }
        selection_id: { type: string, format: uuid }
        jurisdiction_code: { type: string }
        restriction_kind: { type: string, enum: [blocked] }
        status: { type: string, enum: [active, withdrawn] }
        authorization_reference: { type: string }
        reason_code: { type: string }
        created_by_actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, scope_kind, jurisdiction_code, restriction_kind, status, authorization_reference, reason_code, created_by_actor_id, created_at, updated_at]
    SportsbookExposureLimit:
      type: object
      description: >
        A cross-player, per-(scope_kind, asset_code) trading-book exposure
        ceiling (internal/sportsbook.ExposureLimit, migration 0088, ADR
        0083 §6.2.3). Tenant-owned (carries tenant_id, unlike
        SportsbookJurisdictionRestriction) - no player-facing read path
        exists for this data class. Immutable except status/reason_code;
        disabled and superseded by a new row, never edited or deleted.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid, description: "Absent means tenant-wide (every brand)." }
        scope_kind: { type: string, enum: [event, market, selection] }
        asset_code: { type: string }
        max_open_potential_payout: { type: integer, format: int64 }
        measure: { type: string, enum: [gross_potential_payout], description: "Which figure max_open_potential_payout is denominated in (ADR 0083 §6.2.2) - stake included, never netted." }
        status: { type: string, enum: [active, disabled] }
        authorization_reference: { type: string }
        reason_code: { type: string }
        created_by_actor_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, tenant_id, scope_kind, asset_code, max_open_potential_payout, measure, status, authorization_reference, reason_code, created_by_actor_id, created_at, updated_at]
    BonusChangeRequest:
      type: object
      description: >
        A dual-controlled bonus operation's own governance record
        (bonus_change_requests, migration 0063). Immutable except state
        (pending -> applied|rejected|cancelled). The reason_code/
        requested_by_principal_id/requested_at/amount_at_request/
        asset_code/applied_by_principal_id/applied_at fields were added
        Stage 5 (Operator Back Office MVP) to back the new
        GET /v1/admin/bonus/change-requests approval-queue view - purely
        additive, the POST filing/decide endpoints and their own
        semantics are unchanged.
      properties:
        id: { type: string, format: uuid }
        operation:
          type: string
          enum: [manual_grant_issue, bulk_job_execute, bonus_adjustment_write, grant_forced_conversion, campaign_activate, offer_publish, grant_cancel_completed, held_disposition_resolve]
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, applied, rejected, cancelled] }
        reason_code: { type: string }
        requested_by_principal_id: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        amount_at_request: { type: string }
        asset_code: { type: string }
        applied_by_principal_id: { type: string, format: uuid }
        applied_at: { type: string, format: date-time }
      required: [id, operation, target_type, target_id, state]
    EconomicOperation:
      type: object
      description: >
        An EconomicOperationIdentity (economic_operations, doc 34) -
        Bonus Engine's own authorization-lineage anchor for manual/bulk
        grant issuance.
      properties:
        operation_id: { type: string, format: uuid }
        root_operation_id: { type: string, format: uuid }
        operation_type: { type: string, enum: [bonus_manual_grant, bonus_bulk_grant] }
        approval_state: { type: string, enum: [not_required, pending, approved, rejected, expired, consumed, revoked] }
        status: { type: string, enum: [open, exhausted, completed, aborted, superseded] }
      required: [operation_id, root_operation_id, operation_type, approval_state, status]
    Error:
      type: object
      description: Platform-wide error envelope (internal/apierror.Error).
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - internal_error
            - service_unavailable
            - tenant_mismatch
            - rate_limited
        message:
          type: string
        request_id:
          type: string
      required: [code, message]
  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but lacking the required permission or tenant scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (or not visible to the caller's tenant scope)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        A control refused the request - e.g. an asset-registry operation
        with no independently-approved change request behind it
        (four-eyes), or a self-approval. Deliberately distinct from 500:
        the platform is working, a control said no.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed attempts; locked out for a window
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
