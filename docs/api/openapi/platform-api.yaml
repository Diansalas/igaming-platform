    RGLimitChange:
      type: object
      description: >
        One stored RG limit change as the PLAYER sees it (internal/httpserver rgLimitChangeResponse). No staff identity: a staff-originated change
        has source staff_on_player_request and its reason_code only. value null means a removal.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [deposit, loss, wager, session_duration] }
        scope: { type: string, enum: [account, tenant_person] }
        asset_code: { type: string }
        period: { type: string, enum: [rolling_24h, rolling_7d, rolling_30d, calendar_day, calendar_week, calendar_month] }
        value: { type: string, nullable: true, description: "Decimal string (NUMERIC(38,0)); null = removal." }
        change_kind: { type: string, enum: [initial, decrease, increase, removal, cancel_pending, confirm] }
        pending: { type: boolean }
        requires_confirmation: { type: boolean }
        requested_at: { type: string, format: date-time }
        effective_at: { type: string, format: date-time }
        supersedes_change_id: { type: string, format: uuid }
        source: { type: string, enum: [player_self_service, staff_on_player_request] }
        reason_code: { type: string }
      required: [id, kind, scope, value, change_kind, pending, requires_confirmation, requested_at, effective_at, source, reason_code]
    RGLimitState:
      type: object
      description: The realized value and open pending change of one limit key.
      properties:
        kind: { type: string, enum: [deposit, loss, wager, session_duration] }
        scope: { type: string, enum: [account, tenant_person] }
        asset_code: { type: string }
        period: { type: string }
        has_value: { type: boolean }
        value: { type: string, nullable: true }
        pending: { $ref: "#/components/schemas/RGLimitChange" }
      required: [kind, scope, has_value, value]
    RGMyLimits:
      type: object
      properties:
        limits:
          type: array
          items: { $ref: "#/components/schemas/RGLimitState" }
        history:
          type: array
          items: { $ref: "#/components/schemas/RGLimitChange" }
      required: [limits, history]
    RGSetLimitRequest:
      type: object
      description: >
        value is REQUIRED (a positive integer string / integer, or null to remove). There is no tenant, person, scope, change kind or time
        field; an unknown field is 400.
      properties:
        kind: { type: string, enum: [deposit, loss, wager, session_duration] }
        asset_code: { type: string, description: "Required for deposit / loss / wager; absent for session_duration." }
        period: { type: string, enum: [rolling_24h, rolling_7d, rolling_30d, calendar_day, calendar_week, calendar_month], description: "Required for deposit / loss / wager; absent for session_duration." }
        value:
          nullable: true
          description: >
            A positive integer. SEND IT AS A STRING: a JSON number is accepted only as an integer literal and is read as text, but
            JSON libraries lose precision above 2^53, and amounts are NUMERIC(38,0) minor units (an exponent-18 asset exceeds 2^53 at
            once). null removes the limit.
          oneOf:
            - { type: string, pattern: "^[1-9][0-9]{0,37}$" }
            - { type: integer, minimum: 1 }
      required: [kind, value]
    RGStaffSetLimitRequest:
      type: object
      properties:
        kind: { type: string, enum: [deposit, loss, wager, session_duration] }
        asset_code: { type: string }
        period: { type: string }
        value:
          nullable: true
          oneOf:
            - { type: string, pattern: "^[1-9][0-9]{0,37}$" }
            - { type: integer, minimum: 1 }
        reason_code: { type: string, minLength: 1, maxLength: 64 }
        evidence_ref: { type: string, minLength: 1, maxLength: 200 }
      required: [kind, value, reason_code, evidence_ref]
    RGStaffLimitChange:
      type: object
      description: A limit change as TENANT staff see it; created_by is the staff id of the caller's own tenant, else null.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        scope: { type: string }
        asset_code: { type: string }
        period: { type: string }
        value: { type: string, nullable: true }
        change_kind: { type: string }
        pending: { type: boolean }
        requires_confirmation: { type: boolean }
        requested_at: { type: string, format: date-time }
        effective_at: { type: string, format: date-time }
        supersedes_change_id: { type: string, format: uuid }
        source: { type: string }
        reason_code: { type: string }
        player_account_id: { type: string, format: uuid }
        evidence_ref: { type: string }
        created_by_actor_type: { type: string, enum: [player, staff] }
        created_by: { type: string, format: uuid, nullable: true }
      required: [id, kind, scope, value, change_kind, pending, requires_confirmation, requested_at, effective_at, source, reason_code, player_account_id, created_by_actor_type, created_by]
    RGStaffLimits:
      type: object
      properties:
        limits:
          type: array
          items: { $ref: "#/components/schemas/RGLimitState" }
      required: [limits]
    RGStaffHistory:
      type: object
      properties:
        history:
          type: array
          items: { $ref: "#/components/schemas/RGStaffLimitChange" }
      required: [history]
    RGSelfExclusionRequest:
      type: object
      properties:
        duration_days: { type: integer, minimum: 1, description: "Whole days; omit for an indefinite exclusion." }
    RGLimitOption:
      type: object
      properties:
        kind: { type: string, enum: [deposit, loss, wager] }
        config_in_force: { type: boolean }
        mandatory: { type: boolean }
        allowed_periods:
          type: array
          items: { type: string, enum: [rolling_24h, rolling_7d, rolling_30d, calendar_day, calendar_week, calendar_month] }
        ceiling: { type: string, nullable: true, description: "NUMERIC(38,0) minor units, a decimal string; null = none" }
        scope: { type: string, enum: [account, tenant_person] }
        increase_cooldown_seconds: { type: integer, format: int64, nullable: true }
      required: [kind, config_in_force, mandatory, allowed_periods, ceiling, increase_cooldown_seconds]
    RGOptions:
      type: object
      properties:
        asset_code: { type: string }
        limit_enforcement_enabled: { type: boolean }
        limits:
          type: array
          items: { $ref: "#/components/schemas/RGLimitOption" }
        time_out_hours:
          type: array
          items: { type: integer }
        self_exclusion_days:
          type: array
          items: { type: integer }
        self_exclusion_indefinite_allowed: { type: boolean }
      required: [asset_code, limit_enforcement_enabled, limits, time_out_hours, self_exclusion_days, self_exclusion_indefinite_allowed]
    RGEnforcementRequest:
      type: object
      properties:
        brand_id: { type: string, format: uuid, description: "Optional; omit for the whole tenant." }
        reason_code: { type: string, minLength: 1, maxLength: 64, description: "Printable ASCII." }
        attestation_ref: { type: string, minLength: 1, maxLength: 200, description: "Printable ASCII; names the compliance signatory." }
      required: [reason_code, attestation_ref]
    PlatformStatus:
      type: object
      properties:
        build:
          type: object
          properties:
            commit: { type: string, description: "7 to 64 lower-case hex characters, or `unknown`." }
          required: [commit]
        migrations:
          type: object
          properties:
            head_version: { type: integer, format: int64 }
            applied_count: { type: integer, format: int64 }
          required: [head_version, applied_count]
        database_environment:
          type: object
          properties:
            anchor: { type: string, enum: [production, staging, development, test, unrecorded, unrecognised] }
            recorded: { type: boolean }
          required: [anchor, recorded]
      required: [build, migrations, database_environment]
    RGEnforcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        level: { type: string, enum: [tenant, brand] }
        brand_id: { type: string, format: uuid }
        reason_code: { type: string }
        attestation_ref: { type: string }
        created_by: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
      required: [id, level, reason_code, attestation_ref, created_by, created_at]
    RGEnforcementList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RGEnforcement" }
        enforcement_enabled: { type: boolean }
      required: [items, enforcement_enabled]
    RGTimeOutRequest:
      type: object
      properties:
        duration_hours: { type: integer, minimum: 1, maximum: 87600 }
      required: [duration_hours]
    RGAttestedString:
      type: object
      description: Exactly one of {"none":true} (an attested "no bound") or {"value":"..."}.
      properties:
        none: { type: boolean, enum: [true] }
        value: { type: string, pattern: "^[1-9][0-9]{0,37}$" }
    RGAttestedInt:
      type: object
      description: Exactly one of {"none":true} or {"value":<seconds>}.
      properties:
        none: { type: boolean, enum: [true] }
        value: { type: integer, minimum: 1 }
    RGAttestedBool:
      type: object
      description: Exactly one of {"none":true} or {"value":true|false}.
      properties:
        none: { type: boolean, enum: [true] }
        value: { type: boolean }
    RGConfigContent:
      type: object
      description: >
        The content of one RG configuration row (internal/rg.ConfigContent). Which fields are required / forbidden depends on control_kind:
        every applicable field is explicit (a value or an attested none) - no partial configuration. Intervals are whole seconds.
        No legal value is supplied by the platform.
      properties:
        control_kind: { type: string, enum: [deposit, loss, wager, session_duration, reality_check_interval, time_out] }
        asset_code: { type: string }
        effective_from: { type: string, format: date-time }
        enabled: { type: boolean }
        mandatory: { type: boolean }
        ceiling: { $ref: "#/components/schemas/RGAttestedString" }
        increase_cooldown_seconds: { type: integer, minimum: 1 }
        increase_requires_reconfirmation: { type: boolean }
        scope: { type: string, enum: [account, tenant_person, platform_person] }
        allowed_periods:
          type: array
          items: { type: string, enum: [rolling_24h, rolling_7d, rolling_30d, calendar_day, calendar_week, calendar_month] }
        calendar_tz: { type: string }
        week_start: { type: integer, minimum: 1, maximum: 7 }
        count_bonus_funded: { type: boolean }
        loss_computation: { type: string, enum: [net_of_wins] }
        loss_may_go_negative: { $ref: "#/components/schemas/RGAttestedBool" }
        post_session_break: { $ref: "#/components/schemas/RGAttestedInt" }
        concurrent_chain_aggregation: { $ref: "#/components/schemas/RGAttestedBool" }
        pending_intent_ttl: { $ref: "#/components/schemas/RGAttestedInt" }
        allowed_durations_seconds:
          type: array
          items: { type: integer, minimum: 1 }
        allowed_durations_any: { type: boolean }
        allowed_intervals_seconds:
          type: array
          items: { type: integer, minimum: 1 }
        reason_code: { type: string, minLength: 1, maxLength: 64 }
        attestation_ref: { type: string, minLength: 1, maxLength: 200, description: "Printable ASCII. A named signatory reference supplied by compliance." }
      required: [control_kind, reason_code, attestation_ref]
    RGOperatorConfigRequest:
      type: object
      properties:
        brand_id: { type: string, format: uuid, description: "Optional; must be a brand of the caller's tenant." }
        config: { $ref: "#/components/schemas/RGConfigContent" }
      required: [config]
    RGConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        level: { type: string, enum: [floor, tenant, brand] }
        jurisdiction_code: { type: string }
        brand_id: { type: string, format: uuid }
        config: { $ref: "#/components/schemas/RGConfigContent" }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, level, jurisdiction_code, config, created_by, created_at]
    RGConfigList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/RGConfig" }
    RGFloorRequestBody:
      type: object
      properties:
        jurisdiction_code: { type: string }
        config: { $ref: "#/components/schemas/RGConfigContent" }
      required: [jurisdiction_code, config]
    RGFloorRequest:
      type: object
      description: >
        A jurisdiction floor change request. proposed_config is the proposed row keyed by rg_limit_configs column names (as the database hashes it).
      properties:
        id: { type: string, format: uuid }
        jurisdiction_code: { type: string }
        control_kind: { type: string }
        asset_code: { type: string }
        proposed_config: { type: object }
        payload_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        reason_code: { type: string }
        requested_by: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        decided_by: { type: string, format: uuid, nullable: true }
        decided_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        applied_config_id: { type: string, format: uuid }
      required: [id, jurisdiction_code, control_kind, proposed_config, payload_hash, reason_code, requested_by, status, created_at, expires_at]
    RGFloorRequestList:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/RGFloorRequest" }
  responses:
    MarketNotAvailable:
      description: >
        403 `MARKET_NOT_AVAILABLE` (A8, operating-market gate, internal/marketgate): the request is refused
        because this service is not available in the region the request is evidenced to come from. ONE status,
        ONE code and ONE fixed message (`this service is not available in your region`) for EVERY cause - the
        evidenced country is outside the brand's operating market, the brand has no operating-market
        configuration, or location evidence is unknown/unavailable (fail closed) - so the response cannot tell
        a caller which rung blocked or whether their location could not be determined. The country is NEVER
        read from the request (body, headers, query); it is derived server-side. Nothing is created (a refused
        deposit creates no intent, attempt or provider call and does not consume the idempotency key; a refused
        launch mints no session or token; a refused registration creates no account; a refused sportsbook bet locks no stake and writes no ledger row). A deployment with no
        market gate configured answers 503 `service_unavailable` instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AmlBadRequest:
      description: 400 validation_error - a malformed id, body, limit, reason code or note (fixed sentence; check code note_refused for a refused note). Nothing was written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AmlForbidden:
      description: 403 forbidden - no in-force aml_officer grant for the tenant, a proof refusal, or an acting session the database refused. Fixed sentence, no detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AmlNotFound:
      description: 404 not_found - unknown, outside the actor's owner scope, or another tenant (indistinguishable by design).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AmlConflict:
      description: >
        409 conflict with exactly one closed check code: quorum_not_met, hold_refused, four_eyes_refused, stale,
        illegal_transition or guard_refused. Nothing was written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AmlUnavailable:
      description: 503 service_unavailable - AML officer functions are not wired in this process, or no actor-proof issuer is configured. Fail closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StepUpRequired:
      description: >
        403 step_up_required (ADR 0119 S4b): the caller's last second-factor verification is older than the route's
        step-up class allows (or, for 403 forbidden, the caller lacks the permission). Nothing was written. Obtain a
        fresh access token at POST /v1/staff/auth/step-up and re-send the original request exactly once.
      headers:
        WWW-Authenticate:
          description: 'RFC 9470: Bearer realm="platform-api", error="insufficient_user_authentication", error_description="...", max_age="N"'
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffSessionRevoked:
      description: >
        401. unauthorized (no or invalid bearer token) or session_revoked (the staff session is no longer live: revoked,
        suspended, offboarded, role or staff_version changed, second factor revoked or hard-locked; the in-transaction
        re-assertion of a governed write gives the same answer).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffLifecycleForbidden:
      description: >
        403. forbidden (permission, or a tenant caller on a platform route), step_up_required (with max_age and the
        RFC 9470 WWW-Authenticate header; nothing was written), self_target_forbidden, role_not_grantable, or
        four_eyes_violation (platform four-eyes distinctness by staff id and by Person).
      headers:
        WWW-Authenticate:
          description: Set with step_up_required (RFC 9470)
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffLifecycleConflict:
      description: >
        409. conflict (email already used in the scope), lifecycle_transition_invalid (the target is not in a state the
        action applies to), last_admin (SF020 / SF021), or lifecycle_busy (the suspension / offboarding status change
        could not take the row lock within 5 s twice; the target's sessions are already revoked - retry).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffPersonRequired:
      description: 422 person_required - platform_admin, tenant_admin, finance and compliance need a linked Person (SF014).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffLifecycleUnavailable:
      description: 503 service_unavailable - a database fault, no actor-proof key, or no staff MFA keys. Nothing was committed by the failing phase.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffAuthForbidden:
      description: >
        403. One closed code: mfa_enrolment_required (the password is right but the account has no active second
        factor - an administrator must issue an enrolment link; a password alone never opens enrolment),
        mfa_locked (the factor is soft- or hard-locked; nothing was compared, the answer does not depend on the
        code; a hard lock is cleared only by an administrative MFA reset), or forbidden (the account is not active).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffMfaUnauthorized:
      description: >
        401. One closed code: invalid_challenge (the single answer for an unknown, expired, consumed, exhausted or
        wrong-purpose challenge token - restart the login), or invalid_mfa_code (wrong, malformed or already-used
        code; one challenge attempt was spent and the failure was recorded against the factor).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffMfaRateLimited:
      description: rate_limited - the per-IP `mfa` bucket (30 per minute) is exhausted; Retry-After is set
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StaffAuthUnavailable:
      description: >
        503 service_unavailable - a database fault, a serialization failure or a commit failure. The answer is the
        same fixed message whatever the verification outcome would have been (ADR 0119 S3 gate G4); nothing was
        committed. Retry once with a fresh login if the challenge is no longer valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RGNotFound:
      description: 404 not_found. An unknown id, or an id of another tenant / another player (indistinguishable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RGForbidden:
      description: >
        403. Beyond the generic gate refusals (not the right principal type, permission missing, a tenant token on a platform route): one of
        RG_STEP_UP_REQUIRED (staff increase / removal, ADR 0017 not implemented), RG_SELF_TARGET, RG_IDENTITY_REVIEW, RG_PROOF_REFUSED
        (the ADR 0110 signed actor proof), or forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RGConflict:
      description: >
        409. One closed code: RG_NO_CHANGE, RG_CHANGE_NOT_PENDING, RG_COOLING_OFF, RG_CONFIG_MISSING, RG_PENDING_CAP, RG_IDEMPOTENCY_MISMATCH,
        RG_OPERATOR_LOOSENS, RG_NO_FLOOR_IN_FORCE, RG_SELF_APPROVAL, RG_REQUEST_NOT_PENDING, RG_GUARD_REFUSED. The message is a fixed sentence,
        never database text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RGUnprocessable:
      description: >
        422. One closed code: RG_LIMIT_ABOVE_CEILING, RG_PERIOD_NOT_ALLOWED, RG_DURATION_NOT_ALLOWED, RG_NOT_OFFERED, RG_BACKDATED,
        RG_SYNTHETIC_REFUSED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RGUnavailable:
      description: 503 RG_UNAVAILABLE. No actor-proof issuer in this process, or a retryable lock timeout / deadlock (Retry-After).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ResolutionInvalidRequest:
      description: >
        400. invalid_request for a malformed JSON body, an unknown body field
        or a malformed path id; validation_error (message "invalid request")
        for a value that fails validation (a malformed id or hash inside the
        body, a code outside its closed set, a field combination the kind does
        not allow, a length bound).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForceResolutionForbidden:
      description: >
        403 forbidden. Beyond the generic gate refusals (not a staff
        principal, route permission missing), the message is the closed token
        force_resolve_not_permitted: a tenant caller naming another tenant, no
        in-force capability grant or acting session, another database-enforced authority
        rule refused it, or an actor-proof refusal. A tenant-scoped M4 request or
        final approval is refused with this token (the evidence scope is not
        visible to a tenant-staff session). Each such refusal that passes the
        service or the tenant check writes a denied audit row; a refusal at the
        generic gate or at tenant-target validation writes none.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForceResolutionNotFound:
      description: 404 not_found, message force_resolve_not_found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForceResolutionConflict:
      description: >
        409 conflict. The message is one closed token: force_resolve_disabled,
        force_resolve_precondition_failed (including no statement source for
        the provider), force_resolve_reason_not_resolvable,
        force_resolve_conflict (including the resolution not being pending, a
        state conflict or a retryable serialization failure),
        force_resolve_expired, force_resolve_evidence_insufficient (including
        non-MOCK M4 at request, which is blocked), force_resolve_evidence_mismatch,
        force_resolve_evidence_overflow, force_resolve_evidence_unsealed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HoldResolutionForbidden:
      description: >
        403 forbidden. Beyond the generic gate refusals (not a staff
        principal, route permission missing - every tenant role), the message
        is the closed token hold_resolution_not_permitted: a tenant caller
        naming another tenant, no in-force platform grant or acting session,
        another database-enforced authority rule refused it, or an actor-proof refusal. Each such refusal
        that passes the service or the tenant check writes a denied audit row; a refusal at the generic gate
        or at tenant-target validation writes none.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HoldResolutionNotFound:
      description: 404 not_found, message hold_resolution_not_found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HoldResolutionConflict:
      description: >
        409 conflict. The message is one closed token: hold_resolution_disabled,
        hold_resolution_precondition_failed, hold_resolution_conflict
        (including the resolution not being pending or a retryable
        serialization failure), hold_resolution_expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderCredentialInvalidRequest:
      description: >
        400 invalid_request - syntactic errors only (malformed JSON, unknown
        field, missing field, value outside an enum, key_id charset).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but lacking the required permission or tenant scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (or not visible to the caller's tenant scope)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        A control refused the request - e.g. an asset-registry operation
        with no independently-approved change request behind it
        (four-eyes), or a self-approval. Deliberately distinct from 500:
        the platform is working, a control said no.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed attempts; locked out for a window
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: service_unavailable - retryable; nothing was written
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookRateLimited:
      description: >
        ADR 0097 (PAYWH-RL-1, PRH-I4). Rejected by the pre-admission rate
        limiter (A2 per-source-IP, off by default; A3 the pre-auth
        (domain, tenant, provider) bucket; or B1 the post-verification
        (domain, tenant_id, provider_id) bucket). This is a NEW response
        class, distinct from the pre-verification uniform-401 contract:
        with the same limiter-bucket state, a validly-signed and an
        invalidly-signed request get a byte-identical 429 (status,
        headers, generic body) - Retry-After is computed only from
        limiter state, never from anything the signature proves.
        Deliberately generic: request id only, never a domain-specific
        field.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, clamped to [1, 60].
          schema: { type: integer, minimum: 1, maximum: 60 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookAdmissionUnavailable:
      description: >
        ADR 0097 (PAYWH-RL-1, PRH-I4). Rejected by a capacity bulkhead
        (A4a webhook in-flight; A4b the pre-verification DB gate; B2 the
        per-tenant domain-transaction bulkhead) - or, for a provider
        adapter declared not to retry 429 (WebhookRetrySemantics), a B1
        rejection mapped to 503 instead. Also returned if an admission-
        layer panic is recovered internally (never a bare 500), or if the
        webhook tenant directory has not yet completed its first load.
        Always retryable; generic body, request id only.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (1 for a capacity rejection, 2 for the domain-transaction bulkhead).
          schema: { type: integer, minimum: 1, maximum: 60 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchBadRequest:
      description: >
        400. invalid_request for a malformed JSON body, an unknown body field or a malformed path id; validation_error (message "invalid request", never an echo of the
        offending content) for a value that fails validation: a malformed id or query value, an action or reason code outside its closed set, a free-text note that the PII lint
        refuses, a missing required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchForbidden:
      description: >
        403. forbidden: not a staff principal, the static launch_authorisation:* permission is missing for the role (approve and reject are platform_admin only), a tenant-scoped
        caller on a tenant subject or on the platform-wide queue, a non-requester cancelling, or an acting session. LAUNCH_PROOF_REFUSED: the database refused the signed actor
        proof (check_codes carries the AP code). LAUNCH_NO_PERSON: the staff account has no readable Person, so the four-eyes check cannot be evaluated. No data is returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchNotFound:
      description: >
        404 not_found. An unknown id, another tenant's request or brand, and a tenant-scoped caller naming another tenant's path are indistinguishable (no existence oracle).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchConflict:
      description: >
        409. A closed LAUNCH_* code (see the Error.code enum): LAUNCH_PRECONDITION_FAILED and LAUNCH_UNACKNOWLEDGED_CHECKS carry check_codes (H-n:... / R-...);
        LAUNCH_REQUEST_PENDING, LAUNCH_SELF_APPROVAL, LAUNCH_ALREADY_DECIDED, LAUNCH_ILLEGAL_TRANSITION, LAUNCH_SUBJECT_CLOSED (closed is terminal), LAUNCH_REQUEST_NOT_PENDING
        (decided, executed, expired or superseded), LAUNCH_STALE_READINESS, LAUNCH_PRIOR_REJECT, LAUNCH_PRIOR_REJECTER, LAUNCH_NOT_LEGACY_BASELINE,
        LAUNCH_WITHDRAWALS_HOLDING_FUNDS (H-6 / LA023: hold-bearing withdrawal requests exist), LAUNCH_OPEN_BETS_BLOCK_CLOSURE (LA024) and TENANT_CLOSE_BLOCKED_OPEN_ROUNDS (GP020: open
        sportsbook bets) refuse a closure and leave the request pending; LAUNCH_RETRYABLE_LOCK_TIMEOUT is retryable (nothing was recorded); LAUNCH_REFUSED_AT_EXECUTION (the approval is recorded,
        execution was refused; check_codes carries the refusal code); LAUNCH_GUARD_REFUSED (another database guard; check_codes carries the LA code). The message is a fixed sentence; no
        message states a legal conclusion.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WithdrawalRestrictionPolicyUnavailable:
      description: 503 WITHDRAWAL_RESTRICTION_POLICY_UNAVAILABLE. The withdrawal restriction policy service is not wired in this process; nothing was read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WithdrawalRestrictionPolicyForbidden:
      description: >
        403. FORBIDDEN (the caller's role lacks the static permission, a tenant session asked for a write or a change
        request, or a non-requester cancelling), WITHDRAWAL_RESTRICTION_POLICY_PROOF_REFUSED (the ADR 0110 actor proof guard,
        AP0xx), or WITHDRAWAL_RESTRICTION_POLICY_NO_PERSON (the staff account has no readable Person: four-eyes cannot be
        evaluated, fail closed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WithdrawalRestrictionPolicyConflict:
      description: >
        409. WITHDRAWAL_RESTRICTION_POLICY_SELF_APPROVAL (the requester or another account of the requester's Person),
        WITHDRAWAL_RESTRICTION_POLICY_NOT_PENDING (decided, executed, cancelled or expired),
        WITHDRAWAL_RESTRICTION_POLICY_ALREADY_DECIDED (this Person already approved),
        WITHDRAWAL_RESTRICTION_POLICY_DUPLICATE_PENDING (an open change for the tenant and cause),
        WITHDRAWAL_RESTRICTION_POLICY_APPROVALS_STALE (an approval older than the 24 h window),
        WITHDRAWAL_RESTRICTION_POLICY_NOT_CONFIGURABLE (an owner-decided or non-evaluable cause),
        WITHDRAWAL_RESTRICTION_POLICY_GUARD_REFUSED (a database guard WR0xx / LC0xx),
        WITHDRAWAL_RESTRICTION_POLICY_RETRYABLE_LOCK_TIMEOUT (retry). Nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LicensingChangeUnavailable:
      description: 503 LICENSING_CHANGE_UNAVAILABLE. The licensing change service is not wired in this process; nothing was read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LicensingChangeForbidden:
      description: >
        403. FORBIDDEN (the caller's role lacks the static or the kind's permission, a tenant session asked for a
        platform-only kind, an acting session, or a non-requester cancelling), LICENSING_CHANGE_PROOF_REFUSED (the ADR 0110
        actor proof guard, AP0xx), or LICENSING_CHANGE_NO_PERSON (the staff account has no readable Person: four-eyes
        cannot be evaluated, fail closed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LicensingChangeConflict:
      description: >
        409. LICENSING_CHANGE_SELF_APPROVAL (the requester or another account of the requester's Person),
        LICENSING_CHANGE_NOT_PENDING (decided, executed, cancelled or expired), LICENSING_CHANGE_ALREADY_DECIDED (this
        Person already approved), LICENSING_CHANGE_DUPLICATE_PENDING (an identical open request), LICENSING_CHANGE_APPROVALS_STALE
        (an approval older than the 24 h window), LICENSING_CHANGE_REFUSED (the domain writer refused, for example the
        licence ceiling), LICENSING_CHANGE_GUARD_REFUSED (a database guard LC0xx), LICENSING_CHANGE_RETRYABLE_LOCK_TIMEOUT
        (retry). Nothing is recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LaunchUnavailable:
      description: 503 LAUNCH_AUTHORISATION_UNAVAILABLE. The launch authorisation service is not wired in this process; nothing was read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
