  /v1/admin/kyc/verifications/{id}/review:
    post:
      summary: Approve, reject, or flag a verification for further review
      description: >
        Requires verification:review (compliance only - never
        tenant_admin/platform_admin/finance, directive §19). Rejects with
        409 if the verification is already in a terminal status.
      security:
        - bearerAuth: []
      parameters:
