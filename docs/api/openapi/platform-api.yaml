  /v1/webhooks/payments/{tenantSlug}/{providerID}:
    post:
      summary: Payments provider callback (deposit / deposit reversal)
      security: []
      description: >
        No bearer-token middleware - a PSP webhook is not an authenticated
        platform principal. PAY-WH-TENANT-1 (ADR 0090; docs/decisions/0022
        §3 amendment 2026-09-26): {tenantSlug} is a LOOKUP HINT only, never
        the source of authorization - the tenant is established by
        verifying a signature whose input includes the ROUTE-resolved
        tenant_id, and the tenant is NEVER read from the request body. The
        platform-defined (MOCK-only; a real adapter uses its own vendor
        scheme) signing_input is exactly:
        `"igaming.payments.webhook.v1" 0x00 tenant_id 0x00 provider_id 0x00
        key_id 0x00 <raw request body bytes>`, HMAC-SHA256'd with the
        credential resolved for (tenant_id, provider_id, key_id) and hex-
        encoded into X-Payments-Signature. The wire body shape below
        (`PaymentsMockCallback`) is platform-invented for the MOCK adapter
        only - it models no real vendor's webhook format; a real PSP
        integration maps that vendor's own callback shape onto the
        canonical `CallbackEvent` inside its own adapter, per
        docs/decisions/0022 §3's amendment. Every pre-verification failure
        (unknown/inactive tenant, invalid/unregistered/unconfigured
        provider, no credential resolver, missing/malformed/invalid
        signature, an UNPARSEABLE body, an oversized (>1 MiB) body,
        apparent key material in the payload) returns the IDENTICAL 401
        response below, so an unauthenticated caller can never distinguish
        which is true (Stage 10.1 security review P2-1/code review
        F1/architect PW-1: the adapter verifies the raw signature BEFORE
        ever parsing the body, and the HTTP handler checks body size and
        header format BEFORE the tenant lookup, so neither an unparseable
        nor an oversized body can be used to distinguish a live tenant/
        provider pair from an unknown one). 400 is reachable ONLY after
        verification succeeds: a verified body that is still structurally
        malformed (a required field missing, or an unrecognized
        event_type/outcome value), or whose declared facts (amount/asset)
        contradict the deposit intent it claims to resolve. 404 is
        reachable ONLY after verification succeeds (an unknown
        provider_reference for an otherwise-authenticated callback) - it is
        not a second enumeration oracle. 409 covers two distinct,
        generically-reported causes (a provider reference already posted
        with a different payload, or a distinct-reference reversal naming
        an already-reversed deposit) - intentionally collapsed to one
        generic body. 503 means webhooks are not enabled on this
        deployment.
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
        - name: providerID
          in: path
          required: true
          description: "Charset: ^[a-z0-9][a-z0-9-]{0,62}$"
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        - name: X-Payments-Signature
          in: header
          required: true
          description: "Authentication headers are provider-defined (Stage 10.3 WH-VENDOR-SCHEME-1): each adapter's own verification scheme is selected by providerID. This entry documents the platform MOCK scheme only (never a vendor protocol): v1= + lowercase hex(HMAC-SHA256(credential_secret, signing_input)). A real provider's headers are documented per provider when its adapter lands."
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: X-Payments-Key-Id
          in: header
          required: true
          description: "Platform MOCK scheme key id (provider-defined for real adapters)."
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentsMockCallback"
      responses:
        "200":
          description: Callback processed (or safely absorbed as an idempotent replay/no-op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit_intent_id: { type: string, format: uuid }
                  status: { type: string }
                  tombstoned: { type: boolean }
        "400":
          description: >
            Reachable ONLY after signature verification succeeds: a
            verified body that is structurally malformed (unparseable
            JSON, a missing required field, or an unrecognized event_type/
            outcome value), or whose declared amount/asset contradict the
            deposit intent it claims to resolve. Generic body only - never
            the specific field or value that failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Callback rejected - EVERY pre-verification failure reason
            (unknown/inactive tenant, invalid/unregistered/unconfigured
            provider, no resolver, no credential, missing/malformed/invalid
            signature, an unparseable body, an oversized (>1 MiB) body,
            apparent key material) maps to this SAME generic body,
            deliberately indistinguishable from any other, with the SAME
            status code regardless of whether the tenant/provider named in
            the path actually exist or are configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No matching deposit intent for this provider reference - only
            observable AFTER signature verification succeeds; not a second
            enumeration oracle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Payment webhooks are not enabled on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/webhooks/kyc/{tenantSlug}/{providerID}:
    post:
      summary: KYC provider callback (verification status update)
      security: []
      description: >
        Stage 10.2 (KYC-WH-1, ADR 0091): registered ONLY when this
        deployment has test support enabled
        (cfg.TestSupportRoutesEnabled()) - the platform ships no real KYC
        vendor this stage, so the route is entirely ABSENT (a genuine 404,
        not a 503 from inside a registered handler) with test support off,
        including in production. No bearer-token middleware - a provider
        is not an authenticated platform principal. The tenant slug in the
        URL is only a LOOKUP HINT selecting one candidate credential;
        tenant/provider binding is enforced by the signature itself, whose
        signing input is exactly
        `igaming.kyc.webhook.v1 0x00 tenant_id 0x00 provider_id 0x00
        key_id 0x00 <raw body bytes>` (internal/webhookauth's shared
        platform-defined MOCK wire scheme - never a real vendor's format,
        and never trusted from anything inside the body). Idempotent and
        forward-only: unverified(0) < pending(1) < review_required(2) <
        approved|rejected|expired(3, terminal) - a callback only ever
        moves a verification's status FORWARD in this order via a
        compare-and-set update; an equal-or-backward transition, a replay,
        or anything arriving after a terminal status or after a staff
        decision is a no-op (204, no state change, no audit row). A
        provider `outcome: error` never changes verification state, but is
        NOT always audit-free: delivered against a NON-terminal
        verification it writes exactly one failure audit row (still 204,
        still no state change); delivered against an ALREADY-terminal
        verification (or any other replay/backward case) it is a pure
        no-op with no audit row at all, keeping replay-after-terminal
        genuinely inert.
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
        - name: providerID
          in: path
          required: true
          description: "Charset: ^[a-z0-9][a-z0-9-]{0,62}$"
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        - name: X-KYC-Signature
          in: header
          required: true
          description: "Authentication headers are provider-defined (Stage 10.3 WH-VENDOR-SCHEME-1): each adapter's own verification scheme is selected by providerID. This entry documents the platform MOCK scheme only (never a vendor protocol): v1= + lowercase hex(HMAC-SHA256(credential_secret, signing_input)). A real provider's headers are documented per provider when its adapter lands."
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: X-KYC-Key-Id
          in: header
          required: true
          description: "Platform MOCK scheme key id (provider-defined for real adapters)."
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KYCMockCallback"
      responses:
        "204":
          description: >
            Callback processed. Three cases share this status: (1) a
            forward status transition was applied; (2) the callback was a
            true no-op with NO audit row (an equal/backward-rank replay, or
            anything - including a provider `outcome: error` - arriving
            after the verification is already terminal or after a staff
            decision); (3) a provider `outcome: error` delivered against a
            NON-terminal verification, which does NOT change verification
            state but DOES write exactly one failure audit row. No response
            body in any case, so no identifier is ever echoed to the
            external caller.
        "400":
          description: >
            Reachable ONLY after signature verification succeeds: a
            verified body that is structurally malformed (unparseable
            JSON, a missing provider_reference, or an outcome outside the
            closed enum). Generic body only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Callback rejected - EVERY pre-verification failure reason
            (unknown/inactive tenant, invalid/unregistered provider, no
            resolver, no credential, missing/malformed/invalid signature,
            an unparseable body, an oversized (>256 KiB) body) maps to this
            SAME generic body, deliberately indistinguishable from any
            other, with the SAME status code regardless of whether the
            tenant/provider named in the path actually exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No matching verification for this (tenant, provider,
            provider_reference) - only observable AFTER signature
            verification succeeds; not a second enumeration oracle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/webhooks/casino/{tenantSlug}/{providerID}:
    post:
      summary: Casino provider callback (bet / win / rollback)
      security: []
      description: >
        No bearer-token middleware - a casino provider webhook is not an
        authenticated platform principal. CAS-WH-TENANT-1 (Stage 10.2,
        ADR 0091; docs/decisions/0022 §3 as amended): {tenantSlug} is a
        LOOKUP HINT only, never the source of authorization - the tenant is
        established by verifying a signature whose input includes the
        ROUTE-resolved tenant_id, and the tenant is NEVER read from the
        request body. The platform-defined (MOCK-only; a real adapter uses
        its own vendor scheme) signing_input is exactly:
        `"igaming.casino.webhook.v1" 0x00 tenant_id 0x00 provider_id 0x00
        key_id 0x00 <raw request body bytes>`, HMAC-SHA256'd with the
        credential resolved for (tenant_id, provider_id, key_id) and hex-
        encoded into X-Casino-Signature. The wire body shape below
        (`CasinoMockCallback`) is platform-invented for the MOCK adapter
        only - it models no real vendor's webhook format; a real
        aggregator integration maps that vendor's own callback shape onto
        the canonical `CallbackEvent` inside its own adapter. Every
        pre-verification failure (unknown/inactive tenant,
        invalid/unregistered provider, no credential resolver,
        missing/malformed/invalid signature, an UNPARSEABLE body, an
        oversized (>1 MiB) body) returns the IDENTICAL 401 response below,
        so an unauthenticated caller can never distinguish which is true -
        the adapter verifies the raw signature BEFORE ever parsing the
        body. 400 is reachable ONLY after verification succeeds: a
        verified body that is still structurally malformed (a required
        field missing, an unrecognized event_type/outcome value, or a
        legacy top-level `signature` field, which instead maps to 401 -
        see below), OR a verified body that is well-formed but fails a
        casino domain-logic check: `ErrBetNotFound` (a win/rollback naming
        a round with no matching prior bet), `ErrLaunchSessionRequired` (a
        bet callback's session_id does not resolve to a valid, non-revoked,
        real-money launch session for this provider),
        `ErrOutcomeNotSucceeded` (a bet/win callback whose outcome is not
        `succeeded`), `ErrInvalidInput` (any other structurally-invalid
        field combination), or an event_type that HandleCallback itself
        accepted as verified but the orchestrator does not recognize
        (Stage 10.2 final review K10 - also 400, never a 500). 409
        covers a provider_tx_id already posted with a different payload, a
        provider_round_id already bound to a different session, or a
        rollback naming an already-reversed original - intentionally
        collapsed to one generic body that never echoes the round id or
        any player identity. 503 has two distinct causes: (1) casino
        webhooks are not enabled on this deployment at all (the casino
        Orchestrator is nil) - this check runs FIRST, before the shared
        preamble, before any tenant lookup, and before signature
        verification, so it is reachable by anyone, verified or not; (2)
        the tenant's own CasinoProviderCapability for this provider is
        disabled/unconfigured, a deliberate POST-verification money-path
        kill switch that only a verified caller ever observes. The two
        causes carry different error messages ("casino webhooks are not
        enabled on this deployment" vs "provider is not enabled for this
        tenant"); cause (2) is only ever returned to a verified caller.
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
        - name: providerID
          in: path
          required: true
          description: "Charset: ^[a-z0-9][a-z0-9-]{0,62}$"
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        - name: X-Casino-Signature
          in: header
          required: true
          description: "Authentication headers are provider-defined (Stage 10.3 WH-VENDOR-SCHEME-1): each adapter's own verification scheme is selected by providerID. This entry documents the platform MOCK scheme only (never a vendor protocol): v1= + lowercase hex(HMAC-SHA256(credential_secret, signing_input)). A real provider's headers are documented per provider when its adapter lands."
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: X-Casino-Key-Id
          in: header
          required: true
          description: "Platform MOCK scheme key id (provider-defined for real adapters)."
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasinoMockCallback"
      responses:
        "200":
          description: Callback processed (or safely absorbed as an idempotent replay/no-op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome: { type: string }
                  tombstoned: { type: boolean }
                  ledger_transaction_id: { type: string, format: uuid }
                  decline_reason: { type: string }
        "400":
          description: >
            Reachable ONLY after signature verification succeeds, so the
            message is only ever seen by the verified provider. The
            message names the class of failure (for example "no matching
            prior bet for this round" or "callback outcome is not
            succeeded"), never echoing submitted values. Two classes of
            cause: (1)
            structurally malformed (unparseable JSON, a missing required
            field, an unrecognized event_type/outcome value, or an
            event_type the orchestrator itself does not recognize even
            though HandleCallback accepted it as verified - Stage 10.2
            final review K10); (2) a well-formed but domain-invalid
            callback: `ErrBetNotFound`, `ErrLaunchSessionRequired`,
            `ErrOutcomeNotSucceeded`, or `ErrInvalidInput`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Callback rejected - EVERY pre-verification failure reason
            (unknown/inactive tenant, invalid/unregistered provider, no
            resolver, no credential, missing/malformed/invalid signature,
            an unparseable body, an oversized (>1 MiB) body) maps to this
            SAME generic body, deliberately indistinguishable from any
            other, with the SAME status code regardless of whether the
            tenant/provider named in the path actually exist or are
            configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            Two distinct causes share this status. (1) Casino webhooks are
            not enabled on this deployment at all (the casino Orchestrator
            is nil) - this is checked FIRST, before the shared preamble
            even runs, so it PRECEDES signature verification and is
            reachable by any caller, verified or not. (2) The tenant's own
            provider capability is disabled/unconfigured - a deliberate,
            POST-verification money-path kill switch, reachable ONLY after
            signature verification succeeds. The two causes carry
            different error messages; the post-verification one is only
            ever returned to a verified caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Stage 4G: Risk & Limits admin API (docs/decisions/0031) ---
  /v1/admin/risk/rules:
    get:
      summary: List a tenant's risk rules for one operation
      description: >
        Requires risk_config:read (risk_manager or tenant_admin,
        read-only for tenant_admin). Returns the caller's own tenant's
        rules PLUS every platform-wide rule for that operation - no
        pagination or status filter this stage (returns disabled rules
        too).
      security:
        - bearerAuth: []
      parameters:
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
      responses:
        "200":
          description: Risk rules for the named operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a risk rule
      description: >
        Requires risk_config:manage (risk_manager only). Always
        tenant-scoped this stage - a genuinely platform-wide rule
        (tenant_id NULL) has no HTTP write path yet (docs/decisions/0031
        §8's own recorded open decision). A rule is immutable after
        creation except for status/description/effective_until - a
        policy change is a new rule, never an edit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                licensing_mode: { type: string, enum: [under_platform_licence, own_licence], description: "Stage 4G-FINAL: scopes the rule to tenants operating under this licensing arrangement (tenants.licensing_model). Omitted means the rule applies regardless of licensing mode." }
                player_account_id: { type: string, format: uuid }
                product: { type: string, enum: [casino, sportsbook, payments, bonus] }
                operation:
                  type: string
                  enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
                provider_id: { type: string }
                game_id: { type: string, format: uuid }
                asset_code: { type: string }
                payment_method: { type: string }
                limit_kind: { type: string, enum: [min_amount, max_amount, cumulative_amount] }
                time_window: { type: string, enum: [transaction, rolling_hour, rolling_day, rolling_week, rolling_month] }
                threshold: { type: integer, format: int64, description: "Minor units, denominated by asset_code (if set) or by threshold_exponent" }
                threshold_exponent:
                  type: integer
                  minimum: 0
                  maximum: 18
                  nullable: true
                  description: >-
                    REQUIRED when asset_code is omitted: the decimal exponent whose minor units
                    `threshold` is expressed in. Such a rule binds every asset of that exponent and
                    FAILS CLOSED for an asset of any other exponent, instead of being silently
                    re-denominated. MUST be omitted when asset_code is set - the asset is then the
                    threshold's denomination, resolved from the asset registry at evaluation time.
                    See docs/decisions/0031-risk-and-limits-engine.md §35.
                rule_kind: { type: string, enum: [hard_limit, configurable_limit, risk_signal], default: configurable_limit }
                action: { type: string, enum: [deny, review], default: deny }
                description: { type: string }
              required: [operation, limit_kind, time_window, threshold]
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/risk/rules/{id}/disable:
    post:
      summary: Disable a risk rule
      description: >
        Requires risk_config:manage. The only legitimate mutation besides
        description/effective_until - a rule is never deleted, so a past
        RiskDecision remains explainable against the exact rule that
        produced it. Returns 404 (never 403) both for a genuinely
        nonexistent id AND for a rule outside the caller's own tenant
        scope (platform-wide or a different tenant's) - never confirms
        existence outside the caller's own authorization.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rule disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Bonus Engine: four-eyes governance, EOI minting, per-domain
  # activate/publish/execute (Stage 4H-B1 Wave 3 Phase 3) ---
  #
  # NOT DOCUMENTED HERE (a pre-existing, disclosed gap this Phase does
  # not retroactively close): Wave 2's own bonus HTTP surface (POST
  # /v1/admin/bonus/campaigns, POST /v1/admin/bonus/grants, the
  # suggestion-review and held-disposition-resolution endpoints,
  # bonus_handlers.go/bonus_routes.go) was never added to this file
  # either - this section covers only the NEW endpoints this Phase
  # introduces.
  /v1/admin/bonus/campaigns:
    get:
      summary: List bonus campaigns (Stage 5, Operator Back Office MVP)
      description: bonus:read, tenant-scoped. Read-only visibility; campaign lifecycle mutations are unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, paused, ended, archived] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated campaign list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BonusCampaign" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/bonus/grants:
    get:
      summary: List/read bonus grants (Stage 5, Operator Back Office MVP)
      description: >
        bonus:read, tenant-scoped. With player_account_id, that player's
        grant/reward state (for the player-detail view); without it, a
        tenant-wide paginated list. Read-only visibility - grant lifecycle
        mutations are unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: player_account_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [issued, activated, in_progress, pending_settlement, completed, converted, expired, cancelled, forfeited, reversed] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated grant list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BonusGrant" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/bonus/change-requests:
    get:
      summary: Bonus change-request approval queue (Stage 5, Operator Back Office MVP)
      description: >
        bonus:read, tenant-scoped. Defaults to status=pending when no
        status is given, so an operator lands on the actual approval
        queue. The decision itself is made via the existing
        POST .../{requestID}/decide below, unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Defaults to `pending` when omitted.
          schema: { type: string, enum: [pending, applied, rejected, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated change-request queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BonusChangeRequest" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: File a four-eyes change request for a dual-controlled bonus operation
      description: >
        The ONE generic filing surface for all eight of security-
        architecture.md §B1.2's dual-controlled bonus operations - the
        required permission is resolved DYNAMICALLY from the `operation`
        field (campaign_activate/offer_publish -> bonus_campaign:activate/
        bonus_offer:manage; manual_grant_issue -> bonus_grant:issue;
        bulk_job_execute -> bonus_bulk:execute; bonus_adjustment_write ->
        bonus_adjustment:write; grant_forced_conversion/grant_cancel_completed
        -> bonus_grant:review/bonus_grant:cancel; held_disposition_resolve
        -> bonus_held_disposition:resolve).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum: [manual_grant_issue, bulk_job_execute, bonus_adjustment_write, grant_forced_conversion, campaign_activate, offer_publish, grant_cancel_completed, held_disposition_resolve]
                target_type: { type: string, description: "e.g. bonus_campaigns, bonus_offers, bonus_grants, bulk_grant_jobs, bonus_held_dispositions" }
                target_id: { type: string, format: uuid }
                payload: { type: object, description: "Operation-specific identifying fields the eventual consume call must match exactly (JSONB containment)." }
                amount_at_request: { type: string, description: "Decimal-string minor units, never a JSON number." }
                asset_code: { type: string }
                reason_code: { type: string }
              required: [operation, target_type, target_id, reason_code]
      responses:
        "201":
          description: Change request filed, state=pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusChangeRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks the permission the named operation requires
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/change-requests/{requestID}/decide:
    post:
      summary: Approve or reject a pending bonus change request
      description: >
        Requires the SAME permission the underlying operation itself
        requires. migration 0063's own DB triggers enforce requester !=
        approver (distinct Person) and SEP-1 (beneficiary separation for
        manual_grant_issue/bonus_adjustment_write/grant_forced_conversion/
        grant_cancel_completed/held_disposition_resolve/bulk_job_execute
        with a materialized recipient) - a refused decision surfaces as
        403, never 500.


        The threshold/amount snapshot recorded on the resulting
        bonus_change_approvals row (threshold_at_decision,
        amount_at_decision) is resolved SERVER-SIDE from the tenant's own
        approval policy and the request's own amount_at_request - it is
        deliberately NOT accepted from the request body, so the
        append-only forensic record cannot be authored by the approving
        principal (Stage 4H-B1 Wave 3 Phase 6, `security`).
      security:
        - bearerAuth: []
      parameters:
        - name: requestID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code:
                  type: string
                  description: Mandatory when decision=reject.
              required: [decision]
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusChangeRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission, self-approval, or SEP-1 beneficiary-separation refusal
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/economic-operations:
    post:
      summary: Mint an EconomicOperationIdentity root (doc 34 §3.1)
      description: >
        Bonus Engine's exactly-two mint points: a staff single-Grant
        authorization (bonus_manual_grant, requires bonus_grant:issue) or
        a BulkGrantJob authorization (bonus_bulk_grant, requires
        bonus_bulk:execute). Minted already `approved` by the caller's own
        authority - doc 34 does not require a separate approval workflow
        on the EOI object itself for these two consumer types. Idempotent
        on (tenant_id, idempotency_key) - a retry with the SAME key
        resolves to the SAME operation_id.


        Because the root is minted already-approved on ONE actor's
        authority, its budget must be explicit and finite (Stage 4H-B1
        Wave 3 Phase 6, `security`): `asset_code`,
        `intended_aggregate_value` (> 0) and `recipient_ceiling` (> 0) are
        all MANDATORY, `subject_ref` is mandatory for
        `single_subject` (with `recipient_ceiling` = 1),
        `subject_set_count` is mandatory for `enumerated_set` (with
        `recipient_ceiling` <= `subject_set_count`), and
        `expires_in_seconds` is capped at 86400. An absent ceiling is
        treated by the budget-consumption function as "no check at all",
        so an optional ceiling would reopen the SEC-W15-02 decomposition
        vector at the entry point of the mechanism that exists to close
        it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_type: { type: string, enum: [bonus_manual_grant, bonus_bulk_grant] }
                subject_scope: { type: string, enum: [single_subject, enumerated_set] }
                subject_ref: { type: string, format: uuid }
                subject_set_count: { type: integer }
                asset_code: { type: string }
                intended_aggregate_value: { type: string, description: "Decimal-string minor units, strictly positive" }
                recipient_ceiling: { type: integer, minimum: 1 }
                idempotency_key: { type: string }
                expires_in_seconds: { type: integer, default: 3600, maximum: 86400 }
              required:
                [
                  operation_type,
                  subject_scope,
                  asset_code,
                  intended_aggregate_value,
                  recipient_ceiling,
                  idempotency_key,
                ]
      responses:
        "201":
          description: EOI minted (or the existing one, on an idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomicOperation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/campaigns/{campaignID}/activate:
    post:
      summary: Activate a Campaign (four-eyes gated)
      description: >
        Requires bonus_campaign:activate AND a pending bonus_change_requests
        row (operation=campaign_activate, target_id=campaignID, payload
        `{"action":"activate"}`) with the tenant's configured number of
        distinct approvals. Consumes the approval and activates atomically.
      security:
        - bearerAuth: []
      parameters:
        - name: campaignID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Campaign activated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers:
    post:
      summary: Create a Draft Offer under a Campaign
      description: Requires bonus_offer:manage. Not four-eyes gated (a Draft Offer moves no value) - only offer_publish is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid }
                campaign_id: { type: string, format: uuid }
                campaign_version_id: { type: string, format: uuid }
                grant_policy: { type: string, enum: [auto_issue, manual_approval_required, code_redeemed, external_signal, manually_assigned] }
              required: [campaign_id, campaign_version_id]
      responses:
        "201":
          description: Offer created, status=draft
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers/{offerID}/versions:
    post:
      summary: Create a new, append-only OfferVersion
      description: Requires bonus_offer:manage. Every monetary field is a decimal-string minor-unit amount.
      security:
        - bearerAuth: []
      parameters:
        - name: offerID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                min_qualifying_amount: { type: string }
                max_qualifying_amount: { type: string }
                first_deposit_only: { type: boolean }
                eligibility_deposit_methods: { type: array, items: { type: string } }
                reward_kind: { type: string, enum: [R1, R2, R3, R5, R6] }
                reward_asset_code: { type: string }
                reward_calculation: { type: string, description: "Raw JSON object, as a string - e.g. {\"rate_bp\":5000,\"cap_amount\":\"10000\"}." }
                fulfillment_destination: { type: string, enum: [into_platform_wallet, inside_provider] }
                funding_source: { type: string }
                wagering_multiplier_bp: { type: integer }
                contribution_weight_table: { type: string, description: "Raw JSON object, as a string." }
                completion_mechanic: { type: string }
              required: [reward_kind, reward_asset_code, fulfillment_destination, funding_source]
      responses:
        "201":
          description: OfferVersion created
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers/{offerID}/publish:
    post:
      summary: Publish an OfferVersion (four-eyes gated)
      description: >
        Requires bonus_offer:manage AND a pending bonus_change_requests row
        (operation=offer_publish, target_id=offerID, payload
        `{"offer_version_id":"..."}`) with the tenant's configured number
        of distinct approvals. Pins current_version_id and flips the Offer
        Active atomically with the consume.
      security:
        - bearerAuth: []
      parameters:
        - name: offerID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offer_version_id: { type: string, format: uuid }
              required: [offer_version_id]
      responses:
        "200":
          description: Offer published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/manual-grants:
    post:
      summary: Issue a manual grant request (phase 1 - issued, not yet activated)
      description: >
        Requires bonus_grant:issue and an already-minted, approved EOI
        (parent_operation_id). Creates the Grant in status `issued` -
        deliberately NOT four-eyes gated at this step (T.2: issuance moves
        no value). File the manual_grant_issue change request against this
        Grant's own returned id AFTER this call, before calling the
        activate endpoint below (migration 0063's SEP-1 trigger requires
        the Grant row to already exist at approval time).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_account_id: { type: string, format: uuid }
                campaign_id: { type: string, format: uuid }
                campaign_version_id: { type: string, format: uuid }
                offer_id: { type: string, format: uuid }
                offer_version_id: { type: string, format: uuid }
                asset_code: { type: string }
                funding_source: { type: string }
                parent_operation_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
              required: [player_account_id, campaign_id, campaign_version_id, offer_id, offer_version_id, asset_code, funding_source, parent_operation_id]
      responses:
        "201":
          description: Grant issued, status=issued
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission, EOI check failed, or the T.2 gate denied (RG/Risk)
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/manual-grants/{grantID}/activate:
    post:
      summary: Activate an issued manual grant (phase 2 - four-eyes AND EOI budget consumed)
      description: >
        Requires bonus_grant:issue AND a pending bonus_change_requests row
        (operation=manual_grant_issue, target_id=grantID, payload matching
        player_account_id/offer_version_id/asset_code/amount exactly) with
        the tenant's configured number of distinct approvals. Both the
        four-eyes consume and the EOI locking-budget consume run inside
        the SAME PostGateHook, strictly after the T.1 gate chain and
        strictly before the effecting ledger write.
      security:
        - bearerAuth: []
      parameters:
        - name: grantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_operation_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                amount: { type: string }
              required: [parent_operation_id, amount]
      responses:
        "200":
          description: Grant activated
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Four-eyes approval not satisfied, EOI budget exhausted, or the T.1 gate denied
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Grant is not in a state that can be activated
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/bulk-jobs:
    post:
      summary: Create a BulkGrantJob targeting a static player list
      description: >
        Requires bonus_bulk:execute. target_kind is restricted to
        single_player/player_list this Wave (live segment resolution is
        out of scope - internal/segment does not exist). Idempotent on
        (tenant_id, idempotency_key) - a resubmission of the identical job
        spec resolves to the existing job.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_id: { type: string, format: uuid }
                offer_version_id: { type: string, format: uuid }
                target_kind: { type: string, enum: [single_player, player_list] }
                target_player_account_ids: { type: array, items: { type: string, format: uuid } }
                idempotency_key: { type: string }
              required: [campaign_id, offer_version_id, target_kind, target_player_account_ids, idempotency_key]
      responses:
        "201":
          description: Job created (or the existing one, on an idempotent retry)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/bulk-jobs/{jobID}/execute:
    post:
      summary: Execute an approved BulkGrantJob (four-eyes gated, runs synchronously)
      description: >
        Requires bonus_bulk:execute AND a pending bonus_change_requests row
        (operation=bulk_job_execute, target_id=jobID) with the tenant's
        configured number of distinct approvals, whose `payload` contains
        the ECONOMIC payload being approved (Stage 4H-B1 Wave 3 Phase 6,
        `security` - a bare `{"action":"execute"}` pinned nothing, so an
        approval for a modest bulk grant authorized an arbitrarily larger
        one):
        `{"action":"execute","offer_version_id":"<uuid>","asset_code":"<code>","amount_per_recipient":"<decimal-string>","recipient_count":<int>,"recipient_set_hash":"<sha256-hex>"}`,
        where `recipient_set_hash` is SHA-256 over the recipient
        player_account_ids lowercased, de-duplicated, sorted ascending and
        joined with a newline. Runs the job SYNCHRONOUSLY within this
        request (a disclosed, reversible engineering decision - a future
        background-worker invocation can call the identical job-runner
        unchanged). Per-item outcomes roll up to the job's own final
        status (completed | partially_completed | failed).
      security:
        - bearerAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jurisdiction_code: { type: string }
                amount: { type: string }
              required: [amount]
      responses:
        "200":
          description: Job executed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Asset Registry / Asset Authorization (ADR 0037, Stage 4H-B0-R6) ---
  #
  # Split along ADR 0037 §C.1's two tiers: /v1/admin/assets/** is
  # asset_registry:manage (platform_admin only, layers 1-3), and
  # /v1/admin/asset-authorizations/** is asset_authorization:write
  # (tenant-scoped, layers 4-7). There is deliberately NO endpoint that
  # evaluates eligibility: AssetAuthorization.CheckEligibility resolves
  # tenant/brand/jurisdiction server-side, and exposing it over HTTP would
  # mean accepting a jurisdiction identifier from a caller.
  /v1/admin/assets:
    get:
      summary: List the platform asset registry
      description: Requires asset_registry:manage (platform_admin only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create an asset (layer 1, dual-controlled)
      description: >
        Requires asset_registry:manage AND a pending change request for
        this code, approved by a DIFFERENT platform principal (ADR 0037
        §C.5.3), whose payload matches the identity fields exactly. The
        body has no `active`/`platform_authorized` field by design (§C.5.5:
        creation must never authorize any financial operation) and unknown
        fields are rejected. Returns 409 when no approved request exists.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, asset_type, decimal_exponent, display_name, reason_code]
              properties:
                code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                display_name: { type: string }
                network: { type: string, description: Required for a crypto asset }
                reason_code: { type: string }
      responses:
        "201":
          description: Created - always inactive and not platform-authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests:
    post:
      summary: File a four-eyes change request
      description: >
        Requires asset_registry:manage. Only the four dual-controlled
        operations are representable - suspend/revoke are deliberately
        single-actor kill-switches (ADR 0037 §C.5.3). The requesting
        principal must resolve to a platform-scoped staff row that carries
        a confirmed Person linkage and an active status (migration 0047);
        a principal failing any of those is 403, not 400.
        operation=platform_operation_eligibility is the layer-7
        PLATFORM-WIDE default GRANT (§C.5.1 op 9) and requires
        eligibility_operation; eligibility_product may be omitted, meaning
        every product. One approval authorizes exactly that
        (asset, operation, product) grant, once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, asset_code, reason_code]
              properties:
                operation:
                  type: string
                  enum: [create, activate, platform_authorize, platform_operation_eligibility]
                asset_code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                network: { type: string }
                eligibility_operation:
                  type: string
                  enum: [deposit, withdrawal, wagering, settlement, conversion, reporting]
                  description: >
                    Required for operation=platform_operation_eligibility,
                    rejected for any other operation.
                eligibility_product:
                  type: string
                  description: >
                    Omit for "every product". Rejected for any operation
                    other than platform_operation_eligibility.
                reason_code: { type: string }
      responses:
        "201":
          description: Request filed (state = pending)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests/{id}/decision:
    post:
      summary: Approve or reject a change request
      description: >
        Requires asset_registry:manage. Returns 409 for a self-approval,
        for a second decision by the same principal (reported as a
        duplicate decision, distinct from self-approval), or for a
        principal that resolves to the same PERSON as the requester -
        all enforced by the database (migrations 0044/0047, mirroring
        withdrawal_approvals). Returns 403 when the deciding principal is
        not platform-scoped, carries no confirmed Person linkage, or is
        not active: that last set is a property of the actor, and the
        Person-linkage condition is what makes the same-person check real
        rather than inert (migration 0047).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code: { type: string }
      responses:
        "201":
          description: Decision recorded (immutable)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  # --- Casino catalogue four-eyes governance (Stage 9.2, ADR 0081 §5.2,
  # ARCH-DB-2 Phase 2). Documented here, alongside the analogous asset
  # change-request endpoints above, rather than next to the pre-existing
  # (undocumented) Stage 4A casino admin routes - see the casino round-
  # history section's own note on that pre-existing documentation debt,
  # which this addition does not attempt to backfill. ---
  /v1/admin/casino/games/{gameID}/change-requests:
    post:
      summary: File a four-eyes catalogue change request
      description: >
        Requires casino_catalogue:govern. Only the two fail-open/
        compliance-widening transitions are representable
        (ADR 0081 §5): removing one or more codes from a game's
        jurisdiction_blocklist, and re-enabling a disabled game
        (status 'disabled' -> 'active'). Adding a blocklist code and
        disabling a game are the fail-closed direction and remain
        single-actor via PUT /v1/admin/casino/games, unaffected by this
        endpoint. removed_codes must each currently be present in the
        game's blocklist.
      security:
        - bearerAuth: []
      parameters:
        - name: gameID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, reason_code]
              properties:
                operation:
                  type: string
                  enum: [jurisdiction_unblock, status_activate]
                removed_codes:
                  type: array
                  items: { type: string }
                  description: >
                    Required (non-empty) for operation=jurisdiction_unblock,
                    rejected for status_activate.
                reason_code: { type: string }
      responses:
        "201":
          description: Request filed (state = pending)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/casino/change-requests/{requestID}/approvals:
    post:
      summary: Approve or reject a catalogue change request
      description: >
        Requires casino_catalogue:govern. Returns 409 for a self-approval,
        a second decision by the same principal (reported as a duplicate
        decision, distinct from self-approval), or a decision on a
        request that has already left the pending state (applied,
        rejected, or cancelled) - all enforced by the database
        (migration 0086, mirroring the asset-registry four-eyes
        precedent). Returns 403 when the deciding principal does not
        resolve to a platform-scoped staff row. Approving a
        jurisdiction_unblock request only ever authorizes the EXACT set
        of codes named in the request that was approved - a later attempt
        to remove a different or larger set of codes is refused even with
        a valid approval on file.
      security:
        - bearerAuth: []
      parameters:
        - name: requestID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code: { type: string }
      responses:
        "201":
          description: Decision recorded (immutable)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}:
    patch:
      summary: Update mutable asset metadata (layer 1)
      description: >
        Requires asset_registry:manage. display_name is the ONLY mutable
        field: code/decimal_exponent/asset_type/network are immutable
        (ADR 0037 §C.5.4), are not accepted in this body, and are refused
        by a database trigger regardless.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
