        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/kyc/enforcement-policies/{policyID}/withdraw:
    post:
      summary: Withdraw a never-activated (draft) KYC enforcement policy
      description: >
        kyc_enforcement_policy:manage (platform_admin only) AND step-up `critical`. lic10 (L-20). draft to withdrawn only. An ACTIVE policy is never switched off without a successor (migration 0103, security F3: enforcement is not silently disabled): use supersede. A policy that is not a draft is 409. Audited (kyc_enforcement_policy.withdrawn).
      security:
        - bearerAuth: []
      parameters:
        - { name: policyID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KYCEnforcementPolicyReasonRequest" }
      responses:
        "200":
          description: The withdrawn policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KYCEnforcementPolicy" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/kyc/enforcement-policies/{policyID}/supersede:
    post:
      summary: Replace an ACTIVE KYC enforcement policy with an activated draft successor
      description: >
        kyc_enforcement_policy:manage (platform_admin only) AND step-up `critical`. lic10 (L-20). {policyID} is the ACTIVE policy being replaced; successor_policy_id is a DRAFT of the same enforcement key (same jurisdiction, trigger type, play operation and asset). One transaction withdraws the old policy naming the successor and activates the successor. The acting administrator must differ from BOTH policies' authors (403, enforced by the database). Responds with the successor (now active). This is the only way an active policy stops being enforced. Audited on both rows. lic18 (security S4): the acting administrator must also be a different PERSON than the author where both staff accounts are linked to a Person (403; accounts without a Person link are compared by account only, the database rule). The audit record carries the after state of the row. NOT BUILT: a signed actor proof on these writes (no existing proof operation fits a platform-scoped KYC policy write; see docs/plans/lic18-record.md).
      security:
        - bearerAuth: []
      parameters:
        - { name: policyID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KYCEnforcementPolicySupersedeRequest" }
      responses:
        "200":
          description: The successor policy (active)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KYCEnforcementPolicy" }
