          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawals/submitted:
    get:
      summary: Staff stranded-hold recovery queue - submitted withdrawals
      description: >
        withdrawal:review, tenant-scoped. Every withdrawal currently in state
        `submitted` (sent to the provider, no terminal outcome yet), as a
        bare array. Use POST /v1/admin/withdrawals/{id}/resolve to poll the
        provider for the outcome.
      security:
        - bearerAuth: []
      responses:
