    get:
      summary: A player's KYC enforcement decisions (read-only)
      description: >
        kyc_enforcement_decision:read (compliance), tenant-scoped sessions only: the route sits behind the tenant-scope guard, so a platform-scoped caller is refused 403 even though platform_admin holds the permission. ADR 0096 section 6. The tenant comes only from the authenticated context. A player_account_id of another tenant and one that does not exist return the same 404. The response is the closed field set below: never the verification reason, person or document data, or an amount. Keyset pagination, most recent first.
      security:
        - bearerAuth: []
      parameters:
        - { name: player_account_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 100, default: 25 }, description: 0 or absent selects 25; values above 100 are clamped to 100; negative or non-numeric is 400. }
        - { name: next_before, in: query, required: false, schema: { type: string, example: "2026-01-01T00:00:00.123456789Z,00000000-0000-0000-0000-000000000000" }, description: The exact next_before value of the previous response ("<RFC3339Nano>,<uuid>"). A malformed value is 400. }
      responses:
        "200":
          description: One page of decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KYCEnforcementDecisionPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/kyc/enforcement-policies:
    get:
      summary: List KYC enforcement policies (platform-wide configuration)
      description: >
        kyc_enforcement_policy:read (platform_admin only; a tenant-scoped token is refused 403). lic10 (L-20). Lists the platform-wide kyc_enforcement_policies rows newest first (at most 500), optionally filtered by licensing_jurisdiction_id and status. The platform ships NO policy and NO threshold: with no active row for a jurisdiction KYC enforcement is dormant for it (ADR 0096). Responses are Cache-Control no-store.
