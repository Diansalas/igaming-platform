  /v1/admin/withdrawals/{id}/approve:
    post:
      summary: Record a four-eyes approval of a withdrawal (staff)
      description: >
        withdrawal:approve, tenant-scoped (finance). No request body; the
        approver is always the caller's authenticated subject, never a body
        field. The decision is recorded and `approved` in the response says
        whether this decision completed the approval (the withdrawal moved to
        `approved`) or only counted towards the required number of
        approvals. 403 forbidden is returned for: approving your own
        withdrawal (the staff member and the player are the same Person),
        a staff account with no confirmed Person linkage, an inactive staff
        account, or a withdrawal whose resolved policy requires a step-up
        challenge that the platform cannot yet perform (fails closed). 409
        conflict: the withdrawal is not awaiting review, or the caller
        already recorded a decision on it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved: { type: boolean }
                required: [approved]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawals/{id}/payout-reversal:
    post:
      summary: Record one decision of a governed payout reversal (staff, four-eyes)
      description: >
        withdrawal:approve, tenant-scoped (finance), step-up class critical.
        A5 / WITHDRAWAL-REVERSAL-1 (migration 0162): the provider later
        returned or reversed a payout. The decider is always the caller's
        authenticated subject. The body is the payload every decider must
        agree on (bound by its digest). The call that completes the quorum
        (at least two distinct Persons; more if the withdrawal policy
        requires; the policy's step-up applies at any amount; never the paid
        player's own Person) executes in the same transaction:
        for a `completed` payout, a compensating `withdrawal_reversed`
        posting (Dr psp_clearing / Cr the player's cash, the payout amount in
        the payout asset) and `completed` -> `reversed` (outcome `reversed`);
        for a payout still `submitted` (the return was reported before the
        completion), a ledger tombstone on the original provider reference so
        a late completion can never post, the open payout attempt parked
        (`reversal_tombstone_precedes_success`, P1 alert) and the hold
        released to the player (outcome `tombstoned_hold_released`). Only a
        whole-payout return in the same asset is accepted; a partial or
        different-asset return is refused (409). A retry by a decider of the
        executed payload returns `already_executed` and records nothing.
        Sandbox/MOCK providers only - software capability, not a regulatory
        approval. 403 forbidden: the caller is the paid player's Person, has
        no confirmed Person linkage, or is inactive; 403 step_up_required
        when the policy's fresh step-up is missing. 409 conflict: the
        withdrawal is not `completed` or `submitted`, the caller already
        decided on it, the payload does not match the payout, the payout is
        already reversed, or its attempt is still in flight / inconsistent.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider_id: { type: string }
                original_provider_reference: { type: string }
                return_reference: { type: string }
                amount:
                  type: string
                  pattern: "^[0-9]{1,19}$"
                  description: Minor units as a decimal string (never a float).
                asset_code: { type: string }
                evidence_ref_hash:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
              required: [provider_id, original_provider_reference, return_reference, amount, asset_code, evidence_ref_hash]
      responses:
        "200":
          description: Decision recorded (and, when it completed the quorum, executed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome:
                    type: string
                    enum: [decision_recorded, reversed, tombstoned_hold_released, already_executed]
                  counted_approvals: { type: integer }
                  required_approvals: { type: integer }
                  ledger_transaction_id: { type: string, format: uuid }
                required: [outcome, counted_approvals, required_approvals]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawals/{id}/reject:
    post:
      summary: Reject a withdrawal and reverse its hold (staff)
      description: >
        withdrawal:reject, tenant-scoped (finance). The approver is the
        caller's authenticated subject. reason_code is required. 403 forbidden
        for a staff account with no confirmed Person linkage or an inactive
        one. 409 conflict: the withdrawal is not awaiting review, or the
        caller already recorded a decision on it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "204":
          description: Rejected; the hold was reversed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawals/{id}/resolve:
    post:
      summary: Resolve a stranded `submitted` withdrawal by polling its provider (staff)
      description: >
        withdrawal:submit, tenant-scoped (finance). No request body. Queries
        the SAME provider and reference already recorded on the live payment
        attempt (never a second send, never a different provider) and applies
        the outcome: `completed`, `failed`, or unchanged `submitted` while the
        provider is still undecided. The 200 body is the withdrawal after the
        poll. Safe to repeat and to call concurrently. 403 forbidden for a
        staff account with no confirmed Person linkage or an inactive one.
        409 conflict, all with code `conflict` and distinguished by message:
        (a) the withdrawal is not `submitted`; (b) it has no live payment
        attempt yet; (c) the attempt is still awaiting automatic re-claim and
        cannot be polled; (d) "dispatch is still in progress for this
        withdrawal - try again shortly" - the attempt's dispatch lease has not
        expired, retry later; (e) "provider-confirmed amount/asset does not
        match the withdrawal request" - the provider confirmed success but
        the amount or asset differs from the request, the payment attempt is
        parked as disputed (terminal reason amount_asset_mismatch) and the
        hold is kept. Nothing automatic resolves it. The governed exits (A5)
        are an M2 force-resolution with basis provider_confirmed_out_of_band
        (the provider confirmed the requested amount and asset were paid, or
        that nothing was paid; migration 0163) and, when the provider returned
        the whole payout, the payout reversal route. A partial or
        different-asset payout has no exit: it needs operator investigation,
        for example a PSP recall. 503 service_unavailable: resolution
        is not enabled on this deployment, or the provider recorded on the
        withdrawal is not available on it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The withdrawal after the provider poll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawalSubmitted" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/withdrawal-policies:
    get:
      summary: List the tenant's withdrawal approval policies
