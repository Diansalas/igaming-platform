  # --- Stage 4G: Risk & Limits admin API (docs/decisions/0031) ---
  /v1/admin/risk/rules:
    get:
      summary: List a tenant's risk rules for one operation
      description: >
        Requires risk_config:read (risk_manager or tenant_admin,
        read-only for tenant_admin). Returns the caller's own tenant's
        rules PLUS every platform-wide rule for that operation - no
        pagination or status filter this stage (returns disabled rules
        too).
      security:
        - bearerAuth: []
      parameters:
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
      responses:
        "200":
          description: Risk rules for the named operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a risk rule
      description: >
        Requires risk_config:manage (risk_manager only). Always
        tenant-scoped this stage - a genuinely platform-wide rule
        (tenant_id NULL) has no HTTP write path yet (docs/decisions/0031
        §8's own recorded open decision). A rule is immutable after
        creation except for status/description/effective_until - a
        policy change is a new rule, never an edit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                licensing_mode: { type: string, enum: [under_platform_licence, own_licence], description: "Stage 4G-FINAL: scopes the rule to tenants operating under this licensing arrangement (tenants.licensing_model). Omitted means the rule applies regardless of licensing mode." }
                player_account_id: { type: string, format: uuid }
                product: { type: string, enum: [casino, sportsbook, payments, bonus] }
                operation:
                  type: string
                  enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
                provider_id: { type: string }
                game_id: { type: string, format: uuid }
                asset_code: { type: string }
                payment_method: { type: string }
                limit_kind: { type: string, enum: [min_amount, max_amount, cumulative_amount] }
                time_window: { type: string, enum: [transaction, rolling_hour, rolling_day, rolling_week, rolling_month] }
                threshold: { type: integer, format: int64, description: "Minor units, denominated by asset_code (if set) or by threshold_exponent" }
                threshold_exponent:
                  type: integer
                  minimum: 0
                  maximum: 18
                  nullable: true
                  description: >-
                    REQUIRED when asset_code is omitted: the decimal exponent whose minor units
                    `threshold` is expressed in. Such a rule binds every asset of that exponent and
                    FAILS CLOSED for an asset of any other exponent, instead of being silently
                    re-denominated. MUST be omitted when asset_code is set - the asset is then the
                    threshold's denomination, resolved from the asset registry at evaluation time.
                    See docs/decisions/0031-risk-and-limits-engine.md §35.
                rule_kind: { type: string, enum: [hard_limit, configurable_limit, risk_signal], default: configurable_limit }
                action: { type: string, enum: [deny, review], default: deny }
                description: { type: string }
              required: [operation, limit_kind, time_window, threshold]
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/risk/rules/{id}/disable:
    post:
      summary: Disable a risk rule
      description: >
        Requires risk_config:manage. The only legitimate mutation besides
        description/effective_until - a rule is never deleted, so a past
        RiskDecision remains explainable against the exact rule that
        produced it. Returns 404 (never 403) both for a genuinely
        nonexistent id AND for a rule outside the caller's own tenant
        scope (platform-wide or a different tenant's) - never confirms
        existence outside the caller's own authorization.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rule disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Bonus Engine: four-eyes governance, EOI minting, per-domain
  # activate/publish/execute (Stage 4H-B1 Wave 3 Phase 3) ---
  #
  # NOT DOCUMENTED HERE (a pre-existing, disclosed gap this Phase does
  # not retroactively close): Wave 2's own bonus HTTP surface (POST
  # /v1/admin/bonus/campaigns, POST /v1/admin/bonus/grants, the
  # suggestion-review and held-disposition-resolution endpoints,
  # bonus_handlers.go/bonus_routes.go) was never added to this file
  # either - this section covers only the NEW endpoints this Phase
  # introduces.
  /v1/admin/bonus/change-requests:
    post:
      summary: File a four-eyes change request for a dual-controlled bonus operation
      description: >
        The ONE generic filing surface for all eight of security-
        architecture.md §B1.2's dual-controlled bonus operations - the
        required permission is resolved DYNAMICALLY from the `operation`
        field (campaign_activate/offer_publish -> bonus_campaign:activate/
        bonus_offer:manage; manual_grant_issue -> bonus_grant:issue;
        bulk_job_execute -> bonus_bulk:execute; bonus_adjustment_write ->
        bonus_adjustment:write; grant_forced_conversion/grant_cancel_completed
        -> bonus_grant:review/bonus_grant:cancel; held_disposition_resolve
        -> bonus_held_disposition:resolve).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum: [manual_grant_issue, bulk_job_execute, bonus_adjustment_write, grant_forced_conversion, campaign_activate, offer_publish, grant_cancel_completed, held_disposition_resolve]
                target_type: { type: string, description: "e.g. bonus_campaigns, bonus_offers, bonus_grants, bulk_grant_jobs, bonus_held_dispositions" }
                target_id: { type: string, format: uuid }
                payload: { type: object, description: "Operation-specific identifying fields the eventual consume call must match exactly (JSONB containment)." }
                amount_at_request: { type: string, description: "Decimal-string minor units, never a JSON number." }
                asset_code: { type: string }
                reason_code: { type: string }
              required: [operation, target_type, target_id, reason_code]
      responses:
        "201":
          description: Change request filed, state=pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusChangeRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks the permission the named operation requires
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/change-requests/{requestID}/decide:
    post:
      summary: Approve or reject a pending bonus change request
      description: >
        Requires the SAME permission the underlying operation itself
        requires. migration 0063's own DB triggers enforce requester !=
        approver (distinct Person) and SEP-1 (beneficiary separation for
        manual_grant_issue/bonus_adjustment_write/grant_forced_conversion/
        grant_cancel_completed/held_disposition_resolve/bulk_job_execute
        with a materialized recipient) - a refused decision surfaces as
        403, never 500.


        The threshold/amount snapshot recorded on the resulting
        bonus_change_approvals row (threshold_at_decision,
        amount_at_decision) is resolved SERVER-SIDE from the tenant's own
        approval policy and the request's own amount_at_request - it is
        deliberately NOT accepted from the request body, so the
        append-only forensic record cannot be authored by the approving
        principal (Stage 4H-B1 Wave 3 Phase 6, `security`).
      security:
        - bearerAuth: []
      parameters:
        - name: requestID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code:
                  type: string
                  description: Mandatory when decision=reject.
              required: [decision]
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusChangeRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission, self-approval, or SEP-1 beneficiary-separation refusal
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/economic-operations:
    post:
      summary: Mint an EconomicOperationIdentity root (doc 34 §3.1)
      description: >
        Bonus Engine's exactly-two mint points: a staff single-Grant
        authorization (bonus_manual_grant, requires bonus_grant:issue) or
        a BulkGrantJob authorization (bonus_bulk_grant, requires
        bonus_bulk:execute). Minted already `approved` by the caller's own
        authority - doc 34 does not require a separate approval workflow
        on the EOI object itself for these two consumer types. Idempotent
        on (tenant_id, idempotency_key) - a retry with the SAME key
        resolves to the SAME operation_id.


        Because the root is minted already-approved on ONE actor's
        authority, its budget must be explicit and finite (Stage 4H-B1
        Wave 3 Phase 6, `security`): `asset_code`,
        `intended_aggregate_value` (> 0) and `recipient_ceiling` (> 0) are
        all MANDATORY, `subject_ref` is mandatory for
        `single_subject` (with `recipient_ceiling` = 1),
        `subject_set_count` is mandatory for `enumerated_set` (with
        `recipient_ceiling` <= `subject_set_count`), and
        `expires_in_seconds` is capped at 86400. An absent ceiling is
        treated by the budget-consumption function as "no check at all",
        so an optional ceiling would reopen the SEC-W15-02 decomposition
        vector at the entry point of the mechanism that exists to close
        it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_type: { type: string, enum: [bonus_manual_grant, bonus_bulk_grant] }
                subject_scope: { type: string, enum: [single_subject, enumerated_set] }
                subject_ref: { type: string, format: uuid }
                subject_set_count: { type: integer }
                asset_code: { type: string }
                intended_aggregate_value: { type: string, description: "Decimal-string minor units, strictly positive" }
                recipient_ceiling: { type: integer, minimum: 1 }
                idempotency_key: { type: string }
                expires_in_seconds: { type: integer, default: 3600, maximum: 86400 }
              required:
                [
                  operation_type,
                  subject_scope,
                  asset_code,
                  intended_aggregate_value,
                  recipient_ceiling,
                  idempotency_key,
                ]
      responses:
        "201":
          description: EOI minted (or the existing one, on an idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomicOperation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/campaigns/{campaignID}/activate:
    post:
      summary: Activate a Campaign (four-eyes gated)
      description: >
        Requires bonus_campaign:activate AND a pending bonus_change_requests
        row (operation=campaign_activate, target_id=campaignID, payload
        `{"action":"activate"}`) with the tenant's configured number of
        distinct approvals. Consumes the approval and activates atomically.
      security:
        - bearerAuth: []
      parameters:
        - name: campaignID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Campaign activated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers:
    post:
      summary: Create a Draft Offer under a Campaign
      description: Requires bonus_offer:manage. Not four-eyes gated (a Draft Offer moves no value) - only offer_publish is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid }
                campaign_id: { type: string, format: uuid }
                campaign_version_id: { type: string, format: uuid }
                grant_policy: { type: string, enum: [auto_issue, manual_approval_required, code_redeemed, external_signal, manually_assigned] }
              required: [campaign_id, campaign_version_id]
      responses:
        "201":
          description: Offer created, status=draft
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers/{offerID}/versions:
    post:
      summary: Create a new, append-only OfferVersion
      description: Requires bonus_offer:manage. Every monetary field is a decimal-string minor-unit amount.
      security:
        - bearerAuth: []
      parameters:
        - name: offerID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                min_qualifying_amount: { type: string }
                max_qualifying_amount: { type: string }
                first_deposit_only: { type: boolean }
                eligibility_deposit_methods: { type: array, items: { type: string } }
                reward_kind: { type: string, enum: [R1, R2, R3, R5, R6] }
                reward_asset_code: { type: string }
                reward_calculation: { type: string, description: "Raw JSON object, as a string - e.g. {\"rate_bp\":5000,\"cap_amount\":\"10000\"}." }
                fulfillment_destination: { type: string, enum: [into_platform_wallet, inside_provider] }
                funding_source: { type: string }
                wagering_multiplier_bp: { type: integer }
                contribution_weight_table: { type: string, description: "Raw JSON object, as a string." }
                completion_mechanic: { type: string }
              required: [reward_kind, reward_asset_code, fulfillment_destination, funding_source]
      responses:
        "201":
          description: OfferVersion created
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers/{offerID}/publish:
    post:
      summary: Publish an OfferVersion (four-eyes gated)
      description: >
        Requires bonus_offer:manage AND a pending bonus_change_requests row
        (operation=offer_publish, target_id=offerID, payload
        `{"offer_version_id":"..."}`) with the tenant's configured number
        of distinct approvals. Pins current_version_id and flips the Offer
        Active atomically with the consume.
      security:
        - bearerAuth: []
      parameters:
        - name: offerID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offer_version_id: { type: string, format: uuid }
              required: [offer_version_id]
      responses:
        "200":
          description: Offer published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/manual-grants:
    post:
      summary: Issue a manual grant request (phase 1 - issued, not yet activated)
      description: >
        Requires bonus_grant:issue and an already-minted, approved EOI
        (parent_operation_id). Creates the Grant in status `issued` -
        deliberately NOT four-eyes gated at this step (T.2: issuance moves
        no value). File the manual_grant_issue change request against this
        Grant's own returned id AFTER this call, before calling the
        activate endpoint below (migration 0063's SEP-1 trigger requires
        the Grant row to already exist at approval time).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_account_id: { type: string, format: uuid }
                campaign_id: { type: string, format: uuid }
                campaign_version_id: { type: string, format: uuid }
                offer_id: { type: string, format: uuid }
                offer_version_id: { type: string, format: uuid }
                asset_code: { type: string }
                funding_source: { type: string }
                parent_operation_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
              required: [player_account_id, campaign_id, campaign_version_id, offer_id, offer_version_id, asset_code, funding_source, parent_operation_id]
      responses:
        "201":
          description: Grant issued, status=issued
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission, EOI check failed, or the T.2 gate denied (RG/Risk)
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/manual-grants/{grantID}/activate:
    post:
      summary: Activate an issued manual grant (phase 2 - four-eyes AND EOI budget consumed)
      description: >
        Requires bonus_grant:issue AND a pending bonus_change_requests row
        (operation=manual_grant_issue, target_id=grantID, payload matching
        player_account_id/offer_version_id/asset_code/amount exactly) with
        the tenant's configured number of distinct approvals. Both the
        four-eyes consume and the EOI locking-budget consume run inside
        the SAME PostGateHook, strictly after the T.1 gate chain and
        strictly before the effecting ledger write.
      security:
        - bearerAuth: []
      parameters:
        - name: grantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_operation_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                amount: { type: string }
              required: [parent_operation_id, amount]
      responses:
        "200":
          description: Grant activated
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Four-eyes approval not satisfied, EOI budget exhausted, or the T.1 gate denied
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Grant is not in a state that can be activated
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/bulk-jobs:
    post:
      summary: Create a BulkGrantJob targeting a static player list
      description: >
        Requires bonus_bulk:execute. target_kind is restricted to
        single_player/player_list this Wave (live segment resolution is
        out of scope - internal/segment does not exist). Idempotent on
        (tenant_id, idempotency_key) - a resubmission of the identical job
        spec resolves to the existing job.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_id: { type: string, format: uuid }
                offer_version_id: { type: string, format: uuid }
                target_kind: { type: string, enum: [single_player, player_list] }
                target_player_account_ids: { type: array, items: { type: string, format: uuid } }
                idempotency_key: { type: string }
              required: [campaign_id, offer_version_id, target_kind, target_player_account_ids, idempotency_key]
      responses:
        "201":
          description: Job created (or the existing one, on an idempotent retry)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/bulk-jobs/{jobID}/execute:
    post:
      summary: Execute an approved BulkGrantJob (four-eyes gated, runs synchronously)
      description: >
        Requires bonus_bulk:execute AND a pending bonus_change_requests row
        (operation=bulk_job_execute, target_id=jobID) with the tenant's
        configured number of distinct approvals, whose `payload` contains
        the ECONOMIC payload being approved (Stage 4H-B1 Wave 3 Phase 6,
        `security` - a bare `{"action":"execute"}` pinned nothing, so an
        approval for a modest bulk grant authorized an arbitrarily larger
        one):
        `{"action":"execute","offer_version_id":"<uuid>","asset_code":"<code>","amount_per_recipient":"<decimal-string>","recipient_count":<int>,"recipient_set_hash":"<sha256-hex>"}`,
        where `recipient_set_hash` is SHA-256 over the recipient
        player_account_ids lowercased, de-duplicated, sorted ascending and
        joined with a newline. Runs the job SYNCHRONOUSLY within this
        request (a disclosed, reversible engineering decision - a future
        background-worker invocation can call the identical job-runner
        unchanged). Per-item outcomes roll up to the job's own final
        status (completed | partially_completed | failed).
      security:
        - bearerAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jurisdiction_code: { type: string }
                amount: { type: string }
              required: [amount]
      responses:
        "200":
          description: Job executed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Asset Registry / Asset Authorization (ADR 0037, Stage 4H-B0-R6) ---
  #
  # Split along ADR 0037 §C.1's two tiers: /v1/admin/assets/** is
  # asset_registry:manage (platform_admin only, layers 1-3), and
  # /v1/admin/asset-authorizations/** is asset_authorization:write
  # (tenant-scoped, layers 4-7). There is deliberately NO endpoint that
  # evaluates eligibility: AssetAuthorization.CheckEligibility resolves
  # tenant/brand/jurisdiction server-side, and exposing it over HTTP would
  # mean accepting a jurisdiction identifier from a caller.
  /v1/admin/assets:
    get:
      summary: List the platform asset registry
      description: Requires asset_registry:manage (platform_admin only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create an asset (layer 1, dual-controlled)
      description: >
        Requires asset_registry:manage AND a pending change request for
        this code, approved by a DIFFERENT platform principal (ADR 0037
        §C.5.3), whose payload matches the identity fields exactly. The
        body has no `active`/`platform_authorized` field by design (§C.5.5:
        creation must never authorize any financial operation) and unknown
        fields are rejected. Returns 409 when no approved request exists.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, asset_type, decimal_exponent, display_name, reason_code]
              properties:
                code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                display_name: { type: string }
                network: { type: string, description: Required for a crypto asset }
                reason_code: { type: string }
      responses:
        "201":
          description: Created - always inactive and not platform-authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests:
    post:
      summary: File a four-eyes change request
      description: >
        Requires asset_registry:manage. Only the four dual-controlled
        operations are representable - suspend/revoke are deliberately
        single-actor kill-switches (ADR 0037 §C.5.3). The requesting
        principal must resolve to a platform-scoped staff row that carries
        a confirmed Person linkage and an active status (migration 0047);
        a principal failing any of those is 403, not 400.
        operation=platform_operation_eligibility is the layer-7
        PLATFORM-WIDE default GRANT (§C.5.1 op 9) and requires
        eligibility_operation; eligibility_product may be omitted, meaning
        every product. One approval authorizes exactly that
        (asset, operation, product) grant, once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, asset_code, reason_code]
              properties:
                operation:
                  type: string
                  enum: [create, activate, platform_authorize, platform_operation_eligibility]
                asset_code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                network: { type: string }
                eligibility_operation:
                  type: string
                  enum: [deposit, withdrawal, wagering, settlement, conversion, reporting]
                  description: >
                    Required for operation=platform_operation_eligibility,
                    rejected for any other operation.
                eligibility_product:
                  type: string
                  description: >
                    Omit for "every product". Rejected for any operation
                    other than platform_operation_eligibility.
                reason_code: { type: string }
      responses:
        "201":
          description: Request filed (state = pending)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests/{id}/decision:
    post:
      summary: Approve or reject a change request
      description: >
        Requires asset_registry:manage. Returns 409 for a self-approval,
        for a second decision by the same principal (reported as a
        duplicate decision, distinct from self-approval), or for a
        principal that resolves to the same PERSON as the requester -
        all enforced by the database (migrations 0044/0047, mirroring
        withdrawal_approvals). Returns 403 when the deciding principal is
        not platform-scoped, carries no confirmed Person linkage, or is
        not active: that last set is a property of the actor, and the
        Person-linkage condition is what makes the same-person check real
        rather than inert (migration 0047).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code: { type: string }
      responses:
        "201":
          description: Decision recorded (immutable)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}:
    patch:
      summary: Update mutable asset metadata (layer 1)
      description: >
        Requires asset_registry:manage. display_name is the ONLY mutable
        field: code/decimal_exponent/asset_type/network are immutable
        (ADR 0037 §C.5.4), are not accepted in this body, and are refused
        by a database trigger regardless.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, reason_code]
              properties:
                display_name: { type: string }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/activation:
    put:
      summary: Activate or suspend an asset (layer 2)
      description: >
        Requires asset_registry:manage. `value: true` additionally requires
        an approved activate request (409 otherwise); `value: false` is
        deliberately single-actor - an incident kill-switch must not wait
        for a second approver (ADR 0037 §C.5.3). `value` is mandatory:
        defaulting a missing boolean would make granting reachable by
        omission.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/platform-authorization:
    put:
      summary: Grant or revoke platform authorization (layer 3)
      description: >
        Requires asset_registry:manage. ADR 0037 §C.5.1 operation 5 - the
        asset's own platform clearance, NOT ProviderCapability (ADR 0022),
        which is a different concept. Granting requires an approved
        platform_authorize request; revoking does not.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/operation-eligibility:
    put:
      summary: Set the PLATFORM-WIDE operation eligibility default (layer 7)
      description: >
        Requires asset_registry:manage (platform tier of ADR 0037 §C.5.1
        operation 9). `product` omitted means every product; a
        product-specific row always wins over it. Returns 403 if the asset
        is not platform-authorized - nothing may be made eligible for an
        asset the platform has not cleared.


        FOUR-EYES: eligible=true is DUAL-CONTROLLED (§C.5.3). It requires
        an approved platform_operation_eligibility change request for this
        exact (asset, operation, product); without one the response is
        409. This row is a platform-wide gate for every tenant, and until
        migration 0047 a single platform-admin credential could flip it.
        eligible=false (revocation) is deliberately single-actor - the
        fail-closed direction must never wait for a second approver - and
        an idempotent re-write of an already-eligible row needs no new
        approval.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Platform-wide default written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations:
    get:
      summary: List this tenant's asset authorizations (layers 4-6)
      description: Requires asset_authorization:write and a tenant-scoped token.
      security:
        - bearerAuth: []
      parameters:
        - name: asset_code
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Authorization facts visible to the caller's tenant
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/{scopeKind}:
    put:
      summary: Authorize an asset for this tenant, a brand, or a jurisdiction (layers 4/5/6)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. The
        tenant is ALWAYS taken from the verified token, never from the body
        (ADR 0038 §11's rule, applied here). brand_id/jurisdiction_id name
        which brand/jurisdiction is being configured; a composite foreign
        key plus RLS mean neither can belong to another tenant. Returns 403
        when the write would widen past the layer above it (a
        non-platform-authorized asset, or a brand grant with no tenant
        grant behind it) - refused at write time, not only at resolution
        time.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeKind
          in: path
          required: true
          schema: { type: string, enum: [tenant, brand, jurisdiction] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_code, eligible, reason_code]
              properties:
                asset_code: { type: string }
                brand_id: { type: string, format: uuid, description: Required for scopeKind=brand }
                jurisdiction_id: { type: string, format: uuid, description: Required for scopeKind=jurisdiction }
                product: { type: string, description: Omitted means every product }
                eligible: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Authorization fact written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/operation-eligibility/{code}:
    put:
      summary: Narrow the operation eligibility for this tenant (layer 7 override)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. A
        tenant override may only NARROW the platform-wide default: a
        widening write returns 403 and is never stored (ADR 0037 §A.6).
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Tenant override written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HMAC-signed (HS256) JWTs, verified against a key registry keyed
        by the token's own `kid` header claim - this is what allows an
        old and a new signing key to be valid simultaneously during
        rotation (see internal/auth/keys.go). Tokens also carry a
        possibly-nil tenant_id claim: platform_admin tokens are
        legitimately platform-scoped (see docs/decisions/0011) - routes
        that require a real tenant reject a nil one via the
        RequireTenantScope middleware, not at token-verification time.
        This remains PROVIDER DEPENDENT / foundation-only for Stage 2 -
        see docs/architecture/05-identity-architecture.md.
  schemas:
    Asset:
      type: object
      description: >
        One Asset Registry row (ADR 0037 layers 1-3). `active` (layer 2)
        and `platform_authorized` (layer 3) are deliberately separate
        bits - an incident kill-switch and a compliance clearance must not
        share one. Neither being true implies anything about layers 4-7.
      properties:
        code: { type: string }
        asset_type: { type: string, enum: [fiat, crypto] }
        decimal_exponent:
          type: integer
          description: Immutable after creation - changing it would reinterpret every existing balance.
        display_name: { type: string }
        network: { type: string }
        active: { type: boolean }
        platform_authorized: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [code, asset_type, decimal_exponent, display_name, active, platform_authorized]
    AssetOperationEligibilityInput:
      type: object
      description: >
        Layer 7. `product` omitted means every product; a product-specific
        row always wins over it, so the product axis narrows and never
        widens. `operation` is exactly ADR 0037 §C.2's six values.
      properties:
        product: { type: string }
        operation:
          type: string
          enum: [deposit, withdrawal, wagering, settlement, conversion, reporting]
        eligible: { type: boolean }
        reason_code: { type: string }
      required: [operation, eligible, reason_code]
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds }
      required: [access_token, refresh_token, token_type, expires_in]
    PlayerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [pending_verification, active, suspended, self_excluded, closed, identity_review_required]
        kyc_tier: { type: integer }
        tenant_id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
      required: [id, email, status, kyc_tier, tenant_id, brand_id]
    PlayerAccount:
      type: object
      description: Player account as seen by tenant staff (no cross-brand/cross-tenant identifiers exposed).
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [pending_verification, active, suspended, self_excluded, closed, identity_review_required]
        kyc_tier: { type: integer }
      required: [id, brand_id, email, status, kyc_tier]
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
      required: [id, expires_at]
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        licensing_model:
          type: string
          enum: [under_platform_licence, own_licence]
        status: { type: string }
      required: [id, name, slug, licensing_model, status]
    Brand:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
      required: [id, tenant_id, name, slug, status]
    StaffUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: string
          enum: [platform_admin, tenant_admin, support, compliance, finance]
        status: { type: string }
      required: [id, email, role, status]
    AuditEntry:
      type: object
      description: >
        Append-only audit record (internal/audit.Entry / the audit_log
        table). Immutable at the database level - see
        docs/decisions/0013.
      properties:
        id: { type: string, format: uuid }
        actor_type:
          type: string
          enum: [player, staff, system]
        actor_id: { type: string, format: uuid }
        action: { type: string, example: player.suspended }
        target_type: { type: string, example: player_account }
        target_id: { type: string }
        outcome:
          type: string
          enum: [success, failure, denied]
        created_at: { type: string, format: date-time }
      required: [id, actor_type, action, outcome, created_at]
    Verification:
      type: object
      description: >
        A platform-owned KYC/identity-verification attempt
        (internal/kyc.Verification / kyc_verifications). Never collapsed
        into PlayerAccount.status - see docs/decisions/0028.
      properties:
        id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        status:
          type: string
          enum: [unverified, pending, review_required, approved, rejected, expired]
        provider_id: { type: string, example: mock }
        provider_reference: { type: string }
        reason: { type: string }
        reviewed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, player_account_id, status, provider_id, created_at]
    Document:
      type: object
      description: >
        A versioned, immutable-after-upload identity/verification
        document (internal/kyc.Document / kyc_documents). A reupload of
        the same document_type is a NEW row with version+1, never an
        overwrite - see docs/decisions/0029.
      properties:
        id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        verification_id: { type: string, format: uuid }
        document_type:
          type: string
          enum: [passport, national_id, drivers_license, proof_of_address, selfie, other]
        issuing_country: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [pending_review, approved, rejected]
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        original_filename: { type: string }
        rejection_reason: { type: string }
        uploaded_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
      required: [id, player_account_id, verification_id, document_type, version, status, content_type, size_bytes, original_filename, uploaded_at]
    RiskRule:
      type: object
      description: >
        A Risk & Limits policy rule (internal/risk.Rule / risk_rules).
        Immutable after creation except status/description/
        effective_until - see docs/decisions/0031.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, description: "Absent/empty means platform-wide" }
        brand_id: { type: string, format: uuid }
        jurisdiction_code: { type: string }
        licensing_mode: { type: string, enum: [under_platform_licence, own_licence], description: "Stage 4G-FINAL: absent means the rule applies regardless of licensing mode" }
        player_account_id: { type: string, format: uuid }
        product: { type: string, enum: [casino, sportsbook, payments, bonus] }
        operation:
          type: string
          enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
        provider_id: { type: string }
        game_id: { type: string, format: uuid }
        asset_code: { type: string }
        payment_method: { type: string }
        limit_kind: { type: string, enum: [min_amount, max_amount, cumulative_amount] }
        time_window: { type: string, enum: [transaction, rolling_hour, rolling_day, rolling_week, rolling_month] }
        threshold: { type: integer, format: int64 }
        threshold_exponent:
          type: integer
          minimum: 0
          maximum: 18
          nullable: true
          description: >-
            The decimal exponent `threshold`'s minor units are expressed in, for an
            asset-agnostic amount rule. Absent for an asset-scoped rule, whose denomination is
            its own asset_code (ADR 0031 §35).
        rule_kind: { type: string, enum: [hard_limit, configurable_limit, risk_signal] }
        action: { type: string, enum: [deny, review] }
        status: { type: string, enum: [active, disabled] }
        effective_from: { type: string, format: date-time }
        effective_until: { type: string, format: date-time }
        description: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, operation, limit_kind, time_window, threshold, rule_kind, action, status, effective_from, created_at]
    BonusChangeRequest:
      type: object
      description: >
        A dual-controlled bonus operation's own governance record
        (bonus_change_requests, migration 0063). Immutable except state
        (pending -> applied|rejected|cancelled).
      properties:
        id: { type: string, format: uuid }
        operation:
          type: string
          enum: [manual_grant_issue, bulk_job_execute, bonus_adjustment_write, grant_forced_conversion, campaign_activate, offer_publish, grant_cancel_completed, held_disposition_resolve]
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, applied, rejected, cancelled] }
      required: [id, operation, target_type, target_id, state]
    EconomicOperation:
      type: object
      description: >
        An EconomicOperationIdentity (economic_operations, doc 34) -
        Bonus Engine's own authorization-lineage anchor for manual/bulk
        grant issuance.
      properties:
        operation_id: { type: string, format: uuid }
        root_operation_id: { type: string, format: uuid }
        operation_type: { type: string, enum: [bonus_manual_grant, bonus_bulk_grant] }
        approval_state: { type: string, enum: [not_required, pending, approved, rejected, expired, consumed, revoked] }
        status: { type: string, enum: [open, exhausted, completed, aborted, superseded] }
      required: [operation_id, root_operation_id, operation_type, approval_state, status]
    Error:
      type: object
      description: Platform-wide error envelope (internal/apierror.Error).
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - internal_error
            - service_unavailable
            - tenant_mismatch
            - rate_limited
        message:
          type: string
        request_id:
          type: string
      required: [code, message]
  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but lacking the required permission or tenant scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (or not visible to the caller's tenant scope)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        A control refused the request - e.g. an asset-registry operation
        with no independently-approved change request behind it
        (four-eyes), or a self-approval. Deliberately distinct from 500:
        the platform is working, a control said no.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed attempts; locked out for a window
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
