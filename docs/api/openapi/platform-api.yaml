    get:
      summary: Get the caller's wallet for one asset (created on first access)
      description: >
        A10c. Player-authenticated. The wallet is the caller's own for the named asset; the first read of an asset the player has never held
        creates the (empty) wallet. An asset code that is not in the asset registry is 400.
      security:
        - bearerAuth: []
