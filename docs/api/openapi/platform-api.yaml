      responses:
        "201":
          description: OfferVersion created
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers/{offerID}/publish:
    post:
      summary: Publish an OfferVersion (four-eyes gated)
      description: >
        Requires bonus_offer:manage AND a pending bonus_change_requests row
        (operation=offer_publish, target_id=offerID, payload
        `{"offer_version_id":"..."}`) with the tenant's configured number
        of distinct approvals. Pins current_version_id and flips the Offer
        Active atomically with the consume.
      security:
        - bearerAuth: []
      parameters:
        - name: offerID
          in: path
          required: true
          schema: { type: string, format: uuid }
