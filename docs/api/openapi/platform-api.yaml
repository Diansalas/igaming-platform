        executed_by: { type: string, format: uuid, nullable: true }
        executed_at: { type: string, format: date-time, nullable: true }
        approvals: { type: array, items: { type: object, properties: { approver_id: { type: string, format: uuid, nullable: true } }, required: [approver_id] } }
      required: [change_request_id, kind, reason_code, requested_by, executed_by, executed_at, approvals]
    OperatingBasisDetail:
      allOf:
        - $ref: "#/components/schemas/OperatingBasis"
