          schema: { type: string, enum: [pending, applied, rejected, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated change-request queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BonusChangeRequest" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: File a four-eyes change request for a dual-controlled bonus operation
      description: >
        The ONE generic filing surface for all eight of security-
        architecture.md §B1.2's dual-controlled bonus operations - the
        required permission is resolved DYNAMICALLY from the `operation`
        field (campaign_activate/offer_publish -> bonus_campaign:activate/
        bonus_offer:manage; manual_grant_issue -> bonus_grant:issue;
        bulk_job_execute -> bonus_bulk:execute; bonus_adjustment_write ->
        bonus_adjustment:write; grant_forced_conversion/grant_cancel_completed
        -> bonus_grant:review/bonus_grant:cancel; held_disposition_resolve
        -> bonus_held_disposition:resolve).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum: [manual_grant_issue, bulk_job_execute, bonus_adjustment_write, grant_forced_conversion, campaign_activate, offer_publish, grant_cancel_completed, held_disposition_resolve]
                target_type: { type: string, description: "e.g. bonus_campaigns, bonus_offers, bonus_grants, bulk_grant_jobs, bonus_held_dispositions" }
                target_id: { type: string, format: uuid }
                payload: { type: object, description: "Operation-specific identifying fields the eventual consume call must match exactly (JSONB containment)." }
                amount_at_request: { type: string, description: "Decimal-string minor units, never a JSON number." }
                asset_code: { type: string }
                reason_code: { type: string }
              required: [operation, target_type, target_id, reason_code]
      responses:
        "201":
          description: Change request filed, state=pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusChangeRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks the permission the named operation requires
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/change-requests/{requestID}/decide:
    post:
      summary: Approve or reject a pending bonus change request
      description: >
        Requires the SAME permission the underlying operation itself
        requires. migration 0063's own DB triggers enforce requester !=
        approver (distinct Person) and SEP-1 (beneficiary separation for
        manual_grant_issue/bonus_adjustment_write/grant_forced_conversion/
        grant_cancel_completed/held_disposition_resolve/bulk_job_execute
        with a materialized recipient) - a refused decision surfaces as
        403, never 500.


        The threshold/amount snapshot recorded on the resulting
        bonus_change_approvals row (threshold_at_decision,
        amount_at_decision) is resolved SERVER-SIDE from the tenant's own
        approval policy and the request's own amount_at_request - it is
        deliberately NOT accepted from the request body, so the
        append-only forensic record cannot be authored by the approving
        principal (Stage 4H-B1 Wave 3 Phase 6, `security`).
      security:
        - bearerAuth: []
      parameters:
        - name: requestID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code:
                  type: string
                  description: Mandatory when decision=reject.
              required: [decision]
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusChangeRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission, self-approval, or SEP-1 beneficiary-separation refusal
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/economic-operations:
    post:
      summary: Mint an EconomicOperationIdentity root (doc 34 §3.1)
      description: >
        Bonus Engine's exactly-two mint points: a staff single-Grant
        authorization (bonus_manual_grant, requires bonus_grant:issue) or
        a BulkGrantJob authorization (bonus_bulk_grant, requires
        bonus_bulk:execute). Minted already `approved` by the caller's own
        authority - doc 34 does not require a separate approval workflow
        on the EOI object itself for these two consumer types. Idempotent
        on (tenant_id, idempotency_key) - a retry with the SAME key
        resolves to the SAME operation_id.


        Because the root is minted already-approved on ONE actor's
        authority, its budget must be explicit and finite (Stage 4H-B1
        Wave 3 Phase 6, `security`): `asset_code`,
        `intended_aggregate_value` (> 0) and `recipient_ceiling` (> 0) are
        all MANDATORY, `subject_ref` is mandatory for
        `single_subject` (with `recipient_ceiling` = 1),
        `subject_set_count` is mandatory for `enumerated_set` (with
        `recipient_ceiling` <= `subject_set_count`), and
        `expires_in_seconds` is capped at 86400. An absent ceiling is
        treated by the budget-consumption function as "no check at all",
        so an optional ceiling would reopen the SEC-W15-02 decomposition
        vector at the entry point of the mechanism that exists to close
        it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_type: { type: string, enum: [bonus_manual_grant, bonus_bulk_grant] }
                subject_scope: { type: string, enum: [single_subject, enumerated_set] }
                subject_ref: { type: string, format: uuid }
                subject_set_count: { type: integer }
                asset_code: { type: string }
                intended_aggregate_value: { type: string, description: "Decimal-string minor units, strictly positive" }
                recipient_ceiling: { type: integer, minimum: 1 }
                idempotency_key: { type: string }
                expires_in_seconds: { type: integer, default: 3600, maximum: 86400 }
              required:
                [
                  operation_type,
                  subject_scope,
                  asset_code,
                  intended_aggregate_value,
                  recipient_ceiling,
                  idempotency_key,
                ]
      responses:
        "201":
          description: EOI minted (or the existing one, on an idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomicOperation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/campaigns/{campaignID}/activate:
    post:
      summary: Activate a Campaign (four-eyes gated)
      description: >
        Requires bonus_campaign:activate AND a pending bonus_change_requests
        row (operation=campaign_activate, target_id=campaignID, payload
        `{"action":"activate"}`) with the tenant's configured number of
        distinct approvals. Consumes the approval and activates atomically.
      security:
        - bearerAuth: []
      parameters:
        - name: campaignID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Campaign activated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers:
    post:
      summary: Create a Draft Offer under a Campaign
      description: Requires bonus_offer:manage. Not four-eyes gated (a Draft Offer moves no value) - only offer_publish is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid }
                campaign_id: { type: string, format: uuid }
                campaign_version_id: { type: string, format: uuid }
                grant_policy: { type: string, enum: [auto_issue, manual_approval_required, code_redeemed, external_signal, manually_assigned] }
              required: [campaign_id, campaign_version_id]
      responses:
        "201":
          description: Offer created, status=draft
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/offers/{offerID}/versions:
    post:
      summary: Create a new, append-only OfferVersion
      description: Requires bonus_offer:manage. Every monetary field is a decimal-string minor-unit amount.
      security:
        - bearerAuth: []
      parameters:
        - name: offerID
          in: path
