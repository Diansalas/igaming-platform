      responses:
        "200":
          description: The approval was recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidenceApprovalPolicyApproval" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/kyc/residence-determinations/pending:
    get:
      summary: Residence determinations waiting for a second Person
      description: >
        verification:read, tenant-scoped sessions only (a platform token is refused 403). lic10, migration 0181. Lists the CURRENT determinations that the tenant's policy required a second Person for and that have none, oldest first (at most 200). A pending determination is NOT market evidence. A determination replaced by a newer one is not listed. The list carries ids and times only: never the country (reading the residence value is its own permission). `determined_at` must be passed back unchanged to approve the determination.
