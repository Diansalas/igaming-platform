openapi: 3.0.3
info:
  title: "platform-api (Stage 2: identity + tenancy + security)"
  version: "0.2.0"
  description: >
    Health/readiness, player identity/auth, staff auth, and tenant/brand/
    staff/player administration endpoints through Stage 2. This is NOT the
    full platform API - wallet/ledger, bonus, payments, casino, sportsbook,
    and production KYC/AML APIs are added in their owning stages (see
    docs/active-stage.md and docs/architecture/04-api-architecture.md for
    the conventions those additions must follow: versioned paths, the
    shared error envelope below, idempotency-key support on mutating
    endpoints).


    Authentication is HMAC-signed JWTs with key-id-based rotation support
    (see the bearerAuth security scheme below and docs/decisions/0011).
    This remains explicitly PROVIDER DEPENDENT / foundation-only -
    production authentication may move to a real identity provider or
    KMS-managed asymmetric signing before go-live; see
    docs/architecture/05-identity-architecture.md.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: >
        Reports whether the process is up. Never checks the database -
        see /readyz for that - so a database outage does not cause an
        orchestrator to kill and restart an otherwise-healthy process.
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Readiness probe
      description: Reports whether the instance can serve traffic (checks database connectivity).
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Not ready (e.g. database unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  reason:
                    type: string
                    example: database unreachable

  # --- Player auth ---
  /v1/auth/register:
    post:
      summary: Register a new player account
      description: >
        Creates a Person, a PlayerAccount under the given brand, and an
        initial session in one atomic transaction. tenant_id is always
        derived server-side from the resolved brand - never accepted from
        the client (CLAUDE.md's absolute multi-tenancy rule).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
              required: [brand_slug, email, password]
      responses:
        "201":
          description: Account created; returns an initial token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Unknown brand_slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An account with this email already exists for this brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/login:
    post:
      summary: Log in as a player
      description: >
        Verifies credentials against the brand-scoped player account.
        Subject to Postgres-backed lockout after repeated failures (see
        docs/architecture/05-identity-architecture.md's login_attempts
        design) - locked-out requests return 429 even with a correct
        password, matching the documented threshold/window.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [brand_slug, email, password]
      responses:
        "200":
          description: Authenticated; returns a token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account exists but cannot currently log in (suspended/self-excluded/closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown brand_slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token for a new access/refresh token pair
      description: >
        Single-use refresh tokens: presenting one rotates it for a new
        pair and revokes the old one. Presenting an already-rotated
        (reused) token revokes the entire session chain from that point
        forward and returns 401 - see docs/decisions and
        internal/auth/session.go's RotateSession. The principal's CURRENT
        role/status is re-checked on every refresh, never trusted from
        the prior token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: Rotated; returns a new token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Principal is no longer active (e.g. suspended since last login)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/logout:
    post:
      summary: Revoke a session by its refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "204":
          description: Session revoked (idempotent - also returned if the token was already invalid)
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Player self-service ---
  /v1/me:
    get:
      summary: Get the authenticated player's own profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's own player account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is not a player-principal token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/sessions:
    get:
      summary: List the authenticated principal's active sessions
      description: >
        Available to both player and staff principals. Scoped to the
        caller's own principal_id - never returns another principal's
        sessions, even within the same tenant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions for the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/sessions/{id}:
    delete:
      summary: Revoke one of the authenticated principal's own sessions
      description: >
        Ownership-checked server-side (the session's principal_id must
        match the caller's) - a caller cannot revoke another principal's
        session by guessing its id, even within the same tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Staff auth ---
  /v1/staff/auth/login:
    post:
      summary: Log in as a staff user (back-office/admin principal)
      description: >
        Separate credential store and endpoint from player login.
        tenant_slug is omitted entirely for a platform_admin login (there
        is no tenant to resolve - see docs/decisions/0011); every other
        staff role must supply it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_slug:
                  type: string
                  description: Omit only for a platform_admin login.
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [email, password]
      responses:
        "200":
          description: Authenticated; returns a token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account exists but cannot currently log in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown tenant_slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Tenant/brand/staff administration ---
  /v1/admin/tenants:
    get:
      summary: List tenants (Stage 5 - Operator Back Office MVP)
      description: >
        platform_admin only (tenant:read) - tenant-scoped callers are
        rejected with 403, since browsing every tenant is inherently a
        platform-level view. Optional case-insensitive substring match on
        name/slug via `q`, exact match on `status`.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated tenant list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Tenant" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Provision a new tenant
      description: >
        platform_admin only (tenant:write). Never tenant-scoped by design
        - provisioning a tenant is inherently a platform-level action, so
        this route deliberately does not require an existing tenant
        context (see docs/decisions/0011). As of Stage 4I Phase E-SECURITY
        (migration 0077, docs/decisions/0046), this handler opens its
        transaction via db.Pool.WithPlatformAdmin (not WithoutTenant) -
        `tenants` gained row-level security with no tenant-scoped/
        scopeless write policy of any kind. `reason_code` is now a
        required field, and the resulting `tenant.created` audit record
        carries it alongside a before/after state (before: null,
        after: {id, name, slug, licensing_model, status}).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                licensing_model:
                  type: string
                  enum: [under_platform_licence, own_licence]
                reason_code: { type: string }
              required: [name, slug, licensing_model, reason_code]
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A tenant with this slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}:
    get:
      summary: Get a single tenant (Stage 5)
      description: >
        tenant:read. platform_admin may read any tenant; a tenant-scoped
        caller may only read its own tenant (403 otherwise, per ADR 0011's
        canActOnTenant rule).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/brands:
    get:
      summary: List brands under a tenant (Stage 5)
      description: >
        brand:read, canActOnTenant (platform_admin any tenant,
        tenant-scoped caller only its own).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated brand list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Brand" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Provision a new brand under a tenant
      description: >
        Requires brand:write. platform_admin may target any tenant;
        tenant_admin may only target their own tenant (checked explicitly
        against the path parameter, per ADR 0011).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
              required: [name, slug]
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks brand:write, or is a tenant_admin targeting a different tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A brand with this slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/brands/{brandID}:
    get:
      summary: Get a single brand under a tenant (Stage 5)
      description: >
        brand:read, canActOnTenant. 404s if the brand exists but belongs
        to a different tenant than the path (brands are readable at the
        RLS layer platform-wide, so this handler-level check is
        load-bearing, not redundant).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: brandID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/staff:
    post:
      summary: Create a staff user for a tenant
      description: >
        Requires staff:manage. platform_admin may target any tenant;
        tenant_admin may only target their own. Cannot create a
        platform_admin - that role is bootstrapped only via
        cmd/seed-admin (see docs/decisions/0014).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role:
                  type: string
                  enum: [tenant_admin, support, compliance, finance]
              required: [email, password, role]
      responses:
        "201":
          description: Staff user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A staff user with this email already exists for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Player administration (tenant-scoped) ---
  /v1/admin/players:
    get:
      summary: List player accounts for the caller's tenant
      description: >
        Requires player:read, and a real (non-nil) tenant context -
        platform_admin's platform-scoped token is rejected here by
        RequireTenantScope (browsing an arbitrary tenant's players is
        deferred - see docs/decisions/0011's "Consequences"). Stage 5
        (Operator Back Office MVP) added pagination and search/filter -
        this response shape CHANGED from a bare array to the paginated
        envelope below.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring match on email.
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated player accounts in the caller's tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PlayerAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}:
    get:
      summary: Get a single player account in the caller's tenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The player account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/suspend:
    post:
      summary: Suspend a player account
      description: >
        Requires player:suspend (compliance/tenant_admin/platform_admin -
        support explicitly does not have this permission). Requires a
        reason code, recorded on the audit entry.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "204":
          description: Player suspended
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/reinstate:
    post:
      summary: Reinstate a suspended player account (Stage 5)
      description: >
        Requires player:suspend (same authorization level as suspend - it
        is suspend's inverse). Atomic conditional transition: only
        succeeds if the account's CURRENT status is exactly `suspended`
        (409 otherwise) - this deliberately does NOT clear
        self_excluded/closed/identity_review_required, which each have
        their own dedicated workflow (self-exclusion is never cleared by
        a generic reinstate action). Requires a reason code, recorded on
        the audit entry (action player.reinstated) alongside the
        before/after status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "204":
          description: Player reinstated
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account is not currently suspended
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/identity-review/clear:
    post:
      summary: Clear a player account out of identity_review_required
      description: >
        Stage 4E (docs/decisions/0027). Requires identity_review:manage
        (compliance only - never tenant_admin/platform_admin, mirroring
        rg_restriction:write's separation-of-duties precedent). Requires a
        reason code, recorded on the audit entry. The account's CURRENT
        status must actually be identity_review_required - attempting this
        on any other status (e.g. suspended, self_excluded) is rejected
        with 409 rather than silently reactivating it; this is a narrower
        capability than player:suspend's own suspend/reinstate authority
        and must never become a generic "set player active" action.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "204":
          description: Identity review cleared - account is now active
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account is not currently identity_review_required
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Withdrawal admin (staff-facing) visibility (Stage 5, Operator
  # Back Office MVP). The withdrawal state machine, four-eyes approval
  # controls (POST .../approve, .../reject, and the rest of the existing
  # write API), and ledger postings all predate this spec's coverage and
  # are unchanged - only these two READ endpoints are new. Documenting
  # just the Stage 5 additions here, not backfilling the full pre-existing
  # write API, which is a separate, tracked documentation gap. ---
  /v1/admin/withdrawals/history:
    get:
      summary: Withdrawal queue - full history, tenant-wide (Stage 5)
      description: >
        withdrawal:review, tenant-scoped. Distinct from the pre-existing
        pending-only review queue (which also promotes `requested` rows
        to `pending_review` as a side effect) - this is a pure read
        covering every state, for the Back Office's general queue/history
        view. Registered at `/history` rather than the bare
        `/v1/admin/withdrawals` path because that path is already bound
        to the pending-only queue handler.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [requested, pending_review, approved, rejected, submitted, completed, failed, cancelled, reversed] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated withdrawal history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WithdrawalAdmin" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawals/{id}:
    get:
      summary: Get a single withdrawal, staff view (Stage 5)
      description: >
        withdrawal:review, tenant-scoped, tenant-wide (not restricted to
        the caller's own withdrawals, unlike the player-self-service
        GET /v1/me/withdrawals/{id}). 404s indistinguishably for an
        unknown id or one belonging to a different tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Sportsbook (Stage 6, B2C Player/Brand MVP + first sportsbook
  # vertical slice). Catalogue browse is public/unauthenticated (mirrors
  # the assets-registry/casino-catalogue precedent: platform-wide,
  # read-open reference data with no RLS). Bet placement and history are
  # player-authenticated; the admin list is the Stage 6 Back Office
  # visibility counterpart to /v1/admin/withdrawals/history. Only a mock
  # provider (internal/sportsbook.MockSportsbookProvider) is wired this
  # stage - see docs/active-stage.md for the real-provider integration
  # contract this was built against. ---
  /v1/sportsbook/sports:
    get:
      summary: Browse the full sportsbook catalogue (sports -> competitions -> events)
      description: >
        Public, unauthenticated, no tenant scoping - platform-wide
        reference data synced from the configured Provider at server
        startup (SyncCatalogue), not baked into a migration.
      responses:
        "200":
          description: The full catalogue tree
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SportCatalogue" }
        "503":
          description: Sportsbook is not enabled on this deployment
  /v1/sportsbook/events/{id}:
    get:
      summary: Get one event's full market/selection tree
      description: Public, unauthenticated, mirrors GET /v1/sportsbook/sports.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Sportsbook is not enabled on this deployment
  /v1/me/sportsbook/bets:
    post:
      summary: Place a bet on a selection
      description: >
        Player-authenticated. selection_id/asset_code/stake_amount are the
        actual bet; expected_odds_numerator/expected_odds_denominator are
        what the client last saw for the selection - if the server's
        current odds differ, the bet is rejected with
        rejection_category=odds_changed rather than silently placed at a
        different price. idempotency_key must be unique per placement
        attempt (a duplicate returns the original outcome). A rejection is
        a well-formed business decision, not an HTTP error - the response
        is 200 with accepted=false, mirroring internal/casino's
        webhook-decline precedent. Full server-authoritative chain:
        validation -> RG eligibility -> risk evaluation -> wallet balance
        authorization -> ledger post + bet row, in one transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBetRequest"
      responses:
        "201":
          description: Bet accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceBetResponse"
        "200":
          description: Bet declined (accepted=false; see rejection_category)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceBetResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Selection not found
        "503":
          description: Sportsbook is not enabled on this deployment
    get:
      summary: List the caller's own bet history
      description: Player-authenticated, restricted to the caller's own bets (WithPlayerScope).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated bet history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Bet" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Sportsbook is not enabled on this deployment
  /v1/admin/sportsbook/bets:
    get:
      summary: Sportsbook bet queue, tenant-wide (Stage 6 Back Office visibility)
      description: >
        sportsbook_bet:read, tenant-scoped, tenant-wide (not restricted to
        one player) - mirrors GET /v1/admin/withdrawals/history's identical
        shape and rationale. Not granted to platform_admin (no tenant
        context to scope to).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated tenant-wide bet queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminBet" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Sportsbook is not enabled on this deployment

  # --- Stage 10 W1 (ADR 0088 §9): non-production test-support sportsbook
  # settlement simulation. IN-HOUSE MOCK MODE ONLY - see x-test-support and
  # the summary/description below. ---
  /v1/admin/sportsbook/bets/{id}/simulate-settlement-event:
    post:
      x-test-support: true
      summary: >-
        NON-PRODUCTION TEST SUPPORT ONLY - simulate an in-house settlement
        event (settle/void/rollback) for a cash-funded single bet
      description: >
        Absent unless test-support routes are enabled; never present when
        `APP_ENV=production`; simulates an in-house provider event; not an
        operator settlement feature. This is the ONLY driver of the
        in-house MOCK sportsbook settlement lifecycle (docs/decisions/0088)
        - there is no real sportsbook settlement provider or webhook.
        Gated by BOTH `Deps.SportsbookSettlementSimulationEnabled`
        (`cfg.TestSupportRoutesEnabled()`, ADR 0085's two-layer opt-in) AND
        `Deps.SportsbookEnabled`; when either is false this path is never
        registered at all (a request against it 404s exactly like any
        other unregistered path). Requires the staff-only
        `sportsbook_settlement:simulate` permission, held solely by the
        risk_manager role - never finance, tenant_admin, compliance,
        support, platform_admin, or any bonus role (ADR 0024 separation of
        duties). Every effect-bearing amount is derived server-side from
        the bet's own frozen placement/potential_return; payout_amount in
        the request is only the simulated provider's CLAIM, validated
        against the derived value and never posted directly (anti-minting,
        ADR 0088 §2.4). Removed once a real sportsbook settlement provider
        is registered for any tenant (ADR 0088 §9.1).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateSettlementEventRequest"
      responses:
        "200":
          description: The settlement event's outcome (applied, replayed, or tombstoned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateSettlementEventResponse"
        "400":
          description: VALIDATION_FAILED - shape/field-matrix violation, or payout_amount is not a non-negative in-range JSON integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No token; a player, service, or platform_admin principal; or a
            staff principal lacking sportsbook_settlement:simulate; or the
            staff actor is not an active user of this tenant.
        "404":
          description: Route absent (test-support disabled or production), or the bet does not exist in the caller's own tenant (NOT_FOUND)
        "409":
          description: >
            SETTLEMENT_PAYLOAD_MISMATCH, SETTLEMENT_TOMBSTONED, BET_VOIDED,
            BET_ALREADY_SETTLED, GENERATION_OUT_OF_SEQUENCE, or
            SETTLEMENT_INTEGRITY
        "422":
          description: PAYOUT_INVALID or ASSET_MISMATCH (anti-minting / claim-vs-derived-value validation)

  # --- Stage 9.2 (ADR 0083 §5.2/§9.2): sportsbook jurisdiction/market
  # gating governance - platform-admin only, mirrors PUT
  # /v1/admin/casino/games's identical platform-scope shape ---
  /v1/admin/sportsbook/jurisdiction-restrictions:
    get:
      summary: List sb_jurisdiction_restrictions (active and withdrawn)
      description: >
        Requires sportsbook_jurisdiction_restriction:read (platform_admin
        only). Returns every restriction, active and withdrawn, so the
        full compliance history is visible - newest first.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every jurisdiction restriction
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SportsbookJurisdictionRestriction" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Arm a new jurisdiction restriction (event/market/selection)
      description: >
        Requires sportsbook_jurisdiction_restriction:manage (platform_admin
        only). Deny-only by construction (INV-SB-JUR-2) - exactly one of
        event_id/market_id/selection_id must be set, matching scope_kind.
        Arming ANY restriction row blocks that event/market/selection for
        EVERY player until player jurisdiction resolution exists (ADR 0083
        §5.3.2) - this is the fail-closed, disclosed consequence of K3-1/
        K3-2, not a bug.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope_kind: { type: string, enum: [event, market, selection] }
                event_id: { type: string, format: uuid }
                market_id: { type: string, format: uuid }
                selection_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                authorization_reference: { type: string, description: "Required on every row (ADR 0045 §4's authorization discipline)." }
                reason_code: { type: string }
              required: [scope_kind, jurisdiction_code, authorization_reference, reason_code]
      responses:
        "201":
          description: Restriction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookJurisdictionRestriction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/sportsbook/jurisdiction-restrictions/{id}/withdraw:
    post:
      summary: Withdraw an active jurisdiction restriction
      description: >
        Requires sportsbook_jurisdiction_restriction:manage. Never a
        delete - migration 0087's deny-delete trigger refuses one
        regardless, so compliance history survives. Only transitions an
        'active' row; reason_code REPLACES the row's own reason_code
        (the one other mutable field, alongside status).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "200":
          description: Restriction withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookJurisdictionRestriction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 9.2 Part B2 / Wave 3 (ADR 0083 §6.2.3/§9.2): TENANT-scoped
  # cross-player book-exposure limit governance for sb_exposure_limits -
  # UNLIKE the jurisdiction-restriction routes above, this table carries a
  # tenant_id and is RequireTenantScope-wrapped, mirroring
  # /v1/admin/risk/rules exactly ---
  /v1/admin/sportsbook/exposure-limits:
    get:
      summary: List sb_exposure_limits for the caller's own tenant (active and disabled)
      description: >
        Requires sportsbook_exposure_limit:read (RoleRiskManager,
        RoleTenantAdmin), tenant-scoped. Returns every limit, active and
        disabled, so the full configuration history is visible - newest
        first. A limit has no player-facing read path.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every exposure limit for this tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SportsbookExposureLimit" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Arm a new cross-player book-exposure ceiling
      description: >
        Requires sportsbook_exposure_limit:manage (RoleRiskManager only),
        tenant-scoped. max_open_potential_payout is the GROSS potential
        payout ceiling (stake included, never netted - ADR 0083 §6.2.2),
        denominated in asset_code's minor units. brand_id omitted means
        tenant-wide (every brand); a brand-specific limit takes precedence
        over a tenant-wide one for the same (scope_kind, asset_code). At
        most one ACTIVE limit may exist per (tenant, brand, scope_kind,
        asset_code) - disable the existing one first to supersede it with
        a new ceiling (a limit is never edited in place).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid, description: "Omit for tenant-wide." }
                scope_kind: { type: string, enum: [event, market, selection] }
                asset_code: { type: string }
                max_open_potential_payout: { type: integer, format: int64, description: "Positive integer, asset_code's minor units, gross potential payout." }
                authorization_reference: { type: string, description: "Required on every row (ADR 0045 §4's authorization discipline)." }
                reason_code: { type: string }
              required: [scope_kind, asset_code, max_open_potential_payout, authorization_reference, reason_code]
      responses:
        "201":
          description: Exposure limit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookExposureLimit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An active exposure limit already exists for this (brand, scope_kind, asset_code)
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/sportsbook/exposure-limits/{id}/disable:
    post:
      summary: Disable an active exposure limit
      description: >
        Requires sportsbook_exposure_limit:manage. Never an edit or a
        delete - migration 0088's immutability/deny-delete triggers refuse
        both regardless, so max_open_potential_payout itself is immutable;
        changing a ceiling means authoring a new row. Only transitions an
        'active' row; reason_code REPLACES the row's own reason_code (the
        one other mutable field, alongside status).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "200":
          description: Exposure limit disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookExposureLimit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Casino round history / mock-provider play simulation (Stage 7) ---
  # NOTE: only the Stage 7 endpoints below are documented here. The
  # pre-existing Stage 4A casino endpoints (GET /v1/me/casino/games,
  # POST /v1/me/casino/games/{gameID}/launch, the admin catalogue/
  # capability/availability routes, and the provider webhook) predate
  # this OpenAPI file's casino coverage and are tracked as separate,
  # pre-existing documentation debt - not introduced by Stage 7.
  /v1/me/casino/rounds:
    get:
      summary: List the caller's own casino round history
      description: >
        Player-authenticated. A "round" is one casino_launch_sessions row
        enriched with whatever casino_bet/casino_win/casino_rollback
        ledger transactions were posted under it (internal/casino.
        RoundSummary) - amount fields are absent when that leg never
        happened. Runs under db.Pool.WithTenant with an explicit
        player_account_id filter, not RLS - ledger_transactions carries no
        player-scope policy (see internal/casino/history.go).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated round history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Round" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Casino is not enabled on this deployment
  /v1/me/casino/sessions/{sessionID}/wager:
    post:
      summary: Simulate a mock-provider bet for the caller's own launch session
      description: >
        Player-authenticated. There is no real, hosted casino-provider
        game client for this vertical slice, so this endpoint asks the
        tenant's own registered MockCasinoProvider to construct a
        correctly-signed bet callback payload for the caller's own
        session and feeds it through the exact same
        Orchestrator.ReceiveCallback pipeline the public provider webhook
        uses (casino_play_handlers.go) - never a shortcut around
        signature verification or the financial posting logic. Rejects a
        session that does not belong to the caller (404, indistinguishable
        from an unknown session id) or is not in 'real' mode (400).
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stake_amount: { type: integer, format: int64, description: "Minor units, must be positive" }
              required: [stake_amount]
      responses:
        "200":
          description: The simulated bet's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoPlayResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found (or does not belong to the caller)
        "503":
          description: Casino is not enabled on this deployment, or the session's provider is not the mock adapter
  /v1/me/casino/sessions/{sessionID}/win:
    post:
      summary: Simulate a mock-provider win for the caller's own launch session
      description: >
        Same mock-provider round-trip as the wager endpoint, for a win
        event. Amounts credit the platform ledger (never a client-supplied
        final balance) via the existing casino orchestrator.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                win_amount: { type: integer, format: int64, description: "Minor units, must be positive" }
              required: [win_amount]
      responses:
        "200":
          description: The simulated win's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoPlayResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found (or does not belong to the caller)
        "503":
          description: Casino is not enabled on this deployment, or the session's provider is not the mock adapter
  /v1/me/casino/sessions/{sessionID}/rollback:
    post:
      summary: Simulate a mock-provider rollback for the caller's own launch session
      description: >
        Reverses the named prior bet or win via the existing compensating-
        entry model (never a mutation of the original ledger entries). A
        second rollback of the same original_provider_tx_id is rejected
        with 409 (idempotent, never a double reversal).
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                original_provider_tx_id: { type: string, description: "The bet's or win's own provider_tx_id being reversed" }
              required: [original_provider_tx_id]
      responses:
        "200":
          description: The simulated rollback's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoPlayResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found (or does not belong to the caller)
        "409":
          description: The original transaction has already been rolled back
        "503":
          description: Casino is not enabled on this deployment, or the session's provider is not the mock adapter
  /v1/me/deposits/{id}/simulate-callback:
    post:
      summary: >-
        STAGING/NON-PRODUCTION TEST SUPPORT ONLY - simulate a mock-provider
        settlement callback for the caller's own, still-pending deposit
      description: >
        Never available in production (structurally gated by
        Deps.PaymentsMockSettlementEnabled, which cmd/platform-api/main.go
        sets only when BOTH `APP_ENV != "production"` AND
        `TEST_SUPPORT_ENDPOINTS_ENABLED=true` - Stage 9.4's two independent
        conditions, see `internal/config/config.go`'s `Environment`/
        `TestSupportEndpointsEnabled` doc comments - not merely documented
        as unsafe). Payments' equivalent of the casino play-simulation
        endpoints above: there is no real, hosted PSP to deliver a webhook
        against a live, HTTP-only staging process, so this endpoint asks
        the tenant's own registered MockProvider to construct a correctly-
        signed deposit-succeeded callback payload for the caller's own
        deposit intent and feeds it through the exact same
        Orchestrator.ReceiveCallback pipeline the public provider webhook
        (POST /v1/webhooks/payments/{tenantSlug}/{providerID}) uses - never
        a shortcut around signature verification or the financial posting
        logic. The amount, asset, and provider reference are always read
        from the caller's OWN deposit intent row, never accepted from this
        request's body. Rejects a deposit that does not belong to the
        caller (404, indistinguishable from an unknown deposit id), is not
        currently 'pending' (409 - already succeeded/declined/failed), or
        whose resolved provider is not concretely the mock adapter (503).
        Idempotent: the financial effect of settling a given deposit posts
        at most once even under concurrent or repeated calls.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: No fields are read from the body - every identifying/effect-bearing value comes from the deposit intent itself.
      responses:
        "200":
          description: The simulated deposit callback's outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit_intent_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, succeeded, declined, ambiguous, failed] }
                  tombstoned: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deposit not found (or does not belong to the caller)
        "409":
          description: The deposit is not currently awaiting a provider callback (already succeeded/declined/failed)
        "503":
          description: Deposits are not enabled on this deployment, or the deposit's resolved provider is not the mock adapter
  /v1/admin/casino/rounds:
    get:
      summary: Casino round queue, tenant-wide (Stage 7 Back Office visibility)
      description: >
        casino_transaction:read, tenant-scoped, tenant-wide (not restricted
        to one player) - mirrors GET /v1/admin/sportsbook/bets's identical
        shape and rationale. Not granted to platform_admin (no tenant
        context to scope to). Deliberately minimum-visibility, not a full
        casino operations console.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated tenant-wide round queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminRound" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Casino is not enabled on this deployment

  # --- Audit trail (read-only) ---
  /v1/admin/audit-log:
    get:
      summary: List audit log entries for the caller's tenant
      description: >
        Requires audit:read and a real tenant context. Entries are
        immutable (append-only, enforced by a database trigger - see
        docs/decisions/0013) and ordered newest first. Stage 5 (Operator
        Back Office MVP) added pagination and actor_type/action/outcome
        filters - the Stage 2 technical-debt "no pagination yet" item is
        now closed. Response shape CHANGED from a bare array (Stage 2) to
        the paginated envelope below. Scope is unchanged: this route only
        ever returns THIS tenant's own rows (tenant_id = caller's tenant);
        platform-scoped rows (tenant_id IS NULL, e.g. tenant.created,
        AssignTenantLicence) are never included here - see
        GET /v1/admin/platform/audit-log.
      security:
        - bearerAuth: []
      parameters:
        - name: actor_type
          in: query
          schema: { type: string, enum: [player, staff, system] }
        - name: action
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated audit log entries for the caller's tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/platform/audit-log:
    get:
      summary: List platform-scoped audit log entries (Stage 5)
      description: >
        audit:read, platform_admin only (403 for any tenant-scoped
        caller). Reads audit_log WHERE tenant_id IS NULL via
        db.Pool.WithPlatformAdmin - this is the only HTTP route that can
        read platform-scoped audit rows (e.g. tenant.created,
        AssignTenantLicence, operating-market ceiling/policy audit
        entries), which migration 0077's RLS hardening made otherwise
        unreachable over HTTP (see docs/governance/stage-4i-exit-register.md,
        MKT-AUDIT-1). Same filter/pagination params and response shape as
        the tenant-scoped audit-log route above.
      security:
        - bearerAuth: []
      parameters:
        - name: actor_type
          in: query
          schema: { type: string, enum: [player, staff, system] }
        - name: action
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated platform-scoped audit log entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 4F: email verification and password reset
  # (docs/decisions/0030) ---
  /v1/me/email-verification/request:
    post:
      summary: Request a new email-verification token for the caller's own account
      description: >
        Authenticated, self-service. Rate-limited to 3 requests/hour per
        account - in production, and in any deployment without test
        support explicitly enabled, a rate-limited request returns the
        SAME 204 as a successful one (never distinguishable). Any prior
        outstanding token of this purpose is superseded. Delivered via the
        configured EmailProvider (MockProvider in this stage - no
        production SMTP/API dependency).


        Note for the test-support configuration described below: when
        test support IS enabled, a rate-limited request still returns
        `204` (it issued no token, so there is nothing to return) while a
        successful one returns `200` with a token, so the two ARE
        distinguishable in that configuration. That is deliberate and
        confined to non-production deployments - the caller can only ever
        observe the rate-limit state of THEIR OWN account (this endpoint
        is authenticated and self-scoped), which they already know from
        their own request count. The production response shape, and its
        indistinguishability property, are unchanged.


        **Stage 9.4 conditional response shape** (replacing Stage 9.3's
        separate `GET /v1/me/email-verification/dev-token` route, which no
        longer exists): whether this endpoint returns `204` with no body
        or `200` with the raw token in the body depends ENTIRELY on the
        deployment's own server-side configuration
        (`Deps.AccountActivationTestSupportEnabled`, gated by BOTH
        `APP_ENV != "production"` AND `TEST_SUPPORT_ENDPOINTS_ENABLED=true`
        - see `internal/config/config.go`'s `Environment`/
        `TestSupportEndpointsEnabled` doc comments) - never by anything in
        the request. In production, and in any deployment that has not
        explicitly opted into test support, the response is `204` with no
        body, byte-for-byte identical to before Stage 9.4. In a
        staging/non-production deployment with test support explicitly
        enabled, the response is `200` with the raw token in the body -
        STAGING/NON-PRODUCTION TEST SUPPORT ONLY, never available in
        production. The token is only ever the CALLER's own newly-issued
        token (this endpoint is already scoped to the authenticated
        caller, so no new authorization surface is introduced), to be fed
        into the completely unmodified `POST /v1/auth/email-verification/
        confirm` below - token hashing, expiry, and single-use consumption
        are unaffected by this flag either way.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: >-
            Verification email sent, or silently rate-limited. This is the
            ONLY possible success response in production (or any
            deployment without test support explicitly enabled) - no body.
        "200":
          description: >-
            STAGING/NON-PRODUCTION TEST SUPPORT ONLY. Verification email
            "sent" (via the mock EmailProvider), with the caller's own
            newly-issued raw email-verification token also returned
            directly in this response body - never available in
            production. See this operation's own description above for
            the exact two-condition gate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                required: [token]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Email delivery is not configured
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email-verification/confirm:
    post:
      summary: Confirm an email-verification token
      description: >
        Unauthenticated (a player has no session to present at this
        point). One-time use, enforced by an atomic conditional UPDATE -
        never applies its side effect twice under concurrent replay. On
        success, stamps player_accounts.verified_at and transitions the
        account out of pending_verification to active if it is still in
        that exact state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "204":
          description: Email verified
        "400":
          description: Invalid, expired, or already-consumed token
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password-reset/request:
    post:
      summary: Request a password-reset token
      description: >
        Unauthenticated. ALWAYS returns 204 regardless of whether the
        email matches an account or is rate-limited (directive's
        anti-enumeration requirement - never reveals whether a specific
        email belongs to an account). An unknown brand_slug returns 404
        (a brand slug is a public identifier, unlike email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
              required: [brand_slug, email]
      responses:
        "204":
          description: If an account matched, a reset email was sent - identical response otherwise
        "404":
          description: Unknown brand
        "503":
          description: Email delivery is not configured
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password-reset/confirm:
    post:
      summary: Confirm a password-reset token and set a new password
      description: >
        Unauthenticated. One-time use (atomic conditional UPDATE,
        verified exactly-once under real concurrent replay). The new
        password is hashed (Argon2id) ONLY after the token is validated
        and consumed, closing an uncosted-hashing DoS surface found in
        specialist review. On success, revokes every session for the
        account (RevokeAllSessionsForPrincipal) - a completed reset forces
        re-authentication everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                new_password: { type: string }
              required: [token, new_password]
      responses:
        "204":
          description: Password reset - all sessions revoked
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 4F: player verification (KYC) and document management
  # (docs/decisions/0028/0029) ---
  /v1/me/kyc/verifications:
    post:
      summary: Start a new identity-verification attempt for the caller's own account
      description: >
        Authenticated, self-service. Calls the registered KYCProvider
        (MockKYCProvider only this stage - no real vendor is integrated)
        and creates a new kyc_verifications row. NOT_IMPLEMENTED for any
        production identity-verification vendor.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Verification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: >
            Identity verification is not configured - includes the KYC-WH-1
            (Stage 10.2, ADR 0091) production/test-support-off case: the
            platform ships no real KYC vendor, so with the MOCK provider
            gated off (cfg.TestSupportRoutesEnabled() == false), player
            self-service KYC is itself unavailable.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the caller's own verification attempts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/kyc/documents:
    post:
      summary: Upload an identity/verification document
      description: >
        Authenticated, self-service, multipart/form-data
        (verification_id, document_type, issuing_country [optional],
        file). Validated server-side (size, sniffed content-type - never
        the client's claimed Content-Type, extension consistency,
        filename sanitization) and malware-scanned (mock scanner, fails
        closed on a scan error) before storage. A reupload of the same
        document_type is a NEW, version-incremented row - never an
        overwrite; documents are immutable after upload except for the
        review fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                verification_id: { type: string, format: uuid }
                document_type:
                  type: string
                  enum: [passport, national_id, drivers_license, proof_of_address, selfie, other]
                issuing_country: { type: string }
                file: { type: string, format: binary }
              required: [verification_id, document_type, file]
      responses:
        "201":
          description: Document stored, pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Verification not found or not owned by the caller
        "503":
          description: Document upload is not configured
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the caller's own documents (every version)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documents, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/kyc/documents/{id}/content:
    get:
      summary: Download the caller's own document content
      description: >
        Every access, successful or not, is audited
        (kyc.document_accessed on success). A document owned by a
        DIFFERENT player account (even within the same tenant) returns
        404, never 403 - enforced at the application layer, not RLS (ADR
        0029 §4a).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Raw document bytes
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Player declared residence (Stage 4I Phase B, HDR-J-3b) ---
  #
  # Self-service only, mirroring /v1/me's own access pattern: no
  # RequirePermission, principal must be a player, subject taken from the
  # token only. A DECLARATION, never a verification - it does not by
  # itself establish jurisdiction (canonical-model §1.2, "evidence is
  # never a source"; HDR-J-2's precedence policy is not implemented in
  # this phase). No history is kept - a new declaration overwrites the
  # previous value outright (see the Stage 4I Phase B implementation
  # notes on erasability, HDR-J-3f).
  /v1/me/residence:
    get:
      summary: Get the caller's own declared residence
      description: >
        Authenticated, self-service. Returns is_set=false (no
        country_code/captured_at) when nothing has been declared yet.
        Not gated by the evidence-collection-active switch - turning
        collection off does not revoke read access to an
        already-declared value.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's declared residence, or is_set=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResidence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a player account
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Declare the caller's own residence (self-declared, unverified)
      description: >
        Refused with 403, writing nothing, when
        jurisdiction_evidence_collection_active is OFF for this
        tenant's declared_residence evidence type - the activation
        boundary is not optional and is never bypassed by a product
        flow. Overwrites any previously declared value.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMyResidenceRequest"
      responses:
        "200":
          description: Declared residence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResidence"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller is not a player account, or declared-residence
            collection is not active for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Responsible Gaming (pre-existing domain; this route was never
  # previously documented in this spec - documenting its full current
  # shape now, not only the Stage 5 addition, to close that gap) ---
  /v1/admin/rg/restrictions:
    get:
      summary: Get or list responsible-gaming restrictions/self-exclusions
      description: >
        rg_restriction:read, tenant-scoped. Two distinct response shapes
        depending on whether `player_account_id` is supplied:
        - Supplied: returns a bare (unpaginated) array of that player's
          restrictions - this is the ORIGINAL, pre-Stage-5 behavior,
          unchanged.
        - Omitted (Stage 5, Operator Back Office MVP addition): returns
          the paginated tenant-wide queue below. No `status` filter
          exists because player_restrictions has no stored status column
          (only the computed, point-in-time `active` field) - only
          `restriction_type` is filterable.
        Self-exclusion enforcement mechanics are unchanged either way -
        this route is visibility only.
      security:
        - bearerAuth: []
      parameters:
        - name: player_account_id
          in: query
          schema: { type: string, format: uuid }
        - name: restriction_type
          in: query
          description: Only used when player_account_id is omitted.
          schema: { type: string, enum: [self_exclusion] }
        - name: limit
          in: query
          description: Only used when player_account_id is omitted.
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          description: Only used when player_account_id is omitted.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: >
            A bare array of RGRestriction when player_account_id is
            supplied, or the paginated envelope when it is omitted.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/RGRestriction" }
                  - allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/RGRestriction" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown player_account_id (only when supplied)
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/cases:
    get:
      summary: KYC case queue - tenant-wide (Stage 5, Operator Back Office MVP)
      description: >
        verification:read, tenant-scoped. Unlike
        GET /v1/admin/kyc/verifications below (which requires an
        already-known player_account_id), this is the tenant-wide
        operational queue a compliance operator lands on. Existing
        review/decision endpoints are unchanged - this is additive
        read-only visibility.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [unverified, pending, review_required, approved, rejected, expired] }
        - name: player_account_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated KYC case queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/kyc/verifications:
    get:
      summary: List a player account's verification attempts (compliance/tenant admin)
      description: >
        Requires verification:read (compliance or tenant_admin,
        read-only for tenant_admin). Requires a real tenant context -
        scoped to the caller's own tenant only.
      security:
        - bearerAuth: []
      parameters:
        - name: player_account_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Verifications for the named player account, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Verification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/verifications/{id}/review:
    post:
      summary: Approve, reject, or flag a verification for further review
      description: >
        Requires verification:review (compliance only - never
        tenant_admin/platform_admin/finance, directive §19). Rejects with
        409 if the verification is already in a terminal status
        (approved/rejected/expired).


        Optionally records a KYC-verified residence determination in the
        SAME call (Stage 4I Phase B, HDR-J-3c) via
        verified_residence_country - omit the field entirely for a
        review that makes no residence determination. A determination
        can be attached to a non-terminal transition (e.g.
        review_required) and is overwritable by a later review call on
        the same verification; there is no separate clear/revoke
        operation. Refused with 403 or the whole call fails and nothing
        is written, including the status transition itself, when
        jurisdiction_evidence_collection_active is OFF for this
        tenant's verified_residence evidence type. The value is never
        returned on this or any other verification response - only
        presence/provenance are tracked internally
        (kyc_verifications.verified_residence_set_at/set_by) for a
        future phase's read surface.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
