  /v1/admin/tenants/{tenantID}/withdrawal-hold-resolutions:
    post:
      summary: Request a withdrawal hold-resolution
      description: >
        withdrawal_hold_resolution:request (platform_admin only), staff principals only.
        Four-eyes, platform-acting release of the hold of an `approved` withdrawal on a tenant or brand that is not active: the single kind release_hold_to_player moves the withdrawal approved -> rejected and returns the hold to the player's own cash wallet. No tenant role holds these permissions, so a tenant-scoped caller is refused 403 at the permission gate. There is no generic override route and nothing releases a hold without the counted approvals. Status per ADR 0111 section 16: IMPLEMENTED against the MOCK stack; the release dispatches nothing and calls no provider.
        Target tenant is the {tenantID} path value only; a body tenant_id is accepted and ignored. A tenant-scoped caller may name only its own tenant (otherwise 403,
        no data); a platform-scoped caller may name any tenant but acts only through a platform acting session, which the database refuses unless the caller holds an
        in-force capability grant for exactly that tenant. The route permission is only the first layer: the grant, the distinct-Person and beneficiary rules, the
        pinned payload and the approval recount are decided by the database inside the action's own transaction. The signed actor proof (ADR 0110) is produced
        server-side; the client supplies no proof header or field. A denied audit row is written for the 403 raised by the tenant check or by the
        service, and for every 409; generic gate refusals (not a staff principal, route permission missing), tenant-target
        validation failures, 400s and 404s write none. Error bodies carry the generic envelope code plus a fixed closed-token message where the
        responses below say so; no internal detail is returned.
        At execution the database re-checks the pinned preconditions; it ends `refused_at_execution` with a refusal_code of withdrawal_not_approved (the withdrawal is no longer `approved`), attempt_exists, tenant_brand_active_again or policy_disabled.
