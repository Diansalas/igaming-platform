  /v1/admin/tenants/{tenantID}/launch-authorisations/{requestID}/approve:
    post:
      summary: Approve a launch authorisation request
      description: >
        launch_authorisation:approve (platform_admin ONLY; every tenant role is refused 403 at the permission gate), staff principals only.
        The approver passes the readiness_hash it was shown (seen_readiness_hash); a stale hash records no approval (a denied audit row is written) (409 LAUNCH_STALE_READINESS). The requester and any account of the requester's Person
        are refused (409 LAUNCH_SELF_APPROVAL); a second decision by the same Person is 409 LAUNCH_ALREADY_DECIDED and changes no state (a denied audit row is written). When this approval is the final one required, the same transaction
        executes the request (executed=true); if execution is refused the approval is recorded and the response is 409 LAUNCH_REFUSED_AT_EXECUTION with the refusal code in check_codes
        (approvals_stale, readiness_changed_since_approval, readiness_changed_unacknowledged, or an H- code). Operator-fixable refusals (open sportsbook bets, hold-bearing withdrawals,
        a lock timeout) roll the execution back and leave the request pending. The signed actor proof is produced server-side. A body tenant_id is accepted and ignored.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requestID
          in: path
          required: true
          schema: { type: string, format: uuid }
