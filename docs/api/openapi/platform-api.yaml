  /v1/admin/tenants/{tenantID}/staff/{staffID}/person-link:
    post:
      summary: Link a tenant staff account to a Person
      description: >
        staff:manage (tenant_admin, platform_admin). Stage 3D remediation (ADR 0024): sets person_id only where none is set; an existing link can never be changed (database append-only trigger). A tenant-scoped caller may name only its own tenant (403). ADR 0119 S5 + S6 review fix SR-4: a link of one's own account is 403 self_target_forbidden; a tenant admin may link only accounts of the roles it may act on (403 role_not_grantable); the caller is re-asserted in the transaction (401 session_revoked); a Person already bound to another live account is refused for an approve-capable role (409). The link bumps the account's staff_version and ends its sessions. 400 when person_id is not a UUID or names no existing Person; 404 when the staff user is not in the tenant; 409 when it is already linked.
