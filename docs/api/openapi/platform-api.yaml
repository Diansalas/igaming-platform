        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
      required: [items, limit, offset, total]
    OperatingBasis:
      description: >
        An explicit operating basis version (migration 0180): which basis a tenant / brand relies on for a country and operation.
        A recorded business decision, not a legal position.
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid, nullable: true, description: "null = tenant-wide; a brand-specific row wins for that brand." }
        country_code: { type: string }
        operation_code: { type: string }
        product_code: { type: string, nullable: true }
        basis_kind: { type: string, enum: [platform_licence, partner_licence, no_licence_documented] }
        licence_id: { type: string, format: uuid, nullable: true, description: "Required for the two licence kinds." }
        jurisdiction_id: { type: string, format: uuid, nullable: true, description: "The jurisdiction whose regime a no_licence_documented basis relies on." }
        determination_reference: { type: string, description: "Opaque document id of the recorded determination." }
        determined_by_role: { type: string, description: "The responsible function, never a person's name." }
        basis_evidence_reference: { type: string, nullable: true, description: "Opaque evidence reference of the determination (the evidence_reference column; named distinctly because no schema documents a bare evidence_reference field, ADR 0114 S0)." }
        restrictions_note: { type: string, nullable: true }
        restricted_product_codes: { type: array, items: { type: string } }
        review_due_at: { type: string, format: date, nullable: true, description: "Required for no_licence_documented; the basis stops permitting the day after." }
        needs_rereview: { type: boolean }
        last_review_reference: { type: string, nullable: true }
        status: { type: string, enum: [active, withdrawn] }
        reason_code: { type: string }
        policy_version: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        change_request_id: { type: string, format: uuid, nullable: true, description: "The executed licensing change that created this version (null only for an owner-path row, never an approved basis)." }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        disclaimer: { type: string }
      required: [id, tenant_id, brand_id, country_code, operation_code, product_code, basis_kind, licence_id, jurisdiction_id,
                 determination_reference, determined_by_role, basis_evidence_reference, restrictions_note, restricted_product_codes,
                 review_due_at, needs_rereview, last_review_reference, status, reason_code, policy_version, effective_from,
                 effective_to, change_request_id, created_by, created_at, disclaimer]
    OperatingBasisDecision:
      type: object
