        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 }, description: Out-of-range values are clamped; non-numeric values fall back to the default. }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of platform actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformActionAuditPage" }
