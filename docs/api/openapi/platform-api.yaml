        licence: { $ref: "#/components/schemas/Licence" }
        change_kind: { type: string, enum: [widening, narrowing, neutral] }
        change_request_id: { type: string, format: uuid, description: "The executed licensing change (migration 0178). Omitted when absent." }
      required: [licence, change_kind]
    LicenceVersion:
      type: object
      properties:
        version_no: { type: integer, minimum: 1 }
        operation: { type: string, enum: [baseline, insert, update] }
        changed_at: { type: string, format: date-time }
        changed_by: { type: string, format: uuid, nullable: true }
        change_request_id: { type: string, format: uuid, nullable: true, description: "The executed licensing change that authorised the change (migration 0179); null for a baseline row and an owner-path write." }
        status: { type: string }
        issued_at: { type: string, format: date, nullable: true }
        expires_at: { type: string, format: date, nullable: true }
        review_due_at: { type: string, format: date, nullable: true }
        licence_evidence_reference: { type: string, nullable: true }
        licence_number: { type: string }
      required: [version_no, operation, changed_at, changed_by, change_request_id, status, issued_at, expires_at, review_due_at, licence_evidence_reference, licence_number]
    JurisdictionResolutionActive:
      type: object
      description: >
        One (tenant, operation_class) `jurisdiction_resolution_active` fact
        (Stage 4I item B-6) - a tenant-scoped, resolver-owned engineering
        precondition record, consumed read-only by Risk's future R-2b
        precondition (internal/jurisdiction.IsActive) in-process, never by
        any HTTP caller. Absent means inactive/fail-closed, never
        "unrestricted".
      properties:
        id: { type: string, format: uuid }
        operation_class:
          type: string
          enum: [play, catalogue_availability, bonus_issuance, bonus_conversion]
        active: { type: boolean }
      required: [id, operation_class, active]
    AssignTenantLicenceRequest:
      type: object
      description: >
        `licence_id` is a required JSON key with three meaningful states:
        the key absent is rejected with 400 ("licence_id is required; send
        null to unassign"); a JSON `null` unassigns the tenant's current
        licence; a UUID string assigns that licence (subject to the
        licence being `active` and its `licensee` matching the tenant's
        own `licensing_model`). Presence vs. absence of the key is itself
        significant, which is why the underlying Go type is
        `json.RawMessage` rather than a plain optional string.
      properties:
        licence_id:
          nullable: true
          type: string
          format: uuid
          description: Required key. Omit entirely -> 400. `null` -> unassign. UUID string -> assign.
        reason_code: { type: string }
      required: [licence_id, reason_code]
    LicensingChangeCreateRequest:
      type: object
      additionalProperties: false
      description: >
        A licensing / jurisdiction change. `payload` is per kind, every key required, unknown keys refused:
        licence_create {jurisdiction_id, licensee, licence_number, permitted_products, permitted_markets};
        tenant_licence_bind {tenant_id, licence_id}; tenant_licence_unbind {tenant_id};
        licence_ceiling_version {licence_id, country_code, state, status, authorization_reference};
        operating_policy_version {tenant_id, scope, brand_id, operation_code, product_code, country_code, state, status,
        authorization_reference}; tenant_jurisdiction_config_version {tenant_id, jurisdiction_id, action (set | close),
        kyc_ruleset_id, aml_ruleset_id, rg_ruleset_id, reporting_ruleset_id, allowed_currencies, allowed_payment_methods,
        geo_block_list} (for close every content field is null);
        operating_basis_set {tenant_id, brand_id, country_code, operation_code, product_code, basis_kind (platform_licence | partner_licence |
        no_licence_documented), licence_id, jurisdiction_id, determination_reference, determined_by_role, basis_evidence_reference,
        restrictions_note, restricted_product_codes, review_due_at}; operating_basis_withdraw {tenant_id, brand_id, country_code,
        operation_code, product_code}; operating_basis_review_record {tenant_id, brand_id, country_code, operation_code, product_code,
        review_due_at, needs_rereview, review_reference}. No legal value is implied by any field.
      properties:
        kind:
          type: string
          enum: [licence_create, tenant_licence_bind, tenant_licence_unbind, licence_ceiling_version, operating_policy_version, tenant_jurisdiction_config_version, licence_status_change, licence_validity_dates_change, licence_review_due_change, licence_evidence_reference_change, operating_basis_set, operating_basis_withdraw, operating_basis_review_record]
        payload:
          type: object
        reason_code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$"
        note:
          type: string
          maxLength: 1000
      required: [kind, payload, reason_code]
    WithdrawalRestrictionPolicyDisclaimer:
      type: string
