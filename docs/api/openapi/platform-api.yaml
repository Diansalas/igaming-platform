        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payments/kill-switches/{killSwitchID}/release-requests:
    post:
      summary: File a four-eyes release request for a payment kill switch (ADR 0095 §10.4)
      description: >
        Requires payments_kill_switch:release (platform_admin, tenant_admin).
        expected_version is read from the switch's own current row
        server-side, never accepted from the client. Refused (409) when the
        switch is not currently engaged, and when a tenant-scoped caller
        targets a platform-engaged switch (L5(a) - the database refuses the
        insert). Also 409 with code KILL_SWITCH_RELEASE_REQUEST_ALREADY_OPEN
        when the switch already has an open request (one-open unique index;
        a denied audit row is written; read open_release_request_id on the
        switch to find it). reason_code is 1 to 64 BYTES; otherwise 400.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentsKillSwitchTenantID"
        - $ref: "#/components/parameters/PaymentsKillSwitchID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentsKillSwitchReleaseRequestBody"
      responses:
        "201":
          description: The filed request (status open)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsKillSwitchReleaseRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payments/kill-switch-release-requests/{requestID}:
    get:
      summary: Get one payment kill-switch release request
      description: Requires payments_kill_switch:read (platform_admin, tenant_admin). A foreign tenant's id is 404, never data.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentsKillSwitchTenantID"
        - $ref: "#/components/parameters/PaymentsKillSwitchRequestID"
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsKillSwitchReleaseRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payments/kill-switch-release-requests/{requestID}/approve:
    post:
      summary: Approve and release a payment kill switch in one transaction (four-eyes, ADR 0095 §10.2.2 point 6)
      description: >
        Requires payments_kill_switch:release (platform_admin, tenant_admin).
        The approver must be a DIFFERENT principal from the requester
        (enforced by the database); self-approval is 409. Approval and the
        release UPDATE happen in the SAME database transaction, so an
        approval decided in an earlier transaction can never release
        separately.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentsKillSwitchTenantID"
        - $ref: "#/components/parameters/PaymentsKillSwitchRequestID"
      responses:
        "200":
          description: The switch after release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsKillSwitch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict - self-approval, a stale/expired/already-decided request, or a platform-lock violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payments/kill-switch-release-requests/{requestID}/cancel:
    post:
      summary: Cancel an open payment kill-switch release request
      description: Requires payments_kill_switch:release (platform_admin, tenant_admin). Refused (409) once the request has left the open status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentsKillSwitchTenantID"
        - $ref: "#/components/parameters/PaymentsKillSwitchRequestID"
      responses:
        "204":
          description: Cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- ALERT-DELIVERY-1 routing readiness (ADR 0102 section 18, migration 0117).
  # Platform scope only (tenant tokens get 403). Routing is configuration: no
  # channel that reaches a person exists, a log/mock route notifies nobody, and
  # readiness is always false today. ---
  /v1/admin/alerting/routes:
    post:
      summary: Create or supersede an alert route version (log/mock channels only)
      description: >
        Requires `alert:route_manage` (platform_admin only, separate from
        `alert:manage`) and a platform-scope token. A route is never edited in
        place: `supersedes_id` creates a new version and marks the old one
        superseded; a second current route for the same severity and step is
        409. A route is DISABLED unless `enabled` is true; enabling requires a
        `recipient_ref`, an opaque target id (no email, phone, address, URL or
        key-shaped value). The database refuses to enable a route for any
        channel kind that notifies a person (SR-7, four-eyes not built); in
        production a p1/p2 route on log/mock cannot be enabled. Every success
        and every refusal is audited; the recipient value is never audited.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [severity, channel_kind, reason_code]
              properties:
                severity: { type: string, enum: [p1, p2, p3] }
                escalation_step: { type: integer, minimum: 0, maximum: 9, default: 0 }
                channel_kind: { type: string, enum: [log, mock, email, webhook] }
                recipient_ref: { type: string, nullable: true }
                escalate_after_seconds: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 604800 }
                enabled: { type: boolean, default: false }
                reason_code: { type: string, enum: [initial_setup, on_call_change, escalation_change, correction, decommission, drill] }
                supersedes_id: { type: string, format: uuid, nullable: true }
                stage_for_enable:
                  type: boolean
                  default: false
                  description: >
                    SR-7 staging intent (migration 0156). Valid only with `enabled=false` on an email or webhook
                    route: marks the version as the staging record a DIFFERENT platform admin may approve by
                    superseding it with `enabled=true`. A route disabled for another reason (a decommission)
                    leaves it false and can never be used as an approval.
      responses:
        "201":
          description: The new route version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRoute" }
        "400":
          description: Validation refusal (audited as denied), including the SR-7 four-eyes guard
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant-scoped caller, or a platform caller without `alert:route_manage` (audited in the caller's own scope)
        "404":
          description: supersedes_id names no current platform route
        "409":
          description: A current route exists for this severity and step (supply supersedes_id), or supersedes_id names a different severity or step
        "500":
          description: Internal error (class only is logged; no detail)
    get:
      summary: List alert route versions (current, or all with include_superseded=true)
      security:
        - bearerAuth: []
      parameters:
        - name: include_superseded
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Route versions, each with `human_notification` (false for every kind that exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes: { type: array, items: { $ref: "#/components/schemas/AlertRoute" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant-scoped caller or missing `alert:route_manage`
        "500":
          description: Internal error
  /v1/admin/alerting/status:
    get:
      summary: Routing readiness per severity, with the exact missing operator input
      description: >
        Requires `alert:manage` and a platform-scope token. Readiness is computed
        over configuration only (never live delivery success); a stale or
        never-evaluated cache is NOT ready. A log or mock route never counts.
        Report-only: `/readyz` is unaffected.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "`ready`, `evaluated_at`, and per severity routes_configured, routes_enabled, human_notification_routes, ready, reason, missing_operator_input"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  evaluated_at: { type: string, format: date-time }
                  note: { type: string }
                  severities:
                    type: array
                    items:
                      type: object
                      properties:
                        severity: { type: string, enum: [p1, p2, p3] }
                        required_for_readiness: { type: boolean }
                        routes_configured: { type: integer }
                        routes_enabled: { type: integer }
                        human_notification_routes: { type: integer }
                        ready: { type: boolean }
                        reason: { type: string }
                        missing_operator_input: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant-scoped caller or missing `alert:manage`
        "500":
          description: Internal error
  /v1/admin/platform/status:
    get:
      summary: Platform operations status (build commit, migration head, database environment anchor)
      description: >
        F6 / SA-3. Requires `platform_status:read` (granted solely to `platform_admin`) and a platform-scope token; a
        tenant-scoped caller is refused 403. Step-up class none (a read). Returns three facts and nothing else: the
        running build's source commit (injected at link time, `unknown` when none is valid; never a branch, user or path),
        the highest applied migration version with the number of recorded versions (read by the runtime role from
        `schema_migrations`), and the `database_environment` anchor as a closed token (`production`, `staging`, `development`,
        `test`, `unrecorded` when no row exists, `unrecognised` for a value outside the set). It never returns a
        connection string, host, role, secret reference or tenant data. Like the other platform reads it writes a
        platform-scope audit row (`platform.status_read`, no subject tenant) before reading; if that cannot be
        written the read returns 500 and nothing.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant-scoped caller or missing `platform_status:read`
        "500":
          description: Internal error
  /v1/admin/alerts:
    get:
      summary: List platform alerts with their derived delivery state
      description: >
        Requires `alert:manage` and a platform-scope token. `delivery_state` is
        pending, retrying, unrouted (with `unrouted_reason`), delivery_failed,
        recorded_non_human or suppressed. `delivered` is reserved for a
        human-notification channel and does not occur today;
        `notified_a_person` is false for every non-human delivery.

        Paging (ADR 0114 S1b): the order is `first_seen_at` descending, ties broken by `id`
        descending. When more rows exist the response carries `next_cursor`; send it back
        unchanged as `cursor` (with the same `state`, `severity` and `kind`) to read the next
        page. The cursor is opaque, keyset based (alerts raised after the first page was
        served never shift or repeat a later page) and is NOT a credential. A malformed,
        tampered, oversized or foreign-filter cursor is refused with 400 and nothing is
        returned. `next_cursor` is null on the last page. Only the canonical spelling of a
        cursor is accepted, `state`, `severity`, `kind`, `limit` and `cursor` may each be given
        at most once, and `limit` is a canonical decimal (no sign, no leading zero).
      security:
        - bearerAuth: []
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, acked, resolved] } }
        - { name: severity, in: query, schema: { type: string, enum: [p1, p2, p3] } }
        - { name: kind, in: query, description: "A known alert kind; an unknown value is a 400.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: "The `next_cursor` of the previous page.", schema: { type: string, maxLength: 400 } }
      responses:
        "200":
          description: Alerts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [alerts, next_cursor]
                properties:
                  alerts:
                    type: array
                    items: { $ref: "#/components/schemas/PlatformAlert" }
                  next_cursor: { type: string, nullable: true }
        "400":
          description: Invalid filter, limit or cursor
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Tenant-scoped caller or missing `alert:manage`
        "500":
          description: Internal error
  /v1/admin/alerts/{alertID}:
    get:
      summary: Read one platform alert (ADR 0114 S1b)
      description: >
        Requires `alert:manage` and a platform-scope token; the same item shape as the list.
        A tenant-scoped caller gets 403 and an unknown id (or an id that is not a
        platform-owned alert) gets 404. The id must be the canonical lowercase UUID form
        (any other spelling is a 400).
      security:
        - bearerAuth: []
      parameters:
        - { name: alertID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The alert
          content:
            application/json:
              schema:
                type: object
                required: [alert]
                properties:
                  alert: { $ref: "#/components/schemas/PlatformAlert" }
        "400": { description: Malformed alert id }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Tenant-scoped caller or missing `alert:manage` }
        "404": { description: No such platform alert }
        "500": { description: Internal error }
  /v1/admin/alerts/{alertID}/ack:
    post:
      summary: Acknowledge a platform alert (optional audited reason_code)
      description: >
        Requires `alert:manage` and a platform-scope token. The body is optional;
        `reason_code` (lowercase token, at most 64 characters) is recorded in the audit
        metadata only. Permission, scope, body-validation (reason_code) and state
        (404/409) refusals are audited in the caller's own scope; the audit target is the
        parsed alert id or the marker `invalid_id`, never the raw path. A malformed alert
        id from an authorized platform caller is rejected with 400 and writes no audit row.
      security:
        - bearerAuth: []
      parameters:
        - { name: alertID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason_code: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,63}$" }
      responses:
        "200": { description: The alert after the transition }
        "400": { description: Invalid alert id or reason_code }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Tenant-scoped caller or missing `alert:manage` }
        "404": { description: No such platform alert }
        "409": { description: The alert is not open }
        "500": { description: Internal error }
  /v1/admin/alerts/{alertID}/resolve:
    post:
      summary: Resolve a platform alert (reason_code required)
      security:
        - bearerAuth: []
      parameters:
        - { name: alertID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                reason_code: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,63}$" }
      responses:
        "200": { description: The alert after the transition }
        "400": { description: Invalid alert id, body or reason_code }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Tenant-scoped caller or missing `alert:manage` }
        "404": { description: No such platform alert }
        "409": { description: The alert is already resolved }
        "500": { description: Internal error }

  # --- A10a: four existing admin configuration routes that the back office already calls but this document did not
  # list (found by backoffice/src/api/openapiContract.test.ts). Documentation only: the routes and handlers exist
  # (internal/httpserver/casino_routes.go, financial_routes.go). Shapes mirror the handler request structs. ---
  /v1/admin/casino/games:
    put:
      summary: Upsert a platform casino catalogue game (platform_admin)
      description: >
        Requires casino_catalogue:manage (platform_admin only; not tenant-scoped). Step-up none. Creates or updates one
        game in the platform-wide catalogue. Adding a jurisdiction_blocklist code or disabling a game is single-actor;
        the two widening transitions go through the four-eyes change-request routes. Status defaults to active.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertCasinoGameRequest" }
      responses:
        "200":
          description: The game after the upsert
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            The change is refused because it needs four-eyes approval (a jurisdiction_blocklist code removal, or a
            disabled-to-active transition, without an approved change request) or conflicts with an existing change
            request. Nothing was written; use the change-request routes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/casino/providers/{providerID}/capability:
    put:
      summary: Write the tenant's casino provider routing capability (narrowing only)
      description: >
        Requires casino_config:write on a tenant-scoped token (tenant_admin). Step-up critical. The configuration can only
        narrow what the provider adapter declares; a widening attempt is 400. The tenant comes from the token.
      security:
        - bearerAuth: []
      parameters:
        - { name: providerID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteCasinoCapabilityRequest" }
      responses:
        "200":
          description: The capability row id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            Either `step_up_required` (fresh second factor needed: see the StepUpRequired response; re-send once) or plain
            `forbidden` (the caller lacks the permission, or the token is not tenant-scoped). The `code` field tells them
            apart; nothing was written in either case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/casino/games/{gameID}/availability:
    put:
      summary: Opt the tenant in or out of one platform catalogue game
      description: >
        Requires casino_config:write on a tenant-scoped token (tenant_admin). Step-up none. Toggles enablement of a title
        the platform catalogue already contains; never registers a game or widens a platform-level block.
      security:
        - bearerAuth: []
      parameters:
        - { name: gameID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                  default: false
                  description: >
                    The server decodes into a plain boolean, so an omitted `enabled` is treated as false (the game is
                    DISABLED for the tenant). Clients should always send it explicitly.
      responses:
        "200":
          description: The resulting availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_id: { type: string }
                  enabled: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/providers/{providerID}/capability:
    put:
      summary: Write the tenant's payment provider routing capability (narrowing only)
      description: >
        Requires provider_config:write on a tenant-scoped token (tenant_admin). Step-up critical. The configuration can
        only narrow what the adapter declares; a request that asks for anything outside the adapter's declared manifest
        (a payment method, currency, asset, country, capability or amount range) is refused 400 and nothing is written.
        It is never silently reduced. On 200 the response states the EFFECTIVE stored configuration, read back inside the
        same transaction as the write (SA-5), and `narrowed` is true if that differs from the request. Amounts are
        integer minor units.
      security:
        - bearerAuth: []
      parameters:
        - { name: providerID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteProviderCapabilityRequest" }
      responses:
        "200":
          description: The capability row id and the effective stored configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteProviderCapabilityResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            Either `step_up_required` (fresh second factor needed: see the StepUpRequired response; re-send once) or plain
            `forbidden` (the caller lacks the permission, or the token is not tenant-scoped). The `code` field tells them
            apart; nothing was written in either case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  parameters:
    StaffIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        A10c (ADR 0114 G10). OPTIONAL on the K1 / K3 / HSEC staff mutating routes. 1-120 printable ASCII characters, chosen by the client
        (otherwise 400). Scoped to (path tenant, acting staff, key). The same key with the same request (method, path, query and raw body)
        is answered with the stored 2xx STATUS and a fixed body `{"status":"already_applied"}` (no body for 204) plus
        `Idempotent-Replayed: true`, without acting again; the response body of the first call is NOT stored (it may carry acting-session-only
        governed data), so the client re-reads the resource through the governed read routes. The same key with a different request is
        409 IDEMPOTENCY_MISMATCH; the same key while the first request is still running is 409 IDEMPOTENCY_IN_PROGRESS. A non-2xx outcome
        stores nothing, so the client may retry with the same key. A stored key is kept for 24 hours; an unfinished one (a crash) is
        reclaimable after 15 minutes. The key grants no authority: step-up, session liveness, permissions and the flow's own database guards
        still decide first. A replay does NOT re-run the handler's in-handler authority (capability grant, acting session, Person checks): a
        staff member whose grant was revoked after the original request still receives the "already applied" status for that key within
        the 24 hour window; nothing is acted on and no data is returned. Without the header the route behaves as before (idempotent by
        state: a replayed governed write is a 409).
      schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[\\x20-\\x7e]{1,120}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        1-120 printable ASCII characters, chosen by the client. The same key with the same request replays the stored result
        (Idempotent-Replayed: true); the same key with a different request is 409 RG_IDEMPOTENCY_MISMATCH.
      schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[\\x21-\\x7e]{1,120}$" }
    ProviderCredentialTenantID:
      name: tenantID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderCredentialRequestID:
      name: requestID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentsKillSwitchTenantID:
      name: tenantID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentsKillSwitchID:
      name: killSwitchID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentsKillSwitchRequestID:
      name: requestID
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    NoStore:
      description: "no-store (with Pragma: no-cache): the body carries a secret, a token or a one-time code and must never be cached"
      schema:
        type: string
        enum: [no-store]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HMAC-signed (HS256) JWTs, verified against a key registry keyed
        by the token's own `kid` header claim - this is what allows an
        old and a new signing key to be valid simultaneously during
        rotation (see internal/auth/keys.go). Tokens also carry a
        possibly-nil tenant_id claim: platform_admin tokens are
        legitimately platform-scoped (see docs/decisions/0011) - routes
        that require a real tenant reject a nil one via the
        RequireTenantScope middleware, not at token-verification time.


        ADR 0119 S4a (staff route chain): every /v1/admin/ route and every
        /v1/staff/me/ route runs bearer verification, the staff-principal
        check (a player or service token is 403 before any database work),
        a per-request LIVENESS check and an aal2 check before the route's
        own permission gate. Liveness answers 401 with code
        `session_revoked` (one answer for every cause: the session behind
        the token was revoked, logged out or is past its 12 h absolute
        lifetime; the staff member is no longer active; the role or staff
        version changed; the second factor was revoked or hard-locked) and
        503 `service_unavailable` when the check cannot run (fail closed).
        A client answers `session_revoked` by signing in again. A staff
        token without aal2 assurance claims, or with a role outside the
        closed staff role set, is 401 `unauthorized`.


        ADR 0119 S4b (step-up): every staff route has a step-up class
        (none / financial / critical, or a named per-request classifier;
        internal/httpserver/staff_route_golden_test.go). A route of class
        financial (default 600 s) or critical (default 300 s) answers 403
        `step_up_required` with `max_age` (seconds) and the RFC 9470 header
        `WWW-Authenticate: Bearer error="insufficient_user_authentication",
        max_age="N"` when the caller's last second-factor verification (the
        older of the token's mfa_at and the sealed session row's) is older
        than the class allows; nothing was written. The step-up gate runs
        BEFORE the route's own permission gate. Obtain a fresh token at
        POST /v1/staff/auth/step-up and re-send the request once. A
        withdrawal approval under a policy with require_step_up needs a
        step-up within 120 s (same 403, max_age 120).
        This remains PROVIDER DEPENDENT / foundation-only for Stage 2 -
        see docs/architecture/05-identity-architecture.md.
  schemas:
    UpsertCasinoGameRequest:
      type: object
      additionalProperties: false
      properties:
        provider_id: { type: string }
        provider_game_id: { type: string }
        name: { type: string }
        game_type: { type: string }
        rtp_variant: { type: string }
        volatility: { type: string }
        feature_flags: { type: array, items: { type: string } }
        supported_assets: { type: array, items: { type: string } }
        mobile_supported: { type: boolean }
        demo_supported: { type: boolean }
        jurisdiction_blocklist: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled], description: Defaults to active }
      required: [provider_id, provider_game_id, name, game_type]
    WriteCasinoCapabilityRequest:
      type: object
      additionalProperties: false
      properties:
        supports_catalogue: { type: boolean }
        supports_launch: { type: boolean }
        supports_balance: { type: boolean }
        supports_bet: { type: boolean }
        supports_win: { type: boolean }
        supports_rollback: { type: boolean }
        supported_assets: { type: array, items: { type: string } }
        supported_game_types: { type: array, items: { type: string } }
        priority: { type: integer }
        status: { type: string, enum: [active, disabled] }
      required: [status]
    WriteProviderCapabilityRequest:
      type: object
      additionalProperties: false
      properties:
        supported_fiat_currencies: { type: array, items: { type: string } }
        supported_crypto_assets: { type: array, items: { type: string } }
        supported_payment_methods: { type: array, items: { type: string } }
        supported_countries: { type: array, items: { type: string } }
        supports_deposit: { type: boolean }
        supports_withdrawal: { type: boolean }
        supports_refund_reversal: { type: boolean }
        amount_limits:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              asset_code: { type: string }
              min_amount: { type: integer, format: int64, description: Integer minor units }
              max_amount: { type: integer, format: int64, description: Integer minor units }
        priority: { type: integer }
        status: { type: string, enum: [active, disabled] }
      required: [status]
    WriteProviderCapabilityResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        effective:
          type: object
          description: The configuration as stored (same shape as the request, every list present).
          properties:
            supported_fiat_currencies: { type: array, items: { type: string } }
            supported_crypto_assets: { type: array, items: { type: string } }
            supported_payment_methods: { type: array, items: { type: string } }
            supported_countries: { type: array, items: { type: string } }
            supports_deposit: { type: boolean }
            supports_withdrawal: { type: boolean }
            supports_refund_reversal: { type: boolean }
            amount_limits:
              type: array
              items:
                type: object
                properties:
                  asset_code: { type: string }
                  min_amount: { type: integer, format: int64 }
                  max_amount: { type: integer, format: int64 }
            priority: { type: integer }
            status: { type: string, enum: [active, disabled] }
          required: [supported_fiat_currencies, supported_crypto_assets, supported_payment_methods, supported_countries, supports_deposit, supports_withdrawal, supports_refund_reversal, amount_limits, priority, status]
        narrowed:
          type: boolean
          description: True if the stored configuration differs from the request. A request outside the adapter's manifest is a 400, so this is false on every 200 today.
      required: [id, effective, narrowed]
    PlatformAlert:
      type: object
      description: >
        A platform-owned durable alert (ADR 0102). `acked_by` and `resolved_by` are the staff
        ids of the PLATFORM administrators who acted (forced from the validated session by the
        database guard); they pass through the ADR 0114 S0 staff-identity helper, so a viewer
        who may not see a platform actor would receive null. The route is platform-scope only
        today, so a tenant caller is refused (403) before any DTO is built.
        `escalation_step`, `delivery_channel_kind` and `attempt_no` describe the latest
        delivery event and are absent when the alert has no delivery event yet.
        `acked_at`/`acked_by` are set by an ack, or by a resolve of an open alert;
        `resolved_at`/`resolved_by` by a resolve. All four are absent while unset.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        severity: { type: string, enum: [p1, p2, p3] }
        state: { type: string, enum: [open, acked, resolved] }
        subject_tenant_id: { type: string, format: uuid, nullable: true }
        first_seen_at: { type: string, format: date-time }
        acked_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        acked_by: { type: string, format: uuid, nullable: true }
        resolved_by: { type: string, format: uuid, nullable: true }
        delivery_state: { type: string, enum: [pending, retrying, unrouted, delivery_failed, suppressed, recorded_non_human, delivered] }
        unrouted_reason: { type: string, enum: [no_route, channel_disabled, no_sink], nullable: true }
        notified_a_person: { type: boolean }
        escalation_step: { type: integer, minimum: 0, maximum: 9 }
        delivery_channel_kind: { type: string, description: "Channel kind of the latest delivery event (log, mock, or a future human channel kind)." }
        attempt_no: { type: integer, minimum: 1 }
    AlertRoute:
      type: object
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [p1, p2, p3] }
        escalation_step: { type: integer }
        channel_kind: { type: string, enum: [log, mock] }
        recipient_ref: { type: string, nullable: true }
        escalate_after_seconds: { type: number, nullable: true }
        enabled: { type: boolean }
        reason_code: { type: string, nullable: true }
        human_notification: { type: boolean, description: "false for every kind that exists" }
        effective_from: { type: string, format: date-time }
        superseded_at: { type: string, format: date-time, nullable: true }
        superseded_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    PaymentsMockCallback:
      type: object
      description: >
        The MOCK payments adapter's own wire shape (platform-invented, not
        modeled on any real vendor - PAY-WH-TENANT-1). The signature
        covers these RAW BODY BYTES, never a re-serialization, so field
        order/whitespace are significant to verification even though not
        semantically. There is deliberately no "signature" field in the
        body (moved to the X-Payments-Signature header) - a body that
        still carries one is rejected.
      properties:
        event_type: { type: string, enum: [deposit, deposit_reversal] }
        provider_reference:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Provider reference bound (PROVIDER-REF-BOUND-1): 1..255 BYTES
            (not characters) of valid UTF-8 with no control character
            (U+0000-U+001F, U+007F-U+009F). Applies to every provider
            reference in this body. A verified callback that breaks it is a
            deterministic, non-retryable 400; the reference is never
            truncated.
            Note: JSON Schema maxLength counts characters (code
            points), so maxLength: 255 is only an upper bound; the
            server enforces 255 BYTES, and a 255-character multibyte
            value that passes schema validation can still be rejected.
        original_provider_reference:
          type: string
          maxLength: 255
          description: Set only for event_type=deposit_reversal - the reference of the deposit being reversed. Same 255-byte bound.
        outcome: { type: string, enum: [succeeded, declined, ambiguous, pending] }
        amount:
          type: integer
          format: int64
          description: Minor units at the asset's own exponent - never a float.
        asset_code: { type: string, maxLength: 255 }
        decline_reason: { type: string }
        cascadable: { type: boolean }
      required: [event_type, provider_reference, outcome, amount, asset_code]
