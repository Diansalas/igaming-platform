  /v1/admin/kyc/documents/{id}/content:
    get:
      summary: Download a document's content (compliance/tenant admin)
      description: Requires verification:read. Every access is audited (kyc.document_accessed).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
