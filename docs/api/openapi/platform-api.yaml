  # --- Audit trail (read-only) ---
  /v1/admin/audit-log:
    get:
      summary: List audit log entries for the caller's tenant
      description: >
        Requires audit:read and a real tenant context. Entries are
        immutable (append-only, enforced by a database trigger - see
        docs/decisions/0013) and ordered newest first. Stage 5 (Operator
        Back Office MVP) added pagination and actor_type/action/outcome
        filters - the Stage 2 technical-debt "no pagination yet" item is
        now closed. Response shape CHANGED from a bare array (Stage 2) to
        the paginated envelope below. Scope is unchanged: this route only
        ever returns THIS tenant's own rows (tenant_id = caller's tenant);
        platform-scoped rows (tenant_id IS NULL, e.g. tenant.created,
        AssignTenantLicence) are never included here - see
        GET /v1/admin/platform/audit-log.
      security:
        - bearerAuth: []
      parameters:
        - name: actor_type
          in: query
          schema: { type: string, enum: [player, staff, system] }
        - name: action
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated audit log entries for the caller's tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/platform/audit-log:
    get:
      summary: List platform-scoped audit log entries (Stage 5)
      description: >
        audit:read, platform_admin only (403 for any tenant-scoped
        caller). Reads audit_log WHERE tenant_id IS NULL via
        db.Pool.WithPlatformAdmin - this is the only HTTP route that can
        read platform-scoped audit rows (e.g. tenant.created,
        AssignTenantLicence, operating-market ceiling/policy audit
        entries), which migration 0077's RLS hardening made otherwise
        unreachable over HTTP (see docs/governance/stage-4i-exit-register.md,
        MKT-AUDIT-1). Same filter/pagination params and response shape as
        the tenant-scoped audit-log route above.
