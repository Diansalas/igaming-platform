        scope: { type: string, enum: [all_value_movement, withdrawal_and_payout] }
        reason_class: { type: string, enum: [manual, confirmed_sanctions], description: "confirmed_sanctions requires scope all_value_movement" }
        reason_code: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
    AmlOpenCaseRequest:
      type: object
      additionalProperties: false
      required: [person_id, kind, reason_code]
      properties:
        person_id: { type: string, format: uuid }
        kind: { type: string, enum: [manual, alert] }
        reason_code: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
        alert_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
    AmlTransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_seq, to, reason_code]
      properties:
        expected_seq: { type: integer, minimum: 1 }
        to: { type: string, enum: [in_review, escalated, sar_decision_pending, closed_no_action] }
        reason_code: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
    AmlNoteRequest:
      type: object
      additionalProperties: false
      required: [expected_seq, body]
      properties:
        expected_seq: { type: integer, minimum: 1 }
        body: { type: string, description: "Linted server-side; no card numbers, IBANs, e-mail, phone numbers or document-shaped tokens" }
    AmlProposeRequest:
      type: object
      additionalProperties: false
      required: [expected_seq, kind, reason_code]
      properties:
        expected_seq: { type: integer, minimum: 1 }
        kind: { type: string, enum: [close_sar_not_filed, close_sar_filed, lift_hold] }
        hold_id: { type: string, format: uuid, description: "Required for lift_hold, absent otherwise" }
        external_filing_reference: { type: string, description: "Required for close_sar_filed (human-entered, linted), absent otherwise" }
        reason_code: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
    AmlApproveRequest:
      type: object
      additionalProperties: false
      required: [proposal_seq, content_hash, reason_code]
      properties:
        proposal_seq: { type: integer, minimum: 2 }
        content_hash: { type: string, minLength: 64, maxLength: 64 }
        reason_code: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
    LaunchTransitionList:
      type: object
      properties:
        disclaimer: { $ref: "#/components/schemas/LaunchDisclaimer" }
