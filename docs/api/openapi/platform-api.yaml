        scope: { type: string, enum: [tenant, brand, operation] }
        brand_id: { type: string, format: uuid, nullable: true }
        operation_code: { type: string, nullable: true }
        product_code: { type: string, nullable: true }
        country_code: { type: string }
        state: { type: string, enum: [enabled, disabled] }
        status: { type: string, enum: [active, withdrawn] }
        authorization_reference: { type: string, nullable: true }
        reason_code: { type: string }
        policy_version: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        created_by_actor_type: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, tenant_id, scope, brand_id, operation_code, product_code, country_code, state, status, authorization_reference, reason_code, policy_version, effective_from, effective_to, created_by_actor_type, created_by, created_at]
    OperatingCountryPolicyPage:
      type: object
