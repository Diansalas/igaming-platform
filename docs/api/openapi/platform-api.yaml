  /v1/admin/tenants/{tenantID}/payments/kill-switches:
    get:
      summary: List the tenant's payment kill switches (PRH-I1, ADR 0095 §10.5)
      description: >
        Requires payments_kill_switch:read (platform_admin, tenant_admin).
        The tenant comes from the path only (canActOnTenant: a tenant-scoped
        caller may name only its own tenant; a platform-scoped caller may
        name any tenant). Includes platform-engaged rows, read-only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentsKillSwitchTenantID"
      responses:
        "200":
          description: The tenant's kill switches
          content:
            application/json:
              schema:
                type: object
                properties:
                  kill_switches:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentsKillSwitch"
                required: [kill_switches]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Engage a payment kill switch (single-actor, ADR 0095 §10.4)
      description: >
        Requires payments_kill_switch:engage (platform_admin, tenant_admin).
        Idempotent on (tenant, provider_scope, operation_scope): engaging an
        already-engaged switch re-engages it: the reason_code is overwritten,
        version is bumped, engaged_by_scope becomes the caller's scope, and
        an open release request is NOT cancelled by a same-scope re-engage (it
        stays open but its expected_version is now stale, so approval is
        refused). Only a PLATFORM engage of a switch that is not already
        platform-engaged cancels the open request (KS-L6, migration 0106). A
        tenant caller re-engaging a platform-engaged switch is refused 409.
        A platform-scoped caller's engage is forced to engaged_by_scope=platform
        by the database, never asserted by this request. reason_code is 1 to
        64 BYTES (not characters), non-blank, with no control characters (NUL included)
        and valid UTF-8; anything else is 400 before any transaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentsKillSwitchTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentsKillSwitchEngageRequest"
      responses:
        "200":
          description: The switch after engage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsKillSwitch"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payments/kill-switches/{killSwitchID}:
    get:
      summary: Get one payment kill switch
      description: Requires payments_kill_switch:read (platform_admin, tenant_admin). A foreign tenant's id is 404, never data.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentsKillSwitchTenantID"
        - $ref: "#/components/parameters/PaymentsKillSwitchID"
      responses:
        "200":
          description: The switch
          content:
            application/json:
              schema:
