  /v1/admin/kyc/documents:
    get:
      summary: List a player account's documents (compliance/tenant admin)
      description: Requires verification:read. Tenant-scoped only - see ADR 0029 §4 for why this never exposes a platform-wide Person's documents to an arbitrary tenant.
      security:
