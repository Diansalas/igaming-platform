        "404":
          description: Unknown tenantID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/LicensingChangeConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LicensingChangeUnavailable"

  # --- Licensing / jurisdiction change requests (migration 0177, MKT-DUAL-1) ---
  #
  # The generic two-person approval primitive for licensing and jurisdiction configuration writes. Kinds (closed):
  # licence_create, tenant_licence_bind, tenant_licence_unbind, licence_ceiling_version, operating_policy_version,
  # tenant_jurisdiction_config_version, and (migration 0178) licence_status_change, licence_validity_dates_change,
  # licence_review_due_change, licence_evidence_reference_change (the licence lifecycle writes), and (migration 0180) operating_basis_set (always widening), operating_basis_withdraw (always narrowing), operating_basis_review_record (widening iff the review date moves later or needs_rereview is cleared). The DATABASE classifies each change: WIDENING (open / enable / bind / create)
  # needs 2 approvals by distinct Persons, neither the requester's, each at most 24 h old at execution, by ACTIVE
  # platform_admin staff (interim answer to HDR-M-1); NARROWING (close / disable / unbind / narrow) filed by a
  # platform_admin executes in the same transaction (single actor with a reason code); narrowing filed by tenant staff
  # needs one platform approval. Every request, approval, reject, cancel and execution carries a signed actor proof
  # (ADR 0110). Not a legal or regulatory authorisation.
  /v1/admin/licensing-changes:
    post:
      summary: File a licensing / jurisdiction change (licensing_change:request)
      description: >
        Requires licensing_change:request. platform_admin files any kind (plus the kind's own permission:
        jurisdiction_registry:manage for licence_create, tenant_licence:assign for bind / unbind,
        operating_market_ceiling:manage for licence_ceiling_version and the operating_basis_* kinds); tenant_admin and compliance file
        operating_policy_version (compliance for the tenant rung, tenant_admin for the brand / operation rungs) and
        compliance tenant_jurisdiction_config_version, for their OWN tenant only (another tenant's id is a 404). The
        payload shape is per kind (see LicensingChangeCreateRequest); unknown fields are refused. A narrowing change filed
        by a platform_admin is executed in the same call (201 with executed true). An identical open request is 409
        LICENSING_CHANGE_DUPLICATE_PENDING. Step-up: critical. No actor-proof issuer: 500, nothing written.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicensingChangeCreateRequest"
      responses:
        "201":
          description: The change request (executed true when a single-actor narrowing change executed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensingChangeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LicensingChangeForbidden"
        "404":
          description: The payload names a tenant the caller cannot act on, or an unknown tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/LicensingChangeConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LicensingChangeUnavailable"
    get:
      summary: List licensing change requests (licensing_change:read)
      description: >
        Requires licensing_change:read. A platform_admin sees every request; tenant staff see the requests about their
        own tenant only (row-level security on subject_tenant_id). A tenant caller never sees a platform actor's staff
        id (ADR 0114 H1: null). Newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [requested, approved, executed, rejected, cancelled, expired] }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: The requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensingChangeListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LicensingChangeForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LicensingChangeUnavailable"
  /v1/admin/licensing-changes/{changeID}:
    get:
      summary: Read one licensing change request with its approvals (licensing_change:read)
      description: >
        Requires licensing_change:read. A tenant caller reads only requests about its own tenant; anything else is 404.
      security:
        - bearerAuth: []
      parameters:
        - name: changeID
          in: path
