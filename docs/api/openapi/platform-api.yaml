        withdrawal:review, tenant-scoped (a platform-scoped token is 403).
        Held by the finance role. SIDE EFFECT: before reading, every
        `requested` withdrawal in the tenant is promoted to `pending_review`,
        which closes the player's cancel window; use
        GET /v1/admin/withdrawals/history for a side-effect-free read. Returns
