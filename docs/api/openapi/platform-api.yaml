        - name: status
          in: query
          schema: { type: string, enum: [issued, activated, in_progress, pending_settlement, completed, converted, expired, cancelled, forfeited, reversed] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated grant list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BonusGrant" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/bonus/change-requests:
    get:
      summary: Bonus change-request approval queue (Stage 5, Operator Back Office MVP)
      description: >
        bonus:read, tenant-scoped. Defaults to status=pending when no
