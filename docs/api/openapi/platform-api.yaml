        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawal-policies/{id}:
    delete:
      summary: Delete a (mistaken) withdrawal approval policy row
      description: >
        withdrawal_policy:write, tenant-scoped (tenant_admin only). The
        reason_code query parameter is required and is recorded, with the
