  /v1/admin/launch-authorisations:
    get:
      summary: Platform-wide launch authorisation queue (platform staff only)
      description: >
        launch_authorisation:read, platform-scoped staff principals only (a tenant-scoped caller is refused 403). Requests across every tenant for the approval queue,
        ordered by (created_at, id) DESCENDING with a keyset cursor: `next_cursor` of a page is passed back as `cursor` for the next page and is null on the last page.
        A request inserted while a walk is in progress sorts before the first page, so it does not shift or duplicate a row of a later page. Residual: `created_at` is the database
        transaction start time, so a transaction that stays open across a page boundary and commits later with an older `created_at` than the cursor can be missed by a walk
        already past it; re-read the queue from the first page for a complete view. `limit` is 1..200, default 50 (before 2026-10-11 the queue accepted up to 500: 201..500 is now 400);
        a malformed `cursor` or an out-of-range `limit` is 400. Each row carries `tenant_name` and `brand_name` (display only) and, for THE CALLER,
        `can_approve` and a `cannot_approve_reason` from a closed catalogue; the reason is a code, never the name of another staff member. The answer is advisory: the
        decision routes and the database (LA012) remain authoritative.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: The opaque `next_cursor` of the previous page.
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: One page of the requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchQueueList" }
        "400":
          $ref: "#/components/responses/LaunchBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LaunchForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LaunchUnavailable"

  /v1/admin/tenants/{tenantID}/capability-grants/requests:
    post:
      summary: Request a scoped financial capability grant (K1)
      description: >
        capability_grant:request (tenant_admin, platform_admin), staff principals only. ADR 0099. Files a request that a platform administrator must approve; nothing is granted on request.
        The target tenant is the {tenantID} path value only; a tenant-scoped caller may name only its own tenant (403, no data). A platform-scoped session may not request a grant for a tenant-scoped grantee: that is refused 409 with a fixed message (ADR 0099 I-1); the tenant administrator requests instead.
        The signed actor proof (ADR 0110) is produced server-side. Guard refusals, double submissions and a refused database check are 409 or 400 with a generic body; a refusal writes a denied audit row.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffIdempotencyKey"
        - { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityGrantRequestBody" }
      responses:
        "201":
          description: The pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityGrantRequest" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      summary: List the tenant's capability grant requests (K1)
      description: >
        capability_grant:read (tenant_admin, compliance, platform_admin), staff principals only. A bare JSON array (no envelope) of the target tenant's requests. A10c: optional ?limit / ?offset window (newest first, stable order); the response header X-Total-Count carries the size of the whole list. Without them the whole list is returned, as before. Unknown query parameters are 400.
        ADR 0114 S0: requested_by and grantee_staff_id are null for a tenant-scoped caller when the actor's scope is not tenant; the scope fields say which scope acted.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
        - name: limit
          in: query
          description: "A10c. OPTIONAL page size (1..200). Neither limit nor offset gives the whole list, as before; an offset without a limit takes the default page size of 50."
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          description: A10c. OPTIONAL rows to skip (0..1000000).
          schema: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        "200":
          description: The requests
          headers:
            X-Total-Count:
              description: A10c. The number of rows of the whole list (before limit / offset).
              schema: { type: integer }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CapabilityGrantRequest" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/tenants/{tenantID}/capability-grants/requests/{requestID}/cancel:
    post:
      summary: Cancel an open capability grant request (K1)
      description: >
        capability_grant:request (tenant_admin, platform_admin). Only the requester may cancel (migration 0120); any other caller gets 409. 404 when the request does not exist for the target tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffIdempotencyKey"
        - { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cancelled }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/tenants/{tenantID}/capability-grants/requests/{requestID}/approve:
    post:
      summary: Approve a capability grant request (K1)
      description: >
        capability_grant:approve (platform_admin only). No tenant role holds this permission, and a tenant-scoped approval is also refused by the database (migration 0112 R-7). Approving creates the grant in the same transaction and returns it; a database refusal is 409.
      security:
