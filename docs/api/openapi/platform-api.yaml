        Player-authenticated; no request body. Ownership is checked under
        the player-self scope first (another player's or an unknown id is
        404). Only a withdrawal still in state `requested` can be cancelled:
        once the staff review queue has promoted it to `pending_review` (or
        it has moved further) the answer is 409 conflict. Reverses the hold
        through the ledger.
      security:
        - bearerAuth: []
