        recorded through POST /v1/admin/licensing-changes/{changeID}/approve. The refusals the binding would hit are
        answered when filing, as before: unknown licence, a licence whose status is not `active`, a licensee that does not
        match the tenant's `licensing_model`, or an exclusive (tenant-licensee) licence already bound to another tenant
        return 400; an unknown tenantID returns 404. A JSON `null` (unbind: narrowing, fail closed) files a
        `tenant_licence_unbind` change that executes in the same transaction (single actor with a reason code) and answers
