  # --- Jurisdiction Evidence Collection Activation (Stage 4I Phase B) ---
  #
  # A lawful-basis activation switch for player-level jurisdiction
  # EVIDENCE collection (declared_residence / verified_residence /
  # location_signal), distinct from jurisdiction-resolution-active above,
  # which gates resolver behavior for a (tenant, operation_class) pair
  # only. Turning this OFF makes the corresponding write (PUT
  # /v1/me/residence, or a verified_residence_country determination on
  # the KYC review endpoint) fail closed with 403, writing nothing.
  #
  # jurisdiction_evidence_collection:activate is RoleCompliance-only
  # (never RoleTenantAdmin, unlike jurisdiction_resolution_active:write)
  # - switching on collection of privacy-sensitive personal data is a
  # lawful-basis judgment (HDR-J-3e), not a commercial/engineering
  # configuration act. GET shares the same permission - no separate read
  # permission exists for this fact, mirroring the resolution-active
  # precedent above.
  #
  # This switch gates COLLECTION only and has no effect on
  # internal/jurisdiction.Resolve, which this phase leaves entirely
  # unchanged - evidence existing (or being collectible) does not
  # activate any regulatory jurisdiction decision.
  /v1/admin/tenants/{tenantID}/withdrawal-restriction-policy:
    get:
      summary: Read a tenant's effective withdrawal restriction policy (withdrawal_restriction_policy:read)
      description: >
        lic11 (migration 0182). Requires withdrawal_restriction_policy:read. platform_admin reads any tenant; tenant_admin
        and compliance read their OWN tenant only (another tenant is 404). Lists every registry cause: for a configurable
        cause (licence state) the effective action per stage (request, dispatch, redispatch) with its source
        (configured, or default_unconfigured = the INTERIM ENGINEERING DEFAULT, the behaviour before migration 0182) and
        the UNCONFIGURED notice when no row is configured; for a non-configurable cause (tenant / brand status: ADR 0095
        section 44 decisions 13-18; market closed: not evaluable) its governing reference and current behaviour. Not a legal
        or regulatory authorisation.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The effective policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRestrictionPolicyEffective"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WithdrawalRestrictionPolicyForbidden"
        "404":
          description: Unknown tenant, or one the caller may not read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/WithdrawalRestrictionPolicyUnavailable"
