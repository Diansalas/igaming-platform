        effective_to: { type: string, format: date-time, nullable: true }
        created_by_actor_type: { type: string }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, licence_id, country_code, state, status, authorization_reference, reason_code, policy_version, effective_from, effective_to, created_by_actor_type, created_by, created_at]
    LicenceCountryCeilingPage:
