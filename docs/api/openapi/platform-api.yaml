        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/tenants/{tenantID}/residence-approval-policy:
    get:
      summary: Read a tenant's residence determination maker-checker policy
      description: >
        residence_approval_policy:read (compliance and tenant_admin of the tenant; tenant-scoped sessions only, a platform token is refused 403; there is no platform_acting path). lic10, migration 0181 (audit G8, owner question Q21). `effective_mode` is the mode in force: `none` (a single reviewer's determination is market evidence at once; this is the state of every tenant until a policy is configured and is TODAY'S behaviour), `into_open_market` (a determination into a market the brand serves needs a second, distinct Person) or `all` (every determination does). `versions` is the history, newest first (at most 200). A foreign tenant is 404. Cache-Control no-store.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidenceApprovalPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      summary: File a change of a tenant's residence maker-checker mode
      description: >
        residence_approval_policy:manage (compliance of the tenant; tenant-scoped sessions only). Step-up none: filing only tightens or files a request that changes nothing until approved. lic10, migration 0181. The DATABASE compares `mode` with the mode in force (the caller never states the previous mode): a STRICTER mode (none, then into_open_market, then all) is active at once and answers 200 (one actor); a LESS strict mode is filed PENDING and answers 202, and takes effect only after two approvals by two distinct Persons, neither the requester's (POST .../{policyID}/approvals). The same mode as in force is 409. A pending request is only valid against the mode it was filed against: if the mode changed since, it must be refiled (409 at approval). The mode applies to FUTURE determinations; each determination snapshots the mode in force when it is made. Needs a signed actor proof (ADR 0110); `reason_code` is a code (1..64 characters of [A-Za-z0-9_.:-]). The platform ships NO policy: nothing changes for a tenant that never calls this.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResidenceApprovalPolicyRequest" }
      responses:
        "200":
          description: A stricter mode, executed at once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidenceApprovalPolicyChange" }
        "202":
          description: A less strict mode, filed pending (two approvals needed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidenceApprovalPolicyChange" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/tenants/{tenantID}/residence-approval-policy/{policyID}/approvals:
    post:
      summary: Approve a pending (less strict) residence maker-checker mode change
      description: >
        residence_approval_policy:manage AND step-up `critical`. lic10, migration 0181. Records one approval; the approval that reaches the required count (2) activates the policy in the same transaction. The requester (staff account or Person) may not approve (403 four-eyes); one Person approves once (409); an approver must be linked to a Person (403). A policy that is not pending, or whose recorded previous mode is no longer the mode in force, is 409 (refile it). Needs a signed actor proof bound to the policy id and reason.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: policyID, in: path, required: true, schema: { type: string, format: uuid } }
