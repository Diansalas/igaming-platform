        audit:read (tenant_admin, compliance), tenant-scoped sessions only: a platform-scoped caller is refused 403. ADR 0104. Returns platform-scope audit rows whose subject tenant is the caller's tenant (today: payment kill-switch actions), newest first, in the shared paged envelope. The row set is decided by row-level security on subject_tenant_id, not by the handler.
        The platform actor is identified (actor.staff_id, actor.display_name when set) ONLY for payments_kill_switch.* actions (ADR 0104 section 5.2, explicit allow-list). For every other action - capability grants, manual adjustments, force-resolutions, launch authorisation - actor.scope is platform, actor.staff_id is the empty string and display_name is null; the same rule applies to approval_chain entries (actor_staff_id omitted). IP address, user agent, request id and non-allowlisted metadata are never returned. before/after/reason_code appear only for actions with an entry in the compiled-in presentation allowlist. approval_chain links the other kill-switch audit rows for the same switch (ADR 0104 section 5.5).
