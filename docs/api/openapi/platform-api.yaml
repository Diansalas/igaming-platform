  /v1/admin/tenants/{tenantID}/launch-readiness:
    get:
      summary: Read the launch readiness of a tenant or brand (read-only, informational)
      description: >
        launch_authorisation:read (platform_admin; tenant_admin and compliance for their own tenant), staff principals only.
        ADR 0112. Computes, server-side and without writing anything, the informational readiness checks for the action in the query,
        and returns the readiness_hash an approver must pass back as seen_readiness_hash plus the exact set of non-passing check codes a request
        must acknowledge. Readiness proves configuration presence only; it is not a legal or regulatory assessment, and a non-passing check never
        blocks by itself. The tenant is the {tenantID} path value only: a tenant-scoped caller naming another tenant, or a brand_id that is not a brand of
        the tenant, is 404 (no existence oracle). The query carries no free text. Every 2xx response carries the fixed disclaimer.
        Status per ADR 0112 slice 4: IMPLEMENTED against the local database; MOCK provider stack.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [activate, reactivate, suspend, close, ratify] }
        - name: brand_id
          in: query
          required: false
          description: A brand of the tenant; absent means the tenant itself.
          schema: { type: string, format: uuid }
        - name: jurisdiction_ids
          in: query
          required: false
          description: Comma-separated jurisdiction ids (activate, reactivate, ratify).
          schema: { type: string }
        - name: licensing_model
          in: query
          required: false
          schema: { type: string, enum: [platform_licence, tenant_licence, other_manually_approved, not_applicable_recorded_determination] }
        - name: licensing_status
          in: query
          required: false
          schema: { type: string, enum: [in_force, applied_pending, conditional, suspended, expired, not_required_per_determination] }
        - name: licence_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The readiness evaluation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchReadinessResponse" }
        "400":
          $ref: "#/components/responses/LaunchBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LaunchForbidden"
        "404":
          $ref: "#/components/responses/LaunchNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LaunchUnavailable"
  /v1/admin/tenants/{tenantID}/launch-authorisations:
    post:
      summary: File a launch authorisation request (activate, reactivate, close, ratify)
      description: >
        launch_authorisation:request (platform_admin; tenant_admin and compliance for a BRAND of their own tenant only), staff principals only.
        ADR 0112 (MOCK stack; IMPLEMENTED against the local database). Files a request that changes no status by itself: it needs the distinct platform approvers
        named in required_approvals (1 for a brand activate / reactivate / ratify; 2 for a tenant activation, any closure, and a platform-licence brand
        launch requested by tenant staff), who approve through the approve route. The server computes and snapshots the readiness it binds and returns it; every check that is not pass must be listed in
        acknowledged_check_codes (exactly that set). The licensing section records the basis of the decision; it is never judged and no licence is required by this API.
        action `suspend` is NOT accepted here (400): a suspension has its own routes (brand and tenant suspend), because it executes at once and records no licensing section.
        The tenant is the {tenantID} path value only; a body tenant_id is accepted and ignored. brand_id selects a brand OF THE ROUTE TENANT (a foreign or unknown brand is 404);
        absent means the tenant itself (platform only). The signed actor proof (ADR 0110) is produced server-side. Replaying the call while a request is pending is 409 LAUNCH_REQUEST_PENDING and changes no state (a denied audit row is written).
        A recorded launch decision is evidence that named people took a decision on stated inputs; it is not a legal or regulatory authorisation.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchCreateRequest" }
      responses:
        "201":
          description: The filed request (or the executed suspension), with the readiness the server bound
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchResult" }
        "400":
          $ref: "#/components/responses/LaunchBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LaunchForbidden"
        "404":
          $ref: "#/components/responses/LaunchNotFound"
        "409":
          $ref: "#/components/responses/LaunchConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LaunchUnavailable"
    get:
