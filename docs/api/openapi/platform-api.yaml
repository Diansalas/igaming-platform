        "401": { $ref: "#/components/responses/StaffSessionRevoked" }
        "403": { $ref: "#/components/responses/StaffLifecycleForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StaffLifecycleConflict" }
        "503": { $ref: "#/components/responses/StaffLifecycleUnavailable" }

  # --- Player administration (tenant-scoped) ---
  /v1/admin/players:
    get:
      summary: List player accounts for the caller's tenant
      description: >
        Requires player:read, and a real (non-nil) tenant context -
        platform_admin's platform-scoped token is rejected here by
        RequireTenantScope (browsing an arbitrary tenant's players is
        deferred - see docs/decisions/0011's "Consequences"). Stage 5
        (Operator Back Office MVP) added pagination and search/filter -
        this response shape CHANGED from a bare array to the paginated
        envelope below.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring match on email.
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated player accounts in the caller's tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PlayerAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}:
    get:
      summary: Get a single player account in the caller's tenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The player account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/suspend:
    post:
      summary: Suspend a player account
      description: >
        Requires player:suspend (compliance/tenant_admin/platform_admin -
        support explicitly does not have this permission). Requires a
        reason code, recorded on the audit entry.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "204":
          description: Player suspended
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/reinstate:
    post:
      summary: Reinstate a suspended player account (Stage 5)
      description: >
        Requires player:suspend (same authorization level as suspend - it
        is suspend's inverse). Atomic conditional transition: only
        succeeds if the account's CURRENT status is exactly `suspended`
        (409 otherwise) - this deliberately does NOT clear
        self_excluded/closed/identity_review_required, which each have
        their own dedicated workflow (self-exclusion is never cleared by
        a generic reinstate action). Requires a reason code, recorded on
        the audit entry (action player.reinstated) alongside the
        before/after status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "204":
          description: Player reinstated
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account is not currently suspended
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/identity-review/clear:
    post:
      summary: Clear a player account out of identity_review_required
      description: >
        Stage 4E (docs/decisions/0027). Requires identity_review:manage
        (compliance only - never tenant_admin/platform_admin, mirroring
        rg_restriction:write's separation-of-duties precedent). Requires a
        reason code, recorded on the audit entry. The account's CURRENT
        status must actually be identity_review_required - attempting this
        on any other status (e.g. suspended, self_excluded) is rejected
        with 409 rather than silently reactivating it; this is a narrower
        capability than player:suspend's own suspend/reinstate authority
        and must never become a generic "set player active" action.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "204":
          description: Identity review cleared - account is now active
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account is not currently identity_review_required
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Withdrawal admin (staff-facing) visibility (Stage 5, Operator
  # Back Office MVP). The withdrawal state machine, four-eyes approval
  # controls (POST .../approve, .../reject, and the rest of the existing
  # write API), and ledger postings all predate this spec's coverage and
  # are unchanged - only these two READ endpoints are new. Documenting
  # just the Stage 5 additions here, not backfilling the full pre-existing
  # write API, which is a separate, tracked documentation gap. ---
  /v1/admin/withdrawals/history:
    get:
      summary: Withdrawal queue - full history, tenant-wide (Stage 5)
      description: >
        withdrawal:review, tenant-scoped. Distinct from the pre-existing
        pending-only review queue (which also promotes `requested` rows
        to `pending_review` as a side effect) - this is a pure read
        covering every state, for the Back Office's general queue/history
        view. Registered at `/history` rather than the bare
        `/v1/admin/withdrawals` path because that path is already bound
        to the pending-only queue handler.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [requested, pending_review, approved, rejected, submitted, completed, failed, cancelled, reversed] }
        - name: limit
          in: query
          description: Values above 200 are clamped to 200; a missing, non-numeric or non-positive value uses the default 50. Never a 400.
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated withdrawal history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WithdrawalAdmin" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawals/{id}:
    get:
      summary: Get a single withdrawal, staff view (Stage 5)
      description: >
        withdrawal:review, tenant-scoped, tenant-wide (not restricted to
        the caller's own withdrawals, unlike the player-self-service
        GET /v1/me/withdrawals/{id}). 404s indistinguishably for an
        unknown id or one belonging to a different tenant. Since B13-B
        the response also carries `payout_instrument`: the bound
        instrument's id, rail and masked display value (null for a legacy
        withdrawal with no binding). The list endpoint does not carry it.
        ADR 0114 R1b: it also carries `payout_attempt`, the latest payout
        attempt summary (null when none); see PayoutAttemptSummary.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalAdminDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- B13 / B13-B (ADR 0111 2.9, 18): payout instruments and the
  # withdrawal binding. No response on any of these routes ever carries the
  # instrument detail, ciphertext, fingerprint or a seal: the only
  # detail-derived value is display_mask. Request bodies of the registration
  # route are never logged. ---
  /v1/me/payout-instruments:
    get:
      summary: List the authenticated player's payout instruments (masks only)
      description: >
        Player-authenticated; the player is always the authenticated
        subject. Returns every instrument of the player in any state,
        newest first (at most 200), as masked views. 503 service_unavailable
        when the payout-instrument service is not configured on this
        deployment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The player's instruments (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayoutInstrumentView" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      summary: Register a payout instrument
      description: >
        Player-authenticated; the player is the authenticated subject,
        never a body field. Registration is rate-limited per player (burst
        5, refilling one attempt per 6 minutes; refused attempts consume
        budget) and answers 429 with a Retry-After header. Card details are
        accepted only as a PSP hosted-fields token; any Luhn-valid 12-19
        digit string in any field is refused. EVERY registration refusal
        (invalid detail, a card number, an unknown kind or rail, a blocked
        destination, a fingerprint already owned by another person) is the
        same 409 PAYOUT_INSTRUMENT_NOT_ACCEPTED, so registration is not an
        enumeration oracle; the specific reason goes to the audit log only.
        On success the response is 201 with the masked view, or 200 when an
        equivalent instrument already existed. Verification is started
        synchronously on a best-effort basis: the instrument stays
        `pending_verification` when no verifier is available or a
        precondition (for example KYC) is not met.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutInstrumentRegisterRequest" }
      responses:
        "200":
          description: An equivalent instrument already existed; its masked view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutInstrumentView" }
        "201":
          description: Registered; the masked view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutInstrumentView" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: PAYOUT_INSTRUMENT_NOT_ACCEPTED - the generic registration refusal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me/payout-instruments/{id}/revoke:
    post:
      summary: Revoke one of the authenticated player's payout instruments
      description: >
        Player-authenticated. The body is optional; when present it may
        carry reason_code (default `player_revoked`). An instrument that
        belongs to another player or tenant is indistinguishable from an
        unknown one (404). A malformed id or reason_code is 400. 409
        PAYOUT_INSTRUMENT_IN_USE when a withdrawal in progress is bound to
        the instrument; 409 conflict when the instrument is in a state that
        can no longer change.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutInstrumentRevokeRequest" }
      responses:
        "200":
          description: The revoked instrument (masked view)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutInstrumentView" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PAYOUT_INSTRUMENT_IN_USE, or conflict (the instrument can no longer be changed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/players/{playerID}/payout-instruments:
    get:
      summary: List a player's payout instruments, staff view (masks only)
      description: >
        payout_instrument:read (finance, compliance, platform_admin),
        tenant-scoped (a token without a tenant is refused with 403).
        Read-only. Same masked view as the player's own list, plus
        player_account_id.
      security:
        - bearerAuth: []
      parameters:
        - name: playerID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The player's instruments in this tenant, newest first (at most 200)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayoutInstrumentView" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/payout-instruments/{id}/suspend:
    post:
      summary: Suspend a payout instrument (staff)
      description: >
        payout_instrument:suspend (compliance), tenant-scoped. reason_code
        is required. Writes a blocking event and an audit record. There is
        deliberately NO staff create, verify, unsuspend or edit route
        (ADR 0111 decision 7).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutInstrumentSuspendRequest" }
      responses:
        "200":
          description: The suspended instrument (masked view)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutInstrumentView" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me/withdrawals:
    post:
      summary: Request a withdrawal bound to a payout instrument (B13-B)
      description: >
        Player-authenticated. The wallet is the player's own wallet for
        asset_code (never client-supplied). payout_instrument_id is
        REQUIRED since B13-B: the withdrawal is bound server-side to that
        instrument (and its fingerprint) and the destination gate is
        evaluated before anything is written. Every refusal below writes
        nothing (no row, no hold) and does not consume the idempotency key.
        A repeat with the same idempotency_key and the same parameters,
        including the same payout_instrument_id, returns the original; a
        different instrument or amount under the same key is 409
        conflict. 409 PAYOUT_INSTRUMENT_NOT_USABLE is one generic answer
        for an unknown, another player's, or an unusable instrument (the
        reason is logged server-side only). The 201 body is unchanged and
        never carries instrument data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawalRequestCreate" }
      responses:
        "201":
          description: The withdrawal request, in state `requested`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawalPlayer" }
        "400":
          description: >
            validation_error - invalid body, a missing asset_code or
            idempotency_key, a non-positive amount, a payout_instrument_id
            that is not a UUID, or no wallet for the asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            One of PAYOUT_INSTRUMENT_REQUIRED (no payout_instrument_id
            given), PAYOUT_INSTRUMENT_NOT_USABLE (generic), TENANT_OR_BRAND_NOT_ACTIVE
            (the tenant or brand is not active; nothing was created),
            conflict (insufficient available balance, an idempotency key
            reused with different parameters, or a withdrawal that requires
            a passed identity verification).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            service_unavailable - the payout-instrument service is not
            configured, the destination gate or the verification check is
            temporarily unavailable. Retryable; nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List the calling player's own withdrawals
      description: >
        Player-authenticated (player principals only; a staff token is 403).
        Runs under the player-self scope, so only the caller's own
        withdrawal requests in the caller's tenant are returned. Unbounded
        bare array (no pagination). Carries no payout-instrument data.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WithdrawalPlayer" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/withdrawals/{id}/submit:
    post:
      summary: Submit an approved withdrawal to its payment provider (staff)
      description: >
        withdrawal:submit, tenant-scoped. Only valid on an `approved`
        withdrawal (otherwise 409 conflict). Since B13-B the destination and
        the payment rail are those of the bound payout instrument;
        payment_method no longer selects anything. For a bound withdrawal it
        is optional and only COMPARED with the instrument's rail: a
        different value is 400 PAYMENT_METHOD_MISMATCH and nothing is
        written. For a legacy withdrawal with no binding (Synthetic
        adapters only) it is still the routing input and is required (400
        validation_error when empty). 409 PAYOUT_DESTINATION_NOT_USABLE when
        the destination gate refuses; the request stays `approved`, no
        attempt is created and no provider is called. The 200 body is
        returned also when the claim was denied by the payout KYC gate (no
        provider is called). The withdrawal RG/risk gate (WD-RG-1) is
        re-evaluated at dispatch under the request-time rules: a refusal is
        409 conflict with a generic message (the request stays `approved`
        with its hold, no attempt, no provider call; the reason is only in
        the audit record), and an evaluation that cannot decide is 503
        (nothing written, retry).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawalSubmitRequest" }
      responses:
        "200":
          description: The withdrawal after dispatch, with the provider it went to when one was called
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawalSubmitted" }
        "400":
          description: validation_error, or PAYMENT_METHOD_MISMATCH (payment_method differs from the bound instrument's rail)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            conflict (not approved and ready, or held by the withdrawal
            RG/risk gate at dispatch; the request stays `approved`),
            PAYOUT_DESTINATION_NOT_USABLE (the request stays `approved`), or
            TENANT_OR_BRAND_NOT_ACTIVE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # --- Sportsbook (Stage 6, B2C Player/Brand MVP + first sportsbook
  # vertical slice). Catalogue browse is public/unauthenticated (mirrors
  # the assets-registry/casino-catalogue precedent: platform-wide,
  # read-open reference data with no RLS). Bet placement and history are
  # player-authenticated; the admin list is the Stage 6 Back Office
  # visibility counterpart to /v1/admin/withdrawals/history. Only a mock
  # provider (internal/sportsbook.MockSportsbookProvider) is wired this
  # stage - see docs/active-stage.md for the real-provider integration
  # contract this was built against. ---
  /v1/sportsbook/sports:
    get:
      summary: Browse the full sportsbook catalogue (sports -> competitions -> events)
      description: >
        Public, unauthenticated, no tenant scoping - platform-wide
        reference data synced from the configured Provider at server
        startup (SyncCatalogue), not baked into a migration.
      responses:
        "200":
          description: The full catalogue tree
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SportCatalogue" }
        "503":
          description: Sportsbook is not enabled on this deployment
  /v1/sportsbook/events/{id}:
    get:
      summary: Get one event's full market/selection tree
      description: Public, unauthenticated, mirrors GET /v1/sportsbook/sports.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Sportsbook is not enabled on this deployment
  /v1/me/sportsbook/bets:
    post:
      summary: Place a bet on a selection
      description: >
        Player-authenticated. selection_id/asset_code/stake_amount are the
        actual bet; expected_odds_numerator/expected_odds_denominator are
        what the client last saw for the selection - if the server's
        current odds differ, the bet is rejected with
        rejection_category=odds_changed rather than silently placed at a
        different price. idempotency_key must be unique per placement
        attempt (a duplicate returns the original outcome). A rejection is
        a well-formed business decision, not an HTTP error - the response
        is 200 with accepted=false, mirroring internal/casino's
        webhook-decline precedent. Full server-authoritative chain:
        validation -> RG eligibility -> risk evaluation -> wallet balance
        authorization -> ledger post + bet row, in one transaction.
        The A8 operating-market gate (internal/marketgate, SR8-1) runs
        FIRST, before the wallet is touched and again as the first statement
        of PlaceBet (a replay of an earlier idempotency key included): a
        refusal is `403 MARKET_NOT_AVAILABLE` (not the 200 accepted=false
        shape), locks no stake and writes no ledger row. This applies ADR
        0083 5.3.3's rung 2 ahead of the HDR-J-7 answer, by owner decision.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBetRequest"
      responses:
        "403":
          $ref: "#/components/responses/MarketNotAvailable"
        "201":
          description: Bet accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceBetResponse"
        "200":
          description: Bet declined (accepted=false; see rejection_category)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceBetResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Selection not found
        "503":
          description: Sportsbook is not enabled on this deployment, or no operating-market gate is configured (fail closed)
    get:
      summary: List the caller's own bet history
      description: Player-authenticated, restricted to the caller's own bets (WithPlayerScope).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated bet history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Bet" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Sportsbook is not enabled on this deployment
  /v1/admin/sportsbook/bets:
    get:
      summary: Sportsbook bet queue, tenant-wide (Stage 6 Back Office visibility)
      description: >
        sportsbook_bet:read, tenant-scoped, tenant-wide (not restricted to
        one player) - mirrors GET /v1/admin/withdrawals/history's identical
        shape and rationale. Not granted to platform_admin (no tenant
        context to scope to).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated tenant-wide bet queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdminBet" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Sportsbook is not enabled on this deployment

  # --- Stage 10 W1 (ADR 0088 §9): non-production test-support sportsbook
  # settlement simulation. IN-HOUSE MOCK MODE ONLY - see x-test-support and
  # the summary/description below. ---
  /v1/admin/sportsbook/bets/{id}/simulate-settlement-event:
    post:
      x-test-support: true
      summary: >-
        NON-PRODUCTION TEST SUPPORT ONLY - simulate an in-house settlement
        event (settle/void/rollback) for a cash-funded single bet
      description: >
        Absent unless test-support routes are enabled; never present when
        `APP_ENV=production`; simulates an in-house provider event; not an
        operator settlement feature. This is the ONLY driver of the
        in-house MOCK sportsbook settlement lifecycle (docs/decisions/0088)
        - there is no real sportsbook settlement provider or webhook.
        Gated by BOTH `Deps.SportsbookSettlementSimulationEnabled`
        (`cfg.TestSupportRoutesEnabled()`, ADR 0085's two-layer opt-in) AND
        `Deps.SportsbookEnabled`; when either is false this path is never
        registered at all (a request against it 404s exactly like any
        other unregistered path). Requires the staff-only
        `sportsbook_settlement:simulate` permission, held solely by the
        risk_manager role - never finance, tenant_admin, compliance,
        support, platform_admin, or any bonus role (ADR 0024 separation of
        duties). Every effect-bearing amount is derived server-side from
        the bet's own frozen placement/potential_return; payout_amount in
        the request is only the simulated provider's CLAIM, validated
        against the derived value and never posted directly (anti-minting,
        ADR 0088 §2.4). Removed once a real sportsbook settlement provider
        is registered for any tenant (ADR 0088 §9.1).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateSettlementEventRequest"
      responses:
        "200":
          description: The settlement event's outcome (applied, replayed, or tombstoned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateSettlementEventResponse"
        "400":
          description: VALIDATION_FAILED - shape/field-matrix violation, or payout_amount is not a non-negative in-range JSON integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No token; a player, service, or platform_admin principal; or a
            staff principal lacking sportsbook_settlement:simulate; or the
            staff actor is not an active user of this tenant.
        "404":
          description: Route absent (test-support disabled or production), or the bet does not exist in the caller's own tenant (NOT_FOUND)
        "409":
          description: >
            SETTLEMENT_PAYLOAD_MISMATCH, SETTLEMENT_TOMBSTONED, BET_VOIDED,
            BET_ALREADY_SETTLED, GENERATION_OUT_OF_SEQUENCE, SETTLEMENT_TENANT_NOT_ACTIVE
            (the tenant is suspended or closed: no new settlement is posted), or
            SETTLEMENT_INTEGRITY
        "422":
          description: PAYOUT_INVALID or ASSET_MISMATCH (anti-minting / claim-vs-derived-value validation)

  # --- Stage 9.2 (ADR 0083 §5.2/§9.2): sportsbook jurisdiction/market
  # gating governance - platform-admin only, mirrors PUT
  # /v1/admin/casino/games's identical platform-scope shape ---
  /v1/admin/sportsbook/jurisdiction-restrictions:
    get:
      summary: List sb_jurisdiction_restrictions (active and withdrawn)
      description: >
        Requires sportsbook_jurisdiction_restriction:read (platform_admin
        only). Returns every restriction, active and withdrawn, so the
        full compliance history is visible - newest first.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every jurisdiction restriction
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SportsbookJurisdictionRestriction" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Arm a new jurisdiction restriction (event/market/selection)
      description: >
        Requires sportsbook_jurisdiction_restriction:manage (platform_admin
        only). Deny-only by construction (INV-SB-JUR-2) - exactly one of
        event_id/market_id/selection_id must be set, matching scope_kind.
        Arming ANY restriction row blocks that event/market/selection for
        EVERY player until player jurisdiction resolution exists (ADR 0083
        §5.3.2) - this is the fail-closed, disclosed consequence of K3-1/
        K3-2, not a bug.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope_kind: { type: string, enum: [event, market, selection] }
                event_id: { type: string, format: uuid }
                market_id: { type: string, format: uuid }
                selection_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                authorization_reference: { type: string, description: "Required on every row (ADR 0045 §4's authorization discipline)." }
                reason_code: { type: string }
              required: [scope_kind, jurisdiction_code, authorization_reference, reason_code]
      responses:
        "201":
          description: Restriction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookJurisdictionRestriction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/sportsbook/jurisdiction-restrictions/{id}/withdraw:
    post:
      summary: Withdraw an active jurisdiction restriction
      description: >
        Requires sportsbook_jurisdiction_restriction:manage. Never a
        delete - migration 0087's deny-delete trigger refuses one
        regardless, so compliance history survives. Only transitions an
        'active' row; reason_code REPLACES the row's own reason_code
        (the one other mutable field, alongside status).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "200":
          description: Restriction withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookJurisdictionRestriction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 9.2 Part B2 / Wave 3 (ADR 0083 §6.2.3/§9.2): TENANT-scoped
  # cross-player book-exposure limit governance for sb_exposure_limits -
  # UNLIKE the jurisdiction-restriction routes above, this table carries a
  # tenant_id and is RequireTenantScope-wrapped, mirroring
  # /v1/admin/risk/rules exactly ---
  /v1/admin/sportsbook/exposure-limits:
    get:
      summary: List sb_exposure_limits for the caller's own tenant (active and disabled)
      description: >
        Requires sportsbook_exposure_limit:read (RoleRiskManager,
        RoleTenantAdmin), tenant-scoped. Returns every limit, active and
        disabled, so the full configuration history is visible - newest
        first. A limit has no player-facing read path.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every exposure limit for this tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SportsbookExposureLimit" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Arm a new cross-player book-exposure ceiling
      description: >
        Requires sportsbook_exposure_limit:manage (RoleRiskManager only),
        tenant-scoped. max_open_potential_payout is the GROSS potential
        payout ceiling (stake included, never netted - ADR 0083 §6.2.2),
        denominated in asset_code's minor units. brand_id omitted means
        tenant-wide (every brand); a brand-specific limit takes precedence
        over a tenant-wide one for the same (scope_kind, asset_code). At
        most one ACTIVE limit may exist per (tenant, brand, scope_kind,
        asset_code) - disable the existing one first to supersede it with
        a new ceiling (a limit is never edited in place).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid, description: "Omit for tenant-wide." }
                scope_kind: { type: string, enum: [event, market, selection] }
                asset_code: { type: string }
                max_open_potential_payout: { type: integer, format: int64, description: "Positive integer, asset_code's minor units, gross potential payout." }
                authorization_reference: { type: string, description: "Required on every row (ADR 0045 §4's authorization discipline)." }
                reason_code: { type: string }
              required: [scope_kind, asset_code, max_open_potential_payout, authorization_reference, reason_code]
      responses:
        "201":
          description: Exposure limit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookExposureLimit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An active exposure limit already exists for this (brand, scope_kind, asset_code)
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/sportsbook/exposure-limits/{id}/disable:
    post:
      summary: Disable an active exposure limit
      description: >
        Requires sportsbook_exposure_limit:manage. Never an edit or a
        delete - migration 0088's immutability/deny-delete triggers refuse
        both regardless, so max_open_potential_payout itself is immutable;
        changing a ceiling means authoring a new row. Only transitions an
        'active' row; reason_code REPLACES the row's own reason_code (the
        one other mutable field, alongside status).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "200":
          description: Exposure limit disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportsbookExposureLimit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Casino round history / mock-provider play simulation (Stage 7) ---
  # NOTE: the Stage 7 endpoints below, A8's launch route and (A10c) the player game list are documented here. The
  # pre-existing Stage 4A admin catalogue/capability/availability routes and the provider webhook predate
  # this OpenAPI file's casino coverage and are tracked as separate,
  # pre-existing documentation debt - not introduced by Stage 7.
  /v1/me/casino/games:
    get:
      summary: List the games available to the caller (the tenant catalogue joined to the brand's opt-in layer)
      description: >
        A10c. Player-authenticated. A bare JSON array (no envelope). The tenant and brand are resolved server-side from the caller's
        player account; nothing about the tenant is taken from the request. 503 when casino is not enabled on this deployment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The available games
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CasinoGame" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Casino is not enabled on this deployment
  /v1/me/casino/games/{gameID}/launch:
    post:
      summary: Launch a casino game (mints a single-use launch session and token)
      description: >
        Player-authenticated. The player's identity, wallet and brand are resolved server-side. The A8
        operating-market gate (internal/marketgate) is evaluated before the wallet is touched and again as the
        FIRST statement of LaunchGame's phase A transaction, before any catalogue read and before a launch
        session or token can be minted, for real AND demo launches: a refusal is `403 MARKET_NOT_AVAILABLE`
        (the same body for an unknown game id, so a refused market learns nothing about the catalogue) and
        mints nothing. The RG, risk and jurisdiction-blocklist denials, provider/capability errors and the
        remaining launch behaviour are pre-existing documentation debt, not introduced by A8.
        Licensing enforcement slice 3 (G4): before the market gate and before the wallet get-or-create, the tenant
        and the player's brand must both be `active`; otherwise `409 TENANT_OR_BRAND_NOT_ACTIVE` (real AND demo
        mode: a demo launch still creates a wallet and a wallet-bound session) and nothing is minted or created.
      security:
        - bearerAuth: []
      parameters:
        - name: gameID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset_code: { type: string }
                mode: { type: string, enum: [real, demo] }
              required: [asset_code, mode]
      responses:
        "201":
          description: Launch session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  launch_url: { type: string }
                  session_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                required: [launch_url, session_id, expires_at]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MarketNotAvailable"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The tenant or the player's brand is not active (`TENANT_OR_BRAND_NOT_ACTIVE`); nothing was minted or created
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Casino is not enabled on this deployment, the provider is unavailable, or no operating-market gate is configured (fail closed)
  /v1/me/casino/rounds:
    get:
      summary: List the caller's own casino round history
      description: >
        Player-authenticated. A "round" is one casino_launch_sessions row
        enriched with whatever casino_bet/casino_win/casino_rollback
        ledger transactions were posted under it (internal/casino.
        RoundSummary) - amount fields are absent when that leg never
        happened. Runs under db.Pool.WithTenant with an explicit
        player_account_id filter, not RLS - ledger_transactions carries no
        player-scope policy (see internal/casino/history.go).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated round history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Round" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Casino is not enabled on this deployment
  /v1/me/casino/sessions/{sessionID}/wager:
    post:
      summary: Simulate a mock-provider bet for the caller's own launch session
      description: >
        Player-authenticated. There is no real, hosted casino-provider
        game client for this vertical slice, so this endpoint asks the
        tenant's own registered MockCasinoProvider to construct a
        correctly-signed bet callback payload for the caller's own
        session and feeds it through the exact same
        Orchestrator.ReceiveCallback pipeline the public provider webhook
        uses (casino_play_handlers.go) - never a shortcut around
        signature verification or the financial posting logic. Rejects a
        session that does not belong to the caller (404, indistinguishable
        from an unknown session id) or is not in 'real' mode (400).
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stake_amount: { type: integer, format: int64, description: "Minor units, must be positive" }
                idempotency_key: { type: string, minLength: 1, description: "Required. One key per attempt, reused on a retry; it keys the provider transaction id, so the same key with a different amount is refused." }
              required: [stake_amount, idempotency_key]
      responses:
        "200":
          description: The simulated bet's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoPlayResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found (or does not belong to the caller)
        "503":
          description: Casino is not enabled on this deployment, or the session's provider is not the mock adapter
  /v1/me/casino/sessions/{sessionID}/win:
    post:
      summary: Simulate a mock-provider win for the caller's own launch session
      description: >
        Same mock-provider round-trip as the wager endpoint, for a win
        event. Amounts credit the platform ledger (never a client-supplied
        final balance) via the existing casino orchestrator.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                win_amount: { type: integer, format: int64, description: "Minor units, must be positive" }
                idempotency_key: { type: string, minLength: 1, description: "Required. One key per attempt, reused on a retry; it keys the provider transaction id." }
              required: [win_amount, idempotency_key]
      responses:
        "200":
          description: The simulated win's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoPlayResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found (or does not belong to the caller)
        "503":
          description: Casino is not enabled on this deployment, or the session's provider is not the mock adapter
  /v1/me/casino/sessions/{sessionID}/rollback:
    post:
      summary: Simulate a mock-provider rollback for the caller's own launch session
      description: >
        Reverses the named prior bet or win via the existing compensating-
        entry model (never a mutation of the original ledger entries). A
        second rollback of the same original_provider_tx_id is rejected
        with 409 (idempotent, never a double reversal).
      security:
        - bearerAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                original_provider_tx_id: { type: string, minLength: 1, maxLength: 255, description: "The bet's or win's own provider_tx_id being reversed. Provider reference bound (PROVIDER-REF-BOUND-1): 1..255 BYTES of valid UTF-8, no control characters; enforced in bytes, so fewer characters are allowed for multibyte text (maxLength counts characters and is only an upper bound; the server enforces 255 bytes). Over-bound is a 400." }
              required: [original_provider_tx_id]
      responses:
        "200":
          description: The simulated rollback's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoPlayResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found (or does not belong to the caller)
        "409":
          description: The original transaction has already been rolled back
        "503":
          description: Casino is not enabled on this deployment, or the session's provider is not the mock adapter
  /v1/me/deposits:
    get:
      summary: List the caller's own deposit intents
      description: >
        A10c. Player-authenticated, read under the player's own row-level-security scope. A bare JSON array (no envelope) of the caller's
        own intents; another player's intent is never returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's deposit intents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DepositIntent" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Initiate a deposit for the caller's own wallet
      description: >
        Player-authenticated. Every identifying field (tenant, brand, player, wallet) is resolved server-side
        from the session; the body supplies only the asset, amount (integer minor units), payment method and the
        client's idempotency key. The A8 operating-market gate (internal/marketgate) is evaluated BEFORE any
        wallet or deposit row is written and again as the first statement of the orchestrator's phase A
        transaction (a replay of an earlier idempotency key included): a refusal is `403 MARKET_NOT_AVAILABLE`
        and creates no intent, no attempt, no provider call, and does not consume the idempotency key.
        Documentation of the remaining deposit behaviour (RG/KYC denial as a `declined` intent, routing, hosted
        redirect) is pre-existing documentation debt, not introduced by A8.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asset_code: { type: string }
                amount: { type: integer, format: int64, minimum: 1, description: Minor units }
                payment_method: { type: string }
                idempotency_key: { type: string }
              required: [asset_code, amount, payment_method, idempotency_key]
      responses:
        "201":
          description: The deposit intent (status `pending`, `declined`, ...)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  asset_code: { type: string }
                  amount: { type: integer, format: int64 }
                  payment_method: { type: string }
                  status: { type: string }
                  provider_id: { type: string }
                  redirect_url: { type: string }
                  hosted_field_token: { type: string }
                  ledger_transaction_id: { type: string, format: uuid }
                required: [id, asset_code, amount, payment_method, status]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MarketNotAvailable"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency key reused with different parameters, or the tenant/brand is not active (`TENANT_OR_BRAND_NOT_ACTIVE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Deposits are not enabled on this deployment, or no operating-market gate is configured (fail closed)
  /v1/me/deposits/{id}:
    get:
      summary: Get one of the caller's own deposit intents
      description: >
        A10c. Player-authenticated. A deposit that does not exist, or belongs to another player, is the same 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The deposit intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositIntent" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/wallets:
    get:
      summary: List the caller's wallets with their balance summary
      description: >
        A10c. Player-authenticated, read under the player's own row-level-security scope. A bare JSON array, one entry per asset the player
        holds a wallet for. Amounts are integer minor units rendered as JSON numbers. The summary is a projection of ledger entries, shown
        as the server computed it; no client ever derives a balance.
      security:
        - bearerAuth: []
