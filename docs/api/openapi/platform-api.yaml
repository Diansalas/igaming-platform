openapi: 3.0.3
info:
  title: "platform-api (Stage 2: identity + tenancy + security)"
  version: "0.2.0"
  description: >
    Health/readiness, player identity/auth, staff auth, and tenant/brand/
    staff/player administration endpoints through Stage 2. This is NOT the
    full platform API - wallet/ledger, bonus, payments, casino, sportsbook,
    and production KYC/AML APIs are added in their owning stages (see
    docs/active-stage.md and docs/architecture/04-api-architecture.md for
    the conventions those additions must follow: versioned paths, the
    shared error envelope below, idempotency-key support on mutating
    endpoints).


    Authentication is HMAC-signed JWTs with key-id-based rotation support
    (see the bearerAuth security scheme below and docs/decisions/0011).
    This remains explicitly PROVIDER DEPENDENT / foundation-only -
    production authentication may move to a real identity provider or
    KMS-managed asymmetric signing before go-live; see
    docs/architecture/05-identity-architecture.md.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: >
        Reports whether the process is up. Never checks the database -
        see /readyz for that - so a database outage does not cause an
        orchestrator to kill and restart an otherwise-healthy process.
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Readiness probe
      description: Reports whether the instance can serve traffic (checks database connectivity).
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Not ready (e.g. database unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  reason:
                    type: string
                    example: database unreachable

  # --- Player auth ---
  /v1/auth/register:
    post:
      summary: Register a new player account
      description: >
        Creates a Person, a PlayerAccount under the given brand, and an
        initial session in one atomic transaction. tenant_id is always
        derived server-side from the resolved brand - never accepted from
        the client (CLAUDE.md's absolute multi-tenancy rule).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
              required: [brand_slug, email, password]
      responses:
        "201":
          description: Account created; returns an initial token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/MarketNotAvailable"
        "404":
          description: Unknown brand_slug, or a brand (or its tenant) that is still `pending_launch` (indistinguishable by design)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Either an account with this email already exists for this brand
            (code `conflict`), or the brand or its tenant is not `active`
            (code `BRAND_NOT_ACCEPTING_REGISTRATIONS`; ADR 0112 section 7.3 -
            a suspended or closed brand or tenant accepts no new
            registration). Nothing is created in either case. A brand or
            tenant that is still `pending_launch` does NOT answer 409: it
            answers 404 exactly like an unknown brand_slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/login:
    post:
      summary: Log in as a player
      description: >
        Verifies credentials against the brand-scoped player account.
        Subject to Postgres-backed lockout after repeated failures (see
        docs/architecture/05-identity-architecture.md's login_attempts
        design) - locked-out requests return 429 even with a correct
        password, matching the documented threshold/window.
        A brand (or its tenant) that is still `pending_launch` (never launched, ADR 0112
        section 7.3) answers exactly like an unknown brand slug (404);
        login on a `suspended` or `closed` brand stays allowed so players
        can see their balances.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [brand_slug, email, password]
      responses:
        "200":
          description: Authenticated; returns a token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account exists but cannot currently log in (suspended/self-excluded/closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown brand_slug, or a brand that is still `pending_launch` (indistinguishable by design)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token for a new access/refresh token pair
      description: >
        Single-use refresh tokens: presenting one rotates it for a new
        pair and revokes the old one. Presenting an already-rotated
        (reused) token revokes the entire session chain from that point
        forward and returns 401 - see docs/decisions and
        internal/auth/session.go's RotateSession. The principal's CURRENT
        role/status is re-checked on every refresh, never trusted from
        the prior token.
        STAFF sessions (ADR 0119 section 7.2, slice S3): the session's keyed
        assurance seal is verified (a missing or bad seal is refused with the
        same 401; a tampered row also writes an audit record and raises the P1
        alert staff.session_integrity / staff.platform_session_integrity),
        the session is refused past its absolute lifetime (12 h from the
        second-factor login by default), the new refresh token's idle lifetime
        is the staff idle TTL (30 min by default, capped at the absolute
        expiry), and the new access token carries the session's unchanged
        aal / amr / auth_time / mfa_at claims and the new sid. Staff responses
        carry Cache-Control no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: Rotated; returns a new token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid, expired, or reused refresh token; for staff also a missing or bad assurance seal or a session past its absolute lifetime (one answer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Principal is no longer active (e.g. suspended since last login)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/logout:
    post:
      summary: Revoke a session by its refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "204":
          description: Session revoked (idempotent - also returned if the token was already invalid)
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Player self-service ---
  /v1/me:
    get:
      summary: Get the authenticated player's own profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's own player account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is not a player-principal token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/sessions:
    get:
      summary: List the authenticated principal's active sessions
      description: >
        Available to both player and staff principals. Scoped to the
        caller's own principal_id - never returns another principal's
        sessions, even within the same tenant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions for the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/sessions/{id}:
    delete:
      summary: Revoke one of the authenticated principal's own sessions
      description: >
        Ownership-checked server-side (the session's principal_id must
        match the caller's) - a caller cannot revoke another principal's
        session by guessing its id, even within the same tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Staff auth ---
  /v1/staff/auth/login:
    post:
      tags: [staff-auth]
      summary: Staff login, step 1 of 2 (password) - returns an MFA challenge, never a token pair
      description: >
        ADR 0119 section 6.1 (slice S3). Separate credential store and endpoint from player login. tenant_slug is
        omitted entirely for a platform_admin login (there is no tenant to resolve - see docs/decisions/0011); every
        other staff role must supply it. BREAKING CHANGE (S3): a correct password never yields a token pair. When the
        staff member has an ACTIVE second factor that is not hard-locked, the response is a single-use `mfa`
        challenge (5 minutes, 5 attempts) to be completed at POST /v1/staff/auth/mfa/verify (TOTP) or
        POST /v1/staff/auth/mfa/recover (recovery code). There is no MFA bypass in any environment. The password
        lockout (5 failures per 15 minutes per tenant + email) and the dummy-hash timing equalisation are unchanged.
        Rate bucket `login` (per IP). Every response carries Cache-Control no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Password verified; complete the login with the returned `mfa` challenge
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLoginChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: unauthorized - invalid email or password (one answer for an unknown email, a wrong password and a scope mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/StaffAuthForbidden"
        "404":
          description: Unknown tenant_slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/auth/mfa/verify:
    post:
      tags: [staff-auth]
      summary: Staff login, step 2 of 2 (TOTP) - returns an aal2 token pair
      description: >
        ADR 0119 section 6.1 step 2. Presents the `mfa` challenge from POST /v1/staff/auth/login and a 6-digit TOTP
        code. On success the challenge is consumed, the code's time step is burned (a code is accepted at most once,
        and never a code older than the last accepted one) and a staff session is issued with aal=2,
        amr=["pwd","otp"], auth_time, mfa_at, sid and sv claims; all of this commits in ONE transaction. A wrong
        code spends one challenge attempt and counts against the factor's failure counters (5 failures in 15 minutes
        soft-lock the factor for 15 minutes; 10 in 24 hours hard-lock it until an administrative MFA reset). The
        refusal is committed before the answer is sent. A locked factor is refused BEFORE any comparison, with the
        same answer whatever the code. Rate bucket `mfa` (30 per IP per minute). Responses carry no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: Authenticated at aal2
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/StaffMfaUnauthorized"
        "403":
          $ref: "#/components/responses/StaffAuthForbidden"
        "429":
          $ref: "#/components/responses/StaffMfaRateLimited"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/auth/mfa/recover:
    post:
      tags: [staff-auth]
      summary: Use a one-time recovery code - returns an `enrol` challenge, never a session
      description: >
        ADR 0119 section 6.1 step 3. Presents the `mfa` challenge and one recovery code (XXXXX-XXXXX; case, hyphens
        and spaces are ignored, I/L read as 1 and O as 0). A recovery code buys a RE-ENROLMENT, never an aal2 session:
        on success the code and the `mfa` challenge are consumed and a new `enrol` challenge is returned (continue at
        POST /v1/staff/auth/enrol/start). The old factor stays active until the new one is confirmed. A wrong code
        spends one challenge attempt and counts against the same factor failure counters as a TOTP code. The durable
        alert staff.mfa_recovery_used (or staff.platform_mfa_recovery_used) is raised. Rate bucket `mfa`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaRecoverRequest"
      responses:
        "200":
          description: Recovery code accepted; continue with the `enrol` challenge
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLoginChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/StaffMfaUnauthorized"
        "403":
          $ref: "#/components/responses/StaffAuthForbidden"
        "429":
          $ref: "#/components/responses/StaffMfaRateLimited"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/auth/enrol/start:
    post:
      tags: [staff-auth]
      summary: Begin TOTP enrolment - returns the secret exactly once
      description: >
        ADR 0119 section 6.2. Needs an `enrol` challenge (from POST /v1/staff/auth/enrol/redeem or
        POST /v1/staff/auth/mfa/recover). Creates a PENDING factor (10 minutes) and returns its otpauth URI and
        base32 secret exactly once (render the QR code LOCALLY in the browser - never a network QR service). Does NOT
        consume the challenge; each call supersedes the staff member's earlier pending factor. The response is
        x-sensitive and no-store. Rate bucket `mfa`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolStartRequest"
      responses:
        "200":
          description: Pending factor created
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolStartResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/StaffMfaUnauthorized"
        "403":
          $ref: "#/components/responses/StaffAuthForbidden"
        "429":
          $ref: "#/components/responses/StaffMfaRateLimited"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/auth/enrol/confirm:
    post:
      tags: [staff-auth]
      summary: Confirm TOTP enrolment - returns 10 recovery codes and an aal2 token pair, once
      description: >
        ADR 0119 section 6.2. Verifies a TOTP code against the PENDING factor, then in ONE transaction: activates it,
        revokes the previous active factor, replaces every recovery code with 10 new ones, consumes the challenge,
        revokes every other session of the staff member and issues an aal2 session. The recovery codes are shown
        exactly once (x-sensitive, no-store); the UI must make the user confirm they stored them. A wrong code
        spends one challenge attempt and counts against the pending factor's failure counters. Rate bucket `mfa`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolConfirmRequest"
      responses:
        "200":
          description: Factor active; recovery codes and token pair returned once
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolConfirmResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/StaffMfaUnauthorized"
        "403":
          $ref: "#/components/responses/StaffAuthForbidden"
        "409":
          description: >
            mfa_enrolment_expired - the factor_id names no pending factor of this staff member, or its 10 minute window
            has passed (restart at POST /v1/staff/auth/enrol/start with the same challenge while it is valid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/StaffMfaRateLimited"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/auth/enrol/redeem:
    post:
      tags: [staff-auth]
      summary: Redeem an MFA-reset or bootstrap enrolment token (with the current password) - returns an `enrol` challenge
      description: >
        ADR 0119 section 6.3 and S3 entry gate (d). The token is delivered out of band (bootstrap: printed once by
        the cmd/seed-admin deployment job; mfa_reset: emailed, ADR 0119 S6 - NOT IMPLEMENTED until S6). The staff
        member's tenant and identity come from the TOKEN ROW, never from the body: tenant_slug (omit for platform
        staff), email and password must resolve to the SAME staff member as the token, who must be active. Every
        failure (unknown, expired, consumed or revoked token, a token of another purpose, a tenant / email / password
        that does not match the token's staff member) is the single answer 401 invalid_enrolment_token. A wrong
        password counts against the same per-identifier password lockout as POST /v1/staff/auth/login. On success the
        token is consumed and an `enrol` challenge is returned. Rate bucket `credential` (per IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolRedeemRequest"
      responses:
        "200":
          description: Token redeemed; continue with the `enrol` challenge
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLoginChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: invalid_enrolment_token - the single answer for every token or credential failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/invitations/accept:
    post:
      tags: [staff-auth]
      summary: Accept a staff invitation (set the password) - returns an `enrol` challenge
      description: >
        ADR 0119 sections 6.3 and 10.1. The invite token arrives by email (link `<backoffice>/#/enrol?token=...&invite=1`,
        fragment form only). The staff member's tenant and identity come from the TOKEN ROW, never from the body. On
        success the password is set, the account moves `invited -> active`, the token is consumed and an `enrol`
        challenge is returned (continue at /v1/staff/auth/enrol/start); no session is issued until a factor is confirmed.
        Every refusal (unknown, expired, consumed or revoked token; an account that is not invited) is the single answer
        401 invalid_enrolment_token. Rate bucket `credential` (per IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptRequest" }
      responses:
        "200":
          description: Invitation accepted; continue with the `enrol` challenge
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLoginChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: invalid_enrolment_token - the single answer for every token failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/me/mfa:
    get:
      tags: [staff-auth]
      summary: The caller's own second-factor status (My security)
      description: >
        ADR 0119 section 14.1. Any authenticated staff principal, over its own account only (the subject comes from
        the token; there is no permission for MFA self-service). Never returns a secret or a code.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's factor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMfaStatus"
        "401":
          description: >
            Missing, invalid or expired bearer token (`unauthorized`), or the staff session is no longer live
            (`session_revoked`, ADR 0119 S4a liveness: revoked session, inactive staff member, changed role or staff
            version, revoked or hard-locked second factor, absolute lifetime over).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden - not a staff principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/auth/step-up:
    post:
      tags: [staff-auth]
      summary: Step-up - verify a fresh TOTP code and receive a new access token
      description: >
        ADR 0119 section 6.6 (slice S4b). Bearer staff access token through the full staff chain (liveness, aal2).
        Verifies a 6-digit TOTP code against the caller's own active factor with the same replay rule and the same
        failure counters as login (5 failures in 15 minutes soft-lock the factor; 10 in 24 hours hard-lock it).
        Recovery codes are NOT accepted. On success the session row (it must be the newest link of its rotation chain,
        not revoked) gets mfa_at = now and a new keyed seal, and a NEW ACCESS TOKEN is returned with mfa_at = now; the
        refresh token does not change. Five failed step-ups on the same session within 15 minutes revoke the session
        (that answer is session_revoked). Rate bucket `mfa` (30 per IP per minute). Responses carry no-store.
        A client MUST NEVER auto-retry or double-submit this request: a duplicate submission of a valid code is a
        replay and counts as a failure on the shared counter (five lock the factor and revoke the session).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
      responses:
        "200":
          description: Stepped up; replace the access token
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: >
            invalid_mfa_code (wrong, malformed or already-used code; the failure was counted against the factor),
            session_revoked (the session is no longer live, the token is not the session's newest link, or five failed
            step-ups revoked it) or unauthorized (missing / invalid bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/StaffAuthForbidden"
        "429":
          $ref: "#/components/responses/StaffMfaRateLimited"
        "503":
          $ref: "#/components/responses/StaffAuthUnavailable"

  /v1/staff/mfa/recovery-codes/regenerate:
