    KYCMockCallback:
      type: object
      description: >
        The MOCK KYC adapter's own wire shape (platform-invented, not
        modeled on any real vendor - KYC-WH-1, Stage 10.2, ADR 0091). The
        signature covers these RAW BODY BYTES, never a re-serialization.
        At most 256 KiB. There is deliberately no "signature" field in the
        body (the signature lives in the X-KYC-Signature header) - a body
        that still carries one is rejected as an invalid signature, not a
        malformed body.
