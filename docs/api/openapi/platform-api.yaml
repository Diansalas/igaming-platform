  /v1/webhooks/payments/{tenantSlug}/{providerID}:
    post:
      summary: Payments provider callback (deposit / deposit reversal)
      security: []
      description: >
        No bearer-token middleware - a PSP webhook is not an authenticated
        platform principal. PAY-WH-TENANT-1 (ADR 0090; docs/decisions/0022
        §3 amendment 2026-09-26): {tenantSlug} is a LOOKUP HINT only, never
        the source of authorization - the tenant is established by
        verifying a signature whose input includes the ROUTE-resolved
        tenant_id, and the tenant is NEVER read from the request body. The
        platform-defined (MOCK-only; a real adapter uses its own vendor
        scheme) signing_input is exactly:
        `"igaming.payments.webhook.v1" 0x00 tenant_id 0x00 provider_id 0x00
        key_id 0x00 <raw request body bytes>`, HMAC-SHA256'd with the
        credential resolved for (tenant_id, provider_id, key_id) and hex-
        encoded into X-Payments-Signature. The wire body shape below
        (`PaymentsMockCallback`) is platform-invented for the MOCK adapter
        only - it models no real vendor's webhook format; a real PSP
        integration maps that vendor's own callback shape onto the
        canonical `CallbackEvent` inside its own adapter, per
        docs/decisions/0022 §3's amendment. Every pre-verification failure
        (unknown/inactive tenant, invalid/unregistered/unconfigured
        provider, no credential resolver, missing/malformed/invalid
        signature, an UNPARSEABLE body, an oversized (>1 MiB) body,
        apparent key material in the payload) returns the IDENTICAL 401
        response below, so an unauthenticated caller can never distinguish
        which is true (Stage 10.1 security review P2-1/code review
        F1/architect PW-1: the adapter verifies the raw signature BEFORE
        ever parsing the body, and the HTTP handler checks body size and
        header format BEFORE the tenant lookup, so neither an unparseable
        nor an oversized body can be used to distinguish a live tenant/
        provider pair from an unknown one). 400 is reachable ONLY after
        verification succeeds: a verified body that is still structurally
        malformed (a required field missing, or an unrecognized
        event_type/outcome value), or a deposit_reversal event whose
        declared amount/asset contradicts the ORIGINAL deposit it names
        (ErrCallbackProviderMismatch). PRH-payments-callback-cutover: a
        plain `deposit` event's amount/asset mismatch against the attempt
        it resolves is NOT a 400 - ADR 0095 §4.4 records it as a committed
        anomaly receipt and still returns 200 (see below), exactly like
        every other disposition. 409 covers two
        distinct, generically-reported causes (a provider reference already
        posted with a different payload, or a distinct-reference reversal
        naming an already-reversed deposit) - intentionally collapsed to one
        generic body. 503 means either webhooks are not enabled on this
        deployment, an ADR 0097 admission-layer capacity rejection, or the
        ADR 0095 §6.1 step 5 unapplied-receipt cap for this (tenant,
        provider) pair.

        PRH-payments-callback-cutover (ADR 0095 §6.2/S95-C4): every 200
        response is a BYTE-IDENTICAL body regardless of disposition
        (applied, a duplicate/idempotent replay, a deferred callback with no
        resolvable attempt yet, or a committed anomaly) - the outcome is
        recorded only in the receipt, the audit trail and metrics, never in
        this response, so a verified sender can never learn whether a
        reference exists, is already applied, or is still unresolved. This
        also means an unresolved deposit callback (formerly a 404, "no
        matching deposit intent for this provider reference") now returns
        200 after a durable receipt instead - 404 is no longer used by this
        route.
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
        - name: providerID
          in: path
          required: true
          description: "Charset: ^[a-z0-9][a-z0-9-]{0,62}$"
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        - name: X-Payments-Signature
          in: header
          required: true
          description: "Authentication headers are provider-defined (Stage 10.3 WH-VENDOR-SCHEME-1): each adapter's own verification scheme is selected by providerID. This entry documents the platform MOCK scheme only (never a vendor protocol): v1= + lowercase hex(HMAC-SHA256(credential_secret, signing_input)). A real provider's headers are documented per provider when its adapter lands."
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: X-Payments-Key-Id
          in: header
          required: true
          description: "Platform MOCK scheme key id (provider-defined for real adapters)."
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentsMockCallback"
      responses:
        "200":
          description: >
            Callback received - identical body for every disposition
            (applied, an idempotent duplicate/no-op replay, a deferred
            callback with no resolvable attempt yet, or a committed
            anomaly). See this operation's description (ADR 0095 §6.2/
            S95-C4): the disposition is never distinguishable from the
            response alone.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, received]
                properties:
                  request_id: { type: string }
                  received: { type: boolean }
        "400":
          description: >
            Reachable ONLY after signature verification succeeds: a
            verified body that is structurally malformed (unparseable
            JSON, a missing required field, or an unrecognized event_type/
            outcome value), or whose declared amount/asset contradict the
            deposit intent it claims to resolve, or whose provider
            reference breaks the platform bound (PROVIDER-REF-BOUND-1:
            1..255 bytes, valid UTF-8, no control characters - a
            deterministic rejection; do not retry). Generic body only -
            never the specific field or value that failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Callback rejected - EVERY pre-verification failure reason
            (unknown/inactive tenant, invalid/unregistered/unconfigured
            provider, no resolver, no credential, missing/malformed/invalid
            signature, an unparseable body, an oversized (>1 MiB) body,
            apparent key material) maps to this SAME generic body,
            deliberately indistinguishable from any other, with the SAME
            status code regardless of whether the tenant/provider named in
            the path actually exist or are configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/WebhookRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            Payment webhooks are not enabled on this deployment, OR an ADR
            0097 admission-layer capacity rejection (A4a/A4b/B2), OR a
            no-429-retry adapter's B1 rejection (see
            WebhookAdmissionUnavailable), OR the ADR 0095 §6.1 step 5 /
            S95-C2(i) unapplied-receipt cap for this (tenant, provider) -
            nothing is stored in the cap case; the provider is expected to
            redeliver (LF-C1, ADR 0097 §6.3).
          headers:
            Retry-After:
              description: Present for every 503 cause on this route.
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/webhooks/kyc/{tenantSlug}/{providerID}:
    post:
      summary: KYC provider callback (verification status update)
      security: []
      description: >
        Stage 10.2 (KYC-WH-1, ADR 0091): registered ONLY when this
        deployment has test support enabled
        (cfg.TestSupportRoutesEnabled()) - the platform ships no real KYC
        vendor this stage, so the route is entirely ABSENT (a genuine 404,
        not a 503 from inside a registered handler) with test support off,
        including in production. No bearer-token middleware - a provider
        is not an authenticated platform principal. The tenant slug in the
        URL is only a LOOKUP HINT selecting one candidate credential;
        tenant/provider binding is enforced by the signature itself, whose
        signing input is exactly
        `igaming.kyc.webhook.v1 0x00 tenant_id 0x00 provider_id 0x00
        key_id 0x00 <raw body bytes>` (internal/webhookauth's shared
        platform-defined MOCK wire scheme - never a real vendor's format,
        and never trusted from anything inside the body). Idempotent and
        forward-only: unverified(0) < pending(1) < review_required(2) <
        approved|rejected|expired(3, terminal) - a callback only ever
        moves a verification's status FORWARD in this order via a
        compare-and-set update; an equal-or-backward transition, a replay,
        or anything arriving after a terminal status or after a staff
        decision is a no-op (204, no state change, no audit row). A
        provider `outcome: error` never changes verification state, but is
        NOT always audit-free: delivered against a NON-terminal
        verification it writes exactly one failure audit row (still 204,
        still no state change); delivered against an ALREADY-terminal
        verification (or any other replay/backward case) it is a pure
        no-op with no audit row at all, keeping replay-after-terminal
        genuinely inert.
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
        - name: providerID
          in: path
          required: true
          description: "Charset: ^[a-z0-9][a-z0-9-]{0,62}$"
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        - name: X-KYC-Signature
          in: header
          required: true
          description: "Authentication headers are provider-defined (Stage 10.3 WH-VENDOR-SCHEME-1): each adapter's own verification scheme is selected by providerID. This entry documents the platform MOCK scheme only (never a vendor protocol): v1= + lowercase hex(HMAC-SHA256(credential_secret, signing_input)). A real provider's headers are documented per provider when its adapter lands."
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: X-KYC-Key-Id
          in: header
          required: true
          description: "Platform MOCK scheme key id (provider-defined for real adapters)."
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KYCMockCallback"
      responses:
        "204":
          description: >
            Callback processed. Three cases share this status: (1) a
            forward status transition was applied; (2) the callback was a
            true no-op with NO audit row (an equal/backward-rank replay, or
            anything - including a provider `outcome: error` - arriving
            after the verification is already terminal or after a staff
            decision); (3) a provider `outcome: error` delivered against a
            NON-terminal verification, which does NOT change verification
            state but DOES write exactly one failure audit row. No response
            body in any case, so no identifier is ever echoed to the
            external caller.
        "400":
          description: >
            Reachable ONLY after signature verification succeeds: a
            verified body that is structurally malformed (unparseable
            JSON, a missing provider_reference, or an outcome outside the
            closed enum). Generic body only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Callback rejected - EVERY pre-verification failure reason
            (unknown/inactive tenant, invalid/unregistered provider, no
            resolver, no credential, missing/malformed/invalid signature,
            an unparseable body, an oversized (>256 KiB) body) maps to this
            SAME generic body, deliberately indistinguishable from any
            other, with the SAME status code regardless of whether the
            tenant/provider named in the path actually exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No matching verification for this (tenant, provider,
            provider_reference) - only observable AFTER signature
            verification succeeds; not a second enumeration oracle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/WebhookRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/WebhookAdmissionUnavailable"

  /v1/webhooks/casino/{tenantSlug}/{providerID}:
    post:
      summary: Casino provider callback (bet / win / rollback)
      security: []
      description: >
        No bearer-token middleware - a casino provider webhook is not an
        authenticated platform principal. CAS-WH-TENANT-1 (Stage 10.2,
        ADR 0091; docs/decisions/0022 §3 as amended): {tenantSlug} is a
        LOOKUP HINT only, never the source of authorization - the tenant is
        established by verifying a signature whose input includes the
        ROUTE-resolved tenant_id, and the tenant is NEVER read from the
        request body. The platform-defined (MOCK-only; a real adapter uses
        its own vendor scheme) signing_input is exactly:
        `"igaming.casino.webhook.v1" 0x00 tenant_id 0x00 provider_id 0x00
        key_id 0x00 <raw request body bytes>`, HMAC-SHA256'd with the
        credential resolved for (tenant_id, provider_id, key_id) and hex-
        encoded into X-Casino-Signature. The wire body shape below
        (`CasinoMockCallback`) is platform-invented for the MOCK adapter
        only - it models no real vendor's webhook format; a real
        aggregator integration maps that vendor's own callback shape onto
        the canonical `CallbackEvent` inside its own adapter. Every
        pre-verification failure (unknown/inactive tenant,
        invalid/unregistered provider, no credential resolver,
        missing/malformed/invalid signature, an UNPARSEABLE body, an
        oversized (>1 MiB) body) returns the IDENTICAL 401 response below,
        so an unauthenticated caller can never distinguish which is true -
        the adapter verifies the raw signature BEFORE ever parsing the
        body. 400 is reachable ONLY after verification succeeds: a
        verified body that is still structurally malformed (a required
        field missing, an unrecognized event_type/outcome value, or a
        legacy top-level `signature` field, which instead maps to 401 -
        see below), OR a verified body that is well-formed but fails a
        casino domain-logic check: `ErrBetNotFound` (a win/rollback naming
        a round with no matching prior bet), `ErrLaunchSessionRequired` (a
        bet callback's session_id does not resolve to a valid, non-revoked,
        real-money launch session for this provider),
        `ErrOutcomeNotSucceeded` (a bet/win callback whose outcome is not
        `succeeded`), `ErrInvalidInput` (any other structurally-invalid
        field combination), or an event_type that HandleCallback itself
        accepted as verified but the orchestrator does not recognize
        (Stage 10.2 final review K10 - also 400, never a 500).

        **Stage 10.3 CAS-CAP-ROLLBACK-1** (docs/plans/stage-10.3-planning/
        02-casino-financial-analysis.md §1.3): capability/status now gate
        NEW BETS ONLY. A win or rollback of exposure the ledger already
        holds is NEVER blocked by a disabled or missing capability - it
        settles unconditionally. A rollback of a provider_tx_id the ledger
        has never posted a bet/win for ALWAYS writes a tombstone
        (`tombstoned: true` in the 200 body), regardless of capability
        state. A late-arriving original (a bet or win) whose exact
        provider_tx_id a tombstone already covers is a deterministic,
        named rejection, never a 500: for a bet, this is reported as a 200
        decline (`outcome: "declined"`, `decline_reason:
        "original_rolled_back"`) via the SAME shape as an
        insufficient-funds decline; for a win, it is a 409 (the reference
        was already tombstoned by an earlier rollback of that win). 409
        also covers a provider_tx_id already posted with a different
        payload, a provider_round_id already bound to a different session,
        a rollback naming an already-reversed original, or a win whose
        round resolves to a genuinely ambiguous/mixed funding origin
        (`ErrAmbiguousMultiOriginRound`, `ErrCorrelationWalletCollision`,
        `ErrLockAlreadyReleased`, `ErrMixedFundingUnsupported`,
        `ErrBonusBetNotLocked`) - intentionally collapsed to one generic
        body that never echoes the round id or any player identity. **G-1**
        (§3): a round with two or more un-reversed plain-cash bets under
        one correlation id now resolves a win to the shared wallet
        normally (200) instead of the pre-fix 500 - the ambiguity guard
        above remains for a genuine wallet collision or mixed-origin
        (bonus/locked) round. 503 now has exactly TWO causes left, one
        pre-verification and one post-verification: (1) casino webhooks
        are not enabled on this
        deployment at all (the casino Orchestrator is nil) - this check
        runs FIRST, before the shared preamble, before any tenant lookup,
        and before signature verification, so it is reachable by anyone,
        verified or not; (2) a verified NEW BET while the tenant/brand
        capability is not active, does not support bet, or no longer
        supports the session's own asset - resolved for the bet's OWN
        session brand, never a tenant-wide-only lookup. Cause (2) is never
        returned for a win or rollback.
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
        - name: providerID
          in: path
          required: true
          description: "Charset: ^[a-z0-9][a-z0-9-]{0,62}$"
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        - name: X-Casino-Signature
          in: header
          required: true
          description: "Authentication headers are provider-defined (Stage 10.3 WH-VENDOR-SCHEME-1): each adapter's own verification scheme is selected by providerID. This entry documents the platform MOCK scheme only (never a vendor protocol): v1= + lowercase hex(HMAC-SHA256(credential_secret, signing_input)). A real provider's headers are documented per provider when its adapter lands."
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: X-Casino-Key-Id
          in: header
          required: true
          description: "Platform MOCK scheme key id (provider-defined for real adapters)."
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasinoMockCallback"
      responses:
        "200":
          description: Callback processed (or safely absorbed as an idempotent replay/no-op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome: { type: string }
                  tombstoned: { type: boolean }
                  ledger_transaction_id: { type: string, format: uuid }
                  decline_reason: { type: string }
        "400":
          description: >
            Reachable ONLY after signature verification succeeds, so the
            message is only ever seen by the verified provider. The
            message names the class of failure (for example "no matching
            prior bet for this round" or "callback outcome is not
            succeeded"), never echoing submitted values. Two classes of
            cause: (1)
            structurally malformed (unparseable JSON, a missing required
            field, an unrecognized event_type/outcome value, or an
            event_type the orchestrator itself does not recognize even
            though HandleCallback accepted it as verified - Stage 10.2
            final review K10); (2) a well-formed but domain-invalid
            callback: `ErrBetNotFound`, `ErrLaunchSessionRequired`,
            `ErrOutcomeNotSucceeded`, `ErrInvalidInput`, or
            `ErrProviderReferenceInvalid` (PROVIDER-REF-BOUND-1: a provider
            reference outside 1..255 bytes of valid UTF-8 without control
            characters - deterministic, nothing written, no rejection
            record; do not retry). A late-arriving
            original bet whose reference a tombstone already covers is
            NOT a 400 (Stage 10.3 CAS-CAP-ROLLBACK-1): it is a 200 decline
            (`decline_reason: "original_rolled_back"`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Callback rejected - EVERY pre-verification failure reason
            (unknown/inactive tenant, invalid/unregistered provider, no
            resolver, no credential, missing/malformed/invalid signature,
            an unparseable body, an oversized (>1 MiB) body) maps to this
            SAME generic body, deliberately indistinguishable from any
            other, with the SAME status code regardless of whether the
            tenant/provider named in the path actually exist or are
            configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/WebhookRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >
            Three distinct causes share this status. (1) Casino webhooks
            are not enabled on this deployment at all (the casino
            Orchestrator is nil) - this is checked FIRST, before the
            shared preamble even runs, so it PRECEDES signature
            verification and is reachable by any caller, verified or not.
            (2) A verified NEW BET while the tenant/brand's own capability
            is not active, does not support bet, or no longer supports the
            session's own asset - a deliberate, POST-verification kill
            switch on NEW EXPOSURE ONLY (Stage 10.3 CAS-CAP-ROLLBACK-1),
            reachable ONLY after signature verification succeeds. Cause
            (2) is NEVER returned for a win or rollback callback -
            settlement of exposure the ledger already holds is never
            blocked by capability/status. (3) ADR 0097 (PAYWH-RL-1): an
            admission-layer capacity rejection (A4a/A4b/B2), a recovered
            admission-layer panic, or a no-429-retry adapter's B1
            rejection - see WebhookAdmissionUnavailable. The three causes
            carry different error messages; cause (2) is only ever
            returned to a verified caller.
          headers:
            Retry-After:
              description: Present only for cause (3) above (ADR 0097).
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Stage 4G: Risk & Limits admin API (docs/decisions/0031) ---
  /v1/admin/risk/rules:
    get:
      summary: List a tenant's risk rules for one operation
      description: >
        Requires risk_config:read (risk_manager or tenant_admin,
        read-only for tenant_admin). Returns the caller's own tenant's
        rules PLUS every platform-wide rule for that operation - no
        pagination or status filter this stage (returns disabled rules
        too).
      security:
        - bearerAuth: []
      parameters:
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
      responses:
        "200":
          description: Risk rules for the named operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a risk rule
      description: >
        Requires risk_config:manage (risk_manager only). Always
        tenant-scoped this stage - a genuinely platform-wide rule
        (tenant_id NULL) has no HTTP write path yet (docs/decisions/0031
        §8's own recorded open decision). A rule is immutable after
        creation except for status/description/effective_until - a
        policy change is a new rule, never an edit.
        Licensing enforcement slice 3 (G6/G7): two authoring refusals, both
        `400` with a stable code in the message. `operation_not_evaluated`: a
        `deposit` rule is refused because no deposit path evaluates risk rules.
        `jurisdiction_scope_unsupported`: a rule with a `jurisdiction_code` is
        refused for every operation, because no player-scoped jurisdiction can
        be resolved today and every evaluator would refuse every request of the
        operation (including every withdrawal and dispatch). Existing rows are
        not touched.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                licensing_mode: { type: string, enum: [under_platform_licence, own_licence], description: "Stage 4G-FINAL: scopes the rule to tenants operating under this licensing arrangement (tenants.licensing_model). Omitted means the rule applies regardless of licensing mode." }
                player_account_id: { type: string, format: uuid }
                product: { type: string, enum: [casino, sportsbook, payments, bonus] }
                operation:
                  type: string
                  enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant, bonus_conversion]
                provider_id: { type: string }
                game_id: { type: string, format: uuid }
                asset_code: { type: string }
                payment_method: { type: string }
                limit_kind: { type: string, enum: [min_amount, max_amount, cumulative_amount] }
                time_window: { type: string, enum: [transaction, rolling_hour, rolling_day, rolling_week, rolling_month] }
                threshold: { type: integer, format: int64, description: "Minor units, denominated by asset_code (if set) or by threshold_exponent" }
                threshold_exponent:
                  type: integer
                  minimum: 0
                  maximum: 18
                  nullable: true
                  description: >-
                    REQUIRED when asset_code is omitted: the decimal exponent whose minor units
                    `threshold` is expressed in. Such a rule binds every asset of that exponent and
                    FAILS CLOSED for an asset of any other exponent, instead of being silently
                    re-denominated. MUST be omitted when asset_code is set - the asset is then the
                    threshold's denomination, resolved from the asset registry at evaluation time.
                    See docs/decisions/0031-risk-and-limits-engine.md §35.
                rule_kind: { type: string, enum: [hard_limit, configurable_limit, risk_signal], default: configurable_limit }
                action: { type: string, enum: [deny, review], default: deny }
                description: { type: string }
              required: [operation, limit_kind, time_window, threshold]
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/risk/rules/{id}/disable:
    post:
      summary: Disable a risk rule
      description: >
        Requires risk_config:manage. The only legitimate mutation besides
        description/effective_until - a rule is never deleted, so a past
        RiskDecision remains explainable against the exact rule that
        produced it. Returns 404 (never 403) both for a genuinely
        nonexistent id AND for a rule outside the caller's own tenant
        scope (platform-wide or a different tenant's) - never confirms
        existence outside the caller's own authorization.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rule disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Bonus Engine: four-eyes governance, EOI minting, per-domain
  # activate/publish/execute (Stage 4H-B1 Wave 3 Phase 3) ---
  #
  # NOT DOCUMENTED HERE (a pre-existing, disclosed gap this Phase does
  # not retroactively close): Wave 2's own bonus HTTP surface (POST
  # /v1/admin/bonus/campaigns, POST /v1/admin/bonus/grants, the
  # suggestion-review and held-disposition-resolution endpoints,
  # bonus_handlers.go/bonus_routes.go) was never added to this file
  # either - this section covers only the NEW endpoints this Phase
  # introduces.
  /v1/admin/bonus/campaigns:
    get:
      summary: List bonus campaigns (Stage 5, Operator Back Office MVP)
      description: bonus:read, tenant-scoped. Read-only visibility; campaign lifecycle mutations are unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, paused, ended, archived] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated campaign list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BonusCampaign" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/bonus/grants:
    get:
      summary: List/read bonus grants (Stage 5, Operator Back Office MVP)
      description: >
        bonus:read, tenant-scoped. With player_account_id, that player's
        grant/reward state (for the player-detail view); without it, a
        tenant-wide paginated list. Read-only visibility - grant lifecycle
        mutations are unchanged.
