        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payment-force-resolutions:
    post:
      summary: Request a payment force-resolution
      description: >
        payment_force_resolve:request (finance, platform_admin), staff principals only.
        Four-eyes governed resolution of a stuck payment attempt: M1 records evidence on a disputed deposit without changing it; M2 declares an ambiguous or allow-listed disputed payout paid or not paid; M4 resolves an unbound payout park from sealed statement-import evidence.
        M4 is a platform-acting flow (the evidence scope is not visible to a tenant-staff session) and is MOCK-only: it is implemented against MOCK statement sources, and an M4 resting on a non-MOCK statement import is refused at request with 409 force_resolve_evidence_insufficient; if detected at the final approval the resolution ends `refused_at_execution` (200, refused=true). Non-MOCK M4 is blocked (ADR 0111). A tenant-scoped caller's M4 request or final approval is refused 403 force_resolve_not_permitted. Nothing executes on request: the money moves only when the final required approval is recorded, in that approval's own transaction.
        Target tenant is the {tenantID} path value only; a body tenant_id is accepted and ignored. A tenant-scoped caller may name only its own tenant (otherwise 403,
        no data); a platform-scoped caller may name any tenant but acts only through a platform acting session, which the database refuses unless the caller holds an
        in-force capability grant for exactly that tenant. The route permission is only the first layer: the grant, the distinct-Person and beneficiary rules, the
        pinned payload and the approval recount are decided by the database inside the action's own transaction. The signed actor proof (ADR 0110) is produced
        server-side; the client supplies no proof header or field. A denied audit row is written for the 403 raised by the tenant check or by the
        service, and for every 409; generic gate refusals (not a staff principal, route permission missing), tenant-target
        validation failures, 400s and 404s write none. Error bodies carry the generic envelope code plus a fixed closed-token message where the
        responses below say so; no internal detail is returned.
        kind selects the shape. m1_deposit_evidence needs finding_code; m2_declare_paid and m2_declare_not_paid need basis_code and evidence_ref_hash (context_code optional); m4_evidence_paid and m4_evidence_not_paid need basis_code provider_confirmed_out_of_band, evidence_ref_hash and evidence_line_id. Amount and asset are copied from the attempt by the database, never taken from the request. An M2 or M4 is refused (409 force_resolve_precondition_failed) when no statement source is registered for the attempt's provider.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffIdempotencyKey"
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentForceResolutionRequest" }
      responses:
        "201":
          description: The pending resolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentForceResolution" }
        "400":
          $ref: "#/components/responses/ResolutionInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForceResolutionForbidden"
        "404":
          $ref: "#/components/responses/ForceResolutionNotFound"
        "409":
          $ref: "#/components/responses/ForceResolutionConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the tenant's payment force-resolutions
      description: >
        payment_force_resolve:read (finance, compliance, platform_admin), staff principals only. Up to 100 most recent resolutions of the target tenant, as an object with an items array. Same tenant rule as the request route.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The resolutions
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PaymentForceResolution" } } }, required: [items] }
        "400":
          $ref: "#/components/responses/ResolutionInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForceResolutionForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payment-force-resolutions/{resolutionID}:
    get:
      summary: Get one payment force-resolution
      description: >
        payment_force_resolve:read (finance, compliance, platform_admin), staff principals only. A resolution that does not exist for the target tenant is 404.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: resolutionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The resolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentForceResolution" }
        "400":
          $ref: "#/components/responses/ResolutionInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForceResolutionForbidden"
        "404":
          $ref: "#/components/responses/ForceResolutionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/payment-force-resolutions/{resolutionID}/approve:
    post:
      summary: Approve a payment force-resolution
      description: >
