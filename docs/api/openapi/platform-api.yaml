        - bearerAuth: []
      parameters:
        - { name: licensing_jurisdiction_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, active, withdrawn] } }
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KYCEnforcementPolicy" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Author a KYC enforcement policy as a DRAFT
      description: >
        kyc_enforcement_policy:manage (platform_admin only) AND step-up `critical`. lic10 (L-20). Creates a DRAFT only: a draft governs nothing. It becomes active only when a DIFFERENT platform administrator than the author activates it (the database trigger of migration 0100 enforces this; nothing here can bypass it). Only the evaluator-wired trigger types are accepted: `cumulative_deposit` (threshold_minor_units, a positive integer string in minor units, plus asset_code) and `play` (play_operation casino_play or sportsbook_play, nothing else); `edd_amount` and `registration_tier` are NOT IMPLEMENTED and refused. `legal_review_reference` (an opaque reference to the human legal review that supplied the value) and `reason_code` (1..64 characters of [A-Za-z0-9_.:-]) are required. Every value is supplied by the caller: the platform ships no default. Audited (kyc_enforcement_policy.created) with the reason code, IP, user agent and request id in the same transaction. 400 for a malformed or unknown value (including an unknown licensing_jurisdiction_id or asset_code). A draft may coexist with an active policy of the same key; the conflict is raised at activation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KYCEnforcementPolicyCreateRequest" }
      responses:
        "201":
          description: The draft policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KYCEnforcementPolicy" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/kyc/enforcement-policies/{policyID}/activate:
    post:
      summary: Activate a draft KYC enforcement policy (four-eyes)
      description: >
        kyc_enforcement_policy:manage (platform_admin only) AND step-up `critical`. lic10 (L-20). draft to active. The acting administrator must differ from the policy's author (403, enforced by the database); a trigger type the evaluator does not consult cannot be activated (409); a second active policy for the same enforcement key is refused (409, use supersede). A policy that is not a draft is 409. Audited (kyc_enforcement_policy.activated) with the reason code and request evidence. lic18 (security S4): the acting administrator must also be a different PERSON than the author where both staff accounts are linked to a Person (403; accounts without a Person link are compared by account only, the database rule). The audit record carries the after state of the row. NOT BUILT: a signed actor proof on these writes (no existing proof operation fits a platform-scoped KYC policy write; see docs/plans/lic18-record.md).
      security:
        - bearerAuth: []
      parameters:
        - { name: policyID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
