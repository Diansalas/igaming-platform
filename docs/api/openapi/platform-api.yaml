        "409":
          $ref: "#/components/responses/HoldResolutionConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the tenant's withdrawal hold-resolutions
      description: >
        withdrawal_hold_resolution:read (platform_admin only), staff principals only. Up to 100 most recent resolutions of the target tenant, as an object with an items array. Same tenant rule as the request route.
