                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 4F: email verification and password reset
  # (docs/decisions/0030) ---
  /v1/me/email-verification/request:
    post:
      summary: Request a new email-verification token for the caller's own account
      description: >
        Authenticated, self-service. Rate-limited to 3 requests/hour per
        account - in production, and in any deployment without test
        support explicitly enabled, a rate-limited request returns the
        SAME 204 as a successful one (never distinguishable). Any prior
        outstanding token of this purpose is superseded. Delivered via the
        configured EmailProvider (MockProvider in this stage - no
        production SMTP/API dependency).


        Note for the test-support configuration described below: when
        test support IS enabled, a rate-limited request still returns
        `204` (it issued no token, so there is nothing to return) while a
        successful one returns `200` with a token, so the two ARE
        distinguishable in that configuration. That is deliberate and
        confined to non-production deployments - the caller can only ever
        observe the rate-limit state of THEIR OWN account (this endpoint
        is authenticated and self-scoped), which they already know from
        their own request count. The production response shape, and its
        indistinguishability property, are unchanged.


        **Stage 9.4 conditional response shape** (replacing Stage 9.3's
        separate `GET /v1/me/email-verification/dev-token` route, which no
        longer exists): whether this endpoint returns `204` with no body
        or `200` with the raw token in the body depends ENTIRELY on the
        deployment's own server-side configuration
        (`Deps.AccountActivationTestSupportEnabled`, gated by BOTH
        `APP_ENV != "production"` AND `TEST_SUPPORT_ENDPOINTS_ENABLED=true`
        - see `internal/config/config.go`'s `Environment`/
        `TestSupportEndpointsEnabled` doc comments) - never by anything in
        the request. In production, and in any deployment that has not
        explicitly opted into test support, the response is `204` with no
        body, byte-for-byte identical to before Stage 9.4. In a
        staging/non-production deployment with test support explicitly
        enabled, the response is `200` with the raw token in the body -
        STAGING/NON-PRODUCTION TEST SUPPORT ONLY, never available in
        production. The token is only ever the CALLER's own newly-issued
        token (this endpoint is already scoped to the authenticated
        caller, so no new authorization surface is introduced), to be fed
        into the completely unmodified `POST /v1/auth/email-verification/
        confirm` below - token hashing, expiry, and single-use consumption
        are unaffected by this flag either way.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: >-
            Verification email sent, or silently rate-limited. This is the
            ONLY possible success response in production (or any
            deployment without test support explicitly enabled) - no body.
        "200":
          description: >-
            STAGING/NON-PRODUCTION TEST SUPPORT ONLY. Verification email
            "sent" (via the mock EmailProvider), with the caller's own
            newly-issued raw email-verification token also returned
            directly in this response body - never available in
            production. See this operation's own description above for
            the exact two-condition gate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                required: [token]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Email delivery is not configured
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email-verification/confirm:
    post:
      summary: Confirm an email-verification token
      description: >
        Unauthenticated (a player has no session to present at this
        point). One-time use, enforced by an atomic conditional UPDATE -
        never applies its side effect twice under concurrent replay. On
        success, stamps player_accounts.verified_at and transitions the
        account out of pending_verification to active if it is still in
        that exact state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "204":
          description: Email verified
        "400":
          description: Invalid, expired, or already-consumed token
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password-reset/request:
    post:
      summary: Request a password-reset token
      description: >
        Unauthenticated. ALWAYS returns 204 regardless of whether the
        email matches an account or is rate-limited (directive's
        anti-enumeration requirement - never reveals whether a specific
        email belongs to an account). An unknown brand_slug returns 404
        (a brand slug is a public identifier, unlike email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
              required: [brand_slug, email]
      responses:
        "204":
          description: If an account matched, a reset email was sent - identical response otherwise
        "404":
          description: Unknown brand
        "503":
          description: Email delivery is not configured
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password-reset/confirm:
    post:
      summary: Confirm a password-reset token and set a new password
      description: >
        Unauthenticated. One-time use (atomic conditional UPDATE,
        verified exactly-once under real concurrent replay). The new
        password is hashed (Argon2id) ONLY after the token is validated
        and consumed, closing an uncosted-hashing DoS surface found in
        specialist review. On success, revokes every session for the
        account (RevokeAllSessionsForPrincipal) - a completed reset forces
        re-authentication everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                new_password: { type: string }
              required: [token, new_password]
      responses:
        "204":
          description: Password reset - all sessions revoked
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 4F: player verification (KYC) and document management
  # (docs/decisions/0028/0029) ---
  /v1/me/kyc/verifications:
    post:
      summary: Start a new identity-verification attempt for the caller's own account
      description: >
        Authenticated, self-service. PRH-2 E1 (ADR 0095 section 38, ADR
        0106): the vendor submission is ASYNCHRONOUS. This call only records
        the intent - in ONE transaction, a kyc_verifications row in the
        `unverified` state (no provider reference yet) and a durable outbox
        row - and makes NO call to the KYC vendor. A background worker later
        submits it to the registered KYCProvider (MockKYCProvider only - no
        real vendor is integrated; a real vendor is PROVIDER DEPENDENT) and
        the status advances from the vendor's definitive result. A vendor
        outage never changes the status to a failure: the verification stays
        `unverified` and the submission is retried. Alert NOTIFICATION for a
        submission that exhausts its retries is NOT IMPLEMENTED (no route or
        recipient exists; ALERT-DELIVERY-1 is open). At most one verification
        creation is in flight per player account: a repeat call while one is
        still waiting (or being sent) returns 200 with the caller's EXISTING
        verification (same body shape, nothing beyond the verification
        itself); once it has been sent, a new call starts a new verification
        (201). NOT_IMPLEMENTED for any production identity-verification
        vendor.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Verification recorded (status `unverified`; vendor submission pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerVerification"
        "200":
          description: >
            The caller's existing in-flight verification (a repeat create);
            no new verification was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: >
            Identity verification is not configured - includes the KYC-WH-1
            (Stage 10.2, ADR 0091) production/test-support-off case: the
            platform ships no real KYC vendor, so with the MOCK provider
            gated off (cfg.TestSupportRoutesEnabled() == false), player
            self-service KYC is itself unavailable.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the caller's own verification attempts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/kyc/documents:
    post:
      summary: Upload an identity/verification document
      description: >
        Authenticated, self-service, multipart/form-data
        (verification_id, document_type, issuing_country [optional],
        file). Validated server-side (size, sniffed content-type - never
        the client's claimed Content-Type, extension consistency,
        filename sanitization) and malware-scanned (mock scanner, fails
        closed on a scan error) before storage. A reupload of the same
        document_type is a NEW, version-incremented row - never an
        overwrite; documents are immutable after upload except for the
        review fields. PRH-2 E1 (ADR 0106): the call stores the document and
        records, in the same transaction, a durable submission of the current
        document set; it makes NO call to the KYC vendor (a background worker
        submits later, and an identical set is never submitted twice). A
        verification still waiting for its vendor creation accepts the
        upload (its submission waits for the creation); one whose creation
        failed permanently returns 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                verification_id: { type: string, format: uuid }
                document_type:
                  type: string
                  enum: [passport, national_id, drivers_license, proof_of_address, selfie, other]
                issuing_country: { type: string }
                file: { type: string, format: binary }
              required: [verification_id, document_type, file]
      responses:
        "201":
          description: Document stored, pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Verification not found or not owned by the caller
        "503":
          description: Document upload is not configured
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the caller's own documents (every version)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documents, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/kyc/documents/{id}/content:
    get:
      summary: Download the caller's own document content
      description: >
        Every access, successful or not, is audited
        (kyc.document_accessed on success). A document owned by a
        DIFFERENT player account (even within the same tenant) returns
        404, never 403 - enforced at the application layer, not RLS (ADR
        0029 §4a).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Raw document bytes
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Player declared residence (Stage 4I Phase B, HDR-J-3b) ---
  #
  # Self-service only, mirroring /v1/me's own access pattern: no
  # RequirePermission, principal must be a player, subject taken from the
  # token only. A DECLARATION, never a verification - it does not by
  # itself establish jurisdiction (canonical-model §1.2, "evidence is
  # never a source"; HDR-J-2's precedence policy is not implemented in
  # this phase). No history is kept - a new declaration overwrites the
  # previous value outright (see the Stage 4I Phase B implementation
  # notes on erasability, HDR-J-3f).
  /v1/me/residence:
    get:
      summary: Get the caller's own declared residence
      description: >
        Authenticated, self-service. Returns is_set=false (no
        country_code/captured_at) when nothing has been declared yet.
        Not gated by the evidence-collection-active switch - turning
        collection off does not revoke read access to an
        already-declared value.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's declared residence, or is_set=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResidence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a player account
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Declare the caller's own residence (self-declared, unverified)
      description: >
        Refused with 403, writing nothing, when
        jurisdiction_evidence_collection_active is OFF for this
        tenant's declared_residence evidence type - the activation
        boundary is not optional and is never bypassed by a product
        flow. Overwrites any previously declared value.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMyResidenceRequest"
      responses:
        "200":
          description: Declared residence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResidence"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller is not a player account, or declared-residence
            collection is not active for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Responsible Gaming (pre-existing domain; this route was never
  # previously documented in this spec - documenting its full current
  # shape now, not only the Stage 5 addition, to close that gap) ---
  /v1/admin/rg/restrictions:
    get:
      summary: Get or list responsible-gaming restrictions/self-exclusions
      description: >
        rg_restriction:read, tenant-scoped. Two distinct response shapes
        depending on whether `player_account_id` is supplied:
        - Supplied: returns a bare (unpaginated) array of that player's
          restrictions - this is the ORIGINAL, pre-Stage-5 behavior,
          unchanged.
        - Omitted (Stage 5, Operator Back Office MVP addition): returns
          the paginated tenant-wide queue below. No `status` filter
          exists because player_restrictions has no stored status column
          (only the computed, point-in-time `active` field) - only
          `restriction_type` is filterable.
        Self-exclusion enforcement mechanics are unchanged either way -
        this route is visibility only.
      security:
        - bearerAuth: []
      parameters:
        - name: player_account_id
          in: query
          schema: { type: string, format: uuid }
        - name: restriction_type
          in: query
          description: Only used when player_account_id is omitted.
          schema: { type: string, enum: [self_exclusion] }
        - name: limit
          in: query
          description: Only used when player_account_id is omitted.
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          description: Only used when player_account_id is omitted.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: >
            A bare array of RGRestriction when player_account_id is
            supplied, or the paginated envelope when it is omitted.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/RGRestriction" }
                  - allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/RGRestriction" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown player_account_id (only when supplied)
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Responsible gaming, player self-service reads and the original self-exclusion write (ADR 0026) ---
  # Documented by ADR 0115 S4-min (completion audit A6): both routes existed since Stage 4D-RG but were missing from this specification.
  /v1/me/rg/self-exclusion:
    post:
      summary: Self-exclude (player)
      description: >
        Player principals only. Records the player's own PLATFORM-WIDE self-exclusion: it applies to the Person in every brand and tenant and
        cannot be ended early (the table is append-only). `duration_days` is a positive whole number of days; omit it for an INDEFINITE exclusion.
        The suggested durations are served by GET /v1/me/rg/options (an engineering default list, not a legal value). While it is in force the
        player cannot start a launch, place a bet, deposit or claim a bonus; withdrawals of the player's own funds stay possible (ADR 0115).
        Identity and tenant come from the token; a body carrying anything else is 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RGSelfExclusionRequest" }
      responses:
        "201":
          description: The self-exclusion was recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGRestriction" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The player account was not found
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me/rg/status:
    get:
      summary: My own restrictions - self-exclusions and time-outs (player)
      description: >
        Player principals only. Every restriction recorded against the player's Person (row-level security limits the result to the caller's own
        Person), newest first, each with `active` computed at response time. A restriction with `active: true` blocks launches, bets, deposits and
        bonus claims server-side; the UI never decides that.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's restrictions (a bare array, possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RGRestriction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The player account was not found
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me/rg/options:
    get:
      summary: The choices the responsible-gaming screen offers (player)
      description: >
        Player principals only. Read-only; it decides and enforces nothing. For the asset asked about it returns, per amount kind (deposit, loss,
        wager), the periods the configuration allows, the numeric ceiling, whether a limit is mandatory, the scope and the increase cooling-off in
        seconds; the time-out durations in whole hours; and suggested self-exclusion durations in days. Limit configuration comes from the composed
        rg_limit_configs of the player's brand (compliance values, ADR 0115 OQ-2); with `config_in_force: false` every period of the closed
        vocabulary is offered (a protective initial value or decrease needs no configuration). The time-out and self-exclusion duration lists are
        ENGINEERING DEFAULTS unless the configuration lists time-out durations; they are not legal values and the write routes accept any value
        within their documented bounds. `limit_enforcement_enabled` is informational: self-exclusion and time-out are always enforced.
      security:
        - bearerAuth: []
      parameters:
        - { name: asset_code, in: query, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        "200":
          description: The options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGOptions" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The player account was not found
        "500": { $ref: "#/components/responses/InternalError" }

  # --- ADR 0115 slice S2: Responsible Gaming limit, time-out and RG-configuration WRITE APIs ---
  # These record limits and configuration. Since ADR 0115 S4-min the recorded DEPOSIT, LOSS and WAGER limits
  # (and rg_config_missing / rg_limit_required) are enforced inside the deposit, bet and launch transactions of
  # a tenant or brand whose enforcement has been switched on (POST /v1/admin/rg/enforcement; OFF by default).
  # Session-duration and reality-check controls are recorded but NOT enforced (PROVIDER DEPENDENT / future).
  # Every limit and
  # time-out write requires an Idempotency-Key header (1-120 printable ASCII characters): the same key
  # with the same request replays the stored result (header Idempotent-Replayed: true), the same key
  # with a different request is 409 RG_IDEMPOTENCY_MISMATCH. tenant_id, person, brand, scope, the
  # jurisdiction, the classification of a change and every time are server-decided: a body carrying
  # any of them (or any unknown field) is 400.
  /v1/me/rg/limits:
    get:
      summary: My responsible-gaming limits and their history (player)
      description: >
        Player principals only; identity and tenant come from the token. `limits` is one entry per limit key
        (kind, scope, asset, period): the realized value of THAT key and its open pending change, if any. The
        effective limit across scopes and the configuration ceiling (the MIN rule of ADR 0115 2.2) is the
        enforcement read (S3/S4) and is NOT computed here. `history` is the player's own changes, newest
        first; a staff-originated change is marked source staff_on_player_request and carries no staff identity.
        NOTE: the player notification for a staff-originated change is NOT IMPLEMENTED (no player notification
        channel exists); the change is visible here.
      security:
        - bearerAuth: []
      parameters:
        - name: history_limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The caller's limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGMyLimits" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Set, decrease, request an increase of, or remove one of my limits (player)
      description: >
        Player principals only. `value` is REQUIRED: a positive integer (a decimal string of at most 38 digits, in
        asset minor units, or seconds for session_duration) or null to remove the limit. The change is
        classified BY THE DATABASE: an initial value or a decrease takes effect now (201); an increase or a removal
        waits out the configured cooling-off period and, when configured, needs the player's own confirm
        (202, effective_at says when; pending true). The API refuses a value above the composed ceiling
        (422 RG_LIMIT_ABOVE_CEILING) and a period outside the composed allowed_periods
        (422 RG_PERIOD_NOT_ALLOWED); a kind that is not enabled in the configuration is not offered for an increase or
        removal (422 RG_NOT_OFFERED); an increase or removal with no configuration in force is
        409 RG_CONFIG_MISSING. A protective write (initial or decrease) succeeds whatever the enabled state. At most a
        configured number of open pending changes per player (409 RG_PENDING_CAP, an engineering bound).
        An account under identity review may not increase or remove a tenant_person limit (403 RG_IDENTITY_REVIEW).
        Per-player rate limited (429 rate_limited). An unknown field, including tenant_id, is 400.
        Every request, accepted or refused, is audited (rg.limit.change_requested / rg.limit.change_denied).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RGSetLimitRequest" }
      responses:
        "201":
          description: Applied now (initial value or decrease), or the replay of such a request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGLimitChange" }
        "202":
          description: Accepted as a PENDING increase or removal; effective_at says when it takes effect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGLimitChange" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "422": { $ref: "#/components/responses/RGUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/me/rg/limits/changes/{id}/confirm:
    post:
      summary: Confirm a pending increase or removal (player's own session only)
      description: >
        Player principals only. Allowed only once the cooling-off period has run (409 RG_COOLING_OFF before),
        only for the LATEST request of its limit (409 RG_CHANGE_NOT_PENDING otherwise), and only when the change
        awaits a confirmation. A staff-originated increase is never realized without this call.
        An unknown id or another player's change is 404. Audited (rg.limit.confirmed / rg.limit.change_denied).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The confirm row (the limit change now in force)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGLimitChange" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me/rg/limits/changes/{id}/cancel:
    post:
      summary: Cancel a pending increase or removal (player)
      description: >
        Player principals only. Cancels the latest pending request of a limit (the limit stays at its realized
        value); 409 RG_CHANGE_NOT_PENDING when it is not pending. Always allowed while pending (a protective
        action). Audited (rg.limit.cancelled / rg.limit.change_denied).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cancel_pending row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGLimitChange" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me/rg/time-out:
    post:
      summary: Start a time-out (cooling-off break) (player)
      description: >
        Player principals only. A bounded break (duration_hours 1..87600, an engineering bound; the configured
        allowed_durations narrow it, 422 RG_DURATION_NOT_ALLOWED). The request is in WHOLE HOURS while the configuration is in
        seconds: a configured duration that is not a multiple of 3600 s can never be requested through this route. A time-out is a PROTECTIVE write: it succeeds whatever the
        enabled / mandatory state and, with no configuration in force, for any positive duration. It cannot be ended early and
        never changes wallet status (withdrawals keep working). The reach is the configured time_out scope
        (platform_person by default; a configured `account` scope is applied as tenant_person, the broader and more
        protective reach - recorded in the audit row). The restriction is recorded and ENFORCED server-side from then on (ADR 0115 S4-min):
        rg.EvaluateEligibility reads it with the same predicate and lock as a self-exclusion, so while it is active the Person cannot launch, bet,
        deposit or claim a bonus (decision code `timed_out`); withdrawals stay possible. Idempotency-Key: honoured under the person lock against the audit record
        of the earlier request (a replay returns 200 with Idempotent-Replayed: true); it is NOT a database unique constraint.
        Audited (rg.time_out.created / rg.time_out.denied).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RGTimeOutRequest" }
      responses:
        "200":
          description: Replay of an earlier identical request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGRestriction" }
        "201":
          description: The time-out was recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGRestriction" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "422": { $ref: "#/components/responses/RGUnprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/admin/players/{id}/rg/limits:
    get:
      summary: One player's current RG limits (staff)
      description: >
        rg_limit:read (tenant_admin, compliance), tenant-scoped. {id} is resolved inside the caller's tenant: a player of another
        tenant is the same 404 as an unknown id. Same shape as the player's own `limits`.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The player's limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGStaffLimits" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Record a limit change on a player's request (staff)
      description: >
        rg_limit:write_on_player_request (compliance only), tenant-scoped, Idempotency-Key required (the staff key namespace is
        separate from the player's). reason_code and evidence_ref are REQUIRED. DECREASES and initial values only: a staff-originated
        increase or removal is 403 RG_STEP_UP_REQUIRED because ADR 0017 step-up is NOT IMPLEMENTED (and even after it ships it is never
        realized without the player's own confirm). Staff whose Person is the player's Person are refused (403 RG_SELF_TARGET). The
        value is bounded by the same ceiling / period rules as the player's own request. The change appears in the player's own history
        (source staff_on_player_request). The player NOTIFICATION is NOT IMPLEMENTED. Every request is audited.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RGStaffSetLimitRequest" }
      responses:
        "201":
          description: Applied now (or the replay of such a request)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGStaffLimitChange" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "422": { $ref: "#/components/responses/RGUnprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/admin/players/{id}/rg/history:
    get:
      summary: One player's RG limit change history (staff)
      description: >
        rg_limit:read, tenant-scoped; cross-tenant ids are 404. created_by is the staff id of the caller's OWN tenant, else null
        (staffViewer redaction, ADR 0114). Limit history never leaves its tenant.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: The changes, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGStaffHistory" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/admin/rg/enforcement:
    get:
      summary: Is RG limit enforcement switched on for this tenant? (staff)
      description: >
        rg_config:read (tenant_admin, compliance), tenant-scoped. The tenant's activation rows, oldest first. A tenant-wide row (`level: tenant`)
        covers every brand; a `level: brand` row covers one brand. `enforcement_enabled` is true when any row exists. The switch is OFF by default.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The activation rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGEnforcementList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Switch RG limit enforcement ON for this tenant or one brand (staff)
      description: >
        rg_config:write (compliance only; an APPLICATION-enforced check - the database refuses any writer that is not an active staff principal of
        the same tenant), tenant-scoped. ONE-WAY and IRREVERSIBLE: step-up CRITICAL (403 step_up_required without a fresh step-up; security review SR6-1) because with no compliance floor it halts deposits, launches and wagers of the scope. REFUSED with 409 conflict unless the tenant's licence jurisdiction (the one enforcement reads; a tenant with none is refused, detail no_licence_jurisdiction) and every jurisdiction with a configuration in effect have a compliance floor for deposit, loss and wager in every allowed currency (the floor part of R-RG-CONFIG; the message carries the closed detail code); a repeat for an already switched-on scope is not re-checked. There is no disable operation anywhere, the table
        is append-only and holds enabling rows only; switching enforcement off is a recorded decision plus a migration. Once on, a deposit,
        a bet or a launch of the scope is subject to the player's deposit, loss and wager limits, and to `rg_config_missing` (no jurisdiction floor
        in force for the kind and asset: the action is refused) and `rg_limit_required` (a mandatory kind with no value and no numeric ceiling).
        Self-exclusion and time-out are enforced whether or not this is on. Idempotent by state: a repeat for the same scope answers 200 with the
        stored row and writes nothing. `brand_id` (optional) must be a brand of the tenant. Audited (rg.enforcement.activated); a refusal is audited
        as rg.enforcement.activation_denied. The launch readiness check R-RG-CONFIG reports whether this is on and floors are in force.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RGEnforcementRequest" }
      responses:
        "200":
          description: Already switched on for this scope; the stored row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGEnforcement" }
        "201":
          description: Switched on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGEnforcement" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/admin/rg/limit-configs:
    get:
      summary: RG configuration in view of this tenant (staff)
      description: >
        rg_config:read (tenant_admin, compliance), tenant-scoped. Returns the jurisdiction FLOOR rows (readable by every session) and THIS
        tenant's operator rows (row-level security: another tenant's rows are never visible), newest first. created_by is a staff id only
        for operator rows of the caller's own tenant; floor rows are written by platform staff and show null.
      security:
        - bearerAuth: []
      parameters:
        - { name: control_kind, in: query, schema: { type: string, enum: [deposit, loss, wager, session_duration, reality_check_interval, time_out] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: A page of configuration rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGConfigList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Append an operator RG bound for this tenant or one of its brands (staff)
      description: >
        rg_config:write (compliance only; an APPLICATION-enforced check - the database binds the row to a same-tenant principal and to
        tighten-only, not to a permission), tenant-scoped. The jurisdiction is derived from the tenant licence, never the request. Every
        field of the control kind is explicit (a value or an attested {"none":true}); fields that do not apply are refused; there is no default
        and no legal value supplied by the platform (compliance supplies the content). The row appends (append-only) and takes effect now or at a
        future effective_from (a past one is 422 RG_BACKDATED). An operator row may only TIGHTEN restrictive fields and WIDEN option sets
        relative to the floor / tenant row in force (409 RG_OPERATOR_LOOSENS, the field named in the message); with no floor in force there
        is nothing to tighten (409 RG_NO_FLOOR_IN_FORCE). attestation_ref is printable ASCII; SYNTHETIC-NOT-LEGAL configuration is refused
        outside development/test (422 RG_SYNTHETIC_REFUSED). Audited with before/after; a refusal is audited as rg.limit_config.operator_denied.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RGOperatorConfigRequest" }
      responses:
        "201":
          description: The appended operator row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGConfig" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "422": { $ref: "#/components/responses/RGUnprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/admin/platform/rg/limit-config-change-requests:
    get:
      summary: Jurisdiction floor change requests - the approval queue (platform staff)
      description: >
        rg_floor:read (platform_admin only), platform-scoped tokens only (a tenant-scoped caller is 403).
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: A page of requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGFloorRequestList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Propose a jurisdiction floor row (platform staff)
      description: >
        rg_floor:request (platform_admin only), platform-scoped tokens only, with a signed actor proof (ADR 0110, operation
        rg_limit_config:request) bound to the proposal. The proposal is a FLOOR row of the named jurisdiction; effective_from is REQUIRED,
        in the future and within the 72h request lifetime. The payload_hash is derived by the database from the proposed row. Nothing is in
        force until a DIFFERENT staff member AND Person approves. No legal value is supplied by the platform: compliance supplies the content
        and a named signatory in attestation_ref. Audited as rg.limit_config.floor_requested (platform-scope row).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RGFloorRequestBody" }
      responses:
        "201":
          description: The pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGFloorRequest" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "422": { $ref: "#/components/responses/RGUnprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/admin/platform/rg/limit-config-change-requests/{id}/approve:
    post:
      summary: Approve a floor change request and apply it (platform staff)
      description: >
        rg_floor:decide (platform_admin only), platform-scoped tokens only. Four-eyes is enforced by the DATABASE: the approver's Person must
        differ from the requester's (409 RG_SELF_APPROVAL), the request must be pending and unexpired (409 RG_REQUEST_NOT_PENDING), and the
        approval carries a signed actor proof bound to the request id and payload hash (403 RG_PROOF_REFUSED otherwise). The approved payload is
        APPLIED in the same transaction (a second signed proof, rg_limit_config:apply) as an append-only floor row, hash-bound to the approval; a
        request is single-use. If effective_from has passed by the time of approval, the apply is refused (422 RG_BACKDATED) and the whole
        approval rolls back: file a new request. Audited (rg.limit_config.floor_approved with before/after and attestation_ref).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The approved request (applied_config_id names the floor row)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGFloorRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "422": { $ref: "#/components/responses/RGUnprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/admin/platform/rg/limit-config-change-requests/{id}/reject:
    post:
      summary: Reject a floor change request (platform staff)
      description: >
        rg_floor:decide (platform_admin only), platform-scoped tokens only, signed proof (rg_limit_config:reject). The requester's Person
        may not decide (409 RG_SELF_APPROVAL). Audited (rg.limit_config.floor_rejected).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The rejected request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RGFloorRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/admin/platform/rg/limit-config-change-requests/{id}/cancel:
    post:
      summary: Cancel a pending floor change request (platform staff, requester only)
      description: >
        rg_floor:request (platform_admin only), platform-scoped tokens only, signed proof (rg_limit_config:cancel). Only the requester may
        cancel (403). Audited (rg.limit_config.floor_cancelled).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
