  /v1/admin/tenants/{tenantID}/payment-attempts:
    get:
      summary: List the tenant's payment attempts (ADR 0114 R1, read-only)
      description: >
        payment_force_resolve:read ALONE (finance, compliance, platform_admin); withdrawal:review is not accepted. Staff principals only.
        Read-only view of deposit and payout attempts (the parked and disputed queue is `state=disputed`) with the closed park-reason catalogue, the
        open K3 force-resolution id and the resolution kinds the request path would currently admit (`admissible_kinds`, a hint: the request path
        re-checks in the database). Never returned: the provider reference text (only `has_provider_reference`), the merchant reference, the
        idempotency key, a player or wallet id, any destination or instrument detail, a staff id.
        Tenant: the {tenantID} path value only. A tenant-scoped caller may name only its own tenant (otherwise 404, no data); a platform caller may
        name any existing tenant, and that read is first recorded as a tenant-visible platform-action audit row (`payment_attempts.platform_read`);
        if the audit row cannot be written nothing is returned (500). No client-supplied tenant id is read from the query string: an unknown query
        parameter is 400.
        Pagination is a keyset on (created_at, id) descending: pass the previous page's `next_cursor` as `cursor`; `next_cursor` is null on the last page.
        A cursor is a position only; tenant scope is applied on every call. `limit` is 1..200 (default 50); anything else is 400. Unknown `operation`,
        `state` or `terminal_reason` values are 400 (the `other` bucket applies to output only).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: operation
          in: query
          schema: { type: string, enum: [payout, deposit] }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/PaymentAttemptState" }
        - name: terminal_reason
          in: query
          description: Exact match on a catalogue value (the `other` bucket is output-only and is refused as input).
          schema: { $ref: "#/components/schemas/PaymentAttemptTerminalReason" }
        - name: withdrawal_request_id
          in: query
          schema: { type: string, format: uuid }
        - name: provider_id
          in: query
          description: A10c. Exact match on the attempt's provider id (the closed provider-id charset; no pattern or wildcard).
          schema: { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        - name: min_age_seconds
          in: query
          description: A10c. Only attempts created at least this many seconds ago (created_at <= now() - N s). 0..31536000.
          schema: { type: integer, minimum: 0, maximum: 31536000 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous page's next_cursor.
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: One page of payment attempts, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAttemptPage" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
