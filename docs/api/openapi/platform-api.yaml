        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/RGForbidden" }
        "404": { $ref: "#/components/responses/RGNotFound" }
        "409": { $ref: "#/components/responses/RGConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/RGUnavailable" }

  /v1/admin/kyc/cases:
    get:
      summary: KYC case queue - tenant-wide (Stage 5, Operator Back Office MVP)
      description: >
        verification:read, tenant-scoped. Unlike
        GET /v1/admin/kyc/verifications below (which requires an
        already-known player_account_id), this is the tenant-wide
        operational queue a compliance operator lands on. Existing
        review/decision endpoints are unchanged - this is additive
        read-only visibility. Each item carries a read-only, derived
        `submission_state` (PRH-2 E1, ADR 0106 section 7.2): where the
        verification's vendor submission is (none, queued, sent, failed,
        cancelled), plus the closed error class or cancel reason for failed
        or cancelled. It is the ONLY place a stranded submission becomes
        visible: alert notification is NOT IMPLEMENTED (no route or
        recipient). It exposes no vendor reference, document data or
        counters, and enforcement never reads it.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [unverified, pending, review_required, approved, rejected, expired] }
        - name: player_account_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated KYC case queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/kyc/verifications:
    get:
      summary: List a player account's verification attempts (compliance/tenant admin)
      description: >
        Requires verification:read (compliance or tenant_admin,
        read-only for tenant_admin). Requires a real tenant context -
        scoped to the caller's own tenant only. Each item carries the
        read-only derived `submission_state` described on
        GET /v1/admin/kyc/cases.
      security:
        - bearerAuth: []
      parameters:
        - name: player_account_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Verifications for the named player account, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Verification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/verifications/{id}/review:
    post:
      summary: Approve, reject, or flag a verification for further review
      description: >
        Requires verification:review (compliance only - never
        tenant_admin/platform_admin/finance, directive §19). Rejects with
        409 if the verification is already in a terminal status
        (approved/rejected/expired).


        Optionally records a KYC-verified residence determination in the
        SAME call (Stage 4I Phase B, HDR-J-3c) via
        verified_residence_country - omit the field entirely for a
        review that makes no residence determination. A determination
        can be attached to a non-terminal transition (e.g.
        review_required) and is overwritable by a later review call on
        the same verification; there is no separate clear/revoke
        operation. Refused with 403 or the whole call fails and nothing
        is written, including the status transition itself, when
        jurisdiction_evidence_collection_active is OFF for this
        tenant's verified_residence evidence type. The value is never
        returned on this or any other verification response - only
        presence/provenance are tracked internally
        (kyc_verifications.verified_residence_set_at/set_by) for a
        future phase's read surface.

        Step-up class: classifier kycResidenceReviewClass (owner
        decision 3, SRME-1). The recorded residence is the evidence that
        admits deposit, launch and sportsbook placement, so a review
        that carries verified_residence_country is critical (a stale
        second factor gets 403 step_up_required and nothing is
        written); a review without it needs no step-up. A residence
        recorded in a country the brand currently serves also writes the
        audit action market.residence_into_open_market (ids only, never
        the country) and, in the same transaction, raises the durable
        platform alert kyc.residence_into_open_market (p2; attributes
        verification_id, brand_id, request_id; one open alert per
        verification) - a failure that cannot be swallowed rolls the whole
        review back. There is no maker-checker for KYC reviews in the
        permission model.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [approved, rejected, review_required] }
                reason: { type: string }
                verified_residence_country:
                  type: string
                  example: "ES"
                  description: >
                    ISO 3166-1 alpha-2. Optional. Never inferred from a
                    document's issuing country
                    (docs/governance/stage-4i-canonical-model.md §1.2) -
                    this is the sole path that may set it, and only by
                    explicit reviewer input.
              required: [status]
      responses:
        "200":
          description: Verification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller lacks verification:review, or (when
            verified_residence_country is set) verified_residence
            evidence collection is not active for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Verification is already in a terminal status
        "500":
          $ref: "#/components/responses/InternalError"

