                status: { type: string, enum: [approved, rejected, review_required] }
                reason: { type: string }
                verified_residence_country:
                  type: string
                  example: "ES"
                  description: >
                    ISO 3166-1 alpha-2. Optional. Never inferred from a
                    document's issuing country
                    (docs/governance/stage-4i-canonical-model.md §1.2) -
                    this is the sole path that may set it, and only by
                    explicit reviewer input.
              required: [status]
      responses:
        "200":
          description: Verification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller lacks verification:review, or (when
            verified_residence_country is set) verified_residence
            evidence collection is not active for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Verification is already in a terminal status
        "500":
          $ref: "#/components/responses/InternalError"

