        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/kyc/verifications/{id}/residence-approval:
    post:
      summary: Approve one residence determination as the second Person
      description: >
        verification:review (compliance), tenant-scoped sessions only, AND step-up `critical`. lic10, migration 0181. Makes the determination market evidence. Bound to the exact `determined_at` listed for it: a newer determination makes the approval 404. The approver must be a different staff account AND a different, linked Person than the determiner (403 four-eyes). A determination that needs no approval, or already has one, is 409. Needs a signed actor proof. Audited as kyc.residence_determination_approved with ids only: never the country.
