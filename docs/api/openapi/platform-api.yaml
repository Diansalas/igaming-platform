      responses:
        "200":
          description: Offer published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/manual-grants:
    post:
      summary: Issue a manual grant request (phase 1 - issued, not yet activated)
      description: >
        Requires bonus_grant:issue and an already-minted, approved EOI
        (parent_operation_id). Creates the Grant in status `issued` -
        deliberately NOT four-eyes gated at this step (T.2: issuance moves
        no value). File the manual_grant_issue change request against this
        Grant's own returned id AFTER this call, before calling the
        activate endpoint below (migration 0063's SEP-1 trigger requires
        the Grant row to already exist at approval time).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_account_id: { type: string, format: uuid }
                campaign_id: { type: string, format: uuid }
                campaign_version_id: { type: string, format: uuid }
                offer_id: { type: string, format: uuid }
                offer_version_id: { type: string, format: uuid }
                asset_code: { type: string }
                funding_source: { type: string }
                parent_operation_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
              required: [player_account_id, campaign_id, campaign_version_id, offer_id, offer_version_id, asset_code, funding_source, parent_operation_id]
      responses:
        "201":
          description: Grant issued, status=issued
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission, EOI check failed, or the T.2 gate denied (RG/Risk)
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/manual-grants/{grantID}/activate:
    post:
      summary: Activate an issued manual grant (phase 2 - four-eyes AND EOI budget consumed)
      description: >
        Requires bonus_grant:issue AND a pending bonus_change_requests row
        (operation=manual_grant_issue, target_id=grantID, payload matching
        player_account_id/offer_version_id/asset_code/amount exactly) with
        the tenant's configured number of distinct approvals. Both the
        four-eyes consume and the EOI locking-budget consume run inside
        the SAME PostGateHook, strictly after the T.1 gate chain and
        strictly before the effecting ledger write.
      security:
        - bearerAuth: []
      parameters:
        - name: grantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_operation_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                amount: { type: string }
              required: [parent_operation_id, amount]
      responses:
        "200":
          description: Grant activated
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Four-eyes approval not satisfied, EOI budget exhausted, or the T.1 gate denied
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Grant is not in a state that can be activated
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/bulk-jobs:
    post:
      summary: Create a BulkGrantJob targeting a static player list
      description: >
        Requires bonus_bulk:execute. target_kind is restricted to
        single_player/player_list this Wave (live segment resolution is
        out of scope - internal/segment does not exist). Idempotent on
        (tenant_id, idempotency_key) - a resubmission of the identical job
        spec resolves to the existing job.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_id: { type: string, format: uuid }
                offer_version_id: { type: string, format: uuid }
                target_kind: { type: string, enum: [single_player, player_list] }
                target_player_account_ids: { type: array, items: { type: string, format: uuid } }
                idempotency_key: { type: string }
              required: [campaign_id, offer_version_id, target_kind, target_player_account_ids, idempotency_key]
      responses:
        "201":
          description: Job created (or the existing one, on an idempotent retry)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/bonus/bulk-jobs/{jobID}/execute:
    post:
      summary: Execute an approved BulkGrantJob (four-eyes gated, runs synchronously)
      description: >
        Requires bonus_bulk:execute AND a pending bonus_change_requests row
        (operation=bulk_job_execute, target_id=jobID) with the tenant's
        configured number of distinct approvals, whose `payload` contains
        the ECONOMIC payload being approved (Stage 4H-B1 Wave 3 Phase 6,
        `security` - a bare `{"action":"execute"}` pinned nothing, so an
        approval for a modest bulk grant authorized an arbitrarily larger
        one):
        `{"action":"execute","offer_version_id":"<uuid>","asset_code":"<code>","amount_per_recipient":"<decimal-string>","recipient_count":<int>,"recipient_set_hash":"<sha256-hex>"}`,
        where `recipient_set_hash` is SHA-256 over the recipient
        player_account_ids lowercased, de-duplicated, sorted ascending and
        joined with a newline. Runs the job SYNCHRONOUSLY within this
        request (a disclosed, reversible engineering decision - a future
        background-worker invocation can call the identical job-runner
        unchanged). Per-item outcomes roll up to the job's own final
        status (completed | partially_completed | failed).
      security:
        - bearerAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jurisdiction_code: { type: string }
                amount: { type: string }
              required: [amount]
      responses:
        "200":
          description: Job executed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permission or four-eyes approval not satisfied
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Asset Registry / Asset Authorization (ADR 0037, Stage 4H-B0-R6) ---
  #
  # Split along ADR 0037 §C.1's two tiers: /v1/admin/assets/** is
  # asset_registry:manage (platform_admin only, layers 1-3), and
  # /v1/admin/asset-authorizations/** is asset_authorization:write
  # (tenant-scoped, layers 4-7). There is deliberately NO endpoint that
  # evaluates eligibility: AssetAuthorization.CheckEligibility resolves
  # tenant/brand/jurisdiction server-side, and exposing it over HTTP would
  # mean accepting a jurisdiction identifier from a caller.
  /v1/admin/assets:
    get:
      summary: List the platform asset registry
      description: Requires asset_registry:manage (platform_admin only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create an asset (layer 1, dual-controlled)
      description: >
        Requires asset_registry:manage AND a pending change request for
        this code, approved by a DIFFERENT platform principal (ADR 0037
        §C.5.3), whose payload matches the identity fields exactly. The
        body has no `active`/`platform_authorized` field by design (§C.5.5:
        creation must never authorize any financial operation) and unknown
        fields are rejected. Returns 409 when no approved request exists.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, asset_type, decimal_exponent, display_name, reason_code]
              properties:
                code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                display_name: { type: string }
                network: { type: string, description: Required for a crypto asset }
                reason_code: { type: string }
      responses:
        "201":
          description: Created - always inactive and not platform-authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests:
    post:
      summary: File a four-eyes change request
      description: >
        Requires asset_registry:manage. Only the four dual-controlled
        operations are representable - suspend/revoke are deliberately
        single-actor kill-switches (ADR 0037 §C.5.3). The requesting
        principal must resolve to a platform-scoped staff row that carries
        a confirmed Person linkage and an active status (migration 0047);
        a principal failing any of those is 403, not 400.
        operation=platform_operation_eligibility is the layer-7
        PLATFORM-WIDE default GRANT (§C.5.1 op 9) and requires
        eligibility_operation; eligibility_product may be omitted, meaning
        every product. One approval authorizes exactly that
        (asset, operation, product) grant, once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, asset_code, reason_code]
              properties:
                operation:
                  type: string
                  enum: [create, activate, platform_authorize, platform_operation_eligibility]
                asset_code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                network: { type: string }
                eligibility_operation:
                  type: string
                  enum: [deposit, withdrawal, wagering, settlement, conversion, reporting]
                  description: >
                    Required for operation=platform_operation_eligibility,
                    rejected for any other operation.
                eligibility_product:
                  type: string
                  description: >
                    Omit for "every product". Rejected for any operation
                    other than platform_operation_eligibility.
                reason_code: { type: string }
      responses:
        "201":
          description: Request filed (state = pending)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests/{id}/decision:
    post:
      summary: Approve or reject a change request
      description: >
        Requires asset_registry:manage. Returns 409 for a self-approval,
        for a second decision by the same principal (reported as a
        duplicate decision, distinct from self-approval), or for a
        principal that resolves to the same PERSON as the requester -
        all enforced by the database (migrations 0044/0047, mirroring
        withdrawal_approvals). Returns 403 when the deciding principal is
        not platform-scoped, carries no confirmed Person linkage, or is
        not active: that last set is a property of the actor, and the
        Person-linkage condition is what makes the same-person check real
        rather than inert (migration 0047).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code: { type: string }
      responses:
        "201":
          description: Decision recorded (immutable)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  # --- Casino catalogue four-eyes governance (Stage 9.2, ADR 0081 §5.2,
  # ARCH-DB-2 Phase 2). Documented here, alongside the analogous asset
  # change-request endpoints above, rather than next to the pre-existing
  # (undocumented) Stage 4A casino admin routes - see the casino round-
  # history section's own note on that pre-existing documentation debt,
  # which this addition does not attempt to backfill. ---
  /v1/admin/casino/games/{gameID}/change-requests:
    post:
      summary: File a four-eyes catalogue change request
      description: >
        Requires casino_catalogue:govern. Only the two fail-open/
        compliance-widening transitions are representable
        (ADR 0081 §5): removing one or more codes from a game's
        jurisdiction_blocklist, and re-enabling a disabled game
        (status 'disabled' -> 'active'). Adding a blocklist code and
        disabling a game are the fail-closed direction and remain
        single-actor via PUT /v1/admin/casino/games, unaffected by this
        endpoint. removed_codes must each currently be present in the
        game's blocklist.
      security:
        - bearerAuth: []
      parameters:
        - name: gameID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, reason_code]
              properties:
                operation:
                  type: string
                  enum: [jurisdiction_unblock, status_activate]
                removed_codes:
                  type: array
                  items: { type: string }
                  description: >
                    Required (non-empty) for operation=jurisdiction_unblock,
                    rejected for status_activate.
                reason_code: { type: string }
      responses:
        "201":
          description: Request filed (state = pending)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/casino/change-requests/{requestID}/approvals:
    post:
      summary: Approve or reject a catalogue change request
      description: >
        Requires casino_catalogue:govern. Returns 409 for a self-approval,
        a second decision by the same principal (reported as a duplicate
        decision, distinct from self-approval), or a decision on a
        request that has already left the pending state (applied,
        rejected, or cancelled) - all enforced by the database
        (migration 0086, mirroring the asset-registry four-eyes
        precedent). Returns 403 when the deciding principal does not
        resolve to a platform-scoped staff row. Approving a
        jurisdiction_unblock request only ever authorizes the EXACT set
        of codes named in the request that was approved - a later attempt
        to remove a different or larger set of codes is refused even with
        a valid approval on file.
      security:
        - bearerAuth: []
      parameters:
        - name: requestID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code: { type: string }
      responses:
        "201":
          description: Decision recorded (immutable)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}:
    patch:
      summary: Update mutable asset metadata (layer 1)
      description: >
        Requires asset_registry:manage. display_name is the ONLY mutable
        field: code/decimal_exponent/asset_type/network are immutable
        (ADR 0037 §C.5.4), are not accepted in this body, and are refused
        by a database trigger regardless.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, reason_code]
              properties:
                display_name: { type: string }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/activation:
    put:
      summary: Activate or suspend an asset (layer 2)
      description: >
        Requires asset_registry:manage. `value: true` additionally requires
        an approved activate request (409 otherwise); `value: false` is
        deliberately single-actor - an incident kill-switch must not wait
        for a second approver (ADR 0037 §C.5.3). `value` is mandatory:
        defaulting a missing boolean would make granting reachable by
        omission.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/platform-authorization:
    put:
      summary: Grant or revoke platform authorization (layer 3)
      description: >
        Requires asset_registry:manage. ADR 0037 §C.5.1 operation 5 - the
        asset's own platform clearance, NOT ProviderCapability (ADR 0022),
        which is a different concept. Granting requires an approved
        platform_authorize request; revoking does not.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/operation-eligibility:
    put:
      summary: Set the PLATFORM-WIDE operation eligibility default (layer 7)
      description: >
        Requires asset_registry:manage (platform tier of ADR 0037 §C.5.1
        operation 9). `product` omitted means every product; a
        product-specific row always wins over it. Returns 403 if the asset
        is not platform-authorized - nothing may be made eligible for an
        asset the platform has not cleared.


        FOUR-EYES: eligible=true is DUAL-CONTROLLED (§C.5.3). It requires
        an approved platform_operation_eligibility change request for this
        exact (asset, operation, product); without one the response is
        409. This row is a platform-wide gate for every tenant, and until
        migration 0047 a single platform-admin credential could flip it.
        eligible=false (revocation) is deliberately single-actor - the
        fail-closed direction must never wait for a second approver - and
        an idempotent re-write of an already-eligible row needs no new
        approval.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Platform-wide default written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations:
    get:
      summary: List this tenant's asset authorizations (layers 4-6)
      description: Requires asset_authorization:write and a tenant-scoped token.
      security:
        - bearerAuth: []
      parameters:
        - name: asset_code
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Authorization facts visible to the caller's tenant
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/{scopeKind}:
    put:
      summary: Authorize an asset for this tenant, a brand, or a jurisdiction (layers 4/5/6)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. The
        tenant is ALWAYS taken from the verified token, never from the body
        (ADR 0038 §11's rule, applied here). brand_id/jurisdiction_id name
        which brand/jurisdiction is being configured; a composite foreign
        key plus RLS mean neither can belong to another tenant. Returns 403
        when the write would widen past the layer above it (a
        non-platform-authorized asset, or a brand grant with no tenant
        grant behind it) - refused at write time, not only at resolution
        time.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeKind
          in: path
          required: true
          schema: { type: string, enum: [tenant, brand, jurisdiction] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_code, eligible, reason_code]
              properties:
                asset_code: { type: string }
                brand_id: { type: string, format: uuid, description: Required for scopeKind=brand }
                jurisdiction_id: { type: string, format: uuid, description: Required for scopeKind=jurisdiction }
                product: { type: string, description: Omitted means every product }
                eligible: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Authorization fact written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/operation-eligibility/{code}:
    put:
      summary: Narrow the operation eligibility for this tenant (layer 7 override)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. A
        tenant override may only NARROW the platform-wide default: a
        widening write returns 403 and is never stored (ADR 0037 §A.6).
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Tenant override written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Jurisdiction Registry, Resolution-Active, and Tenant-Licence
  # binding (Stage 4I, docs/governance/stage-4i-canonical-model.md §11.1
  # items B-1/B-6, and Phase A item B-4) ---
  #
  # Split along the canonical model's own platform-vs-tenant line,
  # mirroring the Asset Registry split above: /v1/admin/jurisdictions and
  # /v1/admin/licences are jurisdiction_registry:manage (platform_admin
  # only) - platform-wide reference data with no row-level security
  # (jurisdictions/licences are FK targets every tenant-scoped transaction
  # ultimately reads through resolution, not tenant-owned rows).
  # /v1/admin/jurisdiction-resolution-active/** is
  # jurisdiction_resolution_active:write (tenant_admin only, RLS-scoped to
  # the caller's own tenant) - GET shares the same write permission because
  # no separate read permission exists for this fact.
  # /v1/admin/tenants/{tenantID}/licence is tenant_licence:assign
  # (platform_admin only) - the tenant is named by the path, never the
  # body, and platform_admin may target any tenant.
  #
  # There is deliberately NO endpoint that RESOLVES a jurisdiction for a
  # player or tenant: internal/jurisdiction.Resolve takes tenant/brand/
  # player as server-resolved values and is consumed IN-PROCESS ONLY,
  # never over HTTP. jurisdiction_admin_routes.go's own header comment
  # explains why - an HTTP endpoint accepting a jurisdiction identifier
  # from a caller would be exactly the spoofable-input shape Stage 4H-B0-R5
  # finding S-6a (and this stage's own JV-1/JV-2 ruling) forbids.
  /v1/admin/jurisdictions:
    get:
      summary: List the platform jurisdiction registry
      description: >
        Requires jurisdiction_registry:read (platform_admin only). Step-up none.
        Platform-wide reference data with no tenant scoping - returns
        every jurisdiction row regardless of the caller's own tenant (a
        platform_admin token has none).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full jurisdiction registry, ordered by code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Jurisdiction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a jurisdiction (platform-wide reference row)
      description: >
        Requires jurisdiction_registry:manage (platform_admin only). Not
        four-eyes gated - unlike the Asset Registry's own `create`, no
        dual-control mechanism exists for this registry today. Requires
        reason_code, recorded on an audit entry with tenant_id NULL (a
        genuinely platform-wide reference row, not a tenant-owned one). A
        duplicate `code` returns 400, not 409 - jurisdiction.ErrInvalidInput
        is the sole domain-error sentinel this registry's write path maps
        to a client error, and writeJurisdictionRegistryError maps it to
        400 regardless of the underlying database condition (unique
        violation or otherwise).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
                regulatory_body: { type: string }
                notes: { type: string }
                reason_code: { type: string }
              required: [code, name, reason_code]
      responses:
        "201":
          description: Jurisdiction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurisdiction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/licences:
    get:
      summary: List the platform licence registry
      description: >
        Requires jurisdiction_registry:read (platform_admin only). Step-up none.
        Platform-wide reference data with no tenant scoping, ordered by
        created_at. Each licence carries `tenant_ids`, the tenants whose licence
        binding names it (platform staff only; empty when unbound). The list is
        not paginated (a bare array, as before).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full licence registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: File a licence creation (licence_create licensing change; MKT-DUAL-1)
      description: >
        Requires jurisdiction_registry:manage (platform_admin only) and licensing_change:request. Since migration 0177
        (licensing audit G-2) this route no longer writes the licence: the request body is unchanged, but it files a
        `licence_create` licensing change and answers 202 with the change request. The licence is created only when two
        approvals by distinct Persons (neither the requester's Person) are recorded through
        POST /v1/admin/licensing-changes/{changeID}/approve (signed actor proof, ADR 0110); the database refuses any other
        runtime INSERT into licences (LC040). `status` of the created licence is `active`. An unknown jurisdiction_id
        returns 400. reason_code must be a code (1..64 characters of [A-Za-z0-9_.:-]). Step-up: critical. A licensing
        change record is not a legal or regulatory authorisation.
        `status` always starts `active`; status, dates, review date and evidence reference change only through the
        lifecycle endpoints below (PUT /v1/admin/licences/{licenceID}/...).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jurisdiction_id: { type: string, format: uuid }
                licensee:
                  type: string
                  enum: [platform, tenant]
                licence_number: { type: string }
                permitted_products:
                  type: array
                  items: { type: string }
                permitted_markets:
                  type: array
                  items: { type: string }
                reason_code: { type: string }
              required: [jurisdiction_id, licensee, licence_number, reason_code]
      responses:
        "202":
          description: The licence_create change request was filed (status requested; nothing is created yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensingChangeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LicensingChangeForbidden"
        "409":
          $ref: "#/components/responses/LicensingChangeConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LicensingChangeUnavailable"
  /v1/admin/jurisdiction-resolution-active:
    get:
      summary: List the caller's own tenant's jurisdiction-resolution-active facts
      description: >
        Requires jurisdiction_resolution_active:write (tenant_admin only)
        and a real tenant context - GET shares the mutating permission
        because no separate read permission exists for this fact. An
        admin/diagnostics read only; never consumed by any enforcement
        path (enforcement uses the narrow, read-only IsActive accessor for
        exactly one (tenant, operation_class) pair, in-process).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: This tenant's resolution-active facts, ordered by operation_class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JurisdictionResolutionActive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/jurisdiction-resolution-active/{operationClass}:
    put:
      summary: Set whether jurisdiction resolution is genuinely active for one operation class
      description: >
        Requires jurisdiction_resolution_active:write (tenant_admin only).
        Deliberately single-actor (no four-eyes): this records an
        ENGINEERING precondition fact, not a financial or player-facing
        authorization decision, and Risk's own future consumer (R-2b)
        treats "not recorded" as inactive/fail-closed regardless of who
        flips it. Requires reason_code, recorded on the audit entry
        alongside the before/after active value. An unknown
        operationClass path segment returns 400.
      security:
        - bearerAuth: []
      parameters:
        - name: operationClass
          in: path
          required: true
          schema:
            type: string
            enum: [play, catalogue_availability, bonus_issuance, bonus_conversion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
                reason_code: { type: string }
              required: [active, reason_code]
      responses:
        "200":
          description: Resolution-active fact written (created or updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionResolutionActive"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/licences/{licenceID}/status:
    put:
      summary: Set a licence status (regulator suspension, expiry, reinstatement)
      description: >
        Requires jurisdiction_registry:manage (platform_admin only; a tenant-scoped
        token is refused 403) AND step-up `critical` (a stale second factor is
        refused 403 step_up_required). The licence id comes from the path; no
        tenant id is read. `reason_code` is required and recorded, with the
        before and after state and the change kind, on one audit entry in the
        same transaction; a licence_versions history row is written by trigger.
        Since migration 0178 (lic4 slice 4a) the write is a licensing change and the request body is
        unchanged. The DATABASE classifies the change against the current licence: a WIDENING change (status
        toward `active`, a later or cleared `expires_at`, an earlier or cleared `issued_at`, a postponed or
        cleared `review_due_at`) is filed and answers 202 with the change request; it takes effect only when
        two approvals by distinct Persons (neither the requester's Person) are recorded through
        POST /v1/admin/licensing-changes/{changeID}/approve. A NARROWING or neutral change (suspend, expire,
        shorten a date, bring a review date forward, any evidence-reference change) executes in the same
        transaction (single actor plus step-up) and answers 200; the response `change_kind` and
        `change_request_id` say which class applied. reason_code must be a code (1..64 characters of
        [A-Za-z0-9_.:-]). Also requires licensing_change:request. Nothing here is a legal or regulatory
        authorisation.

        The vocabulary is `active`, `suspended`, `expired` only. A regulator
        revocation is recorded as `expired` with a reason code (a distinct
        `revoked` status is a pending human decision). Setting the current
        status again returns 400. A suspended or expired licence makes the
        runtime market gate refuse registration, deposit, casino launch and
        sportsbook wagering for every tenant bound to it, on the next request.
      security:
        - bearerAuth: []
      parameters:
        - name: licenceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended, expired] }
                reason_code: { type: string }
              required: [status, reason_code]
      responses:
        "200":
          description: Licence changed; the response carries the classified change kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenceChange"
        "202":
          description: A widening change was filed as a licensing change; nothing has changed yet (two approvals execute it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensingChangeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LicensingChangeConflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LicensingChangeUnavailable"
  /v1/admin/licences/{licenceID}/validity-dates:
    put:
      summary: Set the licence issue and expiry dates
      description: >
        Requires jurisdiction_registry:manage (platform_admin only; a tenant-scoped
        token is refused 403) AND step-up `critical` (a stale second factor is
        refused 403 step_up_required). The licence id comes from the path; no
        tenant id is read. `reason_code` is required and recorded, with the
        before and after state and the change kind, on one audit entry in the
        same transaction; a licence_versions history row is written by trigger.
        Since migration 0178 (lic4 slice 4a) the write is a licensing change and the request body is
        unchanged. The DATABASE classifies the change against the current licence: a WIDENING change (status
        toward `active`, a later or cleared `expires_at`, an earlier or cleared `issued_at`, a postponed or
        cleared `review_due_at`) is filed and answers 202 with the change request; it takes effect only when
        two approvals by distinct Persons (neither the requester's Person) are recorded through
        POST /v1/admin/licensing-changes/{changeID}/approve. A NARROWING or neutral change (suspend, expire,
        shorten a date, bring a review date forward, any evidence-reference change) executes in the same
        transaction (single actor plus step-up) and answers 200; the response `change_kind` and
        `change_request_id` say which class applied. reason_code must be a code (1..64 characters of
        [A-Za-z0-9_.:-]). Also requires licensing_change:request. Nothing here is a legal or regulatory
        authorisation.

        Both keys are required; `null` clears. Dates are UTC calendar dates
        (YYYY-MM-DD). `expires_at` must be after `issued_at` when both are set.
