openapi: 3.0.3
info:
  title: "platform-api (Stage 2: identity + tenancy + security)"
  version: "0.2.0"
  description: >
    Health/readiness, player identity/auth, staff auth, and tenant/brand/
    staff/player administration endpoints through Stage 2. This is NOT the
    full platform API - wallet/ledger, bonus, payments, casino, sportsbook,
    and production KYC/AML APIs are added in their owning stages (see
    docs/active-stage.md and docs/architecture/04-api-architecture.md for
    the conventions those additions must follow: versioned paths, the
    shared error envelope below, idempotency-key support on mutating
    endpoints).


    Authentication is HMAC-signed JWTs with key-id-based rotation support
    (see the bearerAuth security scheme below and docs/decisions/0011).
    This remains explicitly PROVIDER DEPENDENT / foundation-only -
    production authentication may move to a real identity provider or
    KMS-managed asymmetric signing before go-live; see
    docs/architecture/05-identity-architecture.md.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: >
        Reports whether the process is up. Never checks the database -
        see /readyz for that - so a database outage does not cause an
        orchestrator to kill and restart an otherwise-healthy process.
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Readiness probe
      description: Reports whether the instance can serve traffic (checks database connectivity).
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Not ready (e.g. database unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  reason:
                    type: string
                    example: database unreachable

  # --- Player auth ---
  /v1/auth/register:
    post:
      summary: Register a new player account
      description: >
        Creates a Person, a PlayerAccount under the given brand, and an
        initial session in one atomic transaction. tenant_id is always
        derived server-side from the resolved brand - never accepted from
        the client (CLAUDE.md's absolute multi-tenancy rule).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
              required: [brand_slug, email, password]
      responses:
        "201":
          description: Account created; returns an initial token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Unknown brand_slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An account with this email already exists for this brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/login:
    post:
      summary: Log in as a player
      description: >
        Verifies credentials against the brand-scoped player account.
        Subject to Postgres-backed lockout after repeated failures (see
        docs/architecture/05-identity-architecture.md's login_attempts
        design) - locked-out requests return 429 even with a correct
        password, matching the documented threshold/window.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [brand_slug, email, password]
      responses:
        "200":
          description: Authenticated; returns a token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account exists but cannot currently log in (suspended/self-excluded/closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown brand_slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token for a new access/refresh token pair
      description: >
        Single-use refresh tokens: presenting one rotates it for a new
        pair and revokes the old one. Presenting an already-rotated
        (reused) token revokes the entire session chain from that point
        forward and returns 401 - see docs/decisions and
        internal/auth/session.go's RotateSession. The principal's CURRENT
        role/status is re-checked on every refresh, never trusted from
        the prior token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: Rotated; returns a new token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Principal is no longer active (e.g. suspended since last login)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/logout:
    post:
      summary: Revoke a session by its refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "204":
          description: Session revoked (idempotent - also returned if the token was already invalid)
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Player self-service ---
  /v1/me:
    get:
      summary: Get the authenticated player's own profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's own player account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is not a player-principal token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/sessions:
    get:
      summary: List the authenticated principal's active sessions
      description: >
        Available to both player and staff principals. Scoped to the
        caller's own principal_id - never returns another principal's
        sessions, even within the same tenant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions for the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/sessions/{id}:
    delete:
      summary: Revoke one of the authenticated principal's own sessions
      description: >
        Ownership-checked server-side (the session's principal_id must
        match the caller's) - a caller cannot revoke another principal's
        session by guessing its id, even within the same tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Staff auth ---
  /v1/staff/auth/login:
    post:
      summary: Log in as a staff user (back-office/admin principal)
      description: >
        Separate credential store and endpoint from player login.
        tenant_slug is omitted entirely for a platform_admin login (there
        is no tenant to resolve - see docs/decisions/0011); every other
        staff role must supply it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_slug:
                  type: string
                  description: Omit only for a platform_admin login.
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [email, password]
      responses:
        "200":
          description: Authenticated; returns a token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account exists but cannot currently log in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown tenant_slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Tenant/brand/staff administration ---
  /v1/admin/tenants:
    post:
      summary: Provision a new tenant
      description: >
        platform_admin only (tenant:write). Never tenant-scoped by design
        - provisioning a tenant is inherently a platform-level action, so
        this route deliberately does not require an existing tenant
        context (see docs/decisions/0011).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                licensing_model:
                  type: string
                  enum: [under_platform_licence, own_licence]
              required: [name, slug, licensing_model]
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A tenant with this slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/brands:
    post:
      summary: Provision a new brand under a tenant
      description: >
        Requires brand:write. platform_admin may target any tenant;
        tenant_admin may only target their own tenant (checked explicitly
        against the path parameter, per ADR 0011).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
              required: [name, slug]
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks brand:write, or is a tenant_admin targeting a different tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A brand with this slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/tenants/{tenantID}/staff:
    post:
      summary: Create a staff user for a tenant
      description: >
        Requires staff:manage. platform_admin may target any tenant;
        tenant_admin may only target their own. Cannot create a
        platform_admin - that role is bootstrapped only via
        cmd/seed-admin (see docs/decisions/0014).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role:
                  type: string
                  enum: [tenant_admin, support, compliance, finance]
              required: [email, password, role]
      responses:
        "201":
          description: Staff user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A staff user with this email already exists for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Player administration (tenant-scoped) ---
  /v1/admin/players:
    get:
      summary: List player accounts for the caller's tenant
      description: >
        Requires player:read, and a real (non-nil) tenant context -
        platform_admin's platform-scoped token is rejected here by
        RequireTenantScope (browsing an arbitrary tenant's players is
        deferred - see docs/decisions/0011's "Consequences").
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Player accounts in the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}:
    get:
      summary: Get a single player account in the caller's tenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The player account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/suspend:
    post:
      summary: Suspend a player account
      description: >
        Requires player:suspend (compliance/tenant_admin/platform_admin -
        support explicitly does not have this permission). Requires a
        reason code, recorded on the audit entry.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
              required: [reason]
      responses:
        "204":
          description: Player suspended
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/players/{id}/identity-review/clear:
    post:
      summary: Clear a player account out of identity_review_required
      description: >
        Stage 4E (docs/decisions/0027). Requires identity_review:manage
        (compliance only - never tenant_admin/platform_admin, mirroring
        rg_restriction:write's separation-of-duties precedent). Requires a
        reason code, recorded on the audit entry. The account's CURRENT
        status must actually be identity_review_required - attempting this
        on any other status (e.g. suspended, self_excluded) is rejected
        with 409 rather than silently reactivating it; this is a narrower
        capability than player:suspend's own suspend/reinstate authority
        and must never become a generic "set player active" action.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason_code: { type: string }
              required: [reason_code]
      responses:
        "204":
          description: Identity review cleared - account is now active
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account is not currently identity_review_required
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Audit trail (read-only) ---
  /v1/admin/audit-log:
    get:
      summary: List audit log entries for the caller's tenant
      description: >
        Requires audit:read and a real tenant context. Entries are
        immutable (append-only, enforced by a database trigger - see
        docs/decisions/0013) and ordered newest first, capped at 100 rows
        per request in Stage 2 (no pagination yet - deferred, see the
        Stage 2 completion report's technical debt section).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 4F: email verification and password reset
  # (docs/decisions/0030) ---
  /v1/me/email-verification/request:
    post:
      summary: Request a new email-verification token for the caller's own account
      description: >
        Authenticated, self-service. Rate-limited to 3 requests/hour per
        account - a rate-limited request returns the SAME 204 as a
        successful one (never distinguishable), and any prior outstanding
        token of this purpose is superseded. Delivered via the configured
        EmailProvider (MockProvider in this stage - no production SMTP/API
        dependency).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Verification email sent, or silently rate-limited
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Email delivery is not configured
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email-verification/confirm:
    post:
      summary: Confirm an email-verification token
      description: >
        Unauthenticated (a player has no session to present at this
        point). One-time use, enforced by an atomic conditional UPDATE -
        never applies its side effect twice under concurrent replay. On
        success, stamps player_accounts.verified_at and transitions the
        account out of pending_verification to active if it is still in
        that exact state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "204":
          description: Email verified
        "400":
          description: Invalid, expired, or already-consumed token
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password-reset/request:
    post:
      summary: Request a password-reset token
      description: >
        Unauthenticated. ALWAYS returns 204 regardless of whether the
        email matches an account or is rate-limited (directive's
        anti-enumeration requirement - never reveals whether a specific
        email belongs to an account). An unknown brand_slug returns 404
        (a brand slug is a public identifier, unlike email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_slug: { type: string }
                email: { type: string, format: email }
              required: [brand_slug, email]
      responses:
        "204":
          description: If an account matched, a reset email was sent - identical response otherwise
        "404":
          description: Unknown brand
        "503":
          description: Email delivery is not configured
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password-reset/confirm:
    post:
      summary: Confirm a password-reset token and set a new password
      description: >
        Unauthenticated. One-time use (atomic conditional UPDATE,
        verified exactly-once under real concurrent replay). The new
        password is hashed (Argon2id) ONLY after the token is validated
        and consumed, closing an uncosted-hashing DoS surface found in
        specialist review. On success, revokes every session for the
        account (RevokeAllSessionsForPrincipal) - a completed reset forces
        re-authentication everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                new_password: { type: string }
              required: [token, new_password]
      responses:
        "204":
          description: Password reset - all sessions revoked
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 4F: player verification (KYC) and document management
  # (docs/decisions/0028/0029) ---
  /v1/me/kyc/verifications:
    post:
      summary: Start a new identity-verification attempt for the caller's own account
      description: >
        Authenticated, self-service. Calls the registered KYCProvider
        (MockKYCProvider only this stage - no real vendor is integrated)
        and creates a new kyc_verifications row. NOT_IMPLEMENTED for any
        production identity-verification vendor.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Verification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Identity verification is not configured
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the caller's own verification attempts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Verification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/kyc/documents:
    post:
      summary: Upload an identity/verification document
      description: >
        Authenticated, self-service, multipart/form-data
        (verification_id, document_type, issuing_country [optional],
        file). Validated server-side (size, sniffed content-type - never
        the client's claimed Content-Type, extension consistency,
        filename sanitization) and malware-scanned (mock scanner, fails
        closed on a scan error) before storage. A reupload of the same
        document_type is a NEW, version-incremented row - never an
        overwrite; documents are immutable after upload except for the
        review fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                verification_id: { type: string, format: uuid }
                document_type:
                  type: string
                  enum: [passport, national_id, drivers_license, proof_of_address, selfie, other]
                issuing_country: { type: string }
                file: { type: string, format: binary }
              required: [verification_id, document_type, file]
      responses:
        "201":
          description: Document stored, pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Verification not found or not owned by the caller
        "503":
          description: Document upload is not configured
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List the caller's own documents (every version)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documents, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/kyc/documents/{id}/content:
    get:
      summary: Download the caller's own document content
      description: >
        Every access, successful or not, is audited
        (kyc.document_accessed on success). A document owned by a
        DIFFERENT player account (even within the same tenant) returns
        404, never 403 - enforced at the application layer, not RLS (ADR
        0029 §4a).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Raw document bytes
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/verifications:
    get:
      summary: List a player account's verification attempts (compliance/tenant admin)
      description: >
        Requires verification:read (compliance or tenant_admin,
        read-only for tenant_admin). Requires a real tenant context -
        scoped to the caller's own tenant only.
      security:
        - bearerAuth: []
      parameters:
        - name: player_account_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Verifications for the named player account, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Verification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/verifications/{id}/review:
    post:
      summary: Approve, reject, or flag a verification for further review
      description: >
        Requires verification:review (compliance only - never
        tenant_admin/platform_admin/finance, directive §19). Rejects with
        409 if the verification is already in a terminal status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [approved, rejected, review_required] }
                reason: { type: string }
              required: [status]
      responses:
        "200":
          description: Verification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Verification is already in a terminal status
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/documents:
    get:
      summary: List a player account's documents (compliance/tenant admin)
      description: Requires verification:read. Tenant-scoped only - see ADR 0029 §4 for why this never exposes a platform-wide Person's documents to an arbitrary tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: player_account_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Documents for the named player account, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/documents/{id}/review:
    post:
      summary: Approve or reject a document
      description: >
        Requires verification:review (compliance only). Only status/
        reviewed_at/reviewed_by/rejection_reason ever change - enforced by
        a database trigger, not merely this handler. Rejecting without a
        reason returns 400.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [approved, rejected] }
                reason: { type: string }
              required: [status]
      responses:
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/kyc/documents/{id}/content:
    get:
      summary: Download a document's content (compliance/tenant admin)
      description: Requires verification:read. Every access is audited (kyc.document_accessed).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Raw document bytes
          content:
            application/octet-stream: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/webhooks/kyc/{tenantSlug}/{providerID}:
    post:
      summary: KYC provider callback (verification status update)
      description: >
        No bearer-token middleware - a provider is not an authenticated
        platform principal. Tenant is resolved from the URL slug only,
        never trusted from the payload. Payload signature verification is
        the adapter's own responsibility (MockKYCProvider: HMAC, a
        platform-invented format never modeled on any real vendor).
        Idempotent - a callback for an already-terminal verification is a
        no-op. A provider error never corrupts stored verification state.
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
        - name: providerID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: Callback processed
        "400":
          description: Invalid signature or payload
        "404":
          description: Unknown tenant or provider
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Stage 4G: Risk & Limits admin API (docs/decisions/0031) ---
  /v1/admin/risk/rules:
    get:
      summary: List a tenant's risk rules for one operation
      description: >
        Requires risk_config:read (risk_manager or tenant_admin,
        read-only for tenant_admin). Returns the caller's own tenant's
        rules PLUS every platform-wide rule for that operation - no
        pagination or status filter this stage (returns disabled rules
        too).
      security:
        - bearerAuth: []
      parameters:
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant]
      responses:
        "200":
          description: Risk rules for the named operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create a risk rule
      description: >
        Requires risk_config:manage (risk_manager only). Always
        tenant-scoped this stage - a genuinely platform-wide rule
        (tenant_id NULL) has no HTTP write path yet (docs/decisions/0031
        §8's own recorded open decision). A rule is immutable after
        creation except for status/description/effective_until - a
        policy change is a new rule, never an edit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id: { type: string, format: uuid }
                jurisdiction_code: { type: string }
                licensing_mode: { type: string, enum: [under_platform_licence, own_licence], description: "Stage 4G-FINAL: scopes the rule to tenants operating under this licensing arrangement (tenants.licensing_model). Omitted means the rule applies regardless of licensing mode." }
                player_account_id: { type: string, format: uuid }
                product: { type: string, enum: [casino, sportsbook, payments, bonus] }
                operation:
                  type: string
                  enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant]
                provider_id: { type: string }
                game_id: { type: string, format: uuid }
                asset_code: { type: string }
                payment_method: { type: string }
                limit_kind: { type: string, enum: [min_amount, max_amount, cumulative_amount] }
                time_window: { type: string, enum: [transaction, rolling_hour, rolling_day, rolling_week, rolling_month] }
                threshold: { type: integer, format: int64, description: "Minor units, matching the asset's own exponent" }
                rule_kind: { type: string, enum: [hard_limit, configurable_limit, risk_signal], default: configurable_limit }
                action: { type: string, enum: [deny, review], default: deny }
                description: { type: string }
              required: [operation, limit_kind, time_window, threshold]
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/risk/rules/{id}/disable:
    post:
      summary: Disable a risk rule
      description: >
        Requires risk_config:manage. The only legitimate mutation besides
        description/effective_until - a rule is never deleted, so a past
        RiskDecision remains explainable against the exact rule that
        produced it. Returns 404 (never 403) both for a genuinely
        nonexistent id AND for a rule outside the caller's own tenant
        scope (platform-wide or a different tenant's) - never confirms
        existence outside the caller's own authorization.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rule disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- Asset Registry / Asset Authorization (ADR 0037, Stage 4H-B0-R6) ---
  #
  # Split along ADR 0037 §C.1's two tiers: /v1/admin/assets/** is
  # asset_registry:manage (platform_admin only, layers 1-3), and
  # /v1/admin/asset-authorizations/** is asset_authorization:write
  # (tenant-scoped, layers 4-7). There is deliberately NO endpoint that
  # evaluates eligibility: AssetAuthorization.CheckEligibility resolves
  # tenant/brand/jurisdiction server-side, and exposing it over HTTP would
  # mean accepting a jurisdiction identifier from a caller.
  /v1/admin/assets:
    get:
      summary: List the platform asset registry
      description: Requires asset_registry:manage (platform_admin only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create an asset (layer 1, dual-controlled)
      description: >
        Requires asset_registry:manage AND a pending change request for
        this code, approved by a DIFFERENT platform principal (ADR 0037
        §C.5.3), whose payload matches the identity fields exactly. The
        body has no `active`/`platform_authorized` field by design (§C.5.5:
        creation must never authorize any financial operation) and unknown
        fields are rejected. Returns 409 when no approved request exists.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, asset_type, decimal_exponent, display_name, reason_code]
              properties:
                code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                display_name: { type: string }
                network: { type: string, description: Required for a crypto asset }
                reason_code: { type: string }
      responses:
        "201":
          description: Created - always inactive and not platform-authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests:
    post:
      summary: File a four-eyes change request (create/activate/platform_authorize)
      description: >
        Requires asset_registry:manage. Only the three dual-controlled
        operations are representable - suspend/revoke are deliberately
        single-actor kill-switches (ADR 0037 §C.5.3). The requesting
        principal must resolve to a platform-scoped staff row, enforced by
        the database.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, asset_code, reason_code]
              properties:
                operation: { type: string, enum: [create, activate, platform_authorize] }
                asset_code: { type: string }
                asset_type: { type: string, enum: [fiat, crypto] }
                decimal_exponent: { type: integer, minimum: 0, maximum: 18 }
                network: { type: string }
                reason_code: { type: string }
      responses:
        "201":
          description: Request filed (state = pending)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/change-requests/{id}/decision:
    post:
      summary: Approve or reject a change request
      description: >
        Requires asset_registry:manage. Returns 409 for a self-approval,
        for a second decision by the same principal, or for a principal
        that resolves to the same person as the requester - all enforced by
        the database (migration 0044, mirroring withdrawal_approvals).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason_code]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason_code: { type: string }
      responses:
        "201":
          description: Decision recorded (immutable)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}:
    patch:
      summary: Update mutable asset metadata (layer 1)
      description: >
        Requires asset_registry:manage. display_name is the ONLY mutable
        field: code/decimal_exponent/asset_type/network are immutable
        (ADR 0037 §C.5.4), are not accepted in this body, and are refused
        by a database trigger regardless.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, reason_code]
              properties:
                display_name: { type: string }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/activation:
    put:
      summary: Activate or suspend an asset (layer 2)
      description: >
        Requires asset_registry:manage. `value: true` additionally requires
        an approved activate request (409 otherwise); `value: false` is
        deliberately single-actor - an incident kill-switch must not wait
        for a second approver (ADR 0037 §C.5.3). `value` is mandatory:
        defaulting a missing boolean would make granting reachable by
        omission.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/platform-authorization:
    put:
      summary: Grant or revoke platform authorization (layer 3)
      description: >
        Requires asset_registry:manage. ADR 0037 §C.5.1 operation 5 - the
        asset's own platform clearance, NOT ProviderCapability (ADR 0022),
        which is a different concept. Granting requires an approved
        platform_authorize request; revoking does not.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason_code]
              properties:
                value: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/assets/{code}/operation-eligibility:
    put:
      summary: Set the PLATFORM-WIDE operation eligibility default (layer 7)
      description: >
        Requires asset_registry:manage (platform tier of ADR 0037 §C.5.1
        operation 9). `product` omitted means every product; a
        product-specific row always wins over it. Returns 403 if the asset
        is not platform-authorized - nothing may be made eligible for an
        asset the platform has not cleared.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Platform-wide default written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations:
    get:
      summary: List this tenant's asset authorizations (layers 4-6)
      description: Requires asset_authorization:write and a tenant-scoped token.
      security:
        - bearerAuth: []
      parameters:
        - name: asset_code
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Authorization facts visible to the caller's tenant
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/{scopeKind}:
    put:
      summary: Authorize an asset for this tenant, a brand, or a jurisdiction (layers 4/5/6)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. The
        tenant is ALWAYS taken from the verified token, never from the body
        (ADR 0038 §11's rule, applied here). brand_id/jurisdiction_id name
        which brand/jurisdiction is being configured; a composite foreign
        key plus RLS mean neither can belong to another tenant. Returns 403
        when the write would widen past the layer above it (a
        non-platform-authorized asset, or a brand grant with no tenant
        grant behind it) - refused at write time, not only at resolution
        time.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeKind
          in: path
          required: true
          schema: { type: string, enum: [tenant, brand, jurisdiction] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_code, eligible, reason_code]
              properties:
                asset_code: { type: string }
                brand_id: { type: string, format: uuid, description: Required for scopeKind=brand }
                jurisdiction_id: { type: string, format: uuid, description: Required for scopeKind=jurisdiction }
                product: { type: string, description: Omitted means every product }
                eligible: { type: boolean }
                reason_code: { type: string }
      responses:
        "200":
          description: Authorization fact written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/asset-authorizations/operation-eligibility/{code}:
    put:
      summary: Narrow the operation eligibility for this tenant (layer 7 override)
      description: >
        Requires asset_authorization:write and a tenant-scoped token. A
        tenant override may only NARROW the platform-wide default: a
        widening write returns 403 and is never stored (ADR 0037 §A.6).
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationEligibilityInput"
      responses:
        "200":
          description: Tenant override written
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HMAC-signed (HS256) JWTs, verified against a key registry keyed
        by the token's own `kid` header claim - this is what allows an
        old and a new signing key to be valid simultaneously during
        rotation (see internal/auth/keys.go). Tokens also carry a
        possibly-nil tenant_id claim: platform_admin tokens are
        legitimately platform-scoped (see docs/decisions/0011) - routes
        that require a real tenant reject a nil one via the
        RequireTenantScope middleware, not at token-verification time.
        This remains PROVIDER DEPENDENT / foundation-only for Stage 2 -
        see docs/architecture/05-identity-architecture.md.
  schemas:
    Asset:
      type: object
      description: >
        One Asset Registry row (ADR 0037 layers 1-3). `active` (layer 2)
        and `platform_authorized` (layer 3) are deliberately separate
        bits - an incident kill-switch and a compliance clearance must not
        share one. Neither being true implies anything about layers 4-7.
      properties:
        code: { type: string }
        asset_type: { type: string, enum: [fiat, crypto] }
        decimal_exponent:
          type: integer
          description: Immutable after creation - changing it would reinterpret every existing balance.
        display_name: { type: string }
        network: { type: string }
        active: { type: boolean }
        platform_authorized: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [code, asset_type, decimal_exponent, display_name, active, platform_authorized]
    AssetOperationEligibilityInput:
      type: object
      description: >
        Layer 7. `product` omitted means every product; a product-specific
        row always wins over it, so the product axis narrows and never
        widens. `operation` is exactly ADR 0037 §C.2's six values.
      properties:
        product: { type: string }
        operation:
          type: string
          enum: [deposit, withdrawal, wagering, settlement, conversion, reporting]
        eligible: { type: boolean }
        reason_code: { type: string }
      required: [operation, eligible, reason_code]
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds }
      required: [access_token, refresh_token, token_type, expires_in]
    PlayerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [pending_verification, active, suspended, self_excluded, closed, identity_review_required]
        kyc_tier: { type: integer }
        tenant_id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
      required: [id, email, status, kyc_tier, tenant_id, brand_id]
    PlayerAccount:
      type: object
      description: Player account as seen by tenant staff (no cross-brand/cross-tenant identifiers exposed).
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [pending_verification, active, suspended, self_excluded, closed, identity_review_required]
        kyc_tier: { type: integer }
      required: [id, brand_id, email, status, kyc_tier]
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
      required: [id, expires_at]
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        licensing_model:
          type: string
          enum: [under_platform_licence, own_licence]
        status: { type: string }
      required: [id, name, slug, licensing_model, status]
    Brand:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
      required: [id, tenant_id, name, slug, status]
    StaffUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: string
          enum: [platform_admin, tenant_admin, support, compliance, finance]
        status: { type: string }
      required: [id, email, role, status]
    AuditEntry:
      type: object
      description: >
        Append-only audit record (internal/audit.Entry / the audit_log
        table). Immutable at the database level - see
        docs/decisions/0013.
      properties:
        id: { type: string, format: uuid }
        actor_type:
          type: string
          enum: [player, staff, system]
        actor_id: { type: string, format: uuid }
        action: { type: string, example: player.suspended }
        target_type: { type: string, example: player_account }
        target_id: { type: string }
        outcome:
          type: string
          enum: [success, failure, denied]
        created_at: { type: string, format: date-time }
      required: [id, actor_type, action, outcome, created_at]
    Verification:
      type: object
      description: >
        A platform-owned KYC/identity-verification attempt
        (internal/kyc.Verification / kyc_verifications). Never collapsed
        into PlayerAccount.status - see docs/decisions/0028.
      properties:
        id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        status:
          type: string
          enum: [unverified, pending, review_required, approved, rejected, expired]
        provider_id: { type: string, example: mock }
        provider_reference: { type: string }
        reason: { type: string }
        reviewed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, player_account_id, status, provider_id, created_at]
    Document:
      type: object
      description: >
        A versioned, immutable-after-upload identity/verification
        document (internal/kyc.Document / kyc_documents). A reupload of
        the same document_type is a NEW row with version+1, never an
        overwrite - see docs/decisions/0029.
      properties:
        id: { type: string, format: uuid }
        player_account_id: { type: string, format: uuid }
        verification_id: { type: string, format: uuid }
        document_type:
          type: string
          enum: [passport, national_id, drivers_license, proof_of_address, selfie, other]
        issuing_country: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [pending_review, approved, rejected]
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        original_filename: { type: string }
        rejection_reason: { type: string }
        uploaded_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
      required: [id, player_account_id, verification_id, document_type, version, status, content_type, size_bytes, original_filename, uploaded_at]
    RiskRule:
      type: object
      description: >
        A Risk & Limits policy rule (internal/risk.Rule / risk_rules).
        Immutable after creation except status/description/
        effective_until - see docs/decisions/0031.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid, description: "Absent/empty means platform-wide" }
        brand_id: { type: string, format: uuid }
        jurisdiction_code: { type: string }
        licensing_mode: { type: string, enum: [under_platform_licence, own_licence], description: "Stage 4G-FINAL: absent means the rule applies regardless of licensing mode" }
        player_account_id: { type: string, format: uuid }
        product: { type: string, enum: [casino, sportsbook, payments, bonus] }
        operation:
          type: string
          enum: [casino_launch, casino_bet, deposit, withdrawal, sportsbook_bet, bonus_grant]
        provider_id: { type: string }
        game_id: { type: string, format: uuid }
        asset_code: { type: string }
        payment_method: { type: string }
        limit_kind: { type: string, enum: [min_amount, max_amount, cumulative_amount] }
        time_window: { type: string, enum: [transaction, rolling_hour, rolling_day, rolling_week, rolling_month] }
        threshold: { type: integer, format: int64 }
        rule_kind: { type: string, enum: [hard_limit, configurable_limit, risk_signal] }
        action: { type: string, enum: [deny, review] }
        status: { type: string, enum: [active, disabled] }
        effective_from: { type: string, format: date-time }
        effective_until: { type: string, format: date-time }
        description: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, operation, limit_kind, time_window, threshold, rule_kind, action, status, effective_from, created_at]
    Error:
      type: object
      description: Platform-wide error envelope (internal/apierror.Error).
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - internal_error
            - service_unavailable
            - tenant_mismatch
            - rate_limited
        message:
          type: string
        request_id:
          type: string
      required: [code, message]
  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but lacking the required permission or tenant scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (or not visible to the caller's tenant scope)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        A control refused the request - e.g. an asset-registry operation
        with no independently-approved change request behind it
        (four-eyes), or a self-approval. Deliberately distinct from 500:
        the platform is working, a control said no.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many failed attempts; locked out for a window
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
