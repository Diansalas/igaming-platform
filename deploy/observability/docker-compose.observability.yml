# EXAMPLE: a local Prometheus that scrapes platform-api's dedicated metrics listener and evaluates
# prometheus-alert-rules.yml (A9). Development / staging experiments only. NOT DEPLOYED, no Alertmanager, no
# receiver, no credentials. Usage (from this directory):
#
#   METRICS_ADDR=0.0.0.0:9464 go run ./cmd/platform-api     # in the repo root, development environment
#   docker compose -f docker-compose.observability.yml up
#   open http://127.0.0.1:9090/targets  and  http://127.0.0.1:9090/alerts
#
# Pin the image by digest before using this anywhere shared (digest pinning is a registered hardening item).

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.listen-address=:9090
    ports:
      # Loopback only: the Prometheus UI/API has no authentication.
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alert-rules.yml:/etc/prometheus/rules/prometheus-alert-rules.yml:ro
      - prometheus-data:/prometheus
    restart: "no"

volumes:
  prometheus-data: {}
