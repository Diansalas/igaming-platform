# Alert rules that CANNOT be written yet because the platform emits no signal for them (OPS-READINESS-LOCAL).
#
# STATUS: NOT WIRED, NOT IMPLEMENTED. These are gaps, recorded so they are not mistaken for coverage.
# ALERT-DELIVERY-1 is OPEN regardless: nobody is paged by anything in deploy/observability/.
#
# A9 history: DbPoolSaturation, ReconciliationStale and LedgerDriftAsMetric were promoted out of this file when
# their metrics were implemented (db_pool_*, reconciliation_last_success_unix_seconds,
# reconciliation_mismatches_open); their rules are in prometheus-alert-rules.yml. The alert dispatcher
# backlog/age signal (alert_undelivered_*) was added in the same change and was never listed here.
#
# Each entry names the metric a future instrumentation change would have to add. The parity test requires that
# the proposed name is STILL ABSENT from the code: when someone adds the metric, the test fails and tells them to
# promote the entry into prometheus-alert-rules.yml (so this file cannot rot into a list of things that already
# exist). Adding the instrumentation is a code change in internal/ (owned by the domain specialists).

pending:
  - id: PaymentKillSwitchState
    severity: page
    proposed_metric: payment_kill_switch_engaged_scopes
    proposed_expr: "payment_kill_switch_engaged_scopes > 0 (gauge: number of currently engaged kill-switch scopes)"
    why_missing: "payment_kill_switches is tenant-scoped under FORCE RLS and the platform has no cross-tenant read identity for it (only the alert_dispatcher service identity exists, and it must not gain a second job). A per-process gauge of 'engaged in this process' would be false for every other instance."
    interim: "Engaging a kill switch raises the durable alert payment.kill_switch_engaged (P2, post-commit) and the log event PaymentKillSwitchEngaged (log-event-alert-rules.yml); the release/recovery procedure is docs/runbooks/payment-kill-switch-release-recovery.md. The engaged STATE has no metric: read it in the back office."

  - id: ProviderCallLatency
    severity: ticket
    proposed_metric: provider_call_duration_seconds
    also_needed: [provider_call_total]
    proposed_expr: "histogram_quantile(0.99, sum by (le, provider_kind, operation) (rate(provider_call_duration_seconds_bucket[10m]))) > <SLO>"
    why_missing: "Blueprint section 7 asks for per-provider latency SLOs, but the provider-call gate (internal/payments, internal/casino, internal/kyc outbound calls) records no duration or result metric, and every adapter is a MOCK, so there is no real latency to measure yet. The SLO values are an owner/provider decision (PROVIDER DEPENDENT)."
    interim: "None. The otelhttp histogram covers the platform's own API only, not outbound provider calls."

  - id: PerTenantRequestSlo
    severity: ticket
    proposed_metric: tenant_http_request_errors_total
    proposed_expr: "per-tenant error-budget burn over tenant_http_request_errors_total / tenant_http_requests_total"
    why_missing: "Blueprint section 7 asks for per-tenant error budgets. A raw tenant_id label is unbounded cardinality as B2B tenants grow, so a bounded labelling policy (for example tenant class, or a top-N allowlist) is a decision first; no per-tenant request metric exists, by design, today."
    interim: "The 5xx ratio and latency rules are platform-wide. Per-tenant investigation uses the audit log and the request_id in logs."

  - id: BackupRoleAbuse
    severity: page
    proposed_metric: backup_role_oldest_transaction_seconds
    also_needed: [backup_role_sessions, backup_role_non_accessshare_locks]
    proposed_expr: "backup_role_oldest_transaction_seconds > <planned dump time + margin> OR backup_role_non_accessshare_locks > 0 OR backup_role_sessions > 0 outside the backup window"
    why_missing: "A12 security review M1/M7 (ADR 0122 section 5b): a stolen igaming_backup credential can still hold sessions, locks and snapshots open (the database cannot prevent a role from locking tables it can read or from altering its own settings). The signals come from pg_stat_activity / pg_locks for that role, which needs a monitoring identity and a database exporter (postgres_exporter or CloudWatch Database Insights); the platform process does not read them and no such exporter exists yet. Backup-window knowledge belongs to the runner schedule (gap G1)."
    interim: "docs/runbooks/backup-restore-dr.md section 3a: run the pg_stat_activity query by hand during a dump; connection/disconnection lines and per-role statement logs (pgaudit on RDS) are the detective control."
