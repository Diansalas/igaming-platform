# Prometheus-format alert rules for the metrics platform-api emits (OPS-READINESS-LOCAL, A9).
#
# STATUS: EMITTED AND SCRAPEABLE; NOT DEPLOYED. Every series below is emitted by platform-api and is exposed in
# Prometheus text format on the dedicated metrics listener (METRICS_ADDR; internal/observability/prometheus.go;
# disabled unless set; never on the public API mux). deploy/observability/prometheus.yml and
# docker-compose.observability.yml are a working scrape + rule-evaluation EXAMPLE for development and staging.
# What does NOT exist: a Prometheus / Alertmanager in any real environment, and any Alertmanager route or
# recipient. A rule that fires here pages nobody by itself. ALERT-DELIVERY-1 is OPEN: the durable-alert path
# (internal/alerting; email + one webhook channel, owner decision 2026-10-15) delivers only once a human has
# staged and a second admin has enabled a route (SR-7) AND a real email provider / webhook receiver exists.
# Every rule carries only a `severity` label, never a receiver or recipient.
#
# Metric names assume the standard OpenTelemetry -> Prometheus translation as done by the exporter in
# internal/observability (instrument names pass through unchanged; counters that already end in _total are not
# suffixed twice; no units are set on the custom instruments); the otelhttp histogram
# `http.server.request.duration` (unit s) becomes `http_server_request_duration_seconds_{bucket,count,sum}`
# with dotted attribute names underscored. deploy/observability/exposition_test.go scrapes the REAL exposition
# and asserts these names.
#
# Drift guard: deploy/observability/rules_parity_test.go fails the build if any metric or label used here is not
# emitted by the code (custom instruments are found in the source, the otelhttp series is proven by running the
# real handler). Signals the platform still does NOT emit as metrics are in pending-signals.yml, never invented
# here; log-derived signals are in log-event-alert-rules.yml.
#
# Thresholds are starting points, not tuned SLOs (docs/runbooks/observability-and-alerting.md section 2).
# severity: page = would page an on-call if one existed; ticket = work-hours ticket; info = dashboard.

groups:
  - name: platform-api-payments
    rules:
      - alert: PaymentsSweeperStalled
        # Sweeper tick default is 15s (PAYMENTS_SWEEP_INTERVAL_SECONDS); 8 missed ticks = stalled.
        # absent() covers "never ran" once the series is scraped at all.
        expr: time() - payments_sweeper_last_pass_unix_seconds > 120
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Payments sweeper has not completed a pass for over 2 minutes"
          description: "Deposit polling and payout dispatch/resend/resolve run in this loop. Stalled = payments stop progressing."
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: PaymentsSweeperItemFailures
        # payment dispatch failures: any errored or panicked sweeper item.
        expr: increase(payments_sweeper_items_total{result=~"error|panic"}[15m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Payments sweeper items are failing (error or panic)"
          description: "A deposit poll or payout dispatch step failed. result=panic is always a bug. Look for 'payments sweeper:' log lines (tenant and attempt ids, no provider payloads)."
          runbook: docs/runbooks/operational-runbooks.md

      - alert: PaymentsSweeperTenantFailures
        expr: increase(payments_sweeper_tenant_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Payments sweeper could not list or claim work for a tenant"
          description: "phase=list|claim|panic. A whole tenant's payment work may be silently skipped."
          runbook: docs/runbooks/operational-runbooks.md

      - alert: PaymentsSweeperResolutionOnlyBlocksGrowing
        # New money-moving dispatches withheld for a non-active tenant: normal right after a suspension,
        # a problem if it keeps growing (a suspended tenant with work queued).
        expr: increase(payments_sweeper_resolution_only_blocks_total[1h]) > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Dispatches are being withheld for a non-active tenant"
          description: "Expected while a tenant is suspended or closed; investigate if it persists after reactivation."
          runbook: docs/runbooks/launch-and-suspension.md

  - name: platform-api-webhook-admission
    rules:
      - alert: WebhookAdmissionDirectoryUnloaded
        # The admission layer is failing closed on every webhook route. Not expected outside a fresh deploy.
        expr: sum by (provider_kind) (increase(webhook_admission_decisions_total{decision="rejected",reason="directory_unloaded"}[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Webhook admission is rejecting everything: tenant directory not loaded"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: WebhookAdmissionVerifiedRefusals
        # Ratio stays WITHIN stage="verified" (never mix stages: one request is admitted once per stage).
        expr: |
          sum by (provider_kind) (rate(webhook_admission_decisions_total{decision="rejected",stage="verified"}[10m]))
            /
          sum by (provider_kind) (rate(webhook_admission_decisions_total{stage="verified"}[10m]))
            > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "More than 5% of verified-stage webhook decisions are refusals"
          description: "A vendor's retry window may be at risk. reason label: verified, db_gate, domain_bulkhead, inflight, panic."
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: WebhookAdmissionCapacityRefusals
        expr: sum by (provider_kind, reason) (increase(webhook_admission_decisions_total{decision="rejected",reason=~"db_gate|domain_bulkhead|inflight"}[10m])) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Webhook pool-protection bulkheads are refusing traffic"
          description: "Sustained refusals suggest the bulkheads are undersized for real traffic, not necessarily an attack."
          runbook: docs/runbooks/load-and-soak-test-plan.md

      - alert: WebhookAdmissionInflightSaturated
        # A4a in-flight bulkhead occupancy. Rest value is 0. Threshold must be set from the configured
        # per-domain bulkhead size once real traffic exists; 0 disables nothing, this is a placeholder floor.
        expr: max by (provider_kind) (webhook_admission_inflight) > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Webhook in-flight slots have been continuously occupied for 30 minutes"
          description: "At rest this gauge is 0. A permanently non-zero value suggests a leaked slot or a stuck handler. Tune against the configured bulkhead size."
          runbook: docs/runbooks/load-and-soak-test-plan.md

  - name: platform-api-durable-alerting
    rules:
      - alert: AlertRoutingNotReady
        # ALERT-DELIVERY-1. EXPECTED TO BE FIRING TODAY: no route, no human channel, no recipient exists.
        # It must keep firing until the owner closes ALERT-DELIVERY-1; a silenced or deleted copy hides the gap.
        expr: alert_routing_ready{severity="p1"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No configured path would notify a person for P1 alerts (ALERT-DELIVERY-1 OPEN)"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: AlertDeliveryDead
        expr: increase(alert_dead_total[15m]) > 0
        labels:
          severity: page
        annotations:
          summary: "A durable alert exhausted its delivery attempts"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: AlertUnrouted
        expr: increase(alert_unrouted_total{severity="p1"}[15m]) > 0
        labels:
          severity: page
        annotations:
          summary: "A P1 durable alert was raised with no route (nobody notified)"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: AlertRaiseFailures
        expr: increase(alert_raise_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Raising a durable alert failed (the alert itself may be lost)"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: AlertDispatcherStale
        # No pass of any result in 10 minutes: the dispatcher loop is not running.
        expr: sum(increase(alert_dispatcher_passes_total[10m])) == 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Alert dispatcher loop has completed no passes in 10 minutes"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: AlertUndeliveredP1Old
        # A9 backlog signal: an open, unacknowledged P1 that nobody has been notified of. Today (no human route) this
        # is expected to be firing whenever a P1 exists; it must not be silenced to hide ALERT-DELIVERY-1.
        expr: alert_undelivered_oldest_age_seconds{severity="p1"} > 900
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "A P1 durable alert has been open for over 15 minutes with nobody notified"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: AlertUndeliveredP2Old
        expr: alert_undelivered_oldest_age_seconds{severity="p2"} > 7200
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "A P2 durable alert has been open for over 2 hours with nobody notified"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: AlertDeliveryFailing
        # A delivery failure is itself observable: the alert is NOT dropped (the dispatcher retries with backoff and
        # finally records dead), but a failing channel means people are not being told.
        expr: sum by (channel_kind, error_class) (increase(alert_delivery_attempts_total{result="failed"}[15m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Alert delivery attempts are failing on a channel"
          description: "error_class=misconfigured/rejected is permanent (fix the channel configuration or the receiver); unavailable/timeout is retried."
          runbook: docs/runbooks/observability-and-alerting.md

      - alert: AlertRetentionFailing
        expr: increase(alert_retention_runs_total{result!="ok"}[1d]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "The alert history retention purge failed"
          runbook: docs/runbooks/observability-and-alerting.md

      - alert: AlertRetentionStale
        # Only present when ALERT_RETENTION_DAYS is set (the series is absent otherwise).
        expr: time() - alert_retention_last_run_unix_seconds > 2 * 86400
        labels:
          severity: ticket
        annotations:
          summary: "The alert history retention purge has not succeeded for over 2 days"
          runbook: docs/runbooks/observability-and-alerting.md

  - name: platform-api-background-workers
    rules:
      - alert: KycOutboxStalled
        # KYC outbox tick default is 5s (KYC_OUTBOX_INTERVAL_SECONDS).
        expr: time() - kyc_outbox_last_pass_unix_seconds > 120
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "KYC submission outbox worker has not completed a pass for over 2 minutes"
          runbook: docs/runbooks/operational-runbooks.md

      - alert: KycOutboxLagging
        # stuck outbox / sweeper lag: rows claimed far past their due time.
        expr: kyc_outbox_oldest_due_age_seconds > 300
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "KYC outbox rows are being claimed more than 5 minutes after they were due"
          runbook: docs/runbooks/operational-runbooks.md

      - alert: KycOutboxDeferredTooLong
        # Rows deferred because the tenant is not active; expected during a suspension, not for days.
        expr: kyc_outbox_oldest_deferred_age_seconds > 86400
        labels:
          severity: info
        annotations:
          summary: "KYC outbox rows have been deferred for an inactive tenant for over a day"
          runbook: docs/runbooks/launch-and-suspension.md

      - alert: KycOutboxItemFailures
        expr: increase(kyc_outbox_items_total{result=~"failed_terminal|phase_c_failed|apply_conflict"}[30m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "KYC outbox items ended in a terminal or conflicting state"
          runbook: docs/runbooks/operational-runbooks.md

  - name: platform-api-http
    rules:
      - alert: Http5xxRatioHigh
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
          sum(rate(http_server_request_duration_seconds_count[5m]))
            > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "More than 1% of HTTP requests answered 5xx over 5 minutes"
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: ReadinessFailing
        # /readyz answers 503 when the DB health probe fails (internal/httpserver/health.go).
        expr: sum(increase(http_server_request_duration_seconds_count{http_route="/readyz",http_response_status_code="503"}[5m])) > 3
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "/readyz has answered 503 repeatedly: database health probe failing"
          runbook: docs/runbooks/incident-response-and-oncall.md

  - name: platform-api-staff-auth
    rules:
      - alert: StaffLivenessErrors
        # ADR 0119 S4a (section 7.3, review N1): the per-request staff liveness check could not run and answered
        # 503 (fail closed). Every back-office request needs the database anyway, so any sustained error rate means
        # staff are locked out of the back office.
        # reason="db_error" only: a client that went away is reason="client_cancelled" and never pages. A minimum
        # count keeps a single transient fault from paging.
        expr: sum(increase(staff_liveness_decisions_total{outcome="error",reason="db_error"}[5m])) >= 3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The staff liveness check is failing closed: back-office requests answer 503"
          description: "Check the database, the pool and the 500 ms statement timeout (staff_liveness_failed log lines)."
          runbook: docs/runbooks/incident-response-and-oncall.md

      - alert: StaffLivenessRefusals
        # Refusals are normal after a logout, a suspension or a role change (the old token's next request). A burst
        # per reason (revoked, staff_not_active, role_mismatch, version_mismatch, factor_unusable, no_session,
        # absolute_expired, no_assurance) can mean replayed tokens after revocation or forged sids. The threshold is a
        # starting point for a small back-office population.
        # A ratio over all decisions with a minimum count (a quiet back office does not alert on a few logouts), OR
        # an absolute ceiling (a flood alerts even when legitimate traffic keeps the share under 20 %).
        expr: |
          (
            (sum by (reason) (increase(staff_liveness_decisions_total{outcome="refused"}[10m])) > 25)
              and
            (sum by (reason) (increase(staff_liveness_decisions_total{outcome="refused"}[10m]))
              / ignoring(reason) group_left sum(increase(staff_liveness_decisions_total[10m])) > 0.2)
          )
            or
          (sum by (reason) (increase(staff_liveness_decisions_total{outcome="refused"}[10m])) > 200)
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Many staff requests refused by the liveness check"
          description: "Look at the reason label and the staff_liveness_refused log lines (request_id, reason; never a token)."
          runbook: docs/runbooks/incident-response-and-oncall.md

  - name: platform-api-database
    rules:
      - alert: DbPoolSaturated
        # pending-signals DbPoolSaturation (promoted by A9). One pool per process, so no label match is needed.
        expr: db_pool_acquired_connections / db_pool_max_connections > 0.9
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The application database pool has been over 90% checked out for 5 minutes"
          description: "Requests queue for a connection; the 5xx ratio and request latency follow. Check for a slow query, a leaked transaction or a load spike."
          runbook: docs/runbooks/load-and-soak-test-plan.md

      - alert: DbPoolAcquireWaiting
        # Cumulative time callers spent waiting for a connection, as a rate: callers are queueing even if the pool
        # is not pinned at max at the sampling instant.
        expr: rate(db_pool_acquire_wait_seconds_total[5m]) > 0.5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Callers spent more than half a second per second waiting for a database connection"
          runbook: docs/runbooks/load-and-soak-test-plan.md

  - name: platform-api-reconciliation
    rules:
      - alert: ReconciliationStale
        # pending-signals ReconciliationStale (promoted by A9). The value is the OLDEST per-tenant last success of
        # the stream (0 = a tenant has never succeeded in this process), so one stale tenant fires it. Assumes the
        # default hourly cadence (RECONCILIATION_INTERVAL_SECONDS); 2 hours = two missed sweeps.
        expr: time() - reconciliation_last_success_unix_seconds > 2 * 3600
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "A reconciliation stream has a tenant with no successful run for over 2 hours"
          description: "Check reconciliation_runs_total{result=failed} and the reconciliation.run_failed durable alerts for the failing stream. The money-drift check is not running for that tenant."
          runbook: docs/runbooks/operational-runbooks.md

      - alert: ReconciliationSweepStalled
        expr: time() - reconciliation_last_sweep_unix_seconds > 2 * 3600
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "No complete reconciliation sweep for over 2 hours"
          description: "The scheduler stalled, panicked, or the tenant listing keeps failing (see ReconciliationListingFailed and the reconciliation.sweep_failed durable alert)."
          runbook: docs/runbooks/operational-runbooks.md

      - alert: ReconciliationMismatchesOpen
        # pending-signals LedgerDriftAsMetric (promoted by A9). CLAUDE.md: any non-zero drift is a P1 incident.
        expr: sum by (stream) (reconciliation_mismatches_open) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A reconciliation stream's latest completed run reported mismatches"
          description: "Non-zero ledger/provider drift is a P1. The gauge clears only when a later run is clean."
          runbook: docs/runbooks/operational-runbooks.md

      - alert: ReconciliationRunFailures
        expr: sum by (stream) (increase(reconciliation_runs_total{result="failed"}[2h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "A reconciliation stream run failed for at least one tenant"
          description: "Each failed run also raises a reconciliation.run_failed durable alert (P1) naming the stream and phase."
          runbook: docs/runbooks/operational-runbooks.md

      - alert: PaymentProviderNotReconciled
        # A11 (PAY-K3-STATEMENT-SOURCE-WIRING-1): a (tenant, provider) pair whose payment_statement outcome is NOT
        # "reconciled up to now" because the provider is configured but has no (eligible) statement source, or its
        # provider listing failed. Never a clean result: the pair also holds ReconciliationStale at 0.
        expr: sum by (reason) (reconciliation_payment_unreconciled{reason=~"no_source|source_not_eligible|scope_unavailable"}) > 0
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "A configured payment provider is not being reconciled (no eligible statement source)"
          description: "Also raised per pair as the reconciliation.run_failed durable alert (phase no_statement_source / source_not_eligible / scope). Money movements of that provider are unchecked until a statement source is registered."
          runbook: docs/runbooks/observability-and-alerting.md

      - alert: PaymentStatementBacklog
        # R3-OBS-BOUND-1 (A11): runs keep hitting the per-run line bound, so the provider is reconciled only up to a
        # cursor that trails now. Raise RECONCILIATION_PAYMENT_STATEMENT_MAX_LINES or investigate the volume.
        expr: sum(reconciliation_payment_unreconciled{reason="truncated"}) > 0
        for: 6h
        labels:
          severity: ticket
        annotations:
          summary: "A payment statement stays truncated at the per-run bound for 6 hours (reconciliation is behind)"
          description: "A truncated run is never a clean claim; the next run continues from the persisted cursor. A backlog that never drains means the bound is below the provider's volume per sweep."
          runbook: docs/runbooks/observability-and-alerting.md

      - alert: ReconciliationListingFailed
        # R3-LISTING-FAILURE-LOG-ONLY-1 (A9): a tenant listing failed, so nothing (or not every tenant) was reconciled.
        expr: increase(reconciliation_sweeps_total{result="listing_failed"}[30m]) > 0
        labels:
          severity: page
        annotations:
          summary: "The reconciliation sweep could not list tenants"
          description: "Also raised as the reconciliation.sweep_failed durable alert (P1). Closed-tenant observation silently switches off while this persists."
          runbook: docs/runbooks/operational-runbooks.md
