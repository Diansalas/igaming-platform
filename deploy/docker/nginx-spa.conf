# Shared nginx config for the b2c and backoffice static SPA images.
# Listens on 8080 (matches the container_port every ECS service in
# deploy/aws/modules/ecs uses) so no privileged port binding is needed.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback: any unmatched path serves index.html so client-side
    # routing (react-router) works on a hard refresh / deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively; index.html must not be,
    # or a new deploy's asset hashes won't be picked up by returning
    # clients.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
